# ~/m15/e16/charges.yaml — charges d'essai de M15-E16 (wb-essais). /hostname renvoie le nom du pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agnhost-v1
  namespace: wb-essais
  labels: {app.kubernetes.io/name: agnhost-v1}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: agnhost-v1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agnhost-v1}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agnhost
          image: registry.par1.medisphere.internal/k8s/e2e-test-images/agnhost:2.66.1
          args: ["netexec", "--http-port=8080", "--udp-port=-1"]
          ports:
            - {name: app, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata: {name: agnhost-v1, namespace: wb-essais}
spec:
  selector: {app.kubernetes.io/name: agnhost-v1}
  ports: [{name: http, port: 80, targetPort: app}]
---
