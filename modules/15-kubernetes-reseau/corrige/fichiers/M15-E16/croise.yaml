# ~/m15/e16/croise.yaml — référence entre espaces (M15-E16, étape 6). D'abord sans le ReferenceGrant :
# condition ResolvedRefs=False, reason RefNotPermitted. Puis avec.
apiVersion: v1
kind: Namespace
metadata:
  name: wb-essais-2
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agnhost-v3
  namespace: wb-essais-2
  labels: {app.kubernetes.io/name: agnhost-v3}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: agnhost-v3}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agnhost-v3}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agnhost
          image: registry.par1.medisphere.internal/k8s/e2e-test-images/agnhost:2.61
          args: ["netexec", "--http-port=8080", "--udp-port=-1"]
          ports:
            - {name: app, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata: {name: agnhost-v3, namespace: wb-essais-2}
spec:
  selector: {app.kubernetes.io/name: agnhost-v3}
  ports: [{name: http, port: 80, targetPort: app}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: croise, namespace: wb-essais}
spec:
  parentRefs:
    - {name: gw-par1, namespace: passerelles, sectionName: https}
  hostnames: [croise.apps.par1.medisphere.internal]
  rules:
    - backendRefs:
        - {name: agnhost-v3, namespace: wb-essais-2, port: 80}
---
# Le ReferenceGrant vit dans l'espace de la CIBLE (wb-essais-2) : c'est son propriétaire qui
# accepte d'être référencé. Minimal : un type source, un espace source, UN Service nommé.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata: {name: httproute-wb-essais-vers-agnhost-v3, namespace: wb-essais-2}
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: wb-essais}
  to:
    - {group: "", kind: Service, name: agnhost-v3}
