# espaces/cert-manager.yaml (M15-E13) — l'espace est créé par « helm upgrade --install
# --create-namespace » à la première installation ; ce manifeste le décrit dans le dépôt (étiquettes
# PSA, reprise par task reseau:espaces en M15-E23). Le chart de cert-manager est compatible avec
# « restricted ». Version d'application figée comme au M14-E18 (l'espace naît en 1.36).
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
