# Politique TEMPORAIRE (étape 5, preuve de la règle 2) : à supprimer aussitôt le test fait.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: tout-autoriser-test, namespace: mediagenda-recette}
spec:
  endpointSelector: {}
  ingress:
    - fromEntities: [all]
