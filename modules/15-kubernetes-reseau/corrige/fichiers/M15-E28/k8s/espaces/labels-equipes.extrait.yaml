# espaces/ — RAPPEL (M15-E28, SEC-1628) : rien à ajouter, les labels existent depuis le M14.
# Le label medisphere.internal/equipe, posé sur les Namespace d'équipe au M14 (E10 pour MédiAgenda,
# E33 pour MédiDoc, gabarit gabarits/equipe/), est la SEULE source de l'appartenance à une équipe :
# la ValidatingAdmissionPolicy medisphere-images (M14-E18) le sélectionne déjà, les politiques de
# cluster de M15-E28 aussi. Il est posé par le code de la plateforme, jamais par l'équipe (RBAC :
# les équipes ne modifient pas les Namespace). Ne crée pas un second label d'équipe « pour Cilium ».
# espaces/mediagenda-dev/00-namespace.yaml, espaces/mediagenda-recette/00-namespace.yaml :
metadata:
  labels:
    medisphere.internal/equipe: mediagenda
---
# espaces/medidoc-dev/00-namespace.yaml :
metadata:
  labels:
    medisphere.internal/equipe: medidoc
