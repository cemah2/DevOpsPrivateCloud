# composants/reseau/partenaires/nginx.conf — configuration du relais mTLS (M15-E33). Montée par la
# ConfigMap relais-mtls-conf (générée par « task appliquer » depuis ce fichier).
# Image nginxinc/nginx-unprivileged (utilisateur 101, port non privilégié) ; système de fichiers en
# lecture seule : tout ce que nginx écrit va dans /tmp (emptyDir).
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  server_tokens off;

  # Journal d'accès sans URL complète (pas d'identifiant de patient dans les journaux, RGPD/HDS) :
  # le partenaire, la méthode, le code, la durée.
  log_format partenaires '$time_iso8601 partenaire="$partenaire" methode=$request_method code=$status duree=$request_time';
  access_log /dev/stdout partenaires;

  # CN du certificat client (RFC 2253 : « CN=centre-test-01,O=… »).
  map $ssl_client_s_dn $partenaire {
    default        "";
    "~CN=(?<cn>[^,]+)" $cn;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name mediagenda-partenaires.apps.par1.medisphere.internal;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Authentification mutuelle : certificat client OBLIGATOIRE, émis par la SEULE autorité des
    # partenaires (pas la racine MédiSphère : un certificat serveur de ca01 ne doit pas ouvrir l'API).
    ssl_client_certificate /etc/nginx/ca/ca-partenaires.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://mediagenda-api.mediagenda-recette.svc.cluster.local:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # proxy_set_header REMPLACE tout en-tête de même nom envoyé par le client : un partenaire ne
      # peut pas se faire passer pour un autre en envoyant lui-même X-Partenaire.
      proxy_set_header X-Partenaire $partenaire;
      proxy_set_header X-Partenaire-Dn $ssl_client_s_dn;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
