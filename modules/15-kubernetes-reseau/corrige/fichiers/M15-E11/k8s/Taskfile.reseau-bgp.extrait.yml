# Extrait du Taskfile.yml de plateforme/k8s — M15-E11 (version complète du réseau : M15-E23).
# La tâche « etiquettes » existe depuis M14-E14 : elle lit cluster/noeuds.yaml, complété ici.
version: "3"
tasks:
  reseau:bgp:
    desc: Pool LB IPAM et plan de contrôle BGP de Cilium
    deps: [etiquettes]
    cmds:
      - kubectl apply --server-side -f composants/cilium/lb-ipam/
      - kubectl apply --server-side -f composants/cilium/bgp/
