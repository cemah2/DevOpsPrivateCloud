# Résolution de noms : vers les SEULS pods CoreDNS de kube-system, UDP et TCP 53 (TCP : réponses
# tronquées, DNSSEC). Avec le remplacement de kube-proxy, la politique voit l'adresse du POD de
# destination (après traduction du Service kube-dns) : on sélectionne donc des pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sortie-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
