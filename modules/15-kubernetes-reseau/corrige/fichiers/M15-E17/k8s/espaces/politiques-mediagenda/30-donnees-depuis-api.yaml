# Côté données : PostgreSQL n'accepte que l'API et les tâches de MédiAgenda de son espace ; Valkey
# n'accepte que l'API, plus ses propres répliques. (L'autorisation doit exister DES DEUX CÔTÉS :
# sortie du client ET entrée de la base.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-depuis-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [mediagenda-api, mediagenda-migration, mediagenda-sauvegarde]}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-depuis-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mediagenda-api
      ports:
        - {protocol: TCP, port: 6379}
---
# Réplication de Valkey (StatefulSet valkey-0..2 du M14-E15/E21 : valkey-1 et valkey-2 suivent
# valkey-0 par --replicaof sur 6379). Sans elle, les répliques restent « prêtes » (la sonde ne fait
# qu'un PING local) mais ne répliquent plus rien : une panne silencieuse.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-replication
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - {protocol: TCP, port: 6379}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - {protocol: TCP, port: 6379}
