# ~/m15/e10/essai-lb.yaml — charges d'essai de M15-E10 dans wb-essais (gardées jusqu'à E15/E20).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agnhost
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: agnhost
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agnhost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agnhost
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agnhost
          image: registry.par1.medisphere.internal/k8s/e2e-test-images/agnhost:2.61
          args: ["netexec", "--http-port=8080", "--udp-port=-1"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# Adresse DEMANDÉE dans la plage d'essai.
apiVersion: v1
kind: Service
metadata:
  name: essai-lb
  namespace: wb-essais
  annotations:
    lbipam.cilium.io/ips: 10.10.41.20
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: agnhost
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Deux Services qui PARTAGENT une adresse (même clé de partage, ports distincts, même espace).
# L'adresse est DEMANDÉE sur les deux : sans demande, le premier créé prendrait la première adresse
# libre du pool (10.10.41.10, réservée à gw-par1).
apiVersion: v1
kind: Service
metadata:
  name: essai-lb-a
  namespace: wb-essais
  annotations:
    lbipam.cilium.io/sharing-key: essai-partage
    lbipam.cilium.io/ips: 10.10.41.22
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: agnhost
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: essai-lb-b
  namespace: wb-essais
  annotations:
    lbipam.cilium.io/sharing-key: essai-partage
    lbipam.cilium.io/ips: 10.10.41.22
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: agnhost
  ports:
    - name: http-alt
      port: 8081
      targetPort: http
