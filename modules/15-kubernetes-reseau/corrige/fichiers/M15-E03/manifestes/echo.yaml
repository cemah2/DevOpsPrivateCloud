# echo.yaml — application de test « echo » et ses Services dans wb-essais (M15-E03, réutilisée jusqu'à E09).
# agnhost netexec : /hostname (nom du pod), /clientip (adresse source vue par le pod), /healthz, /readyz.
# ⚠️ netexec expose aussi /shell et /exit : jamais publié tel quel hors du lab ; la route de E07 ne
#    laisse passer que /hostname et /clientip.
#
# Services :
#   echo            ClusterIP, affinité de session par adresse client (300 s)
#   echo-np         NodePort 30880, externalTrafficPolicy: Local (adresse du client conservée)
#   echo-local      ClusterIP, internalTrafficPolicy: Local (seulement le pod du nœud du client)
#   echo-sans-tete  headless (clusterIP: None) : le DNS rend les adresses des pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: wb-essais
  labels:
    app: echo
    app.kubernetes.io/part-of: m15
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
        app.kubernetes.io/part-of: m15
    spec:
      # k8s-w03 porte le taint dedie=bdd:NoSchedule (M14-E14) : l'application d'essai, minuscule, le
      # tolère pour avoir un pod sur chacun des trois travailleurs. Une application réelle ne le ferait pas.
      tolerations:
        - key: dedie
          operator: Equal
          value: bdd
          effect: NoSchedule
      # Un pod par travailleur : indispensable aux essais de externalTrafficPolicy et internalTrafficPolicy.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Les nœuds de contrôle (taint NoSchedule) ne comptent pas comme domaines vides.
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: echo
      containers:
        - name: echo
          image: registry.par1.medisphere.internal/k8s/e2e-test-images/agnhost:2.66.1
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: wb-essais
spec:
  type: ClusterIP
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: echo-np
  namespace: wb-essais
spec:
  type: NodePort
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30880
  externalTrafficPolicy: Local
---
apiVersion: v1
kind: Service
metadata:
  name: echo-local
  namespace: wb-essais
spec:
  type: ClusterIP
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: http
  internalTrafficPolicy: Local
---
apiVersion: v1
kind: Service
metadata:
  name: echo-sans-tete
  namespace: wb-essais
spec:
  clusterIP: None
  selector:
    app: echo
  ports:
    - name: http
      port: 8080
      targetPort: http
