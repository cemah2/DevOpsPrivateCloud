# etc/ms-verif-k8s-reseau.conf — ce que surveille ms-verif-k8s-reseau (M15-E26, PLAT-1626).
# Installé dans /usr/local/etc par « task install:systeme ». Modifié par MR, comme le code.
# Syntaxe bash (fichier chargé par le script) : tableaux et variables simples, aucune commande.

# --- Identité Kubernetes (compte de service ms-supervision, lecture, sans Secrets) ---------------
MS_K8S_KUBECONFIG=/home/admin/.config/workbook/k8s-supervision.kubeconfig

# --- Composants (espace/nom) ---------------------------------------------------------------------
MS_K8S_DAEMONSETS=(kube-system/cilium kube-system/cilium-envoy)
MS_K8S_DEPLOIEMENTS=(
  kube-system/cilium-operator
  kube-system/hubble-relay
  kube-system/hubble-ui
  kube-system/coredns
  cert-manager/cert-manager
  external-dns/external-dns
)

# --- Nœuds : adresses du VLAN 40 (métriques de l'agent, prometheus.enabled) ----------------------
MS_K8S_NB_NOEUDS=6
MS_K8S_NOEUDS=(10.10.40.51 10.10.40.52 10.10.40.53 10.10.40.61 10.10.40.62 10.10.40.63)
MS_K8S_PORT_AGENT=9962

# --- BGP ---------------------------------------------------------------------------------------------
# 3 travailleurs annonceurs × 2 passerelles.
MS_K8S_BGP_SESSIONS_MIN=6
# Vu du maître de la bordure : les voisins dont l'adresse commence par ce préfixe sont les nœuds.
MS_K8S_RESEAU_NOEUDS=10.10.40.
MS_K8S_BGP_SESSIONS_MAITRE_MIN=3
# Adresses de service qui doivent être installées dans la table du maître, et nombre minimal de sauts.
# 10.10.41.11 (gw-partenaires) s'ajoute par MR en M15-E33.
MS_K8S_ADRESSES_SERVICE=(10.10.41.10)
MS_K8S_SAUTS_MIN=2

# --- Bordure (compte SSH « supervision », commande forcée etat-reseau, M07-E29) ------------------
MS_SSH_CLE="$HOME/.config/workbook/ssh-supervision-reseau"
MS_SSH_COMPTE=supervision
MS_PASSERELLES=(gw01.par1.medisphere.internal gw02.par1.medisphere.internal)

# --- Noms publiés : « nom=adresse attendue » ---------------------------------------------------------
MS_DNS=10.10.20.10
MS_RACINE=/usr/local/share/ca-certificates/medisphere-root-ca.crt
MS_K8S_NOMS=(
  mediagenda-recette.apps.par1.medisphere.internal=10.10.41.10
  hubble.apps.par1.medisphere.internal=10.10.41.10
)
