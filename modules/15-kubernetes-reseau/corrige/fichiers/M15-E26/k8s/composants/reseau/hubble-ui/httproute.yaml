# composants/reseau/hubble-ui/httproute.yaml — M15-E26 (PLAT-1626). Interface de Hubble par gw-par1.
# La route vit dans « passerelles » (espace des routes d'ADMINISTRATION de la plateforme, label
# d'exposition posé), le Service dans kube-system : ReferenceGrant (referencegrant.yaml) obligatoire.
# Le nom est publié par ExternalDNS (source gateway-httproute) ; le certificat est le joker apps-joker.
# NE PAS appliquer avant cnp-hubble-ui.yaml (ordre dans le Taskfile : politique d'abord).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: passerelles
  labels:
    app.kubernetes.io/part-of: plateforme-reseau
spec:
  parentRefs:
    - name: gw-par1
      namespace: passerelles
      sectionName: https
  hostnames:
    - hubble.apps.par1.medisphere.internal
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: hubble-ui
          namespace: kube-system
          port: 80
