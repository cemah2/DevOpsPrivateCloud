# Taskfile.yml de plateforme/k8s — EXTRAIT (M15-E27, CHG-1627) : la version de Cilium est une variable
# du projet, modifiée par MR comme les values. Une seule valeur pour l'installation, la mise à jour et
# la vérification préalable.
vars:
  CILIUM_VERSION: 1.20.2

tasks:
  cilium:apercu:
    desc: Values effectives que produirait la mise à jour (rien n'est appliqué)
    dir: composants/cilium
    cmds:
      - cilium upgrade --version {{.CILIUM_VERSION}} --reset-values --values values.yaml --dry-run-helm-values

  cilium:preflight:
    desc: Vérification préalable de la documentation (tire les images, valide les politiques)
    cmds:
      - helm repo add cilium https://helm.cilium.io --force-update
      - >-
        helm template cilium cilium/cilium --version {{.CILIUM_VERSION}} --namespace kube-system
        --set preflight.enabled=true --set agent=false --set operator.enabled=false
        --set k8sServiceHost=k8s-api.par1.medisphere.internal --set k8sServicePort=8443
        > /tmp/cilium-preflight.yaml
      - kubectl create -f /tmp/cilium-preflight.yaml
      - kubectl -n kube-system rollout status ds/cilium-pre-flight-check --timeout=10m
      - kubectl -n kube-system rollout status deploy/cilium-pre-flight-check --timeout=5m
      - kubectl delete -f /tmp/cilium-preflight.yaml
      - rm -f /tmp/cilium-preflight.yaml

  cilium:appliquer:
    desc: Installe ou met à jour Cilium avec le fichier de values du projet
    dir: composants/cilium
    cmds:
      # --reset-values (comme au M15-E08) : le fichier est la SEULE source. Sans lui, la CLI reprend par
      # défaut les values de la release précédente (--reset-then-reuse-values) : une clé retirée du
      # fichier survivrait (ex. autoDirectNodeRoutes après l'essai natif de M15-E29, que l'agent refuse
      # en mode tunnel : « auto-direct-node-routes cannot be used with tunneling »).
      - cilium upgrade --version {{.CILIUM_VERSION}} --reset-values --values values.yaml
      - cilium status --wait --wait-duration 10m
