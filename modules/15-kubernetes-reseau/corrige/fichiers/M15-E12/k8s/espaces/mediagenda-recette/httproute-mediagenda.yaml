# espaces/mediagenda-recette/httproute-mediagenda.yaml — publication de la recette (M15-E12).
# Rangée avec les objets de l'espace (elle appartient à l'application, pas à la Gateway) ; elle
# rejoindra le dépôt de déploiement de MédiAgenda au M17 (Kustomize).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mediagenda
  namespace: mediagenda-recette
spec:
  parentRefs:
    - name: gw-par1
      namespace: passerelles
      sectionName: https
  hostnames:
    - mediagenda-recette.apps.par1.medisphere.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mediagenda-api
          port: 80          # port du Service (targetPort http = 8000 du conteneur, M14)
