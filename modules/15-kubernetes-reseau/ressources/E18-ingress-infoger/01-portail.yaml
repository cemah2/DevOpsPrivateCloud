apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portail
  namespace: portail
  annotations:
    nginx.ingress.kubernetes.io/app-root: /accueil
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [portail.medisphere-infoger.example]
      secretName: portail-tls
  rules:
    - host: portail.medisphere-infoger.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portail
                port:
                  number: 80
