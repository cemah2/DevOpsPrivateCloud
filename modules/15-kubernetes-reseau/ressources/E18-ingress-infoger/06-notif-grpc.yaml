apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notif-grpc
  namespace: notif
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [notif.medisphere-infoger.example]
      secretName: notif-tls
  rules:
    - host: notif.medisphere-infoger.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notif
                port:
                  number: 50051
