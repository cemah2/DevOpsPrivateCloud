apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-par-defaut
  namespace: medidoc-dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - {}
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8333
