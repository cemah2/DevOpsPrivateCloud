apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: medidoc
  namespace: medidoc-dev
spec:
  parentRefs:
    - name: gw-medidoc
  hostnames:
    - medidoc-dev.apps.par1.medisphere.internal
    - medidoc.par1.medisphere.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: medidoc
          port: 80
