# À INTÉGRER si l'espace supervision filtre déjà l'entrée d'Alertmanager (CiliumNetworkPolicy du
# M21-E29) : le ruler de Loki (espace journaux) doit pouvoir POSTer ses alertes sur 9093.
# Ajoute ce bloc à la liste « ingress » de la politique qui sélectionne les pods d'Alertmanager
# (app.kubernetes.io/name: alertmanager) ; ne crée pas une seconde politique qui se contredirait.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: journaux
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - {port: "9093", protocol: TCP}
