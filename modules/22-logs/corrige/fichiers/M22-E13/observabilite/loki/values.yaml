# plateforme/observabilite — loki/values.yaml (version M22-E14 ; créé en M22-E02, PLAT-2302)
# Ajouts du palier 3 : rétention, effacement et limites par locataire (M22-E13, SEC-2313), requêtes
# (M22-E14, PLAT-2314). Ils sont repérés par « M22-E13 » / « M22-E14 » dans les commentaires.
# Valeurs du chart grafana-community/loki 19.0.3 (Loki 3.7.9), recopié dans Harbor charts/ par
# plateforme/charts-miroir. Consommé par l'Application Argo CD « loki » (source $values).
#
# Choix structurants (détail dans le corrigé de M22-E02 et dans l'ADR-0220, M22-E17) :
#   - mode Monolithic (un seul binaire, -target=all), UN réplica : le lab ingère quelques Go par jour ;
#   - multi-locataire (auth_enabled: true) : chaque requête porte X-Scope-OrgID ;
#   - index TSDB, schéma v13 (seul schéma qui porte les métadonnées structurées) ;
#   - stockage objet : compartiment loki-k8s-par1 du RGW de ceph-par1 (utilisateur RGW « loki ») ;
#     identifiants dans le Secret loki-objstore (hors Git, plateforme/k8s/outils/secrets-k8s.sh) ;
#   - pas de passerelle nginx du chart, pas de memcached, pas de canari : un Service LoadBalancer à nous
#     (loki/manifestes/service-externe.yaml) publie l'API sur 10.10.41.62:3100.

deploymentMode: Monolithic

loki:
  # Image amont : le nœud la tire par le cache Harbor « dockerhub » (miroir containerd, M14-E19).
  image:
    registry: docker.io
    repository: grafana/loki
    tag: 3.7.9
  auth_enabled: true

  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1

  # Le chart écrit storage_config / common.storage à partir de ce bloc.
  storage:
    type: s3
    bucketNames:
      chunks: loki-k8s-par1
    s3:
      endpoint: https://rgw.par1.medisphere.internal
      region: us-east-1                    # le RGW (zonegroup « default ») l'ignore ; le client S3 l'exige
      s3ForcePathStyle: true               # pas d'adressage virtuel (pas de *.rgw… dans le DNS)
      # Variables d'environnement développées par Loki (-config.expand-env=true, posé par le chart),
      # injectées depuis le Secret loki-objstore (singleBinary.extraEnvFrom ci-dessous).
      accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
      secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
      insecure: false
      http_config:
        # Racine MédiSphère : le RGW présente un certificat step-ca (M08). Jamais insecure_skip_verify.
        ca_file: /etc/loki/racine/medisphere-root-ca.crt

  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  ingester:
    chunk_encoding: snappy
    wal:
      flush_on_shutdown: true

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    volume_enabled: true
    allow_structured_metadata: true        # défaut de Loki 3, écrit pour être lu (M22-E06)
    # Liste fermée d'étiquettes : Loki n'ajoute pas d'étiquette service_name déduite (défaut : la
    # première trouvée parmi service, app, container, job…). Les tableaux et Logs Drilldown
    # sélectionnent par « app » ou « namespace ».
    discover_service_name: []
    discover_log_levels: true              # niveau détecté rangé en métadonnée structurée (detected_level)
    # Champs où Loki lit le niveau (métadonnées structurées, puis ligne JSON ou logfmt) : la liste par
    # défaut, plus « niveau » (MédiAgenda, journald des nœuds et des VMs). M22-E06.
    log_level_fields: [level, LEVEL, Level, log.level, severity, SEVERITY, Severity, SeverityText, lvl, LVL, Lvl, niveau]
    # M22-E13 — rétention et effacement par défaut (= locataire plateforme ; surcharges plus bas)
    retention_period: 336h                 # 14 jours ; appliquée par le compactor (retention_enabled)
    max_query_lookback: 336h               # ne pas proposer à la requête ce que la rétention supprime
    deletion_mode: disabled                # API d'effacement fermée sauf pour les locataires ouverts plus bas
    # M22-E13 — ingestion (valeurs par défaut de tout locataire non listé)
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 6
    max_global_streams_per_user: 5000
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
    # M22-E14 — requêtes (mesures dans docs/observabilite/journaux/performance.md)
    split_queries_by_interval: 1h          # 15m auparavant : trop de sous-requêtes pour un seul requêteur
    query_timeout: 2m                      # 300s auparavant ; les requêtes légitimes sur 7 jours tiennent en < 30 s
    max_query_parallelism: 16
    max_query_series: 500

  # M22-E13 — compactor : compaction de l'index, rétention, effacement. Il tourne dans loki-0 (-target=all).
  compactor:
    working_directory: /var/loki/compactor # sur le PVC : les marques de suppression survivent au redémarrage
    compaction_interval: 10m
    retention_enabled: true                # sans lui, retention_period n'a AUCUN effet et l'API d'effacement n'existe pas
    retention_delete_delay: 2h             # délai avant la suppression réelle des chunks marqués (rattrapage possible)
    retention_delete_worker_count: 50
    delete_request_store: s3               # obligatoire dès que retention_enabled est vrai
    delete_request_cancel_period: 24h      # une demande d'effacement reste annulable 24 h
    delete_max_interval: 24h

  # M22-E13 — surcharges par locataire (fichier de configuration d'exécution). Le chart l'écrit dans le
  # ConfigMap loki-runtime, monté dans le pod ; Loki le relit toutes les 10 s, sans redémarrer.
  runtimeConfig:
    overrides:
      audit:                               # preuve HDS : 1 an, jamais effaçable par l'API
        retention_period: 8760h
        max_query_lookback: 8760h
        deletion_mode: disabled
        ingestion_rate_mb: 2
        ingestion_burst_size_mb: 4
        max_global_streams_per_user: 500
      mediagenda:
        retention_period: 720h             # 30 jours
        max_query_lookback: 720h
        deletion_mode: filter-and-delete   # droit à l'effacement (RB-221)
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 6
        max_global_streams_per_user: 2000
      medidoc:
        retention_period: 720h
        max_query_lookback: 720h
        deletion_mode: filter-and-delete
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 6
        max_global_streams_per_user: 2000
      plateforme:
        retention_period: 336h
        max_query_lookback: 336h
        deletion_mode: disabled
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 12
        max_global_streams_per_user: 10000
        retention_stream:                  # les essais jetables n'ont rien à faire 14 jours dans Loki
          - selector: '{namespace="wb-essais"}'
            priority: 1
            period: 24h
      essai:                               # Fluent Bit (E10), essais d'effacement (E13) : jetable
        retention_period: 24h              # minimum accepté par le compactor
        max_query_lookback: 24h
        deletion_mode: filter-and-delete
        ingestion_rate_mb: 1
        ingestion_burst_size_mb: 2
        max_global_streams_per_user: 500

  # M22-E14 — requêteur et cache des résultats (intégré au processus : pas de memcached dans le lab)
  querier:
    max_concurrent: 4
  query_range:
    cache_results: true
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 100

  # Ruler (M22-E08, PLAT-2308) : règles lues sur le disque du pod, dans /rules/<locataire>/, où le
  # conteneur « sidecar » recopie les ConfigMaps étiquetées loki_rule (loki/regles/, kustomize).
  # Alertes envoyées à l'Alertmanager du cluster (kube-prometheus-stack, M21), qui route par « equipe ».
  rulerConfig:
    storage:
      type: local
      local:
        directory: /rules
    rule_path: /var/loki/ruler-tmp        # copie de travail du ruler (sur le PVC)
    wal:
      dir: /var/loki/ruler-wal
    alertmanager_url: http://kps-alertmanager.supervision.svc.cluster.local:9093
    enable_api: true
    enable_alertmanager_discovery: false
    evaluation_interval: 1m
    poll_interval: 1m
    # Étiquettes ajoutées à toutes les alertes : l'origine se lit dans le courriel.
    external_labels:
      source: loki

  analytics:
    reporting_enabled: false               # pas de statistiques d'usage envoyées à Grafana Labs

  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: info
    log_format: logfmt

# En Monolithic, « ruler.enabled » n'ajoute AUCUN pod (ruler.replicas reste à 0) : il fait écrire la
# section ruler de la configuration, et le binaire unique (-target=all) démarre son ruler.
ruler:
  enabled: true

# Le conteneur « sidecar » (k8s-sidecar) surveille les ConfigMaps étiquetées loki_rule de l'espace
# journaux et les écrit dans /rules/<dossier> (annotation k8s-sidecar-target-directory).
#   - resource: configmap → il ne lit plus les Secrets ;
#   - rbac.namespaced: true → Role dans journaux au lieu d'une ClusterRole sur tout le cluster.
# (Le Role du chart cite encore « secrets » : le conteneur ne s'en sert pas ; à signaler en amont.)
sidecar:
  rules:
    enabled: true
    label: loki_rule
    labelValue: "1"
    folder: /rules
    resource: configmap
    watchMethod: WATCH
rbac:
  namespaced: true

singleBinary:
  replicas: 1
  priorityClassName: medisphere-critique
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ceph-rbd                 # WAL et index en cours ; les données durables sont dans S3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi                          # GOMEMLIMIT posé par le chart à 85 % de cette limite
  extraEnvFrom:
    - secretRef:
        name: loki-objstore
  extraVolumes:
    - name: racine
      configMap:
        name: racine-medisphere
  extraVolumeMounts:
    - name: racine
      mountPath: /etc/loki/racine
      readOnly: true

# Le chart ne crée que le Service ClusterIP « loki » (3100, 9095) et le Service sans tête ;
# l'adresse 10.10.41.62 est portée par loki-externe (manifestes/), qui n'expose que 3100.
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false

# Autres modes à zéro (le chart les ignore en Monolithic ; écrit pour lever toute ambiguïté).
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Supervision par le Prometheus du cluster (M21) : sélection par l'étiquette commune.
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      medisphere.internal/supervision: "oui"
