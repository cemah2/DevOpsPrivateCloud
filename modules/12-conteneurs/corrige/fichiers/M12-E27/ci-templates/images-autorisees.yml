# plateforme/ci-templates — images-autorisees.yml (M12-E27, PLAT-1353)
# Refuse tout FROM (et COPY/RUN --mount from=) vers une image hors de la liste de MédiSphère.
#
#   include:
#     - project: plateforme/ci-templates
#       ref: v<X.Y.Z>
#       file: images-autorisees.yml
#
# La liste et le script vivent dans plateforme/images-base (branche main) ; ils sont lus avec le
# jeton du job. Prérequis côté plateforme/images-base : Settings > CI/CD > Job token permissions,
# groupes mediagenda, medidoc, medinotif, legacy et plateforme dans la liste d'autorisation.
variables:
  IMAGES_AUTORISEES_PROJET: plateforme%2Fimages-base
  IMAGES_AUTORISEES_REF: main

images-autorisees:
  stage: test
  image: ctr01.par1.medisphere.internal:5000/bibliotheque/debian:trixie
  tags: [docker]
  needs: []
  # ARGS_CONSTRUCTION : les --build-arg que le pipeline passe à la construction (même valeur que le
  # job de construction), pour que les FROM ${…} soient vérifiés avec la vraie valeur.
  script:
    - |
      set -euo pipefail
      api="$CI_API_V4_URL/projects/$IMAGES_AUTORISEES_PROJET/repository/files"
      curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" -o /tmp/liste.txt "$api/images-autorisees.txt/raw?ref=$IMAGES_AUTORISEES_REF"
      curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" -o /tmp/verifier-from.sh "$api/outils%2Fverifier-from.sh/raw?ref=$IMAGES_AUTORISEES_REF"
      bash /tmp/verifier-from.sh /tmp/liste.txt
  rules:
    - exists: ["**/Dockerfile*", "**/Containerfile*"]
