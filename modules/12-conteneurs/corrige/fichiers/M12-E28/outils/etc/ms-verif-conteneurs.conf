# etc/ms-verif-conteneurs.conf — ce que surveille ms-verif-conteneurs (M12-E28, PLAT-1328).
# Installé dans /usr/local/etc par « task install:systeme ». Modifié par MR, comme le code :
# un conteneur de plus à suivre = une ligne ici, jamais une modification du script.
# Syntaxe bash (fichier chargé par le script) : tableaux et variables simples, aucune commande.

# --- Accès aux hôtes ------------------------------------------------------------------------------
MS_CONTENEURS_HOTES=(ctr01.par1.medisphere.internal ctr02.par1.medisphere.internal)
MS_CONTENEURS_UTILISATEUR=supervision
# Clé privée dédiée (adm01, 600) ; côté hôtes : commande forcée vers ms-etat-conteneurs.
MS_CONTENEURS_CLE=/home/admin/.config/workbook/ssh-supervision-conteneurs

# --- Conteneurs attendus : « hôte-court:nom » -------------------------------------------------------
# ctr01 : pile Compose de MédiAgenda (E08, E24 ; api-b et entree ajoutés en E30), registre de
# travail (E15). ctr02 : unités Quadlet du compte app (E14) — adapte les noms aux tiens
# (« podman ps --format '{{.Names}}' » sous app).
MS_CONTENEURS_ATTENDUS=(
  ctr01:mediagenda-api-1
  ctr01:mediagenda-api-b-1
  ctr01:mediagenda-db-1
  ctr01:mediagenda-valkey-1
  ctr01:mediagenda-entree-1
  ctr01:registre-registre-1
  ctr02:mediagenda-api
  ctr02:mediagenda-valkey
)
# Exceptions écrites à la norme « sonde de santé obligatoire » (avec la raison) :
#   - HAProxy de test (E30) : image sans curl, page d'état lue par maj-progressive.sh.
MS_CONTENEURS_SANS_SONDE=(ctr01:mediagenda-entree-1)

# Un redémarrage (ou plus) entre deux passages (5 min) est une anomalie : un conteneur sain ne
# redémarre pas. 1 = la moindre relance alerte.
MS_CONTENEURS_SEUIL_REDEMARRAGES=1

# --- Métriques des démons Docker (metrics-addr, E28) ------------------------------------------------
MS_CONTENEURS_METRIQUES=(http://ctr01.par1.medisphere.internal:9323/metrics)
