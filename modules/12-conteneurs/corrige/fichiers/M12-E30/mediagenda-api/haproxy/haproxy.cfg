# haproxy/haproxy.cfg — répartiteur de TEST de la recette MédiAgenda sur ctr01 (M12-E30).
# Ce n'est pas lb01/lb02 (socle) : un HAProxy jetable, dans la pile Compose, pour prouver qu'une
# mise à jour instance par instance ne coupe aucune requête.
global
    log stdout format raw local0 info
    # Le DNS embarqué de Docker répond sur 127.0.0.11 dans chaque conteneur.
    # (Voir « resolvers docker » : une instance recréée change d'adresse IP.)

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    # Une requête qui échoue À LA CONNEXION (instance en cours d'arrêt : uvicorn a fermé son
    # socket) est rejouée, sur un AUTRE serveur (redispatch). Les requêtes POST déjà envoyées
    # ne sont jamais rejouées sur « response-timeout » : on s'en tient aux échecs sans effet.
    retries 3
    option redispatch 1
    retry-on conn-failure empty-response

resolvers docker
    nameserver dns 127.0.0.11:53
    # Garder une adresse valide 1 s seulement : après recréation, la nouvelle IP est vue vite.
    hold valid 1s
    hold obsolete 5s
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s

frontend mediagenda
    bind :8080
    default_backend api

backend api
    balance roundrobin
    # Disponibilité (readiness) : /pret vérifie PostgreSQL et Valkey ; une instance qui ne joint
    # plus sa base sort de la rotation sans être redémarrée.
    option httpchk
    http-check send meth GET uri /pret
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr none resolve-prefer ipv4
    server api-a api:8000 check
    server api-b api-b:8000 check

frontend etat
    bind :8404
    stats enable
    stats uri /etat
    stats refresh 5s
    # Lecture seule : aucune action d'administration depuis cette page.
    stats show-legends
