# Hôte virtuel Apache de Legacy-RDV dans l'image (M12-E19). Reprend vm/apache-legacy-rdv.conf
# (mêmes interdictions d'accès) avec trois différences :
#   - port 8080 : Apache tourne entièrement sous www-data ; sous Docker il pourrait ouvrir le port 80
#     (Docker met net.ipv4.ip_unprivileged_port_start à 0 dans le conteneur, M12-E32), mais ni
#     Podman sans privilège ni Kubernetes ne le garantissent : un port > 1024 marche partout ;
#   - journaux sur la sortie standard et la sortie d'erreur du conteneur (facteur XI) ;
#   - plus de « php_value » ici : les réglages PHP sont dans conteneur/php-legacy-rdv.ini, qui
#     vaut quel que soit le serveur (mod_php aujourd'hui, php-fpm demain).
<VirtualHost *:8080>
    ServerName rdv.medisphere.internal
    DocumentRoot /var/www/legacy-rdv

    <Directory /var/www/legacy-rdv>
        Require all granted
        DirectoryIndex index.php
        AllowOverride None
    </Directory>

    <Directory /var/www/legacy-rdv/uploads>
        Require all denied
    </Directory>
    <DirectoryMatch "^/var/www/legacy-rdv/(inc|cron|vm|conteneur)/">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(schema\.sql|compose\.yaml|Dockerfile|README\.md)$">
        Require all denied
    </FilesMatch>

    # Les sondes ne remplissent pas le journal d'accès.
    SetEnvIf Request_URI "^/sante\.php$" sonde
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!sonde
</VirtualHost>
