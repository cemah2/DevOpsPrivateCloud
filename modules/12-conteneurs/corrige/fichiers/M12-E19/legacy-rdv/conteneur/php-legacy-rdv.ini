; Réglages PHP de Legacy-RDV dans l'image (M12-E19) : /usr/local/etc/php/conf.d/legacy-rdv.ini
; Les deux premiers viennent de l'hôte virtuel de la VM (php_value) : sans eux, l'image officielle
; reviendrait à 2 Mo et refuserait les pièces jointes de 5 Mo (README, point 12).
upload_max_filesize = 6M
post_max_size = 8M
; Sessions en fichiers, dans un répertoire monté en volume (facteur VI : écart assumé et documenté,
; une seule instance ; sessions partagées dans Valkey au final F4).
session.save_handler = files
session.save_path = /var/lib/php/sessions
session.cookie_httponly = 1
session.use_strict_mode = 1
; Ne pas annoncer la version de PHP dans les en-têtes.
expose_php = Off
; Les erreurs PHP vont au journal d'Apache (sortie d'erreur), jamais à l'écran.
log_errors = On
display_errors = Off
