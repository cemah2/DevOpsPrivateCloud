# ~/m12/e07/nginx/default.conf sur ctr01 (M12-E07) — monté avec son dossier, en lecture seule,
# à la place de /etc/nginx/conf.d/ dans le conteneur m12-e07-web.
server {
    # IPv4 seulement : les réseaux Docker du lab n'ont pas d'IPv6 (un « listen [::]:80 » ferait
    # échouer nginx là où le noyau de l'espace réseau n'a pas d'IPv6).
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Sonde de vivacité : ne lit aucun fichier, répond tant que nginx répond.
    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
