# compose.yaml — MédiAgenda, PostgreSQL 18 et Valkey 8 sur un poste ou une VM de recette (M12-E08).
#
#   admin@ctr01:~/src/mediagenda-api$ ./outils/secrets-compose.sh      # une fois : secrets/ en 600
#   admin@ctr01:~/src/mediagenda-api$ docker compose up -d --wait
#   admin@ctr01:~/src/mediagenda-api$ docker compose --profile outils run --rm psql
#
# Pas d'attribut « version: » : il est obsolète (la spécification Compose n'a plus de version).
# Nom du projet fixé : réseau, volumes et conteneurs s'appellent mediagenda-…, d'où que l'on lance.
name: mediagenda

services:
  # --- Base de données ------------------------------------------------------------------------
  db:
    image: docker.io/library/postgres:18-trixie
    environment:
      POSTGRES_DB: mediagenda
      POSTGRES_USER: mediagenda
      # Variante « _FILE » de l'image officielle : le mot de passe est lu dans le secret monté,
      # il n'apparaît ni dans ce fichier, ni dans « docker inspect », ni dans l'environnement.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_mdp
      # Base en UTF-8 (README de MédiAgenda).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    secrets:
      - db_mdp
    volumes:
      # PostgreSQL 18 : l'image range les données dans /var/lib/postgresql/18/docker (PGDATA) et
      # attend le volume sur /var/lib/postgresql (et non plus /var/lib/postgresql/data).
      - donnees-db:/var/lib/postgresql
    healthcheck:
      # pg_isready dit si le serveur accepte les connexions, sans mot de passe.
      test: ["CMD", "pg_isready", "-U", "mediagenda", "-d", "mediagenda"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [arriere]

  # --- Cache ------------------------------------------------------------------------------------
  valkey:
    image: docker.io/valkey/valkey:8-trixie
    # Cache seulement : pas de persistance sur disque (il se reconstruit depuis la base).
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [arriere]

  # --- Migrations : un service PONCTUEL ---------------------------------------------------------
  # Il applique V1, V2… puis s'arrête avec le code 0 ; l'API ne démarre qu'après ce succès.
  migrations:
    image: mediagenda-api:${MEDIAGENDA_TAG:-0.1.0}
    build:
      context: .
      args:
        VERSION: ${MEDIAGENDA_TAG:-0.1.0}
    entrypoint: ["/bin/sh", "-c"]
    # L'application ne lit sa configuration que dans l'environnement : on compose l'URL à partir
    # du secret au dernier moment, et « exec » remplace le shell (le processus reçoit les signaux).
    command:
      - 'MEDIAGENDA_DB_URL="postgresql://mediagenda:$$(cat /run/secrets/db_mdp)@db:5432/mediagenda" exec mediagenda-migrate'
    environment:
      MEDIAGENDA_MIGRATIONS_DIR: /app/migrations
    secrets:
      - db_mdp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [arriere]

  # --- L'API ------------------------------------------------------------------------------------
  api:
    image: mediagenda-api:${MEDIAGENDA_TAG:-0.1.0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'MEDIAGENDA_DB_URL="postgresql://mediagenda:$$(cat /run/secrets/db_mdp)@db:5432/mediagenda" exec mediagenda'
    environment:
      MEDIAGENDA_VALKEY_URL: redis://valkey:6379/0
      MEDIAGENDA_LOG_LEVEL: INFO
    secrets:
      - db_mdp
    ports:
      # Publié sur toutes les adresses de l'hôte, port 8000 (la recette est jointe depuis adm01).
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      # Pas de curl dans l'image : le Python de l'image fait la requête. /sante seulement :
      # la vivacité ne doit pas dépendre de la base (README de MédiAgenda).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [avant, arriere]

  # --- Outils (profil « outils ») : jamais lancés par un simple « up » ------------------------------
  psql:
    profiles: [outils]
    image: docker.io/library/postgres:18-trixie
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'PGPASSWORD="$$(cat /run/secrets/db_mdp)" exec psql -h db -U mediagenda -d mediagenda'
    secrets:
      - db_mdp
    depends_on:
      db:
        condition: service_healthy
    networks: [arriere]

networks:
  # « avant » : le seul réseau de l'API vers l'extérieur (publication de port).
  avant: {}
  # « arriere » : base et cache ; internal = pas de route vers l'extérieur, aucun port publiable.
  arriere:
    internal: true

volumes:
  donnees-db: {}

secrets:
  # Fichier local, hors dépôt (.gitignore), en 600 ; créé par outils/secrets-compose.sh.
  db_mdp:
    file: ./secrets/db_mdp
