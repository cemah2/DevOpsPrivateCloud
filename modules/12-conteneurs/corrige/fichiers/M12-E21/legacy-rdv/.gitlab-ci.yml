# .gitlab-ci.yml — legacy/legacy-rdv (M12-E21 ; obligatoire au mini-projet M12-E46).
# Gitleaks signale le mot de passe historique de config.php dans l'HISTORIQUE (M12-E19 l'a retiré du
# code) : exception documentée dans .gitleaksignore (empreinte du commit d'import), pas de
# désactivation du contrôle.
include:
  - project: plateforme/ci-templates
    ref: v1
    file:
      - templates/qualite.yml
      - templates/release.yml
      - templates/image.yml

# Workflow de templates/qualite.yml (MR, branches) + les étiquettes de version : qualite.yml ne
# lance aucun pipeline d'étiquette, or c'est l'étiquette vX.Y.Z qui publie l'image X.Y.Z.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

syntaxe-php:
  stage: test
  image: docker.io/library/php:8.4-apache-trixie@sha256:901b0dbcd2419cc9cd307ea05e57403449ce722ccd5b32335da6e8d39f2b1ee0
  tags: [docker]
  needs: []
  script:
    - find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

hadolint:
  extends: .hadolint

image:
  extends: .image-construction
  needs: [syntaxe-php, hadolint]
  variables:
    IMAGE: ctr01.par1.medisphere.internal:5000/legacy/legacy-rdv
