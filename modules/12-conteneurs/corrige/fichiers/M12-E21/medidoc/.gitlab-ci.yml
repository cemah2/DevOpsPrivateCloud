# .gitlab-ci.yml — medidoc/medidoc (M12-E21, SEC-1321). Même chaîne que mediagenda/api ; tests Go
# dans l'image Go de référence (runner02), image multi-architectures par compilation croisée (E12).
include:
  - project: plateforme/ci-templates
    ref: v1
    file:
      - templates/qualite.yml
      - templates/release.yml
      - templates/image.yml

# Workflow de templates/qualite.yml (MR, branches) + les étiquettes de version : qualite.yml ne
# lance aucun pipeline d'étiquette, or c'est l'étiquette vX.Y.Z qui publie l'image X.Y.Z.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

tests:
  stage: test
  image: docker.io/library/golang:1.26-trixie@sha256:f06b7122f888680048afb247c4e5f49c0069eb6c4c1ccae0f3f4834527a8d22c
  tags: [docker]
  needs: []
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key: modules-go
    paths: [.go/pkg/mod/]
  script:
    - go vet ./...
    - go test ./...

hadolint:
  extends: .hadolint

image:
  extends: .image-construction
  needs: [tests, hadolint]
  variables:
    IMAGE: ctr01.par1.medisphere.internal:5000/medidoc/medidoc
    PLATEFORMES: linux/amd64,linux/arm64
