---
argument_specs:
  main:
    short_description: Prépare un hôte Podman sans privilège (Debian 13 ou Rocky Linux 10)
    options:
      podman_hote_compte:
        type: str
        description: Compte applicatif qui fait tourner les conteneurs (sans sudo).
      podman_hote_compte_uid:
        type: int
        description: UID fixe du compte.
      podman_hote_compte_commentaire:
        type: str
        description: Champ GECOS du compte.
      podman_hote_subid_debut:
        type: int
        description: Premier UID/GID subordonné du compte.
      podman_hote_subid_nombre:
        type: int
        description: Nombre d'UID/GID subordonnés.
      podman_hote_linger:
        type: bool
        description: Activer le linger systemd du compte.
      podman_hote_version_attendue:
        type: dict
        description: Version major.minor attendue de Podman par famille d'OS.
      podman_hote_paquets_communs:
        type: list
        elements: str
        description: Paquets installés sur toutes les familles.
      podman_hote_paquets_famille:
        type: dict
        description: Paquets propres à chaque famille (clé = ansible_os_family).
      podman_hote_registres_recherche:
        type: list
        elements: str
        description: Registres de recherche des noms courts (unqualified-search-registries).
