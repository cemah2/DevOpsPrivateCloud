---
# ⚠️ Redémarrer docker arrête les conteneurs en cours (sauf live-restore, M12-E26) : les
# conteneurs à politique de redémarrage repartent seuls, les autres non.
- name: Redémarrer docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

- name: Mettre à jour l'index APT
  ansible.builtin.apt:
    update_cache: true
