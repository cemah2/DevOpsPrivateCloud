---
# inventories/lab/netbox-m12.yml — environnement du module 12 tiré de NetBox (M12-E02).
#
# Même construction que netbox-ceph.yml (M08-E02) : une source par environnement, car les filtres
# d'étiquettes de l'API NetBox se cumulent en ET. Les group_vars de inventories/lab/ s'appliquent.
# ansible.cfg : inventory = inventories/lab/netbox.yml,inventories/lab/netbox-ceph.yml,inventories/lab/netbox-m12.yml
# Contrôle : uv run ansible-inventory --graph env_m12
plugin: netbox.netbox.nb_inventory
api_endpoint: https://nbx01.par1.medisphere.internal
validate_certs: true
token:
  type: Bearer
  value: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"

plurals: false
racks: false
services: false
interfaces: false
config_context: false

query_filters:
  - tag: env-m12
vm_query_filters:
  - status: active

rename_variables:
  - pattern: "^tags$"
    repl: netbox_etiquettes

# Groupes par étiquette : env_m12, role_docker, role_podman, role_legacy.
keyed_groups:
  - key: netbox_etiquettes | map('replace', '-', '_') | list
    prefix: ""
    separator: ""

# Ces VMs sont en DHCP : NetBox ne connaît pas leur adresse (pas d'IP primaire). On se connecte
# par le nom que le DDNS de Kea a publié.
compose:
  vmid: custom_fields.vmid
  ansible_host: inventory_hostname ~ '.par1.medisphere.internal'
strict: false
