---
- name: Paramètres de sauvegarde fournis
  ansible.builtin.assert:
    that:
      - (sauvegarde_conteneurs_bases | length + sauvegarde_conteneurs_volumes | length) > 0
      - sauvegarde_conteneurs_jeton_secret | length > 0
      - sauvegarde_conteneurs_empreinte | length > 0
      - sauvegarde_conteneurs_cle | length > 0
    fail_msg: >-
      Au moins une base ou un volume, et les secrets PBS (jeton, empreinte, clé de chiffrement, en
      Vault « critique ») sont requis pour {{ inventory_hostname }}.
    quiet: true

# --- Client PBS (même méthode que sauvegarde_pbs) ---------------------------------------------
- name: Trousseau de l'archive Proxmox (empreinte vérifiée)
  ansible.builtin.get_url:
    url: "{{ sauvegarde_conteneurs_cle_depot_url }}"
    dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
    checksum: "sha256:{{ sauvegarde_conteneurs_cle_depot_sha256 }}"
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Dépôt pbs-client (Debian 13)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pbs-client.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Géré par Ansible (rôle sauvegarde_conteneurs, M12-E29)
      Types: deb
      URIs: http://download.proxmox.com/debian/pbs-client
      Suites: trixie
      Components: main
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  register: sauvegarde_conteneurs_depot

- name: Client PBS
  ansible.builtin.apt:
    name: proxmox-backup-client
    state: present
    update_cache: "{{ sauvegarde_conteneurs_depot is changed }}"

# --- Secrets -----------------------------------------------------------------------------------
- name: Dossier des secrets
  ansible.builtin.file:
    path: /etc/wb-backup
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Accès à PBS (jeton, empreinte)
  ansible.builtin.template:
    src: pbs.env.j2
    dest: /etc/wb-backup/pbs-{{ inventory_hostname }}.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Clé de chiffrement côté client
  ansible.builtin.copy:
    content: "{{ sauvegarde_conteneurs_cle }}"
    dest: /etc/wb-backup/pbs-{{ inventory_hostname }}.key
    owner: root
    group: root
    mode: "0600"
  no_log: true

# --- Script et unités ---------------------------------------------------------------------------
- name: Paramètres non secrets
  ansible.builtin.template:
    src: conteneurs.conf.j2
    dest: /etc/wb-backup/conteneurs.conf
    owner: root
    group: root
    mode: "0600"

- name: Script de sauvegarde
  ansible.builtin.copy:
    src: wb-backup-conteneurs.sh
    dest: /usr/local/sbin/wb-backup-conteneurs.sh
    owner: root
    group: root
    mode: "0750"

- name: Image de l'outil de copie de volume présente (évite un tirage à 01:40)
  ansible.builtin.command:
    argv: [docker, pull, --quiet, "{{ sauvegarde_conteneurs_image_outil }}"]
  register: sauvegarde_conteneurs_tirage
  changed_when: false
  when: sauvegarde_conteneurs_volumes | length > 0

- name: Unités systemd
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - wb-backup-conteneurs.service
    - wb-backup-conteneurs.timer
  notify: Recharger systemd

- name: Prendre en compte les unités
  ansible.builtin.meta: flush_handlers

- name: Minuterie active
  ansible.builtin.systemd_service:
    name: wb-backup-conteneurs.timer
    enabled: true
    state: started
