---
# Rôle registre_travail — registre d'images de travail du module 12 (M12-E15, ticket PLAT-1325).
# CNCF Distribution 3 (image registry:3) sur ctr01, lancé par Docker Compose, TLS par step-ca
# (ACME, rôle certificats_acme), authentification htpasswd (bcrypt), suppression activée.
# Il disparaît au module 13 (Harbor) : pas de haute disponibilité, pas de réplication, pas de
# droits par dépôt (tout compte authentifié peut tirer, pousser ET supprimer).

registre_travail_dossier: /opt/registre
# Étiquette ET empreinte (relevée le 2026-10-08 : registry:3 = Distribution 3.1.2). Pour changer
# de version : relever l'empreinte (docker buildx imagetools inspect registry:3), MR, application.
registre_travail_image: "registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8"
registre_travail_port: 5000
registre_travail_nom: "{{ inventory_hostname }}.par1.medisphere.internal"

# Certificat (émis et renouvelé par certificats_acme, monté en lecture seule dans le conteneur).
registre_travail_certificat: /etc/registre/tls/registre.crt
registre_travail_cle: /etc/registre/tls/registre.key

# Comptes htpasswd : nom → mot de passe (depuis le Vault « lab » ; jamais en clair ici).
#   plateforme : l'équipe (et les vérifications du workbook) ; ci : les pipelines (runner02).
registre_travail_comptes: {}
#   plateforme: "{{ vault_registre_travail_mdp_plateforme }}"
#   ci: "{{ vault_registre_travail_mdp_ci }}"

# Journaux du registre : JSON sur la sortie standard (pilote de journaux du démon Docker).
registre_travail_niveau_journal: info

# Ramasse-miettes planifié (registry garbage-collect --delete-untagged), en mode lecture seule.
registre_travail_gc_calendrier: "Sun *-*-* 03:30:00"

registre_travail_entete: >-
  {{ ms_gere_par | default('Fichier géré par Ansible (projet plateforme/ansible).') | replace('\n', ' ') }}
