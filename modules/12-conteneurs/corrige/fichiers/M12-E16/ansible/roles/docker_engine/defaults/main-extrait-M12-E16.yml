# roles/docker_engine/defaults/main.yml — EXTRAIT : variables ajoutées en M12-E16.
docker_engine_outils_qualite: false
docker_engine_outils_qualite_dossier: /opt/outils-qualite
# Hadolint 2.15.1 (PLAN §6) : la release ne publie pas de fichier d'empreinte (constaté le
