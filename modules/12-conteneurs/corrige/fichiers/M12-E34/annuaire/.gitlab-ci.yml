# .gitlab-ci.yml — mediagenda/annuaire (M12-E34, CHG-1360)
# Tests → contrôles (Hadolint, images autorisées) → construction sans privilège et publication
# (gabarit image.yml de M12-E21, runner02). Une étiquette X.Y.Z (semantic-release, M01) publie
# l'image X.Y.Z ; main publie seulement une image de travail (« main-<court SHA> »).
include:
  - project: plateforme/ci-templates
    ref: v1.5.0          # qualite.yml (M01), image.yml (M12-E21), images-autorisees.yml (M12-E27)
    file: [qualite.yml, image.yml, images-autorisees.yml]

stages: [test, construction]

variables:
  IMAGE: ctr01.par1.medisphere.internal:5000/mediagenda/annuaire

tests:
  stage: test
  # Même image de base que l'application, épinglée (norme CNT-IMG-02).
  image: ctr01.par1.medisphere.internal:5000/bibliotheque/python:3.13-trixie-<AAAAMMJJ>@sha256:<EMPREINTE>
  tags: [docker]
  script:
    - python -m unittest discover -s tests -v
  variables:
    PYTHONPATH: src

hadolint:
  stage: test
  image: docker.io/hadolint/hadolint:v2.15.1-debian
  tags: [docker]
  script:
    - hadolint Dockerfile        # .hadolint.yaml de MédiSphère (M12-E16) à la racine du projet

construire:
  extends: .image-construction   # job caché de image.yml (E21) : BuildKit sans privilège, poussée
  stage: construction
  needs: [tests, hadolint, images-autorisees]
  variables:
    FICHIER: Dockerfile
    CONTEXTE: .
    ARGS_CONSTRUCTION: "VERSION=${CI_COMMIT_TAG:-main-$CI_COMMIT_SHORT_SHA} REVISION=$CI_COMMIT_SHA"
    ETIQUETTES: "${CI_COMMIT_TAG:-main-$CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
