# .gitlab-ci.yml — mediagenda/annuaire (M12-E34, CHG-1334)
# lint (pre-commit, commitlint, gitleaks, Hadolint) → test (unittest, images autorisées) → build
# (BuildKit sans privilège, gabarit image.yml de M12-E21, runner02). Pas de release.yml en temps
# limité : l'étiquette v1.0.0 est posée à la main (protégée) ; semantic-release peut venir ensuite.
#   MR               : tout est construit, rien n'est publié ;
#   main             : image de travail main-<SHA court> publiée ;
#   étiquette v1.0.0 : image 1.0.0 publiée (VERSION, REVISION et SOURCE_DATE_EPOCH posés par le gabarit).
# Stages : ceux de templates/qualite.yml (lint, test, build, release), non redéfinis.
include:
  - project: plateforme/ci-templates
    ref: v1
    file:
      - templates/qualite.yml
      - templates/image.yml
      - templates/images-autorisees.yml   # M12-E27

# Workflow de qualite.yml + les étiquettes de version (qualite.yml n'en lance pas), comme mediagenda/api.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

tests:
  stage: test
  # Même image de base que l'application, épinglée (norme CNT-IMG-02).
  image: ctr01.par1.medisphere.internal:5000/bibliotheque/python:3.13-trixie-<AAAAMMJJ>@sha256:<EMPREINTE>
  tags: [docker]
  needs: []
  script:
    - python -m unittest discover -s tests -v
  variables:
    PYTHONPATH: src

hadolint:
  extends: .hadolint             # .hadolint.yaml de MédiSphère (M12-E16) à la racine du projet

image:
  extends: .image-construction   # job caché de image.yml (E21) : règles, étiquettes et version calculées
  needs: [tests, hadolint, images-autorisees]
  variables:
    IMAGE: ctr01.par1.medisphere.internal:5000/mediagenda/annuaire
    # Ne pas écrire ici « ${CI_COMMIT_TAG:-…} » : GitLab ne connaît pas cette syntaxe du shell dans
    # les variables ; ETIQUETTES vide laisse le gabarit déduire les étiquettes de Git.
