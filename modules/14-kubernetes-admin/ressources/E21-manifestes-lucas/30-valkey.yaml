apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediagenda-valkey
  namespace: mediagenda-recette
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediagenda-valkey
  template:
    metadata:
      labels:
        app: mediagenda-valkey
    spec:
      containers:
        - name: valkey
          image: registry.par1.medisphere.internal/dockerhub/valkey/valkey:latest
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: mediagenda-valkey
  namespace: mediagenda-recette
spec:
  type: NodePort
  selector:
    app: mediagenda-valkey
  ports:
    - port: 6379
      nodePort: 30379
