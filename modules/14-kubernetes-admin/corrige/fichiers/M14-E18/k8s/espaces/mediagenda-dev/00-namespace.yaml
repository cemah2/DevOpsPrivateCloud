# plateforme/k8s — espaces/mediagenda-dev/00-namespace.yaml (M14-E10, Pod Security en M14-E18)
# Espace de développement de l'équipe MédiAgenda (Julien Petit).
# Les étiquettes medisphere.internal/* servent de sélecteurs (RBAC, admission en E18, supervision au M21).
apiVersion: v1
kind: Namespace
metadata:
  name: mediagenda-dev
  labels:
    medisphere.internal/equipe: mediagenda
    medisphere.internal/environnement: dev
    # Pod Security Admission : « restricted » appliqué (enforce), et signalé (warn) / journalisé
    # (audit) au niveau de la dernière version, pour voir venir les durcissements futurs.
    # Version d'application FIGÉE : une montée de Kubernetes ne change pas la règle sans MR.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
  annotations:
    medisphere.internal/responsable: "julien.petit"
    medisphere.internal/ticket: "PLAT-1510"
