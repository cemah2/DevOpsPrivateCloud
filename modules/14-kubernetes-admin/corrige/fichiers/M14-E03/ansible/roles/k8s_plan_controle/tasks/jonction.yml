---
# Jonction d'un nœud de contrôle (M14-E05) : les secrets de jonction sont créés à la demande sur
# le nœud de référence, utilisés aussitôt, puis détruits.
#   - jeton d'amorçage (15 min) ;
#   - clé de chiffrement des certificats partagés (Secret kubeadm-certs, valable 2 h) ;
#   - empreinte de la clé publique de la CA (discovery-token-ca-cert-hash) : elle n'est pas secrète,
#     elle protège le nœud qui rejoint contre un faux point d'accès.

- name: Créer un jeton d'amorçage à durée courte
  ansible.builtin.command: >-
    kubeadm token create --ttl {{ k8s_plan_controle_jeton_duree }}
    --description "jonction de {{ inventory_hostname }} (Ansible, k8s_plan_controle)"
  delegate_to: "{{ _k8s_plan_controle_reference }}"
  register: _k8s_plan_controle_jeton
  changed_when: true
  no_log: true

# Ré-envoie les certificats partagés (CA, sa, front-proxy, etcd) chiffrés dans le Secret
# kubeadm-certs et affiche la clé sur la dernière ligne.
# --config : le fichier du nœud de référence (posé par kubeadm.yml) fixe la version ; sans lui,
# kubeadm part de ses défauts et interroge dl.k8s.io pour « stable-1 ».
- name: Ré-envoyer les certificats partagés et obtenir la clé de déchiffrement
  ansible.builtin.command: >-
    kubeadm init phase upload-certs --upload-certs
    --config {{ k8s_plan_controle_dossier }}/kubeadm-config.yaml
  delegate_to: "{{ _k8s_plan_controle_reference }}"
  register: _k8s_plan_controle_cle_certs
  changed_when: true
  no_log: true

- name: Empreinte de la clé publique de la CA
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -pubkey -noout -in /etc/kubernetes/pki/ca.crt \
      | openssl pkey -pubin -outform der \
      | openssl dgst -sha256 -hex | sed 's/^.* //'
  args:
    executable: /bin/bash
  delegate_to: "{{ _k8s_plan_controle_reference }}"
  register: _k8s_plan_controle_empreinte_ca
  changed_when: false

- name: Fichier de jonction (600, détruit après usage)
  ansible.builtin.template:
    src: kubeadm-join-controle.yaml.j2
    dest: "{{ k8s_plan_controle_dossier }}/kubeadm-join.yaml"
    owner: root
    group: root
    mode: "0600"
    validate: kubeadm config validate --config %s
  vars:
    _k8s_plan_controle_jeton_valeur: "{{ _k8s_plan_controle_jeton.stdout | trim }}"
    _k8s_plan_controle_cle_valeur: "{{ _k8s_plan_controle_cle_certs.stdout_lines | last | trim }}"
  no_log: true

- name: Joindre le nœud (kubeadm join --config)
  block:
    - name: Lancer kubeadm join avec le fichier de jonction
      ansible.builtin.command:
        cmd: kubeadm join --config {{ k8s_plan_controle_dossier }}/kubeadm-join.yaml
        creates: /etc/kubernetes/kubelet.conf
      register: _k8s_plan_controle_jonction
      no_log: true
  always:
    - name: Détruire le fichier de jonction
      ansible.builtin.file:
        path: "{{ k8s_plan_controle_dossier }}/kubeadm-join.yaml"
        state: absent

    - name: Révoquer le jeton d'amorçage
      ansible.builtin.command: kubeadm token delete {{ (_k8s_plan_controle_jeton.stdout | trim).split('.')[0] }}
      delegate_to: "{{ _k8s_plan_controle_reference }}"
      changed_when: true
      no_log: true
