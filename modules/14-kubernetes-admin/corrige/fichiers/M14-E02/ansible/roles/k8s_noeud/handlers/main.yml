---
- name: Relire les unités systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Avant init/join, kubelet redémarre en boucle (pas de configuration) : un redémarrage de plus
# ne coûte rien. Sur un nœud membre, il n'arrive qu'après un changement de version autorisé.
- name: Relancer kubelet
  ansible.builtin.systemd_service:
    name: kubelet.service
    state: restarted
