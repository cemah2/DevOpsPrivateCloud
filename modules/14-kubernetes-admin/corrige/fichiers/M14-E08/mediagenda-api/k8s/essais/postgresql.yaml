# k8s/essais/postgresql.yaml — base de MédiAgenda pour les ESSAIS (M14-E07, sondes et ressources M14-E08).
# JETABLE : emptyDir, effacé quand le pod disparaît. PostgreSQL de production : M16, M27.
# Mot de passe : Secret « mediagenda-db » (clé mot-de-passe), créé hors du dépôt (M14-E08).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: mediagenda
    app.kubernetes.io/component: base
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/part-of: mediagenda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: mediagenda
        app.kubernetes.io/component: base
    spec:
      # PostgreSQL termine proprement (point de contrôle) sur SIGTERM ; on lui laisse le temps.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18-trixie
          env:
            - name: POSTGRES_DB
              value: mediagenda
            - name: POSTGRES_USER
              value: mediagenda
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mediagenda-db
                  key: mot-de-passe
          ports:
            - name: postgresql
              containerPort: 5432
          # Démarrage : initdb au premier lancement (quelques secondes) ; pas de vivacité avant.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "mediagenda", "-d", "mediagenda", "-h", "127.0.0.1"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mediagenda", "-d", "mediagenda", "-h", "127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: postgresql
            periodSeconds: 10
            failureThreshold: 6
          # Guaranteed : demandes = limites pour le CPU et la mémoire. Dernière classe évincée
          # sous pression mémoire du nœud.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql
      volumes:
        - name: donnees
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: mediagenda
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: mediagenda
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
