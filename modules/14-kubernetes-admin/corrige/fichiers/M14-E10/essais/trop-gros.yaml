# ~/m14/e10/trop-gros.yaml — dépasse le maximum par conteneur du LimitRange : refusé à l'admission.
apiVersion: v1
kind: Pod
metadata:
  name: essai-trop-gros
  namespace: mediagenda-dev
spec:
  securityContext:   # conforme à « restricted » (E18) : ces essais resteront valables
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: attente
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sleep", "3600"]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      resources:
        requests:
          cpu: "3"
          memory: 256Mi
        limits:
          cpu: "3"
          memory: 256Mi
