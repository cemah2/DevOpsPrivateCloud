# ~/m14/e10/sans-ressources.yaml — un pod qui ne déclare rien : le LimitRange le complète.
apiVersion: v1
kind: Pod
metadata:
  name: essai-sans-ressources
  namespace: mediagenda-dev
spec:
  securityContext:   # conforme à « restricted » (E18) : ces essais resteront valables
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: attente
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sleep", "3600"]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
