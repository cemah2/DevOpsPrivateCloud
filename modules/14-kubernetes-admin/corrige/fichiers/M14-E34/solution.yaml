# solution.yaml — M14-E34, examen blanc : objets de référence des tâches 1 à 11 et 14.
# <IMAGE-MEDIAGENDA> : registry.par1.medisphere.internal/medisphere/mediagenda-api:<version> (M14-E07).
# Application (après la tâche 10 et 11 pour les nœuds) : kubectl apply -f solution.yaml
# --- Tâche 1 -------------------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: wb-examen
  labels:
    examen: blanc
    pod-security.kubernetes.io/enforce: baseline
---
# --- Tâche 2 -------------------------------------------------------------------------------------
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-examen
  namespace: wb-examen
spec:
  hard:
    pods: "15"
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 6Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limites-examen
  namespace: wb-examen
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 256Mi
---
# --- Tâche 14 (avant la tâche 3, qui la cite) ----------------------------------------------------------
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: examen-haute
value: 100000
globalDefault: false
preemptionPolicy: Never
description: Examen blanc M14-E34
---
# --- Tâche 3 -------------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-examen-config
  namespace: wb-examen
data:
  MEDIAGENDA_DB_URL: postgresql://examen@base.wb-examen.svc:5432/examen
  MEDIAGENDA_VALKEY_URL: redis://cache.wb-examen.svc:6379/0
  MEDIAGENDA_LOG_LEVEL: INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-examen
  namespace: wb-examen
  labels:
    app: api-examen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-examen
  template:
    metadata:
      labels:
        app: api-examen
    spec:
      priorityClassName: examen-haute            # tâche 14
      topologySpreadConstraints:                 # tâche 4
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          # Par défaut (Ignore), les nœuds « taintés » comptent comme des zones vides : k8s-w03
          # (dedie=bdd) et les nœuds de contrôle rendraient la 3e réplique inordonnançable.
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: api-examen
      containers:
        - name: api
          image: <IMAGE-MEDIAGENDA>
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-examen-config
          livenessProbe:
            httpGet: {path: /sante, port: 8000}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /sante, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
---
# --- Tâche 5 -------------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: api-examen
  namespace: wb-examen
spec:
  type: ClusterIP
  selector:
    app: api-examen
  ports:
    - port: 80
      targetPort: 8000
---
# --- Tâche 6 -------------------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-examen
  namespace: wb-examen
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-examen
---
# --- Tâche 7 -------------------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lecteur-examen
  namespace: wb-examen
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lecture-pods
  namespace: wb-examen
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lecteur-examen
  namespace: wb-examen
subjects:
  - kind: ServiceAccount
    name: lecteur-examen
    namespace: wb-examen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lecture-pods
---
# --- Tâche 8 -------------------------------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: purge-examen
  namespace: wb-examen
spec:
  schedule: "*/15 * * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: purge
              image: <IMAGE-MEDIAGENDA>
              command: ["python", "-c", "print('purge')"]
---
# --- Tâche 10 (après : kubectl label node k8s-w01 examen.medisphere.internal/frontal=oui) ------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontal-examen
  namespace: wb-examen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontal-examen
  template:
    metadata:
      labels:
        app: frontal-examen
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: examen.medisphere.internal/frontal
                    operator: In
                    values: ["oui"]
      containers:
        - name: api
          image: <IMAGE-MEDIAGENDA>
          envFrom:
            - configMapRef:
                name: api-examen-config
---
# --- Tâche 11 (après : kubectl taint node k8s-w03 examen=maintenance:NoSchedule) --------------------
# k8s-w03 porte AUSSI le taint dedie=bdd:NoSchedule de M14-E14 : il faut tolérer les deux.
apiVersion: v1
kind: Pod
metadata:
  name: outil-examen
  namespace: wb-examen
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-w03
  tolerations:
    - {key: examen, operator: Equal, value: maintenance, effect: NoSchedule}
    - {key: dedie, operator: Equal, value: bdd, effect: NoSchedule}
  containers:
    - name: outil
      image: <IMAGE-MEDIAGENDA>
      command: ["sleep", "7200"]
