# k8s/essais/postgresql.yaml — base de MédiAgenda pour les ESSAIS (M14-E07, DEV-1507), wb-essais.
# JETABLE : les données vivent dans un emptyDir, effacé quand le pod disparaît (redémarrage du
# nœud, suppression, reprogrammation). C'est voulu au M14 ; PostgreSQL de production : M16
# (volume persistant), M27 (CloudNativePG).
# Le mot de passe vient du Secret « postgresql » (clé mot-de-passe), créé hors du dépôt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: mediagenda
    app.kubernetes.io/component: base
spec:
  replicas: 1
  # Jamais deux instances sur les mêmes données (même jetables) : l'ancienne s'arrête d'abord.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/part-of: mediagenda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: mediagenda
        app.kubernetes.io/component: base
    spec:
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18-trixie
          env:
            - name: POSTGRES_DB
              value: mediagenda
            - name: POSTGRES_USER
              value: mediagenda
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: mot-de-passe
          ports:
            - name: postgresql
              containerPort: 5432
          volumeMounts:
            # Image 18 : PGDATA = /var/lib/postgresql/18/docker, volume déclaré sur /var/lib/postgresql.
            - name: donnees
              mountPath: /var/lib/postgresql
      volumes:
        - name: donnees
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: mediagenda
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: mediagenda
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
