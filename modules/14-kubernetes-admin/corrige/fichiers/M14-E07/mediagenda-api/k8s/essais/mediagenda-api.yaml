# k8s/essais/mediagenda-api.yaml — l'API MédiAgenda sur k8s-par1, espace wb-essais (M14-E07, DEV-1507).
# Image du projet Harbor « medisphere » (privé) : tirée avec le robot robot$k8s-pull, par le
# Secret harbor-pull (type kubernetes.io/dockerconfigjson) créé hors du dépôt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediagenda-api
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: mediagenda-api
    app.kubernetes.io/part-of: mediagenda
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mediagenda-api
      app.kubernetes.io/part-of: mediagenda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediagenda-api
        app.kubernetes.io/part-of: mediagenda
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: harbor-pull
      # Migrations avant l'API, dans chaque pod : la commande prend un verrou consultatif
      # PostgreSQL, deux pods qui démarrent ensemble ne se gênent pas ; une migration déjà faite
      # n'est pas rejouée. Reprends la commande du service de migration de ton compose.yaml (M12-E08).
      initContainers:
        - name: migrations
          image: registry.par1.medisphere.internal/medisphere/mediagenda-api:v1.0.0
          command: ["python", "-m", "mediagenda.migrate"]
          env:
            - name: MEDIAGENDA_DB_MDP
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: mot-de-passe
            - name: MEDIAGENDA_DB_URL
              value: postgresql://mediagenda:$(MEDIAGENDA_DB_MDP)@postgresql:5432/mediagenda
      containers:
        - name: api
          # Étiquette immuable publiée par le pipeline de mediagenda/api (M13-E09) : remplace
          # v1.0.0 par la tienne. Jamais « latest ».
          image: registry.par1.medisphere.internal/medisphere/mediagenda-api:v1.0.0
          ports:
            - name: http
              containerPort: 8000
          env:
            # $(VAR) est remplacé par Kubernetes à partir d'une variable définie PLUS HAUT dans la liste.
            - name: MEDIAGENDA_DB_MDP
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: mot-de-passe
            - name: MEDIAGENDA_DB_URL
              value: postgresql://mediagenda:$(MEDIAGENDA_DB_MDP)@postgresql:5432/mediagenda
            # MEDIAGENDA_VERSION et MEDIAGENDA_MIGRATIONS_DIR sont posées par l'image (M12-E05).
            - name: MEDIAGENDA_VALKEY_URL
              value: redis://valkey:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: mediagenda-api
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: mediagenda-api
    app.kubernetes.io/part-of: mediagenda
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mediagenda-api
    app.kubernetes.io/part-of: mediagenda
  ports:
    - name: http
      port: 80
      targetPort: http
