# .gitlab-ci.yml — plateforme/k8s (M14-E06). La CI VALIDE, elle n'applique pas : l'application se
# fait depuis adm01 (task appliquer) jusqu'au GitOps du M20. La validation par le serveur
# (--dry-run=server) exige l'accès au cluster : elle reste dans « task valider », sur adm01.
include:
  - project: plateforme/ci-templates
    file: qualite.yml   # pre-commit, Gitleaks (M01)

stages: [qualite, validation]

yamllint:
  stage: validation
  tags: [shell, socle]
  script:
    - uvx yamllint==1.38.0 --strict .

shellcheck:
  stage: validation
  tags: [shell, socle]
  script:
    - shellcheck -x outils/*.sh
