# mediagenda/api — k8s/dev/20-postgresql.yaml (M14-E19)
# ⚠️ PostgreSQL JETABLE : données dans un emptyDir, perdues à chaque recréation du pod.
# C'est assumé jusqu'au M16 (stockage Ceph RBD, puis CloudNativePG). Un seul réplica, stratégie
# Recreate : deux instances sur deux emptyDir feraient deux bases différentes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: mediagenda-dev
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: base-de-donnees
    app.kubernetes.io/part-of: mediagenda
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/component: base-de-donnees
        app.kubernetes.io/part-of: mediagenda
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # utilisateur postgres de l'image officielle
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: registry.par1.medisphere.internal/dockerhub/library/postgres:18-trixie
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: mediagenda
            - name: POSTGRES_DB
              value: mediagenda
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mediagenda-db
                  key: mot-de-passe
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mediagenda", "-d", "mediagenda", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "mediagenda", "-d", "mediagenda", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql     # PostgreSQL 18 : PGDATA=/var/lib/postgresql/18/docker
            - name: socket
              mountPath: /var/run/postgresql
      volumes:
        - name: donnees
          emptyDir: {}
        - name: socket
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: mediagenda-dev
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: mediagenda
spec:
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
