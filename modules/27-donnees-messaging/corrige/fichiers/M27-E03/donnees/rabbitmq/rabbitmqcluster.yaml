# plateforme/donnees — rabbitmq/rabbitmqcluster.yaml (M27-E03, PLAT-2803)
# Grappe RabbitMQ de MédiSphère, gérée par le Cluster Operator 2.23.1.
# Ce que l'opérateur crée à partir de cet objet : StatefulSet rabbitmq-server (3 pods), Services
# rabbitmq (client : amqp 5672, amqps 5671, management 15672, management-tls 15671) et rabbitmq-nodes
# (sans tête : epmd 4369, distribution 25672), Secret rabbitmq-default-user (BRIS DE GLACE, voir
# docs/donnees/rabbitmq.md), Secret rabbitmq-erlang-cookie, ConfigMaps server-conf et plugins-conf,
# compte de service + Role de découverte des pairs. PAS de PodDisruptionBudget (pdb.yaml).
# Configuration générée par l'opérateur (internal/resource/configmap.go) : disk_free_limit 2GB,
# cluster_partition_handling pause_minority, découverte par l'API Kubernetes ; avec TLS : 5671,
# 15671 (gestion), 15691 (Prometheus) EN PLUS de 15672 et 15692 (disableNonTLSListeners: false).
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  labels:
    medisphere.internal/domaine: donnees
spec:
  replicas: 3
  # Dernière corrective de la 4.3 au moment de l'installation, par le cache Harbor, ÉTIQUETTE ET
  # EMPREINTE (relevée : crane digest …/dockerhub/library/rabbitmq:4.3.7-management).
  image: registry.par1.medisphere.internal/dockerhub/library/rabbitmq:4.3.7-management@sha256:<EMPREINTE-RABBITMQ>
  # Arrêt d'un nœud (montée de version, drainage) : le crochet preStop de l'opérateur attend que les
  # files quorum gardent leur majorité sans lui (rabbitmq-upgrade await_online_quorum_plus_one), puis
  # vide le nœud (drain). Le défaut de l'opérateur est de 7 JOURS : un nœud bloqué bloquerait un
  # drainage de nœud Kubernetes pendant une semaine. 10 minutes, et une alerte si on les atteint.
  terminationGracePeriodSeconds: 600
  persistence:
    storageClassName: ceph-rbd
    storage: 10Gi
  resources:
    # Mémoire : requête = limite (pas de dépassement, pas d'éviction pour pression mémoire).
    # L'opérateur en déduit total_memory_available_override_value (limite moins 20 %) ; RabbitMQ lève
    # son alarme mémoire (blocage des éditeurs) à 60 % de cette valeur (vm_memory_high_watermark).
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  # Un nœud par travailleur, OBLIGATOIREMENT : deux nœuds sur le même travailleur, et la perte de ce
  # travailleur emporte la majorité de chaque file quorum (et de Khepri).
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
  tls:
    secretName: rabbitmq-tls
    # false : 15672 reste ouvert pour la Gateway (le TLS est terminé par gw-par1 ; dans le cluster,
    # le trafic Gateway → pod est chiffré par WireGuard, M15/M26). 5672 est FERMÉ par la politique
    # réseau (reseau.yaml), pas par RabbitMQ. true couperait aussi 15672 et 15692.
    disableNonTLSListeners: false
  rabbitmq:
    # Ajoutés aux greffons essentiels (management, prometheus, peer_discovery_k8s).
    additionalPlugins:
      - rabbitmq_auth_backend_oauth2
    # Format rabbitmq.conf, ajouté à la configuration générée.
    additionalConfig: |
      # Utilisateurs internes (applications, wb-checks, bris de glace) d'abord, jetons ensuite.
      auth_backends.1 = internal
      auth_backends.2 = oauth2
      # OAuth 2.0 (Keycloak, royaume medisphere, client public « rabbitmq ») pour l'interface.
      auth_oauth2.resource_server_id = rabbitmq
      auth_oauth2.issuer = https://sso.par1.medisphere.internal/realms/medisphere
      auth_oauth2.https.cacertfile = /etc/medisphere/racine/medisphere-root-ca.crt
      auth_oauth2.preferred_username_claims.1 = preferred_username
      # Droits RabbitMQ portés par les rôles du client « rabbitmq » (rabbitmq.tag:administrator,
      # rabbitmq.read:*/*…), dans resource_access.rabbitmq.roles du jeton.
      auth_oauth2.additional_scopes_key = resource_access.rabbitmq.roles
      management.oauth_enabled = true
      management.oauth_client_id = rabbitmq
      management.oauth_scopes = openid profile
      # L'interface ne propose QUE le SSO (défaut quand OAuth est activé : true). L'API HTTP, elle,
      # accepte toujours l'authentification basique (management.disable_basic_auth : false par défaut).
      management.oauth_disable_basic_auth = true
  override:
    statefulSet:
      spec:
        template:
          spec:
            priorityClassName: medisphere-critique
            containers:
              - name: rabbitmq
                volumeMounts:
                  - name: racine-medisphere
                    mountPath: /etc/medisphere/racine
                    readOnly: true
            volumes:
              - name: racine-medisphere
                configMap:
                  name: racine-medisphere
