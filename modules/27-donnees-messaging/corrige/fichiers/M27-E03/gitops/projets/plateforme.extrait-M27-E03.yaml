# À INTÉGRER dans plateforme/gitops — projets/plateforme.yaml (AppProject), M27-E03 (PLAT-2803).
# Nouveau dépôt source, deux espaces, et les types de CLUSTER que créent les manifestes des
# opérateurs (relevés par : yq 'select(.metadata.namespace == null) | .kind' sur le rendu).
spec:
  sourceRepos:
    - https://git01.par1.medisphere.internal/plateforme/donnees.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: rabbitmq-system
    - server: https://kubernetes.default.svc
      namespace: messagerie
  clusterResourceWhitelist:
    # … entrées existantes …
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
