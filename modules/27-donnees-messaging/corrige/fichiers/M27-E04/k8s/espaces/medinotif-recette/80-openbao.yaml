# plateforme/k8s — espaces/medinotif-recette/80-openbao.yaml (M27-E04, modèle de M25-E13)
# Compte « eso » sans jeton monté, SecretStore « openbao » lié au rôle eso-medinotif-recette
# (kv/medinotif/recette/* seulement ; plateforme/secrets, tofu/eso-espaces.tf). L'équipe écrit ses
# ExternalSecret dans medinotif/deploiement ; elle ne peut pas changer ce magasin (AppProject).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso
  namespace: medinotif-recette
  labels:
    app.kubernetes.io/part-of: external-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: medinotif-recette
spec:
  provider:
    vault:
      server: https://openbao.par1.medisphere.internal:8200
      path: kv
      version: v2
      caBundle: <RACINE-MEDISPHERE-EN-BASE64>
      auth:
        kubernetes:
          mountPath: k8s-par1
          role: eso-medinotif-recette
          serviceAccountRef:
            name: eso
            audiences:
              - openbao.medisphere.internal
