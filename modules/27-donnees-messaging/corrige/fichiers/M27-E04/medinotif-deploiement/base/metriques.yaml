# Métriques du worker (medinotif_messages_total{type,resultat}, medinotif_traitement_duration_seconds)
# sur 9100 : Service sans adresse réservé à la collecte + ServiceMonitor sélectionné par Prometheus
# (étiquette medisphere.internal/supervision=oui, M21-E02). Le flux supervision → 9100 est autorisé
# par la politique de cluster collecte-prometheus (port ajouté au M27).
apiVersion: v1
kind: Service
metadata:
  name: medinotif-metriques
  labels:
    app.kubernetes.io/name: medinotif
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: medinotif
    app.kubernetes.io/instance: medinotif
  ports:
    - name: metriques
      port: 9100
      targetPort: metriques
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: medinotif
  labels:
    app.kubernetes.io/name: medinotif
    medisphere.internal/supervision: "oui"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: medinotif
  endpoints:
    - port: metriques
      interval: 30s
