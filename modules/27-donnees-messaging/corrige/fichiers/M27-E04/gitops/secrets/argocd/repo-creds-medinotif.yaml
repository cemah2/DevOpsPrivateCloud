# plateforme/gitops — secrets/argocd/repo-creds-medinotif.yaml (M27-E04, DEV-2804)
# Identifiants de dépôt du groupe GitLab « medinotif » pour Argo CD (jeton de déploiement en
# lecture, read_repository, créé sur le GROUPE medinotif). Même modèle que repo-creds-mediagenda
# (M25-E13). Valeur rangée dans OpenBao, kv/plateforme/argocd/depot-medinotif, clés url (préfixe
# https://git01.par1.medisphere.internal/medinotif), username, password ; chemin déjà couvert par
# eso-plateforme (kv/data/plateforme/argocd/*).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-creds-medinotif
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: repo-creds-medinotif
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      metadata:
        labels:
          medisphere.internal/source: openbao
          argocd.argoproj.io/secret-type: repo-creds
  dataFrom:
    - extract:
        key: plateforme/argocd/depot-medinotif
