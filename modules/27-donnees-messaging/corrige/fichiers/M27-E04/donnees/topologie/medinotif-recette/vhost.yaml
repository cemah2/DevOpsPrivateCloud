# Vhost de recette : cloisonne files, échanges et permissions de la recette.
# defaultQueueType: quorum → une file déclarée sans type dans ce vhost est une file quorum.
# deletionPolicy: retain → supprimer l'objet (erreur de Git, Application supprimée) ne supprime PAS
# le vhost dans RabbitMQ (ni donc ses files et leurs messages).
apiVersion: rabbitmq.com/v1beta1
kind: Vhost
metadata:
  name: medinotif-recette
spec:
  name: medinotif-recette
  defaultQueueType: quorum
  deletionPolicy: retain
  rabbitmqClusterReference:
    name: rabbitmq
