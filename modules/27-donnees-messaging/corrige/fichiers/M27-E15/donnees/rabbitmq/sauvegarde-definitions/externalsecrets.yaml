# plateforme/donnees — rabbitmq/sauvegarde-definitions/externalsecrets.yaml (M27-E15)
# ClusterSecretStore « openbao » de la plateforme (M27-E03), comme la topologie (M27-E04). Clés attendues par le Topology Operator pour
# importCredentialsSecret : username, password. medisphere-ca : déjà présent dans messagerie (M27-E03).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sauvegarde-definitions-identifiants
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: sauvegarde-definitions-identifiants, creationPolicy: Owner}
  data:
    - secretKey: username
      remoteRef: {key: plateforme/rabbitmq/sauvegarde-definitions, property: utilisateur}
    - secretKey: password
      remoteRef: {key: plateforme/rabbitmq/sauvegarde-definitions, property: mot_de_passe}
---
# Identité SeaweedFS « messagerie-definitions » : Write et List sur le seul compartiment messagerie-definitions.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messagerie-definitions-s3
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: messagerie-definitions-s3, creationPolicy: Owner}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: plateforme/rabbitmq/messagerie-definitions-s3, property: ACCESS_KEY_ID}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: plateforme/rabbitmq/messagerie-definitions-s3, property: ACCESS_SECRET_KEY}
