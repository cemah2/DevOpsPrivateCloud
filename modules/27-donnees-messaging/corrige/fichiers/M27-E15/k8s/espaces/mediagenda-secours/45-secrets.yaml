# plateforme/k8s — espaces/mediagenda-secours/45-secrets.yaml (M27-E15)
# Entrée de l'espace dans OpenBao (modèle M25-E13 : compte « eso », SecretStore « openbao » lié au rôle
# eso-mediagenda-secours → kv/mediagenda/secours/* seulement ; ajouté à tofu/eso-espaces.tf de
# plateforme/secrets), puis les deux Secrets que lit l'ObjectStore :
#   cnpg-s3       identité SeaweedFS « cnpg-secours » en LECTURE seule sur cnpg-k8s-par1 (actions Read
#                 et List du fichier d'identités S3 de s3-01, rôle Ansible du M05) : un réplica qui ne
#                 fait que lire l'archive n'a aucune raison de pouvoir l'effacer ;
#   medisphere-ca racine MédiSphère (kv/mediagenda/secours/medisphere-ca, clé ca.crt).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso
  namespace: mediagenda-secours
  labels:
    app.kubernetes.io/part-of: external-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: mediagenda-secours
spec:
  provider:
    vault:
      server: https://openbao.par1.medisphere.internal:8200
      path: kv
      version: v2
      caBundle: <RACINE-MEDISPHERE-EN-BASE64>
      auth:
        kubernetes:
          mountPath: k8s-par1
          role: eso-mediagenda-secours
          serviceAccountRef:
            name: eso
            audiences:
              - openbao.medisphere.internal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3
  namespace: mediagenda-secours
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: cnpg-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: mediagenda/secours/cnpg-s3, property: ACCESS_KEY_ID}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: mediagenda/secours/cnpg-s3, property: ACCESS_SECRET_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medisphere-ca
  namespace: mediagenda-secours
spec:
  refreshInterval: 24h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: medisphere-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef: {key: mediagenda/secours/medisphere-ca, property: ca.crt}
