# plateforme/gitops — valeurs/strimzi/values.yaml (M27-E09, PLAT-2809) — chart strimzi-kafka-operator 1.3.0
# Opérateur installé DANS kafka-essai et cantonné à cet espace : watchNamespaces vide et
# watchAnyNamespace faux = l'opérateur ne surveille que son propre espace (STRIMZI_NAMESPACE).
# Toutes les images (opérateur, Kafka, opérateurs d'entité…) par le cache Harbor de quay.io : le chart
# compose <defaultImageRegistry>/<defaultImageRepository>/<image>:<étiquette>.
defaultImageRegistry: registry.par1.medisphere.internal
defaultImageRepository: quay/strimzi
watchNamespaces: []
watchAnyNamespace: false
replicas: 1
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 384Mi}
# Les NetworkPolicy des grappes (générées par l'opérateur, generateNetworkPolicy: true par défaut) et
# les PodDisruptionBudget des nœuds Kafka (generatePodDisruptionBudget: true) restent activés.
