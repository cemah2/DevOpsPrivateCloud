# plateforme/donnees — kafka-essai/topics.yaml (M27-E09)
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: rendez-vous.evenements
  labels:
    strimzi.io/cluster: kafka-essai
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 604800000     # 7 jours
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: notifications.rebut
  labels:
    strimzi.io/cluster: kafka-essai
spec:
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 1209600000    # 14 jours : le temps de regarder ce qui a été rejeté
