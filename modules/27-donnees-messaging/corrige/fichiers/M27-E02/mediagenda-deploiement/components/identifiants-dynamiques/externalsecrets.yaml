# mediagenda/deploiement — components/identifiants-dynamiques/externalsecrets.yaml (M25-E14 ; M27-E02, PLAT-2802)
# Deux ExternalSecret, un par générateur d'identifiants dynamiques d'OpenBao (M25-E14).
# M27-E02 : l'API passe par la RÉSERVE DE CONNEXIONS (Pooler mediagenda-db-pooler-rw, PgBouncer en
# mode transaction) ; le migrateur, lui, reste DIRECTEMENT sur le primaire (mediagenda-db-rw) :
# verrou consultatif de session, DDL longs, SET de session — tout ce que le mode transaction casse.
# Le pooler n'existe qu'en recette et en prod ; ce component n'est inclus que dans ces deux
# overlays (dev garde le Secret du propriétaire, rendu par le chart).
# Vague -2 : prêts AVANT le Job de migration (vague -1) et l'API (vague 0).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediagenda-db-api
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 30m
  target:
    name: mediagenda-db-api
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          medisphere.internal/source: openbao-dynamique
      data:
        # M27-E02 : hôte mediagenda-db-pooler-rw (au lieu de mediagenda-db-rw).
        uri: "postgresql://{{ .username }}:{{ .password }}@mediagenda-db-pooler-rw:5432/mediagenda"
        username: "{{ .username }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: mediagenda-api
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediagenda-db-migrateur
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 30m
  target:
    name: mediagenda-db-migrateur
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          medisphere.internal/source: openbao-dynamique
      data:
        # INCHANGÉ : directement sur le primaire, jamais par le pooler.
        uri: "postgresql://{{ .username }}:{{ .password }}@mediagenda-db-rw:5432/mediagenda"
        username: "{{ .username }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: mediagenda-migrateur
