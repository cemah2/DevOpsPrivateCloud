# mediagenda/deploiement — components/identifiants-dynamiques/externalsecrets.yaml
# (M25-E14 ; M27-E02 : API par le pooler ; M27-E05 : clé « password » pour Flyway, DEV-2805)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediagenda-db-api
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 30m
  target:
    name: mediagenda-db-api
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          medisphere.internal/source: openbao-dynamique
      data:
        uri: "postgresql://{{ .username }}:{{ .password }}@mediagenda-db-pooler-rw:5432/mediagenda"
        username: "{{ .username }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: mediagenda-api
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediagenda-db-migrateur
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 30m
  target:
    name: mediagenda-db-migrateur
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          medisphere.internal/source: openbao-dynamique
      data:
        # uri : gardée pour l'outillage (psql, ancien Job) ; directement sur le primaire.
        uri: "postgresql://{{ .username }}:{{ .password }}@mediagenda-db-rw:5432/mediagenda"
        username: "{{ .username }}"
        # M27-E05 : Flyway lit l'utilisateur et le mot de passe à part (FLYWAY_USER, FLYWAY_PASSWORD).
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: mediagenda-migrateur
