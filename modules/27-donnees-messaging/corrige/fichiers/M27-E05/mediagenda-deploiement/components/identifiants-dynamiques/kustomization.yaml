# mediagenda/deploiement — components/identifiants-dynamiques (M25-E14, E15 ; M27-E02 : pooler ;
# M27-E05 : Job Flyway, DEV-2805)
# L'API et le Job de migration lisent leurs identifiants dans des Secrets produits par ESO à partir
# des identifiants DYNAMIQUES d'OpenBao (M25-E14). M27-E05 : le Job s'appelle mediagenda-migrations,
# son conteneur « flyway » ; Flyway veut l'utilisateur et le mot de passe À PART (l'URL JDBC est
# fixe, dans le Job) : le modèle de mediagenda-db-migrateur fournit désormais « password ».
# Ordre des components dans l'overlay : migrations, canary, identifiants-dynamiques, livraison.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - externalsecrets.yaml
patches:
  - target:
      group: argoproj.io
      kind: Rollout
      name: mediagenda
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Rollout
      metadata:
        name: mediagenda
        annotations:
          secret.reloader.stakater.com/reload: "mediagenda-db-api"
          reloader.stakater.com/rollout-strategy: "restart"
  - target:
      kind: Deployment
      name: mediagenda
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mediagenda
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: MEDIAGENDA_DB_URL
                    valueFrom:
                      secretKeyRef:
                        name: mediagenda-db-api
                        key: uri
  # Job Flyway (component « migrations », M27-E05) : remplace les identifiants du propriétaire
  # (mediagenda-db-app, dev) par ceux du migrateur dynamique.
  - target:
      group: batch
      kind: Job
      name: mediagenda-migrations
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: mediagenda-migrations
      spec:
        template:
          spec:
            containers:
              - name: flyway
                env:
                  - name: FLYWAY_USER
                    valueFrom:
                      secretKeyRef:
                        name: mediagenda-db-migrateur
                        key: username
                  - name: FLYWAY_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: mediagenda-db-migrateur
                        key: password
