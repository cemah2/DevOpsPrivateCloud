# mediagenda/deploiement — components/migrations/job.yaml (M20-E11 ; Flyway : M27-E05, DEV-2805)
# Job de migration du schéma de MédiAgenda, joué par Argo CD à CHAQUE synchronisation, AVANT la
# nouvelle version de l'API : hook Sync, vague -1 (inchangé depuis M20-E11 ; PreSync interbloquerait
# un environnement neuf, voir M20). Il REMPLACE le Job « mediagenda-migrate » (python -m
# mediagenda.migrate) : nouveau nom, donc l'ancien Job n'est plus rendu ; son dernier exemplaire
# (hook BeforeHookCreation) reste visible jusqu'à ce qu'on le supprime (étape 9).
#
# Flyway 13.11.1, image medisphere/mediagenda-migrations (même étiquette que l'API, component
# « livraison » ; empreinte en prod). Configuration par variables FLYWAY_* : une variable mal
# orthographiée est IGNORÉE sans message (vérifié) — relis les noms.
#   - Connexion DIRECTE au primaire (mediagenda-db-rw), jamais au pooler : Flyway prend un verrou
#     consultatif PostgreSQL pour qu'une seule migration tourne à la fois.
#   - TLS vérifié : CA de la grappe (Secret mediagenda-db-ca de CloudNativePG, clé ca.crt SEULE —
#     le Secret contient aussi la clé privée de la CA, qu'on ne monte pas) ; le certificat serveur
#     de CNPG porte le nom mediagenda-db-rw.
#   - Compte : en dev, le propriétaire (Secret mediagenda-db-app de CNPG) ; en recette et en prod,
#     le migrateur DYNAMIQUE d'OpenBao (component identifiants-dynamiques remplace FLYWAY_USER et
#     FLYWAY_PASSWORD). Il prend le rôle mediagenda à la connexion : tables et
#     flyway_schema_history appartiennent à mediagenda.
#   - Reprise : baselineOnMigrate + version 2 + rappel beforeBaseline (garde-fou) TANT QUE les
#     trois environnements n'ont pas été repris ; retiré ensuite par une MR (étape 10).
apiVersion: batch/v1
kind: Job
metadata:
  name: mediagenda-migrations
  labels:
    app.kubernetes.io/name: mediagenda
    app.kubernetes.io/instance: mediagenda
    app.kubernetes.io/component: migrations
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Deux nouvelles tentatives (une base qui bascule, un verrou pris : lock_timeout des migrations,
  # M27-E06), dix minutes en tout.
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        # name + instance : sorties de la NetworkPolicy « mediagenda » du chart (DNS, 5432) et entrée
        # de « mediagenda-acces-base » en recette ; component=migrations l'exclut du reste.
        app.kubernetes.io/name: mediagenda
        app.kubernetes.io/instance: mediagenda
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10004
        runAsGroup: 10004
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway
          image: registry.par1.medisphere.internal/medisphere/mediagenda-migrations:v1.0.0
          imagePullPolicy: IfNotPresent
          # ENTRYPOINT « flyway » de l'image ; « migrate » puis « info » (état final dans le journal).
          args: ["migrate", "info"]
          env:
            - name: FLYWAY_URL
              value: "jdbc:postgresql://mediagenda-db-rw:5432/mediagenda?sslmode=verify-full&sslrootcert=/etc/mediagenda-db-ca/ca.crt"
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: mediagenda-db-app
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mediagenda-db-app
                  key: password
            - name: FLYWAY_CONNECT_RETRIES
              value: "10"
            - name: FLYWAY_LOCK_RETRY_COUNT
              value: "50"
            # --- Reprise de la base existante (à RETIRER après les trois environnements) ---------
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_BASELINE_VERSION
              value: "2"
            - name: FLYWAY_BASELINE_DESCRIPTION
              value: "reprise de mediagenda.migrate (M27-E05)"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # JVM (JRE 25 de l'image) : tas par défaut à 25 % de cette limite (MaxRAMPercentage).
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ca-base
              mountPath: /etc/mediagenda-db-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: ca-base
          secret:
            secretName: mediagenda-db-ca
            items:
              - key: ca.crt
                path: ca.crt
