# components/valkey/externalsecrets.yaml (M27-E07) — comptes de Valkey, depuis OpenBao
# kv/mediagenda/<env>/valkey (clés mot_de_passe, mot_de_passe_admin, mot_de_passe_exportateur,
# mot_de_passe_sonde, url). Le chemin « <env> » est posé par chaque overlay (patch sur l'étiquette
# app.kubernetes.io/name=valkey). SecretStore « openbao » de l'espace (M25-E13).
# Trois Secrets, trois usages : chaque conteneur ne reçoit que ce dont il a besoin.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-comptes
  labels:
    app.kubernetes.io/name: valkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: valkey-comptes
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          medisphere.internal/source: openbao
      data:
        # Fichier ACL de Valkey : « #<sha256> » = empreinte du mot de passe, jamais le mot de passe.
        #   default      désactivé (sans lui, une connexion non authentifiée ne peut RIEN faire)
        #   mediagenda   l'API : ses clés seulement, lecture/écriture, rien de dangereux (FLUSHALL, KEYS,
        #                CONFIG, DEBUG…), aucun canal
        #   exportateur  redis_exporter : statistiques seulement (latency|histogram : exigé par la v1.95)
        #   sonde        la sonde de disponibilité : PING
        #   admin        bris de glace (Secret valkey-admin) : tout
        users.acl: |
          user default off resetkeys resetchannels -@all
          user mediagenda on #{{ .mot_de_passe | sha256sum }} resetkeys ~mediagenda:* resetchannels -@all +@read +@write +@connection -@dangerous
          user exportateur on #{{ .mot_de_passe_exportateur | sha256sum }} resetkeys resetchannels -@all +@connection +info +config|get +client|list +slowlog|get +slowlog|len +latency|latest +latency|histogram +dbsize +memory|stats +select
          user sonde on #{{ .mot_de_passe_sonde | sha256sum }} resetkeys resetchannels -@all +ping
          user admin on #{{ .mot_de_passe_admin | sha256sum }} ~* &* +@all
        sonde: "{{ .mot_de_passe_sonde }}"
        exportateur: "{{ .mot_de_passe_exportateur }}"
  dataFrom:
    - extract:
        key: mediagenda/ENVIRONNEMENT/valkey
---
# Compte de bris de glace (valkey-cli --user admin) : interventions et scripts de panne du workbook.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-admin
  labels:
    app.kubernetes.io/name: valkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: valkey-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          medisphere.internal/source: openbao
      data:
        utilisateur: admin
        mot_de_passe: "{{ .mot_de_passe_admin }}"
  dataFrom:
    - extract:
        key: mediagenda/ENVIRONNEMENT/valkey
---
# URL de l'API : rediss://mediagenda:<mot de passe>@valkey.mediagenda-<env>.svc:6379/0 (clé url).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediagenda-valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mediagenda-valkey
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          medisphere.internal/source: openbao
      data:
        url: "{{ .url }}"
  dataFrom:
    - extract:
        key: mediagenda/ENVIRONNEMENT/valkey
