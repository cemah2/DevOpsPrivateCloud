# valkey.conf — MédiAgenda (M27-E07). Monté en lecture seule : CONFIG REWRITE et ACL SAVE échouent,
# c'est voulu (la configuration vient de Git, les comptes d'OpenBao).
# TLS seulement, sur le port habituel (les politiques réseau et l'URL ne changent que de schéma).
port 0
tls-port 6379
tls-cert-file /etc/valkey/tls/tls.crt
tls-key-file /etc/valkey/tls/tls.key
tls-ca-cert-file /etc/valkey/tls/ca.crt
# Pas de certificat client exigé : l'authentification passe par les ACL.
tls-auth-clients no
# Certificat de 72 h renouvelé par cert-manager : relu toutes les heures, sans redémarrage (Valkey 9.1).
tls-auto-reload-interval 3600
# Comptes : fichier construit par l'ExternalSecret valkey-comptes (empreintes SHA-256, pas de mot de passe).
aclfile /etc/valkey/acl/users.acl
# Cache borné : ≈ 60 % de la limite mémoire du conteneur (160 Mio), le reste pour les tampons des
# clients, la fragmentation et le processus lui-même. Plein : on évince la clé la moins récemment lue.
maxmemory 96mb
maxmemory-policy allkeys-lru
# Un cache : pas de persistance. BGSAVE reste possible à la main (sauvegarde avant montée de version).
save ""
appendonly no
dir /data
