# mediagenda/deploiement — overlays/prod/valkey.yaml (M27-E07, PLAT-2807)
# Certificat serveur de Valkey (PKI de services d'OpenBao, M25-E16 : noms sous « svc » seulement, 72 h).
# Valkey le relit toutes les heures (tls-auto-reload-interval) : pas de redémarrage au renouvellement.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-tls
spec:
  secretName: valkey-tls
  duration: 72h
  renewBefore: 24h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
  dnsNames:
    - valkey.mediagenda-prod.svc
    - valkey.mediagenda-prod.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: openbao-services
