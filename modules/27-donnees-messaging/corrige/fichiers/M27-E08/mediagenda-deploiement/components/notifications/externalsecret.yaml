# components/notifications/externalsecret.yaml (M27-E08) — même secret OpenBao que celui dont la
# plateforme se sert pour créer l'utilisateur mediagenda-<env> dans RabbitMQ (topologie, E04/E08).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediagenda-amqp
  labels:
    app.kubernetes.io/name: notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mediagenda-amqp
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          medisphere.internal/source: openbao
  data:
    - secretKey: url
      remoteRef:
        key: mediagenda/ENVIRONNEMENT/amqp
        property: url
