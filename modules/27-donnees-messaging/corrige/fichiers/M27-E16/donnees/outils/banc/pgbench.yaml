# plateforme/donnees — outils/banc/pgbench.yaml (M27-E16)
# Job pgbench générique. Point de départ : kubectl cnpg pgbench bench-essai -n wb-essais --db-name banc
#   --job-name x --dry-run -- … (manifeste du plugin), modifié pour viser l'hôte voulu (PGHOST) :
#     direct   : bench-essai-rw         (Service du primaire, 5432)
#     pooler   : bench-essai-pooler-rw  (Service du pooler, 5432)
# Identifiants : Secret bench-essai-app (créé par CNPG pour le propriétaire « banc »).
# Lancer une mesure (exemple : pooler, 80 clients, une connexion par transaction) :
#   sed -e 's/@HOTE@/bench-essai-pooler-rw/' -e 's/@NOM@/pooler-c80-C/' -e 's/@ARGS@/"-c","80","-j","4","-T","60","-C","-P","10"/' \
#     outils/banc/pgbench.yaml | kubectl apply -f -
#   kubectl -n wb-essais logs -f job/pgbench-pooler-c80-C
apiVersion: batch/v1
kind: Job
metadata:
  name: pgbench-@NOM@
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: pgbench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbench
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pgbench
          image: registry.par1.medisphere.internal/ghcr/cloudnative-pg/postgresql:18.6-minimal-trixie
          command: ["pgbench"]
          args: [@ARGS@]
          env:
            - {name: PGHOST, value: "@HOTE@"}
            # Certificat vérifié (règle 6 du module), sans le nom : le pooler présente le certificat
            # serveur de la grappe, dont les noms ne couvrent pas le Service du pooler. verify-ca
            # garde la vérification de la chaîne ; verify-full suffit pour le seul accès direct.
            - {name: PGSSLMODE, value: verify-ca}
            - {name: PGSSLROOTCERT, value: /etc/banc-ca/ca.crt}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: bench-essai-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: bench-essai-app, key: password}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: bench-essai-app, key: dbname}}
          resources:
            requests: {cpu: 500m, memory: 64Mi}
            limits: {cpu: "2", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: ca, mountPath: /etc/banc-ca, readOnly: true}
      volumes:
        # Seule la clé ca.crt du Secret de la CA de la grappe (il contient aussi la clé privée).
        - name: ca
          secret:
            secretName: bench-essai-ca
            items: [{key: ca.crt, path: ca.crt}]
