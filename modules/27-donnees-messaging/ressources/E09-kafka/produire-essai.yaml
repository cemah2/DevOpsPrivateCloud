# Outil du workbook (M27-E09, E10) : produit un lot d'essai sur le topic rendez-vous.evenements de la
# grappe kafka-essai, avec le compte « mediagenda » (SCRAM-SHA-512 sur TLS, acks=all).
# À lancer À LA MAIN dans l'espace d'essai (jamais dans un espace applicatif), après avoir créé :
#   - la ConfigMap « produire-essai » (le script) :
#       kubectl -n kafka-essai create configmap produire-essai --from-file=produire.sh \
#         --dry-run=client -o yaml | kubectl apply -f -
#   - la ConfigMap « messages-essai » (le lot, généré par messages.py, une ligne par message) ;
# puis : kubectl -n kafka-essai delete job produire-essai --ignore-not-found && kubectl apply -f produire-essai.yaml
#        kubectl -n kafka-essai logs -f job/produire-essai
# Le mot de passe vient du Secret « mediagenda » créé par l'opérateur d'utilisateurs de Strimzi
# (clé sasl.jaas.config) ; la CA des courtiers du Secret kafka-essai-cluster-ca-cert (clé ca.crt).
# Code de sortie 1 si un message n'a pas été accepté (kafka-console-producer, lui, rend toujours 0).
apiVersion: batch/v1
kind: Job
metadata:
  name: produire-essai
  namespace: kafka-essai
  labels:
    app.kubernetes.io/name: produire-essai
    app.kubernetes.io/part-of: kafka-essai
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: produire-essai
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # appuser de l'image apache/kafka
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producteur
          image: registry.par1.medisphere.internal/dockerhub/apache/kafka:4.3.1
          command: ["sh", "/outil/produire.sh"]
          env:
            - name: AMORCE
              value: kafka-essai-kafka-bootstrap.kafka-essai.svc:9093
            - name: TOPIC
              value: rendez-vous.evenements
            - name: LOG_DIR       # les scripts de Kafka écrivent leurs journaux ici (racine en lecture seule)
              value: /tmp
            - name: SASL_JAAS
              valueFrom:
                secretKeyRef:
                  name: mediagenda
                  key: sasl.jaas.config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: outil, mountPath: /outil, readOnly: true}
            - {name: messages, mountPath: /messages, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: outil
          configMap: {name: produire-essai}
        - name: messages
          configMap: {name: messages-essai}
        - name: ca
          secret:
            secretName: kafka-essai-cluster-ca-cert
            items: [{key: ca.crt, path: ca.crt}]
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
