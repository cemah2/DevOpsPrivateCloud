# plateforme/gitops — plateforme/vc-essai.yaml (M28-E09, PLAT-2909) — TEMPORAIRE.
# vCluster OSS « vc-essai » dans l'espace de libre-service medidoc-vc-essai (créé par l'équipe MédiDoc,
# locataire medidoc). Projet « plateforme » : le chart crée une ClusterRole (lecture des PV,
# gestion des VolumeSnapshotContent) que le projet « medidoc » n'autorise pas — à mettre dans la
# comparaison. AJOUTER aussi la destination medidoc-vc-essai à l'AppProject « plateforme » le temps
# de l'essai (et la retirer avec ce fichier).
# Finaliseur : supprimer ce fichier (élagage de l'Application de groupe « plateforme ») supprime
# l'Application ET tous les objets qu'elle suit (StatefulSet, Services, ClusterRole…). Le PVC du plan
# de contrôle, lui, vient du volumeClaimTemplate (politique de rétention « Retain » par défaut du
# chart 0.37.4) : il ne part qu'avec l'espace medidoc-vc-essai, supprimé ensuite par l'équipe.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vc-essai
  namespace: argocd
  labels:
    medisphere.internal/equipe: plateforme
    medisphere.internal/temporaire: "oui"
  annotations:
    medisphere.internal/ticket: "PLAT-2909"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: plateforme
  sources:
    - repoURL: registry.par1.medisphere.internal/charts
      chart: vcluster
      targetRevision: 0.37.4
      helm:
        releaseName: vc-essai
        valueFiles:
          - $values/valeurs/vc-essai/values.yaml
    - repoURL: https://git01.par1.medisphere.internal/plateforme/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: medidoc-vc-essai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
