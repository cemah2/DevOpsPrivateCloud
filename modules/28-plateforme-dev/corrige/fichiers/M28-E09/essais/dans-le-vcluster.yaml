# M28-E09, étapes 3 et 4 — objets créés DANS le vCluster (contexte de « vcluster connect »).
# Étape 3 : un espace, un Deployment, un Service, un PVC, une CRD, une ClusterRole.
apiVersion: v1
kind: Namespace
metadata:
  name: essai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: essai
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: echo
          image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: essai
spec:
  selector: {app: echo}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: donnees
  namespace: essai
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vignettes.essai.medisphere.internal
spec:
  group: essai.medisphere.internal
  names: {kind: Vignette, plural: vignettes, singular: vignette}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lecture-vignettes
rules:
  - apiGroups: ["essai.medisphere.internal"]
    resources: ["vignettes"]
    verbs: [get, list, watch]
---
# Étape 4 : ce que l'HÔTE refuse — un pod privilégié (Pod Security « restricted » de medidoc-vc-essai)
# et un PVC cephfs (Capsule : seule ceph-rbd est autorisée au locataire medidoc).
apiVersion: v1
kind: Pod
metadata:
  name: privilegie
  namespace: essai
spec:
  containers:
    - name: c
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: partage
  namespace: essai
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs
  resources: {requests: {storage: 1Gi}}
