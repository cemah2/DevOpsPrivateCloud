# plateforme/k8s — locataires/kustomization.yaml (M28-E05, PLAT-2905)
# Rendu par l'Application Argo CD « locataires » (projet plateforme). Un fichier par locataire.
# Nombre d'espaces : mediagenda 4 environnements (dev, recette, prod, secours) + 3 en libre-service ;
# medidoc 2 (dev, recette) + 3 ; medinotif 2 (recette, prod) + 2.
# limites-par-defaut.yaml : LimitRange répliquée par Capsule dans tout espace des locataires.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mediagenda.yaml
  - medidoc.yaml
  - medinotif.yaml
  - limites-par-defaut.yaml
