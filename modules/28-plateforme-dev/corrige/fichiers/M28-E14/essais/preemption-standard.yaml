# Pod « haute » qui ne tient pas sur k8s-w01 sans déloger des pods « essai-basse » (M28-E14, étape 5).
# Il joue le rôle de medisphere-standard face à medisphere-lot (voir preemption.yaml : pourquoi des
# classes d'essai négatives). Seconde partie de l'essai : remplace essai-haute par essai-basse ; le pod
# reste Pending (preemptionPolicy: Never, et de toute façon aucune victime de priorité inférieure).
apiVersion: v1
kind: Pod
metadata:
  name: essai-haute
  namespace: wb-essais
  labels: {app.kubernetes.io/name: essai-haute, medisphere.internal/equipe: plateforme}
spec:
  priorityClassName: essai-haute
  nodeSelector: {kubernetes.io/hostname: k8s-w01}
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: dort
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 2Gi}
        limits: {memory: 2Gi}
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
