# plateforme/gitops — valeurs/keda/values.yaml (M28-E03, PLAT-2903) — chart kedacore/keda 2.21.0.
# Clés vérifiées dans le values.yaml du chart 2.21.0 et rendues par « helm template ».

# Images par le cache Harbor « ghcr », épinglées par empreinte (le chart accepte « tag », pas
# « digest » : on met « version@sha256:… » dans tag). Relève les empreintes dans Harbor :
#   crane digest registry.par1.medisphere.internal/ghcr/kedacore/keda:2.21.0
image:
  keda:
    registry: registry.par1.medisphere.internal/ghcr
    repository: kedacore/keda
    tag: "2.21.0@sha256:<DIGEST-KEDA>"
  metricsApiServer:
    registry: registry.par1.medisphere.internal/ghcr
    repository: kedacore/keda-metrics-apiserver
    tag: "2.21.0@sha256:<DIGEST-KEDA-METRICS-APISERVER>"
  webhooks:
    registry: registry.par1.medisphere.internal/ghcr
    repository: kedacore/keda-admission-webhooks
    tag: "2.21.0@sha256:<DIGEST-KEDA-ADMISSION-WEBHOOKS>"
  pullPolicy: IfNotPresent

clusterName: k8s-par1

# Certificats internes (gRPC opérateur ↔ adaptateur, APIService, webhooks) par cert-manager (M15)
# plutôt que générés par l'opérateur : renouvellement suivi comme les autres certificats.
certificates:
  autoGenerated: false
  certManager:
    enabled: true
    generateCA: true
  # Autorités de confiance supplémentaires de l'opérateur pour les connexions sortantes TLS
  # (API de gestion de RabbitMQ, chaîne « MédiSphère Services CA » → racine MédiSphère).
  # Rendu : argument --ca-dir=/custom/ca de keda-operator.
  operator:
    caDirs:
      - /custom/ca

volumes:
  keda:
    extraVolumes:
      - name: racine-medisphere
        configMap:
          name: racine-medisphere
    extraVolumeMounts:
      - name: racine-medisphere
        mountPath: /custom/ca
        readOnly: true

# La règle par défaut donne à l'opérateur list/watch sur TOUS les Secrets du cluster (ClusterRole
# rendue) : c'est ainsi qu'il lit ceux que référencent les TriggerAuthentication des équipes.
# Restreindre (restrict.secret: true) limiterait la lecture à l'espace « keda » et imposerait des
# ClusterTriggerAuthentication dont la plateforme gère les Secrets. Décision M28-E03 : défaut
# CONSERVÉ, risque écrit dans docs/plateforme-dev/autoscaling.md et repris dans l'ADR-0280.
permissions:
  operator:
    restrict:
      secret: false

# Types de cibles à sous-ressource « scale » autorisés en plus de Deployment et StatefulSet :
# les Rollouts seulement (défaut : « */* », toute ressource du cluster).
# ⚠️ Le gabarit écrit « <kind>/scale » tel quel dans la ClusterRole : il faut le nom de RESSOURCE
# (pluriel, minuscules), « rollouts », pas le Kind « Rollout » de l'exemple commenté du chart,
# qui produirait une règle « Rollout/scale » sans effet (vérifié par helm template).
rbac:
  scaledRefKinds:
    - apiGroup: argoproj.io
      kind: rollouts

# Politiques réseau : celles du chart (sortie vers l'entité « cluster » entière) sont trop larges ;
# les nôtres sont dans plateforme/k8s/espaces/keda/20-reseau.yaml.
networkPolicy:
  enabled: false

# Supervision (M21) : ServiceMonitors sélectionnés par medisphere.internal/supervision: "oui".
prometheus:
  operator:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        medisphere.internal/supervision: "oui"
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        medisphere.internal/supervision: "oui"
  webhooks:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        medisphere.internal/supervision: "oui"

# Ressources : défauts du chart en requests (100 m / 100 Mi par composant), limites resserrées.
resources:
  operator:
    requests: {cpu: 100m, memory: 100Mi}
    limits: {memory: 512Mi}
  metricServer:
    requests: {cpu: 100m, memory: 100Mi}
    limits: {memory: 512Mi}
  webhooks:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Contextes de sécurité : ceux du chart sont conformes à « restricted » (non-root, sans privilège,
# capacités retirées, seccomp RuntimeDefault, système de fichiers en lecture seule).
