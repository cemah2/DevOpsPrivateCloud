# medinotif/deploiement — overlays/recette/keda/externalsecret.yaml (M28-E03, PLAT-2903)
# Identifiants du compte keda-recette (API de gestion de RabbitMQ), lus dans OpenBao par le
# SecretStore « openbao » de l'espace (rôle eso-medinotif-recette : kv/medinotif/recette/*).
# Vague -1 : le Secret existe avant le ScaledObject (vague 0) ; sinon KEDA journalise une erreur
# d'authentification jusqu'à la synchronisation suivante.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medinotif-rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: medinotif-rabbitmq
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        utilisateur: "{{ .utilisateur }}"
        mot_de_passe: "{{ .mot_de_passe }}"
        # Adresse de l'API de gestion (HTTPS, dans le cluster) : rangée avec les identifiants pour
        # que le ScaledObject ne porte aucune information de connexion (la même pour tous les
        # environnements ; le vhost, lui, est dans le ScaledObject). Barre oblique finale
        # obligatoire quand l'URL ne porte pas le vhost (documentation du scaler).
        hote: "https://rabbitmq.messagerie.svc.cluster.local:15671/"
  data:
    - secretKey: utilisateur
      remoteRef:
        key: medinotif/recette/keda
        property: utilisateur
    - secretKey: mot_de_passe
      remoteRef:
        key: medinotif/recette/keda
        property: mot_de_passe
