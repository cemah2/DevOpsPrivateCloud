# plateforme/k8s — espaces/portail/40-externalsecret.yaml (M28-E06 ; clés ajoutées en E07 et E10)
# Secrets du portail, lus dans OpenBao (kv/plateforme/portail) par le ClusterSecretStore « openbao »
# (rôle eso-plateforme). Le Secret « portail » est passé tel quel en variables d'environnement
# (backstage.extraEnvVarsSecrets) : ses clés SONT les noms des variables de app-config.production.yaml.
# Valeurs dans le coffre, générées longues et sans caractère spécial :
#   bao kv put kv/plateforme/portail session_secret="$(openssl rand -hex 32)" checks_token="$(openssl rand -hex 32)" …
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portail
  namespace: portail
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: portail
    creationPolicy: Owner
  data:
    - secretKey: AUTH_OIDC_CLIENT_SECRET
      remoteRef: {key: plateforme/portail, property: oidc_client_secret}
    - secretKey: AUTH_SESSION_SECRET
      remoteRef: {key: plateforme/portail, property: session_secret}
    - secretKey: BACKSTAGE_CHECKS_TOKEN
      remoteRef: {key: plateforme/portail, property: checks_token}
    # E07 : jeton du compte de service GitLab svc-portail, mot de passe du compte système LDAP.
    - secretKey: GITLAB_TOKEN
      remoteRef: {key: plateforme/portail, property: gitlab_token}
    - secretKey: LDAP_SECRET
      remoteRef: {key: plateforme/portail, property: ldap_mot_de_passe}
    # E10 : identité de LECTURE du compartiment portail-techdocs (s3-01).
    - secretKey: TECHDOCS_S3_ACCESS_KEY_ID
      remoteRef: {key: plateforme/portail, property: techdocs_cle}
    - secretKey: TECHDOCS_S3_SECRET_ACCESS_KEY
      remoteRef: {key: plateforme/portail, property: techdocs_secret}
