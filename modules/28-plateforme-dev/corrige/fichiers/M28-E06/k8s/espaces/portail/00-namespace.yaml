# plateforme/k8s — espaces/portail/00-namespace.yaml (M28-E06, PLAT-2906) — « task espaces ».
apiVersion: v1
kind: Namespace
metadata:
  name: portail
  labels:
    app.kubernetes.io/part-of: plateforme-k8s
    medisphere.internal/role: plateforme
    medisphere.internal/proprietaire: plateforme
    medisphere.internal/supervision-regles: "oui"
    # HTTPRoute du portail acceptée par gw-par1 (allowedRoutes, M15-E12) : sans elle, la route
    # reste « NotAllowedByListeners » et l'adresse publique ne répond pas.
    medisphere.internal/exposition: oui
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    medisphere.internal/responsable: "karim.benali"
    medisphere.internal/ticket: "PLAT-2906"
