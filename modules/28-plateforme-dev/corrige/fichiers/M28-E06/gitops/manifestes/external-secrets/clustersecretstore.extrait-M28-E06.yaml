# À INTÉGRER dans plateforme/gitops — manifestes/external-secrets/clustersecretstore.yaml (M28-E06).
# portail rejoint les espaces de plateforme servis par le ClusterSecretStore « openbao » (comme
# messagerie au M27-E03) : sans cette ligne, l'ExternalSecret « portail » reste en erreur (magasin non
# autorisé pour cet espace), le Secret « portail » n'existe pas et le pod ne démarre pas.
# Va avec l'extrait de politiques/eso-plateforme.hcl (plateforme/secrets).
spec:
  conditions:
    - namespaces:
        # … argocd, supervision, journaux, traces, gitlab-runner, gitlab-agent, oauth2-proxy, messagerie …
        - portail
