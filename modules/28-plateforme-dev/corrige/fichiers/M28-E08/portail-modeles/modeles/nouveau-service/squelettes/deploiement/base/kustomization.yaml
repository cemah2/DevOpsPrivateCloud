apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - reseau.yaml
labels:
  - pairs:
      app.kubernetes.io/name: ${{ values.nom }}
      app.kubernetes.io/part-of: ${{ values.locataire }}
      backstage.io/kubernetes-id: ${{ values.nom }}
      medisphere.internal/equipe: ${{ values.equipe }}
    includeSelectors: false
    includeTemplates: true
