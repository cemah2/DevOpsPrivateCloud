apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.nom }}
  # « dump » : chaîne JSON, donc YAML valide même si la description contient « : » ou « # ».
  description: ${{ values.description | dump }}
  annotations:
    gitlab.com/project-slug: ${{ values.locataire }}/${{ values.nom }}
    backstage.io/kubernetes-id: ${{ values.nom }}
  tags: [${{ values.langage }}]
spec:
  type: service
  lifecycle: experimental
  owner: group:default/${{ values.equipe }}
  system: ${{ values.locataire }}
