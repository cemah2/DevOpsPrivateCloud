# plateforme/k8s — espaces/${{ values.nom }}-dev/10-quota.yaml (proposé par le portail)
# Quota de départ d'un nouveau service en dev (petit : la Plateforme l'agrandit par MR si besoin).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: ${{ values.nom }}-dev
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "10"
    persistentvolumeclaims: "2"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limites
  namespace: ${{ values.nom }}-dev
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 20m, memory: 64Mi}
      default: {memory: 256Mi}
      max: {memory: 512Mi}
