apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.nom }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: ${{ values.nom }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ${{ values.nom }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          # Posée par la MR de promotion (overlay dev : images, par empreinte).
          image: registry.par1.medisphere.internal/medisphere/${{ values.nom }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 128Mi}
          startupProbe:
            httpGet: {path: /sante, port: http}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /sante, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /pret, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
