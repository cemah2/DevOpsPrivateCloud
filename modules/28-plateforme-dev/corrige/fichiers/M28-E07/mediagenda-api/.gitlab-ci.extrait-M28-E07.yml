# mediagenda/api — .gitlab-ci.yml : job AJOUTÉ (M28-E07, PLAT-2907). Garde le reste de TON fichier.
# Le contrat publié au portail (openapi.json, lu par l'entité API) doit suivre le code.
api:contrat-openapi:
  stage: test
  tags: [k8s]
  interruptible: true
  image: registry.par1.medisphere.internal/dockerhub/library/python:3.13-slim-trixie@sha256:<DIGEST-PYTHON>
  needs: []
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  cache:
    key:
      files: [uv.lock]
    paths: [.cache/uv]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - pip install --no-cache-dir "uv==<VERSION-UV-DU-PROJET>"
    - uv sync --locked
    - uv run python outils/exporter_openapi.py > /tmp/openapi.json
    # Échoue si le fichier versionné n'est pas à jour ; le diff dit quoi régénérer.
    - diff -u openapi.json /tmp/openapi.json
