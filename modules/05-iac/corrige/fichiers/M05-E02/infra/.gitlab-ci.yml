# .gitlab-ci.yml — plateforme/infra (M05-E02)
#
# Gabarit commun de la plateforme (M01-E24), branche v1 :
#   qualite.yml : stages standard (lint, test, build, release) + pre-commit, commitlint, gitleaks
# PAS de release.yml : on ne publie pas de version de l'infrastructure, on l'APPLIQUE
# (plan relu en MR, apply protégé : M05-E26). Les contrôles OpenTofu (fmt, validate,
# tflint…) arrivent en M05-E20, le pipeline plan/apply en M05-E26.
include:
  - project: plateforme/ci-templates
    ref: v1
    file:
      - templates/qualite.yml
