gitlab_runner_opentofu_cle_url: https://get.opentofu.org/opentofu.gpg
gitlab_runner_opentofu_empreinte: E3E6E43D84CB852EADB0051D0C0AF313E5FD9F80
gitlab_runner_opentofu_depot_cle_url: https://packages.opentofu.org/opentofu/tofu/gpgkey
gitlab_runner_opentofu_depot_empreinte: F4AF70F66EAC4337EEECC97407D3DFCD4C61499F

# Checkov (PyPI), version exacte, en outil uv partagé comme pre-commit.
gitlab_runner_checkov_version: 3.3.26
