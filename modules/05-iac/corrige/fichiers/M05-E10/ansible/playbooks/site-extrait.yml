---
# Modifications de playbooks/site.yml (M04-E46) pour accueillir s3-01 (M05-E10).
# 1. Garde-fou d'inventaire : SIX hôtes dans « socle », dont un dans role_s3.
- name: Garde-fou d'inventaire
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Les six hôtes du socle sont dans l'inventaire, chacun dans son groupe
      ansible.builtin.assert:
        that:
          - groups['socle'] | default([]) | length == 6
          - groups['role_routeur'] | default([]) | length == 1
          - groups['role_bastion'] | default([]) | length == 1
          - groups['role_dns'] | default([]) | length >= 1
          - groups['role_gitlab'] | default([]) | length == 1
          - groups['role_runner'] | default([]) | length == 1
          - groups['role_s3'] | default([]) | length == 1
        fail_msg: >-
          Inventaire incomplet ({{ groups['socle'] | default([]) | length }} hôte(s) dans socle) :
          passage annulé. Voir RB-040, section « inventaire ».
        quiet: true

# 2. Rôles communs : socle-base.yml vise déjà le groupe « socle » (s3-01 y entre seul).
- name: Rôles communs
  ansible.builtin.import_playbook: socle-base.yml

- name: DNS provisoire
  ansible.builtin.import_playbook: dns01.yml

# 3. Stockage objet : avant la forge et le runner (le pipeline d'infra en dépendra, M05-E26).
- name: Stockage objet S3
  ansible.builtin.import_playbook: s3-01.yml

- name: Forge
  ansible.builtin.import_playbook: git01.yml

- name: Runner
  ansible.builtin.import_playbook: runner01.yml

- name: Routeur et pare-feu (en dernier)
  ansible.builtin.import_playbook: gw01-pare-feu.yml
