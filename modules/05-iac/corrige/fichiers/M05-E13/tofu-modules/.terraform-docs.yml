# .terraform-docs.yml — documentation générée des modules (M05-E13, vérifiée en CI en M05-E20)
# Lancement, depuis la racine de tofu-modules :  terraform-docs vm-debian
# Le tableau est injecté entre les marqueurs BEGIN_TF_DOCS / END_TF_DOCS du README.md du
# module : le texte écrit à la main autour est conservé.
formatter: markdown table
version: ">= 0.24.0, < 1.0.0"

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: false
  default: true
  escape: true
  hide-empty: true
  html: false
  indent: 3
  required: true
  sensitive: true
  type: true

sections:
  show:
    - requirements
    - providers
    - modules
    - inputs
    - outputs
    - resources
    - data-sources
