apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventaire
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inventaire
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inventaire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inventaire
subjects:
  - kind: ServiceAccount
    name: inventaire
    namespace: default
