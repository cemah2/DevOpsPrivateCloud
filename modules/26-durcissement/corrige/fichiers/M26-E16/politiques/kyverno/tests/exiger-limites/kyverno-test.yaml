# kyverno test kyverno/tests/exiger-limites (lancé par le job kyverno:tests de .gitlab-ci.yml)
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: exiger-limites
policies:
  - ../../validation/exiger-limites.yaml
resources:
  - ressources.yaml
variables: ../valeurs.yaml
results:
  - policy: exiger-limites
    isValidatingPolicy: true
    resources: [limites-ok]
    kind: Pod
    result: pass
  - policy: exiger-limites
    isValidatingPolicy: true
    resources: [sans-limite-memoire, init-sans-ressources]
    kind: Pod
    result: fail
  - policy: exiger-limites
    isValidatingPolicy: true
    resources: [deploiement-sans-ressources]
    kind: Deployment
    result: fail
  - policy: exiger-limites
    isValidatingPolicy: true
    resources: [hors-equipe]
    kind: Pod
    result: skip
