apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: exiger-digest
policies:
  - ../../validation/exiger-digest.yaml
resources:
  - ressources.yaml
variables: ../valeurs.yaml
results:
  - policy: exiger-digest
    isValidatingPolicy: true
    resources: [par-condense]
    kind: Pod
    result: pass
  - policy: exiger-digest
    isValidatingPolicy: true
    resources: [par-etiquette, init-par-etiquette]
    kind: Pod
    result: fail
  - policy: exiger-digest
    isValidatingPolicy: true
    resources: [recette-par-etiquette]
    kind: Pod
    result: skip
