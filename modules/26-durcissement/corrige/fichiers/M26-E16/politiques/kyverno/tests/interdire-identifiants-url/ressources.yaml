apiVersion: v1
kind: ConfigMap
metadata: {name: config-propre, namespace: mediagenda-recette}
data:
  VALKEY_URL: "redis://valkey.mediagenda-recette.svc:6379/0"
  DOC_URL: "https://medidoc.apps.par1.medisphere.internal/api"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: config-fuite, namespace: mediagenda-recette}
data:
  DATABASE_URL: "postgresql://mediagenda:S3cret-de-Lucas@mediagenda-db-rw:5432/mediagenda"
---
apiVersion: v1
kind: Pod
metadata: {name: env-fuite, namespace: mediagenda-recette}
spec:
  containers:
    - name: api
      image: registry.par1.medisphere.internal/medisphere/mediagenda-api:v1.4.0
      env:
        - name: AMQP_URL
          value: "amqp://medinotif:motdepasse@rabbitmq:5672/"
---
apiVersion: v1
kind: Pod
metadata: {name: env-secret-ref, namespace: mediagenda-recette}
spec:
  containers:
    - name: api
      image: registry.par1.medisphere.internal/medisphere/mediagenda-api:v1.4.0
      env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: {name: mediagenda-db-app, key: uri}
        - name: LIEN
          value: "https://user@exemple.medisphere.internal/"
