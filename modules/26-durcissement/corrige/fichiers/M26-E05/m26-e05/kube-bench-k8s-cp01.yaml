# ~/m26/e05/kube-bench-k8s-cp01.yaml — M26-E05 (SEC-2705). Adapté de job-master.yaml de kube-bench
# v0.16.0. Passage du référentiel CIS Kubernetes 1.12 (le plus récent de kube-bench, prévu pour
# 1.32-1.34 : aucun référentiel ne couvre 1.36) sur le nœud de contrôle k8s-cp01.
#   - espace wb-diagnostic (PSA privileged, M14-E20) : hostPID et montages hostPath l'exigent ;
#   - nodeName : le pod va sur k8s-cp01 sans passer par l'ordonnanceur (donc sans tolérance) ;
#   - image du cache Harbor, version exacte ; tous les montages en lecture seule ;
#   - montages des chemins d'autres distributions retirés (/srv/kubernetes, /var/lib/kube-scheduler,
#     /var/lib/kube-controller-manager) : absents d'un nœud kubeadm, le runtime les créerait vides
#     sur l'hôte ;
#   - cibles : plan de contrôle, etcd (empilé sur ce nœud), kubelet du nœud, politiques ;
#   - sortie JSON sur la sortie standard (kubectl logs), Job supprimé une heure après sa fin.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench-k8s-cp01
  namespace: wb-diagnostic
  labels:
    app.kubernetes.io/name: kube-bench
    medisphere.internal/ticket: SEC-2705
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bench
    spec:
      nodeName: k8s-cp01
      hostPID: true
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: kube-bench
          image: registry.par1.medisphere.internal/dockerhub/aquasec/kube-bench:v0.16.0
          command:
            - kube-bench
            - run
            - --benchmark
            - cis-1.12
            - --targets
            - master,controlplane,etcd,node,policies
            - --json
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: var-lib-cni, mountPath: /var/lib/cni, readOnly: true}
            - {name: var-lib-etcd, mountPath: /var/lib/etcd, readOnly: true}
            - {name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true}
            - {name: etc-systemd, mountPath: /etc/systemd, readOnly: true}
            - {name: lib-systemd, mountPath: /lib/systemd/, readOnly: true}
            - {name: etc-kubernetes, mountPath: /etc/kubernetes, readOnly: true}
            # kubectl et kubelet de l'hôte, pour la détection de version (inutile avec --benchmark,
            # gardé pour les contrôles qui lisent la version du kubelet).
            - {name: usr-bin, mountPath: /usr/local/mount-from-host/bin, readOnly: true}
            - {name: etc-cni-netd, mountPath: /etc/cni/net.d/, readOnly: true}
            - {name: opt-cni-bin, mountPath: /opt/cni/bin/, readOnly: true}
            - {name: etc-passwd, mountPath: /etc/passwd, readOnly: true}
            - {name: etc-group, mountPath: /etc/group, readOnly: true}
      volumes:
        - {name: var-lib-cni, hostPath: {path: /var/lib/cni, type: Directory}}
        - {name: var-lib-etcd, hostPath: {path: /var/lib/etcd, type: Directory}}
        - {name: var-lib-kubelet, hostPath: {path: /var/lib/kubelet, type: Directory}}
        - {name: etc-systemd, hostPath: {path: /etc/systemd, type: Directory}}
        - {name: lib-systemd, hostPath: {path: /lib/systemd, type: Directory}}
        - {name: etc-kubernetes, hostPath: {path: /etc/kubernetes, type: Directory}}
        - {name: usr-bin, hostPath: {path: /usr/bin, type: Directory}}
        - {name: etc-cni-netd, hostPath: {path: /etc/cni/net.d, type: Directory}}
        - {name: opt-cni-bin, hostPath: {path: /opt/cni/bin, type: Directory}}
        - {name: etc-passwd, hostPath: {path: /etc/passwd, type: File}}
        - {name: etc-group, hostPath: {path: /etc/group, type: File}}
