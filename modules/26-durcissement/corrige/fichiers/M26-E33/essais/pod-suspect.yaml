# Pod de TEST de la réponse à incident (M26-E33) — wb-essais, contexte restricted, AUCUNE charge
# malveillante : un serveur HTTP (agnhost netexec) géré par un Deployment, comme une vraie application.
# Sert à éprouver RB-262 : quarantaine sans redémarrage, sortie du contrôleur, collecte, éradication.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suspect
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: suspect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suspect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suspect
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serveur
          image: registry.par1.medisphere.internal/k8s/e2e-test-images/agnhost:2.66.1
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
