# plateforme/k8s — admission/30-etiquette-equipe-par-defaut.yaml (M26-E17, SEC-2717)
# MutatingAdmissionPolicy native (GA en Kubernetes 1.36, admissionregistration.k8s.io/v1) :
#   un POD créé dans un espace d'équipe sans l'étiquette medisphere.internal/equipe la reçoit,
#   avec la valeur portée par son espace.
# Pourquoi : exiger-etiquettes (Kyverno, E07) contrôle les CONTRÔLEURS versionnés (Deployment,
# StatefulSet…). Les pods créés autrement n'ont pas l'étiquette : instances CloudNativePG et pods de
# Job des AnalysisRun (créés par des opérateurs), « kubectl run », copies de « kubectl debug ». Or
# l'étiquette sert à attribuer : coûts (kube_pod_labels), journaux, alertes Falco, rapports.
# Pourquoi les pods seulement : ils ne sont pas dans Git. Muter un Deployment créerait une
# différence permanente avec le dépôt (Argo CD le verrait « OutOfSync » ou le corrigerait en boucle).
# Ordre de la chaîne d'admission : mutations (MAP, webhooks de mutation de Kyverno) AVANT validations
# (VAP, ValidatingPolicy) : une validation sur les pods voit le pod déjà complété.
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: medisphere-etiquette-equipe-par-defaut
  labels:
    app.kubernetes.io/part-of: plateforme-k8s
  annotations:
    medisphere.internal/ticket: SEC-2717
spec:
  # Ignore : une valeur par défaut n'est pas un contrôle de sécurité ; si l'évaluation échoue, le pod
  # passe sans l'étiquette (rien n'est bloqué). Contrepartie : une ERREUR passe aussi en silence
  # (voir matchConditions) : l'essai par --dry-run=server est obligatoire.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  # Ne muter que si l'étiquette manque : une étiquette posée par le chart n'est jamais écrasée.
  # (namespaceObject n'est PAS disponible dans matchConditions, seulement dans les mutations et les
  # variables : le fait que l'espace porte l'étiquette est garanti par le sélecteur de la liaison.)
  matchConditions:
    - name: etiquette-absente
      expression: >-
        !has(object.metadata.labels) || !('medisphere.internal/equipe' in object.metadata.labels)
  # Une seule mutation, qui ne dépend d'aucune autre : pas de réinvocation.
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {"medisphere.internal/equipe": namespaceObject.metadata.labels["medisphere.internal/equipe"]}
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: medisphere-etiquette-equipe-par-defaut
  labels:
    app.kubernetes.io/part-of: plateforme-k8s
spec:
  policyName: medisphere-etiquette-equipe-par-defaut
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: medisphere.internal/equipe
          operator: Exists
