# /etc/kubernetes/audit/politique.yaml — politique d'audit du serveur d'API de k8s-par1, VERSION 2
# (M14-E27, SEC-1527 ; revue en M26-E28, SEC-2728). Déposée par le rôle Ansible k8s_audit sur les trois
# nœuds de contrôle ; lue AU DÉMARRAGE du serveur d'API (redémarrage un nœud à la fois).
# Règle d'or : la PREMIÈRE règle qui correspond s'applique. Bruit d'abord, exceptions ensuite, cas
# général en dernier. Jamais « Request » ni « RequestResponse » sur les Secrets (contenu en clair dans
# les journaux et dans Loki pendant un an).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # --- 1. Bruit : sondes et découverte (M14) ---------------------------------------------------------
  - level: None
    nonResourceURLs:
      - /healthz*
      - /livez*
      - /readyz*
      - /version
      - /openapi/*
      - /api
      - /api/*
      - /apis
      - /apis/*
  - level: None
    verbs: [get, update, watch]
    resources:
      - group: coordination.k8s.io
        resources: [leases]
  - level: None
    users: [system:kube-proxy]
    verbs: [watch, list, get]
  - level: None
    userGroups: [system:nodes]
    verbs: [get, list, watch]
  - level: None
    resources:
      - group: ""
        resources: [events]
      - group: events.k8s.io
        resources: [events]

  # --- 1 bis. Bruit ajouté depuis le M14 (M26-E28) ---------------------------------------------------
  # Rapports de Kyverno : réécrits en continu par ses contrôleurs (analyse en arrière-plan, E07, E18),
  # des milliers d'événements par heure sans information de sécurité (le rapport lui-même se lit dans
  # le cluster et alimente déjà Grafana). Seulement pour les comptes de service de l'espace kyverno :
  # une personne qui modifie un rapport reste tracée par le cas général.
  - level: None
    userGroups: [system:serviceaccounts:kyverno]
    resources:
      - group: reports.kyverno.io
      - group: wgpolicyk8s.io
  # Objets d'état de Cilium (points de terminaison, identités, nœuds), écrits par les agents et
  # l'opérateur à chaque création de pod. Les POLITIQUES Cilium, elles, sont auditées plus bas.
  - level: None
    userGroups: [system:serviceaccounts:kube-system]
    resources:
      - group: cilium.io
        resources: [ciliumendpoints, ciliumendpointslices, ciliumidentities, ciliumnodes]

  # --- 2. Données sensibles : qui, quoi, quand, JAMAIS le contenu (M14) --------------------------------
  # Secrets, ConfigMaps, jetons, revues de jetons et d'autorisations, CSR (approbations comprises :
  # kubelet-csr-approver, M26-E25) : Metadata pour tous les verbes.
  - level: Metadata
    resources:
      - group: ""
        resources: [secrets, configmaps, serviceaccounts/token]
      - group: authentication.k8s.io
        resources: [tokenreviews]
      - group: authorization.k8s.io
        resources: [subjectaccessreviews, selfsubjectaccessreviews]
      - group: certificates.k8s.io
        resources: [certificatesigningrequests, certificatesigningrequests/approval]

  # --- 3. Accès interactifs (M14) ----------------------------------------------------------------------
  # Metadata suffit : une requête exec/attach n'a pas de corps ; la commande et le conteneur sont dans
  # requestURI (paramètres command=… et container=…), présent dès le niveau Metadata. Le flux du shell
  # lui-même n'est JAMAIS audité, quel que soit le niveau (Falco et Tetragon le voient).
  - level: Metadata
    resources:
      - group: ""
        resources: [pods/log, pods/exec, pods/attach, pods/portforward, nodes/proxy, services/proxy]

  # --- 4. Écritures : le corps de la requête (M14, complété en M26-E28) --------------------------------
  - level: Request
    verbs: [create, update, patch, delete, deletecollection]
    resources:
      - group: rbac.authorization.k8s.io
      - group: admissionregistration.k8s.io
      - group: ""
        resources: [namespaces, resourcequotas, limitranges, serviceaccounts, services, pods, nodes, persistentvolumes, persistentvolumeclaims]
      - group: apps
      - group: batch
      - group: policy
      - group: scheduling.k8s.io
      - group: networking.k8s.io
      - group: apiextensions.k8s.io
      # M26-E28 : objets de SÉCURITÉ ajoutés par les modules 24 à 26. Qui a affaibli une politique
      # d'admission, ajouté une exception, ouvert un flux réseau ou retiré une règle d'application de
      # Tetragon doit être retrouvable AVEC le contenu demandé.
      - group: policies.kyverno.io
      - group: cilium.io
        resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies, tracingpolicies, tracingpoliciesnamespaced]
      # ESO : les objets ne contiennent que des références (chemins OpenBao), jamais de valeur.
      - group: external-secrets.io

  # --- 5. Tout le reste : métadonnées (M14) ------------------------------------------------------------
  - level: Metadata
