# Ressources du test de registres-autorises (jamais appliquées : hors de kustomization.yaml).
apiVersion: v1
kind: Pod
metadata:
  name: image-harbor
  namespace: mediagenda-recette
spec:
  containers:
    - name: api
      image: registry.par1.medisphere.internal/medisphere/mediagenda-api:v1.4.0
---
apiVersion: v1
kind: Pod
metadata:
  name: image-docker-hub
  namespace: mediagenda-recette
spec:
  containers:
    - name: api
      image: docker.io/library/nginx:1.29
---
apiVersion: v1
kind: Pod
metadata:
  name: hors-espace-equipe
  namespace: wb-essais
spec:
  containers:
    - name: essai
      image: docker.io/library/debian:13-slim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-hors-registre
  namespace: mediagenda-recette
spec:
  selector:
    matchLabels: {app: essai}
  template:
    metadata:
      labels: {app: essai}
    spec:
      initContainers:
        - name: init
          image: quay.io/prometheus/busybox:latest
      containers:
        - name: api
          image: registry.par1.medisphere.internal/medisphere/mediagenda-api:v1.4.0
