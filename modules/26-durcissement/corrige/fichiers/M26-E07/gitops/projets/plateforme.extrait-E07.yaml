# À INTÉGRER dans plateforme/gitops — projets/plateforme.yaml (AppProject du M20-E07), M26-E07.
# Seuls les ajouts sont montrés ; garde le reste (sources, destinations, types des modules précédents).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: plateforme
  namespace: argocd
spec:
  sourceRepos:
    # (existant) registry.par1.medisphere.internal/charts, plateforme/gitops…
    - https://git01.par1.medisphere.internal/plateforme/politiques.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kyverno
  # Types sans espace créés par le chart kyverno et par l'Application « politiques ». Liste fermée :
  # ajoute-les à celle des modules précédents (CRD, ClusterRole, ClusterRoleBinding y sont déjà).
  # Les configurations de webhooks ne sont PAS dans le chart : Kyverno les crée lui-même.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: policies.kyverno.io
      kind: ValidatingPolicy
    - group: policies.kyverno.io
      kind: ImageValidatingPolicy
    - group: policies.kyverno.io
      kind: MutatingPolicy
    - group: policies.kyverno.io
      kind: GeneratingPolicy
