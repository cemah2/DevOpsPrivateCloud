# plateforme/politiques — kyverno/validation/exiger-etiquettes.yaml (M26-E07, M26-E16)
# État SAIN (après M26-E35) : la politique exige l'étiquette d'équipe sur les charges, en AUDIT sur les
# espaces de dev et en DENY sur recette/prod. Aucune garde ad hoc, aucune condition qui échoue.
# CRD CEL policies.kyverno.io/v1 (Kyverno 1.19) : jamais ClusterPolicy (supprimée en 1.20).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: exiger-etiquettes
  labels:
    medisphere.internal/domaine: securite
spec:
  # Deny sur recette/prod ; Audit ailleurs (une seconde politique « …-audit » couvre dev si besoin).
  validationActions: [Deny]
  failurePolicy: Ignore          # politique d'étiquettes : ne jamais bloquer sur un échec d'évaluation
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [apps, batch, ""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, jobs, cronjobs, pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [mediagenda-recette, mediagenda-prod, medidoc-recette, medidoc-prod]
  validations:
    - expression: >-
        has(object.metadata.labels) && 'medisphere.internal/equipe' in object.metadata.labels
      message: >-
        Toute charge doit porter l'étiquette medisphere.internal/equipe (voir docs/securite/durcissement).
