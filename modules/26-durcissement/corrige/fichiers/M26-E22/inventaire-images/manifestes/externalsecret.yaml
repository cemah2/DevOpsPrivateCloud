# plateforme/inventaire-images — manifestes/externalsecret.yaml (version corrigée, M26-E22)
# Jeton du robot Harbor lu dans OpenBao par External Secrets (M25), ClusterSecretStore « openbao »
# (espaces de plateforme). Le jeton de Lucas, lui, est COMPROMIS (il est dans l'historique Git et
# dans l'image poussée) : il est révoqué dans Harbor et remplacé, pas seulement déplacé (RB-250).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventaire-harbor
  namespace: inventaire
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: inventaire-harbor
  data:
    - secretKey: robot
      remoteRef: {key: plateforme/inventaire/harbor, property: robot}
    - secretKey: jeton
      remoteRef: {key: plateforme/inventaire/harbor, property: jeton}
