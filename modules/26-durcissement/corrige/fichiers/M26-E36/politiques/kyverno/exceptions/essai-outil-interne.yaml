# plateforme/politiques — kyverno/exceptions/essai-outil-interne.yaml (M26-E36, format d'E18)
# Exception CIBLÉE et DATÉE, au lieu de l'exemption trop large de la panne : elle ne vise qu'UN outil
# interne précis dans wb-pannes, pour UNE politique, avec une échéance. Comme toutes les exceptions,
# elle vit dans l'espace kyverno-exceptions (fixé par kyverno/exceptions/kustomization.yaml, à qui
# on ajoute ce fichier) et figure au registre docs/securite/durcissement/exceptions.md (RB-261).
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: essai-outil-interne
  labels:
    medisphere.internal/registre-exceptions: "oui"
spec:
  policyRefs:
    - name: registres-autorises
      kind: ValidatingPolicy
  matchConditions:
    - name: seul-cet-outil
      expression: >-
        object.metadata.namespace == 'wb-pannes' &&
        object.metadata.name.startsWith('essai-outil-interne')
  expiresAt: "2027-01-15T00:00:00Z"
  reportResult: skip
  properties:
    raison: "essai d'un outil interne tiré d'un registre public, périmètre bac à sable"
    ticket: "SEC-2736"
    valideur: "sophie.laurent"
    demandeur: "lucas.martin"
    revue: "2027-01-08"
    registre: "docs/securite/durcissement/exceptions.md#EXC-K-005"
