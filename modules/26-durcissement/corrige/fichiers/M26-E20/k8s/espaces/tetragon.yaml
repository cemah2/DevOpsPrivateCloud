# plateforme/k8s — espaces/tetragon.yaml (M26-E20)
# Exception écrite à « restricted » (E06, docs/securite/durcissement/exceptions.md) : l'agent Tetragon
# charge des programmes eBPF, lit /proc et /sys/fs/bpf de l'hôte et partage son réseau.
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
