# plateforme/politiques — kyverno/acces/harbor-kyverno.externalsecret.yaml (M26-E15, SEC-2715)
# Rendu par l'Application « politiques » (destination : espace kyverno), comme les PolicyException.
# Identifiants de lecture de Harbor pour la vérification des signatures (projet « medisphere » privé).
# Robot robot$medisphere+kyverno (lecture seule, créé par OpenTofu dans l'état registre/ du M13) ;
# secret rangé dans OpenBao : kv/plateforme/kyverno/harbor (clés « utilisateur », « mot_de_passe »).
# Livré par ESO (ClusterSecretStore « openbao », réservé aux espaces de plateforme, M25-E12).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-kyverno
  namespace: kyverno
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-kyverno
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.par1.medisphere.internal":{"username":"{{ .utilisateur }}","password":"{{ .mot_de_passe }}","auth":"{{ printf "%s:%s" .utilisateur .mot_de_passe | b64enc }}"}}}
  data:
    - secretKey: utilisateur
      remoteRef:
        key: plateforme/kyverno/harbor
        property: utilisateur
    - secretKey: mot_de_passe
      remoteRef:
        key: plateforme/kyverno/harbor
        property: mot_de_passe
