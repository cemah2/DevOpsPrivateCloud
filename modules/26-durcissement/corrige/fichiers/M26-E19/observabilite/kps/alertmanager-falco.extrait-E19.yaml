#        group_wait: 30s
#        group_interval: 5m
#        repeat_interval: 4h
#        routes:
#          # Critique : l'astreinte est réveillée ; « continue » : la sécurité reçoit aussi.
#          - matchers: ['gravite="critique"']
#            receiver: astreinte-mail
#            continue: true
#          - matchers: ['gravite=""', 'priority=~"Critical|Alert|Emergency"']
#            receiver: astreinte-mail
#            continue: true
#          # Tout le reste (et la copie des critiques) : boîte de la sécurité, heures ouvrées.
#          - matchers: ['alertname="AlerteFalco"']
#            receiver: securite-mail
