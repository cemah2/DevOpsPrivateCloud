# plateforme/politiques — falco/regles-medisphere.yaml (M26-E19, SEC-2719)
# Règles de détection de MédiSphère, sous la forme d'un FICHIER DE VALEURS du chart falco : la clé
# customRules devient la ConfigMap <release>-rules, montée dans /etc/falco/rules.d. Le chart pose une
# somme de contrôle de cette ConfigMap sur le DaemonSet : une règle modifiée redémarre les pods de
# Falco un par un (aucune règle « à moitié chargée »).
# L'Application Argo CD falco lit ce fichier par sa source « politiques » ($politiques/falco/…).
# CI (.gitlab-ci.yml, job falco:valider) : outils/valider-falco.sh extrait le bloc et lance
# « falco -V » de la version du cluster, avec les règles par défaut chargées AVANT (nos règles
# utilisent leurs macros : spawned_process, container, shell_procs, open_read, container_entrypoint).
#
# Conventions :
#   - noms de règles en français, préfixe « MédiSphère — » (lisible dans le courriel et dans Loki) ;
#   - une étiquette (tag) gravite_critique | gravite_avertissement par règle : la configuration de
#     Falco (append_output, values.yaml) la transforme en champ « gravite », que falcosidekick envoie
#     comme étiquette d'alerte à Alertmanager ;
#   - EXCEPTIONS : on n'édite ni ne supprime une règle pour la faire taire. On ajoute un élément à une
#     LISTE (medisphere_*) ou on remplit une MACRO medisphere_*_attendu, par MR, avec une ligne dans
#     docs/securite/durcissement/exceptions.md (RB-261).
customRules:
  regles-medisphere.yaml: |-
    # --- Périmètre ---------------------------------------------------------------------------
    # Espaces applicatifs (et wb-essais : banc d'essai des règles, jamais une application réelle).
    - macro: medisphere_espace_applicatif
      condition: >
        (k8s.ns.name startswith "mediagenda-" or k8s.ns.name startswith "medidoc-"
         or k8s.ns.name = "wb-essais")

    - macro: medisphere_production
      condition: (k8s.ns.name in (mediagenda-prod, medidoc-prod))

    # --- Listes d'exceptions (à compléter par MR, jamais en éditant les règles) ----------------
    # Images dont un shell interactif est attendu (aucune aujourd'hui).
    - list: medisphere_images_shell_attendu
      items: []

    # Chemins des jetons de compte de service (projetés par le kubelet). /run et /var/run : selon
    # l'image, /var/run est un lien vers /run et le chemin vu par le processus change.
    - list: medisphere_chemins_jeton
      items: [/var/run/secrets/kubernetes.io/serviceaccount, /run/secrets/kubernetes.io/serviceaccount,
              /var/run/secrets/tokens, /run/secrets/tokens]

    # Processus qui lisent légitimement le jeton de leur pod dans un espace applicatif :
    # le gestionnaire d'instance de CloudNativePG (binaire « manager » des pods mediagenda-db-*).
    - list: medisphere_lecteurs_jeton
      items: [manager]

    # Ports de destination prévus pour les charges applicatives (matrice des flux du cluster) :
    # DNS, HTTP(S) des services du cluster et du RGW, PostgreSQL, Valkey, API MédiAgenda (8000) et
    # MédiDoc (8080) — avec le remplacement de kube-proxy, Cilium traduit l'adresse du Service AU
    # MOMENT du connect() : Falco voit le port du POD (8000), pas celui du Service (80) —, OTLP.
    - list: medisphere_ports_sortants
      items: [53, 80, 443, 5432, 6379, 8000, 8080, 4317, 4318]

    - list: medisphere_repertoires_temporaires
      items: [/tmp, /var/tmp, /dev/shm]

    # Exécutions attendues dans un conteneur de production (sondes « exec », outil d'exploitation
    # validé…). Vide : la production ne doit voir aucun « kubectl exec ».
    - macro: medisphere_exec_prod_attendu
      condition: (never_true)

    # --- Règles ------------------------------------------------------------------------------
    - rule: MédiSphère — shell interactif dans un conteneur applicatif
      desc: >
        Un shell avec un terminal est lancé dans un conteneur d'un espace applicatif : kubectl exec -it
        ou prise de contrôle. Aucune application de MédiSphère n'a besoin d'un shell interactif.
      condition: >
        spawned_process and container and shell_procs and proc.tty != 0
        and container_entrypoint and medisphere_espace_applicatif
        and not container.image.repository in (medisphere_images_shell_attendu)
      output: >
        Shell interactif dans un conteneur applicatif (espace=%k8s.ns.name pod=%k8s.pod.name
        conteneur=%container.name image=%container.image.repository commande=%proc.cmdline
        parent=%proc.pname utilisateur=%user.name uid=%user.uid terminal=%proc.tty)
      priority: WARNING
      tags: [medisphere, gravite_avertissement, container, shell, mitre_execution, T1059]

    - rule: MédiSphère — lecture du jeton de compte de service
      desc: >
        Un processus inattendu lit le jeton de compte de service de son pod. Les applications de
        MédiSphère ne parlent pas à l'API Kubernetes (automountServiceAccountToken: false) : un jeton
        lu est un jeton qu'on s'apprête à utiliser contre le cluster.
      condition: >
        open_read and container and medisphere_espace_applicatif
        and fd.name pmatch (medisphere_chemins_jeton)
        and not proc.name in (medisphere_lecteurs_jeton)
      output: >
        Jeton de compte de service lu (espace=%k8s.ns.name pod=%k8s.pod.name conteneur=%container.name
        fichier=%fd.name processus=%proc.name commande=%proc.cmdline parent=%proc.pname uid=%user.uid)
      priority: CRITICAL
      tags: [medisphere, gravite_critique, container, filesystem, mitre_credential_access, T1528]

    - rule: MédiSphère — écriture sous /etc dans un conteneur
      desc: >
        Ouverture en écriture d'un fichier sous /etc dans un conteneur applicatif, réussie ou non : avec
        readOnlyRootFilesystem, la tentative échoue (EROFS) mais révèle quelqu'un qui essaie de modifier
        la configuration (comptes, résolution de noms, certificats).
      condition: >
        evt.type in (open, openat, openat2) and evt.is_open_write=true and fd.typechar='f'
        and container and medisphere_espace_applicatif and fd.name startswith /etc/
      output: >
        Écriture sous /etc dans un conteneur (espace=%k8s.ns.name pod=%k8s.pod.name conteneur=%container.name
        fichier=%fd.name résultat=%evt.res processus=%proc.name commande=%proc.cmdline uid=%user.uid)
      priority: ERROR
      tags: [medisphere, gravite_critique, container, filesystem, mitre_persistence, T1543]

    - rule: MédiSphère — connexion sortante vers un port non prévu
      desc: >
        Un conteneur applicatif tente une connexion vers un port absent de la matrice des flux du
        cluster, qu'elle aboutisse ou non (une tentative refusée par la politique réseau reste un
        signal : balayage, mauvaise configuration). La macro « outbound » des règles par défaut ignore
        les adresses privées (RFC 1918) : tout le lab est en 10.0.0.0/8, elle ne verrait rien ici.
      condition: >
        evt.type = connect and (fd.typechar = 4 or fd.typechar = 6)
        and container and medisphere_espace_applicatif
        and fd.sip != "127.0.0.1" and fd.sip != "0.0.0.0"
        and not fd.sport in (medisphere_ports_sortants)
      output: >
        Connexion sortante vers un port non prévu (espace=%k8s.ns.name pod=%k8s.pod.name
        conteneur=%container.name destination=%fd.sip port=%fd.sport protocole=%fd.l4proto
        résultat=%evt.res processus=%proc.name commande=%proc.cmdline)
      priority: WARNING
      tags: [medisphere, gravite_avertissement, container, network, mitre_command_and_control, T1571]

    - rule: MédiSphère — binaire exécuté depuis un répertoire temporaire
      desc: >
        Un programme est exécuté depuis /tmp, /var/tmp ou /dev/shm d'un conteneur applicatif. Un
        emptyDir monté sur /tmp n'est pas « noexec » : c'est l'endroit où l'on dépose un outil.
      condition: >
        spawned_process and container and medisphere_espace_applicatif
        and proc.exepath pmatch (medisphere_repertoires_temporaires)
      output: >
        Binaire exécuté depuis un répertoire temporaire (espace=%k8s.ns.name pod=%k8s.pod.name
        conteneur=%container.name exécutable=%proc.exepath commande=%proc.cmdline parent=%proc.pname uid=%user.uid)
      priority: CRITICAL
      tags: [medisphere, gravite_critique, container, process, mitre_execution, T1204]

    - rule: MédiSphère — exec dans un conteneur de production
      desc: >
        Un processus est lancé DANS un conteneur de production par le runtime (parent runc), sans être
        le processus principal : c'est « kubectl exec » (ou une sonde exec). Le journal d'audit de l'API
        (Loki, locataire audit) dit QUI l'a demandé ; Falco dit CE QUI a été lancé.
      condition: >
        spawned_process and container and medisphere_production
        and container_entrypoint and proc.vpid != 1
        and not medisphere_exec_prod_attendu
      output: >
        Exec dans un conteneur de production (espace=%k8s.ns.name pod=%k8s.pod.name conteneur=%container.name
        commande=%proc.cmdline utilisateur=%user.name uid=%user.uid terminal=%proc.tty)
      priority: WARNING
      tags: [medisphere, gravite_avertissement, container, process, mitre_execution, T1609]
