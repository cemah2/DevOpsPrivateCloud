# inventories/lab/durcissement.yml — vagues de durcissement (M26-E14, RB-263). Inventaire statique
# ajouté à la liste « inventory » d'ansible.cfg : il ne déclare que des GROUPES ; les hôtes, leurs
# adresses et leurs variables viennent de NetBox (netbox.yml, netbox-ceph.yml, netbox-k8s.yml).
# Règles : jamais les deux passerelles, deux répartiteurs ou deux nœuds d'une même grappe dans la
# même passe (serial: 1 dans le playbook à partir de la vague 4) ; adm01 en dernier.
all:
