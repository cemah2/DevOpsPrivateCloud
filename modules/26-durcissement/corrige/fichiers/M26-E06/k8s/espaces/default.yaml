# plateforme/k8s — espaces/default.yaml (M26-E06, SEC-2706)
# L'espace « default » existe toujours et n'a rien à héberger chez nous : on le verrouille en
# « restricted » pour qu'un « kubectl run » oublié n'y crée pas un pod privilégié. On ne déclare que
# ses étiquettes (kubectl apply fusionne avec l'objet existant ; ne jamais le supprimer).
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    medisphere.internal/proprietaire: plateforme
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
