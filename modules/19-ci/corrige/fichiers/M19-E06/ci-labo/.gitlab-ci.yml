# .gitlab-ci.yml — formation/ci-labo (M19-E06, DEV-2006) : stages, needs, rules et workflow.
#
# Objectifs : ne lancer que ce qui est utile (rules:changes), le plus tôt possible (needs),
# une seule fois par commit (workflow:rules), et annuler ce qui devient inutile (auto_cancel).

# --- Quand un pipeline est-il créé ? -------------------------------------------------------------
# Évaluées dans l'ordre, la première règle qui s'applique décide.
workflow:
  rules:
    # 1. Pipelines de MR : le cas normal pendant le développement.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # 2. Planifications et lancements manuels (« Run pipeline ») : toujours, quelle que soit la branche.
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    # 3. Une poussée sur une branche qui a une MR ouverte : pas de pipeline de branche (la règle 1
    #    crée déjà le pipeline de MR pour ce commit) — c'est ce qui supprime le doublon.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # 4. La branche par défaut et les étiquettes.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    # Tout le reste (poussée sur une branche sans MR, déclencheurs non prévus) : pas de pipeline.
  # Un nouveau commit sur la même référence annule les jobs « interruptible » du pipeline précédent.
  auto_cancel:
    on_new_commit: interruptible

default:
  tags: [k8s]
  image: $IMAGE_UV
  # Par défaut, un job peut être annulé s'il devient inutile ; les jobs qui publient ou déploient
  # le refusent explicitement (« interruptible: false »).
  interruptible: true

variables:
  IMAGE_UV: registry.par1.medisphere.internal/ghcr/astral-sh/uv:0.12.23-python3.13-trixie-slim@sha256:a6aeb5c166af9f765f9c68e585b5a5148c28f3b8a362f90151cecea88b21a3e2
  UV_LINK_MODE: copy

stages: [lint, test, build, rapport]

# --- Quels jobs ? ---------------------------------------------------------------------------------
# Fichiers qui touchent au code : changer l'un d'eux relance ruff, tests et paquet.
.fichiers-code: &fichiers-code
  - src/**/*
  - tests/**/*
  - pyproject.toml
  - uv.lock

.regles-code:
  rules:
    # Planification, lancement manuel et étiquettes : tout s'exécute (explicite, même si
    # « changes » vaut toujours vrai hors poussée et hors MR).
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG
    # Branche et MR : seulement si le code a changé (MR : par rapport à la branche cible ;
    # branche : par rapport au commit précédent de la branche).
    - changes: *fichiers-code

ruff:
  stage: lint
  extends: .regles-code
  # Démarre tout de suite, comme tests : rien à attendre.
  needs: []
  script:
    - uvx ruff@0.16.10 check src tests
    - uvx ruff@0.16.10 format --check src tests

docs:
  stage: lint
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG
    - changes: [docs/**/*]
  script:
    - test -s docs/index.md
    # Chaque page commence par un titre de niveau 1.
    - for f in docs/*.md; do head -n 1 "$f" | grep -q '^# ' || { echo "$f sans titre"; exit 1; }; done

tests:
  stage: test
  extends: .regles-code
  # Sans « needs », tests attendrait la fin de TOUT le stage lint (docs compris). Avec « needs: [] »,
  # il démarre en même temps que ruff : un échec de ruff n'empêche pas de voir les tests.
  needs: []
  script:
    - uv sync --locked
    - uv run pytest --junitxml=rapport-junit.xml
  artifacts:
    when: always
    reports:
      junit: rapport-junit.xml
    expire_in: 1 week

paquet:
  stage: build
  extends: .regles-code
  # N'attend que tests (pas ruff, pas docs).
  needs: [tests]
  script:
    - uv build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

resume:
  stage: rapport
  # Pas de « needs » : il attend la fin des stages précédents (quels que soient les jobs présents),
  # et « when: always » le lance même après un échec. allow_failure : il ne bloque rien.
  when: always
  allow_failure: true
  image: registry.par1.medisphere.internal/dockerhub/library/debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
  script:
    - 'echo "pipeline $CI_PIPELINE_ID ($CI_PIPELINE_SOURCE) sur $CI_COMMIT_REF_NAME, commit $CI_COMMIT_SHORT_SHA"'
    - echo "voir $CI_PIPELINE_URL"

# M19-E05 : le job à disséquer, gardé pour les lancements manuels seulement (il dort 2 minutes).
anatomie:
  stage: rapport
  needs: []
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  image: registry.par1.medisphere.internal/dockerhub/library/debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
  services:
    - name: registry.par1.medisphere.internal/dockerhub/valkey/valkey:8.1@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
      alias: valkey
  variables:
    KUBERNETES_CPU_REQUEST: "500m"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "1Gi"
  script:
    - |
      {
        echo "== pod";            echo "$HOSTNAME"
        echo "== identité";       id
        echo "== limite mémoire du conteneur build (cgroup v2)"; cat /sys/fs/cgroup/memory.max
        echo "== montages (hors /proc, /sys, /dev)"
        grep -vE ' (/proc|/sys|/dev)' /proc/self/mounts
        echo "== jeton de compte de service"
        ls -la /var/run/secrets/kubernetes.io/serviceaccount 2>&1 || true
        echo "== résolution DNS";  cat /etc/resolv.conf
        echo "== variables CI_ et KUBERNETES_ (sans aucune valeur sensible)"
        env | grep -E '^(CI_|KUBERNETES_)' | grep -vE 'TOKEN|PASSWORD|KEY|SECRET|AUTH' | sort
      } > anatomie.txt
    - echo "pause de 120 s pour l'observation du pod" && sleep 120
  artifacts:
    paths: [anatomie.txt]
    expire_in: 1 week
