# plateforme/k8s — composants/gitlab-runner-protege/values.yaml (M19-E24, SEC-2024).
# Runner d'instance « k8s-par1-protege » : access_level ref_protected, étiquette « protege »,
# run_untagged false (réglés côté GitLab à la création par l'API : outils/creer-runner-protege.sh).
# Il n'exécute que les jobs des branches et étiquettes PROTÉGÉES qui demandent l'étiquette
# « protege » : signature et attestations (composant securite ≥ v2.7.0), promotion (composant
# promotion ≥ v2.7.0). Pods dans ci-jobs-protege (PSA restricted, sans Internet).
#
# Secrets que lui seul remet aux jobs (jamais des variables de GitLab) :
#   - « cosign-medisphere » (clés cosign.key et cosign.password) de ci-jobs-protege, monté en lecture
#     seule dans /run/secrets/medisphere/cosign/ ; créé par outils/secrets-k8s.sh depuis
#     secrets/cosign-ci.yml (Vault critique).
# Jeton du runner : Secret « gitlab-runner-protege-jeton » (secrets/gitlab-runner-protege.yml) ;
# racine MédiSphère du gestionnaire : Secret gitlab-runner-certs de M19-E04 (même espace).
# Tous deux posés par « outils/secrets-k8s.sh appliquer gitlab-runner-protege|cosign-ci ».

gitlabUrl: https://git01.par1.medisphere.internal/

image:
  registry: registry.par1.medisphere.internal
  image: gitlab/gitlab-org/gitlab-runner
  tag: alpine-v19.4.0@sha256:a4838319e55b510c05b36d701d06362b9197458558c7b0d3d63f2c7588c7cd2f

certsSecretName: gitlab-runner-certs

sessionServer:
  enabled: false
unregisterRunners: true
terminationGracePeriodSeconds: 1800

# Peu de jobs, courts : quatre au plus à la fois (quota de ci-jobs-protege : 6 pods).
concurrent: 4
checkInterval: 3

rbac:
  create: true
  clusterWideAccess: false
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["create", "delete", "get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods/attach", "pods/exec"]
      verbs: ["create", "delete", "get", "patch"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get", "list"]
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["create", "delete", "get", "update"]
    - apiGroups: [""]
      resources: ["serviceaccounts"]
      verbs: ["get"]
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["list", "watch"]
    # Pas de « services » : aucun job protégé n'utilise « services: ».

serviceAccount:
  create: true
  name: gitlab-runner-protege

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  privileged: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
podSecurityContext:
  runAsUser: 100
  fsGroup: 65533

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}

runners:
  jobNamespace: ci-jobs-protege
  secret: gitlab-runner-protege-jeton
  name: k8s-par1-protege
  executor: kubernetes
  # Pas de cache : les jobs protégés n'en ont pas besoin, et un cache partagé avec des branches non
  # protégées serait un chemin d'empoisonnement (E31 Q5).
  config: |
    [[runners]]
      output_limit = 4096
      environment = ["SSL_CERT_DIR=/etc/ssl/certs:/etc/medisphere/ca", "HOME=/tmp"]
      [runners.kubernetes]
        namespace = "{{ .Values.runners.jobNamespace }}"
        service_account = "ci-job"
        automount_service_account_token = false
        privileged = false
        allow_privilege_escalation = false
        cap_drop = ["ALL"]
        # Plus strict que k8s-par1 : les images outillées du projet Harbor « plateforme »
        # (outils-supply-chain : signature, attestations) et l'image du composant promotion de E17
        # (alpine/k8s par le cache dockerhub). Rien d'autre.
        allowed_images = ["registry.par1.medisphere.internal/plateforme/**", "registry.par1.medisphere.internal/dockerhub/alpine/k8s:*"]
        # Aucun job protégé n'utilise « services: ». Attention : une liste VIDE autoriserait TOUT
        # (common/allowed_images.go du runner : liste vide = pas de filtre) ; on ne garde donc que
        # les images de « plateforme », comme pour les jobs.
        allowed_services = ["registry.par1.medisphere.internal/plateforme/**"]
        allowed_pull_policies = ["if-not-present"]
        image = "registry.par1.medisphere.internal/plateforme/outils-supply-chain:1.0.1@sha256:<EMPREINTE>"
        # Même helper que k8s-par1 (étiquette ET empreinte, changé avec la version du runner en E26).
        helper_image = "registry.par1.medisphere.internal/gitlab/gitlab-org/gitlab-runner/gitlab-runner-helper:x86_64-v19.4.0@sha256:13188cca15a2d44fc621d42da4efb42b81c9527e072d07aab29468dea15af831"
        poll_timeout = 300
        cpu_request = "100m"
        cpu_limit = "1"
        memory_request = "256Mi"
        memory_limit = "512Mi"
        helper_cpu_request = "50m"
        helper_memory_request = "64Mi"
        helper_memory_limit = "256Mi"
        [runners.kubernetes.pod_security_context]
          run_as_non_root = true
          run_as_user = 1000
          run_as_group = 1000
          fs_group = 1000
          [runners.kubernetes.pod_security_context.seccomp_profile]
            type = "RuntimeDefault"
        [runners.kubernetes.pod_labels]
          "medisphere.internal/ci" = "job-protege"
        # Racine MédiSphère (ConfigMap de ci-jobs-protege, comme dans ci-jobs en E07) : git et curl
        # du composant promotion (GIT_SSL_CAINFO), cosign vers Harbor.
        [[runners.kubernetes.volumes.config_map]]
          name = "medisphere-racine"
          mount_path = "/etc/medisphere/ca"
          read_only = true
        # La clé de signature n'existe QUE dans ci-jobs-protege et n'est montée QUE par ce runner.
        [[runners.kubernetes.volumes.secret]]
          name = "cosign-medisphere"
          mount_path = "/run/secrets/medisphere/cosign"
          read_only = true
