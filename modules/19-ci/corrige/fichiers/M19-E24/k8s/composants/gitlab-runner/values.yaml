# plateforme/k8s — composants/gitlab-runner/values.yaml
# Runner d'instance « k8s-par1 » (M19-E04, cache S3 en E07, durci en M19-E24 SEC-2024).
# Chart gitlab/gitlab-runner 0.93.x (Runner 19.4) ; 0.94.x à partir de M19-E26 (voir ce fichier dans
# corrige/fichiers/M19-E26/ : clé image.repository). Capacité et disponibilité : M19-E27.
#
# Jeton : runner créé par l'API (POST /user/runners, E04), jeton glrt- en Vault critique
# (secrets/gitlab-runner.yml) puis Secret « gitlab-runner-jeton » par outils/secrets-k8s.sh.
# Avec un jeton glrt-, étiquettes, niveau d'accès et « run_untagged » se règlent CÔTÉ GITLAB :
# runners.tags / runners.protected / runners.runUntagged du chart sont ignorés, on ne les pose pas.

gitlabUrl: https://git01.par1.medisphere.internal/

image:
  # Image du gestionnaire par le cache Harbor « gitlab » (registry.gitlab.com, M19-E04).
  registry: registry.par1.medisphere.internal
  image: gitlab/gitlab-org/gitlab-runner
  # tag : alpine-v<appVersion du chart> par défaut ; ne pas le figer ici (il suit le chart).

# Racine MédiSphère pour parler à git01 (E04) : Secret dont la clé porte le nom de l'hôte
# (git01.par1.medisphere.internal.crt), monté dans /home/gitlab-runner/.gitlab-runner/certs/.
certsSecretName: gitlab-runner-racine

# Gestionnaire : pas de session interactive (terminal web), pas de métriques avant le M21.
sessionServer:
  enabled: false
unregisterRunners: true
terminationGracePeriodSeconds: 3600

concurrent: 10
checkInterval: 3

# --- Droits du gestionnaire (E24 étape 3) ---------------------------------------------------------
# Une Role dans l'espace des JOBS (runners.jobNamespace), liée au compte du gestionnaire (espace
# gitlab-runner). Liste de la documentation de GitLab Runner 19.x (« Configure runner API
# permissions ») réduite aux fonctions utilisées : stratégie attach (pods/attach), exec, journaux,
# Secrets d'identifiants de registre créés par job, compte de service vérifié, Services des
# « services: » de job, événements (affichage des avertissements du pod).
# Pas de namespaces (pas de namespace_per_job), pas de configmaps/PVC (pas d'environnements
# suspendables), pas de PDB par job (pod_disruption_budget non activé), pas d'autoscaler.
# NB : le chart refuse « resourceNames » dans ces règles.
rbac:
  create: true
  clusterWideAccess: false
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["create", "delete", "get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods/attach", "pods/exec"]
      verbs: ["create", "delete", "get", "patch"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get", "list"]
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["create", "delete", "get", "update"]
    - apiGroups: [""]
      resources: ["serviceaccounts"]
      verbs: ["get"]
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["create", "get"]
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["list", "watch"]

serviceAccount:
  create: true
  name: gitlab-runner

# Conteneur du gestionnaire : valeurs du chart, explicites (non root, sans capacité).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  privileged: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
podSecurityContext:
  runAsUser: 100
  fsGroup: 65533

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}

runners:
  # Espace des pods de job : le chart y crée la Role (rbac.create) ; le TOML ci-dessous le reprend.
  jobNamespace: ci-jobs
  secret: gitlab-runner-jeton
  name: k8s-par1
  executor: kubernetes
  # Cache S3 (E07) : Secret « ci-cache-s3 » (clés accesskey, secretkey) de l'espace gitlab-runner.
  cache:
    secretName: ci-cache-s3
  config: |
    [[runners]]
      output_limit = 8192
      # HOME inscriptible pour les images qui supposent root (/root non inscriptible en UID 1000).
      environment = ["HOME=/tmp"]
      [runners.cache]
        Type = "s3"
        Path = "k8s-par1"
        Shared = false
        [runners.cache.s3]
          ServerAddress = "s3-01.par1.medisphere.internal:8333"
          BucketName = "ci-cache"
          BucketLocation = "us-east-1"
          Insecure = false
      [runners.kubernetes]
        namespace = "{{ .Values.runners.jobNamespace }}"
        service_account = "ci-job"
        # --- E24 : aucun accès à l'API Kubernetes depuis un job -----------------------------------
        automount_service_account_token = false
        # Aucune surcharge par les variables KUBERNETES_* du .gitlab-ci.yml pour l'identité et
        # l'espace : clés *_overwrite_allowed absentes (vides = fonction désactivée).
        # --- E24 : Pod Security « restricted » ------------------------------------------------------
        privileged = false
        allow_privilege_escalation = false
        cap_drop = ["ALL"]
        # Images : Harbor seulement (caches dockerhub, quay, ghcr, gitlab, k8s et projets internes).
        # Motif « ** » (plusieurs niveaux de chemin) : à vérifier sur ton lab, sinon énumère
        # registry.par1.medisphere.internal/*/*:* et …/*/*/*:*.
        allowed_images = ["registry.par1.medisphere.internal/**/*"]
        allowed_services = ["registry.par1.medisphere.internal/**/*"]
        allowed_pull_policies = ["if-not-present", "always"]
        image = "registry.par1.medisphere.internal/dockerhub/library/debian:trixie-slim"
        # Image helper par le cache Harbor « gitlab », version suivie automatiquement (E26).
        helper_image = "registry.par1.medisphere.internal/gitlab/gitlab-org/gitlab-runner/gitlab-runner-helper:x86_64-v${CI_RUNNER_VERSION}"
        poll_timeout = 600
        # Demandes et limites par défaut, surcharges bornées (valeurs de E04 ; revues en E27).
        cpu_request = "100m"
        cpu_limit = "1"
        cpu_limit_overwrite_max_allowed = "2"
        memory_request = "256Mi"
        memory_limit = "1Gi"
        memory_limit_overwrite_max_allowed = "3Gi"
        helper_cpu_request = "50m"
        helper_memory_request = "64Mi"
        helper_memory_limit = "256Mi"
        service_cpu_request = "100m"
        service_memory_request = "256Mi"
        service_memory_limit = "1Gi"
        [runners.kubernetes.pod_security_context]
          run_as_non_root = true
          run_as_user = 1000
          run_as_group = 1000
          fs_group = 1000
          [runners.kubernetes.pod_security_context.seccomp_profile]
            type = "RuntimeDefault"
        # Les services (PostgreSQL, Valkey : E14) gardent leur utilisateur d'image s'il n'est pas root ;
        # les images officielles postgres et valkey démarrent en root puis changent d'utilisateur :
        # on leur impose l'utilisateur de l'image (999) — voir cloisonnement.md.
        [runners.kubernetes.service_container_security_context]
          run_as_user = 999
          run_as_group = 999
        [runners.kubernetes.pod_labels]
          "medisphere.internal/role" = "ci-job"
