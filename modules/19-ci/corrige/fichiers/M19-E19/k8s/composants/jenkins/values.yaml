# composants/jenkins/values.yaml — chart jenkins/jenkins 5.9.72, Jenkins LTS 2.580.1 (M19-E19, PLAT-2019).
# TOUT est ici : rien ne se clique dans l'interface (une modification à la main est écrasée au
# redémarrage : JCasC.overwriteConfiguration). Essai : retiré au mini-projet si l'ADR-0190 le confirme.
controller:
  image:
    # Java 21 (obligatoire depuis 2.555.1 ; l'étiquette par défaut du chart est la variante jdk25).
    registry: registry.par1.medisphere.internal
    repository: dockerhub/jenkins/jenkins
    tag: 2.580.1-jdk21
    pullPolicy: IfNotPresent
  # Aucun build sur le contrôleur : tout passe par des agents en pods éphémères.
  numExecutors: 0
  jenkinsUrl: https://jenkins.apps.par1.medisphere.internal
  # Compte « admin » : Secret créé hors Git (outils/secrets-k8s.sh appliquer jenkins).
  # ⚠️ createSecret doit rester à true : avec existingSecret renseigné, le chart ne crée AUCUN Secret,
  # mais c'est cette option qui projette le Secret existant vers chart-admin-username/-password
  # (templates/jenkins-controller-statefulset.yaml du chart 5.9.72). À false, JCasC ne trouve plus
  # ${chart-admin-username} et le compte admin n'existe pas.
  admin:
    createSecret: true
    existingSecret: jenkins-admin
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
  # Mots de passe des autres comptes locaux, lus par JCasC sous la forme ${<secret>-<clé>}.
  additionalExistingSecrets:
    - name: jenkins-comptes
      keyName: karim-benali
    - name: jenkins-comptes
      keyName: wb-checks
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  javaOpts: "-XX:MaxRAMPercentage=70"
  # Pod Security « restricted » : UID 1000 (utilisateur jenkins de l'image), seccomp, sans capacité.
  podSecurityContextOverride:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # Greffons ÉPINGLÉS (centre de mise à jour, 22/10/2026) ; dépendances à la version MINIMALE requise
  # (pas « la dernière » : un redémarrage ne change rien tout seul).
  installPlugins:
    - kubernetes:4560.vc25b_83890c34
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.11.0
    - configuration-as-code:2136.veb_3a_554550b_f
    - job-dsl:3732.v9a_c49a_61a_313
    - junit:1442.vb_b_a_467df2767
    - matrix-auth:3.3
    - timestamper:1.30
  installLatestPlugins: false
  installLatestSpecifiedPlugins: false
  overwritePlugins: true
  # Agents : WebSocket sur le port HTTP (8080) ; pas de port 50000 à ouvrir.
  agentListenerEnabled: false
  # Sidecar de rechargement du JCasC : image par Harbor.
  sidecars:
    configAutoReload:
      image:
        registry: registry.par1.medisphere.internal
        repository: dockerhub/kiwigrid/k8s-sidecar
        tag: 2.14.1
      # Le défaut du chart ne retire pas les capacités : le pod serait refusé par « restricted ».
      containerSecurityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
  JCasC:
    defaultConfig: true
    overwriteConfiguration: true
    securityRealm: |-
      local:
        allowsSignup: false
        enableCaptcha: false
        users:
          - id: "${chart-admin-username}"
            name: "Administrateur (bris de glace)"
            password: "${chart-admin-password}"
          - id: "karim.benali"
            name: "Karim Benali"
            password: "${jenkins-comptes-karim-benali}"
          - id: "wb-checks"
            name: "Vérifications du workbook (lecture)"
            password: "${jenkins-comptes-wb-checks}"
    # Pas de lecture anonyme ; droits par compte (greffon matrix-auth).
    authorizationStrategy: |-
      globalMatrix:
        entries:
          - user:
              name: "${chart-admin-username}"
              permissions:
                - "Overall/Administer"
          - user:
              name: "karim.benali"
              permissions:
                - "Overall/Read"
                - "Job/Build"
                - "Job/Cancel"
                - "Job/Read"
                - "Job/Workspace"
                - "Run/Replay"
          - user:
              name: "wb-checks"
              permissions:
                - "Overall/Read"
                - "Job/Read"
    configScripts:
      message: |
        jenkins:
          systemMessage: "Jenkins MédiSphère — configuré par JCasC (M19-E19)"
      # Job de test : défini par Job DSL (greffon job-dsl), un pipeline en ligne sur un agent en pod.
      jobs: |
        jobs:
          - script: |
              pipelineJob('essai-agent') {
                description('Essai d\'agent en pod (M19-E19). Géré par JCasC : ne pas modifier à la main.')
                definition {
                  cps {
                    sandbox(true)
                    script('''
                      pipeline {
                        agent { kubernetes { inheritFrom 'default' } }
                        options { timeout(time: 10, unit: 'MINUTES'); timestamps() }
                        stages {
                          stage('agent') {
                            steps {
                              sh 'id; uname -a; cat /etc/os-release | head -n 2; java -version 2>&1 | head -n 1'
                            }
                          }
                        }
                      }
                    '''.stripIndent())
                  }
                }
              }
  # Pas de pod de « helm test » (image bats tirée de Docker Hub, hors Harbor).
  testEnabled: false
  # Publication par la Gateway principale.
  httpRoute:
    enabled: true
    parentRefs:
      - name: gw-par1
        namespace: passerelles
    hostnames:
      - jenkins.apps.par1.medisphere.internal

agent:
  enabled: true
  image:
    registry: registry.par1.medisphere.internal
    repository: dockerhub/jenkins/inbound-agent
    tag: 3385.vf1123fb_515da_-1-jdk21
  # Connexion de l'agent au contrôleur par WebSocket (http://jenkins.jenkins.svc:8080).
  websocket: true
  # Contexte de sécurité compatible « restricted » sur le conteneur jnlp.
  restrictedPssSecurityContext: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podRetention: Never
  # Pas de YAML de pod dans les journaux de build.
  showRawYaml: false

persistence:
  enabled: true
  storageClass: ceph-rbd
  size: 8Gi
