---
# host_vars/mon01/mailpit.yml — Mailpit sur mon01 (M19-E03). Valeurs par défaut du rôle pour le reste.
# Changer de version : mailpit_version ET mailpit_sha256 (relevée sur adm01, voir le corrigé).
mailpit_version: "1.31.6"
mailpit_sha256: "10fa12ccc610f653d4ed4df848c1817f9935dcf4e9a6a458a19ab0fa02093f91"

# Comptes de l'interface et de l'API. Mailpit n'a pas de rôles : wb-checks a techniquement tous
# les droits de l'API (compensations dans docs/socle/messagerie.md).
mailpit_comptes:
  - nom: "<MOI>"
    mot_de_passe: "{{ vault_mailpit_mdp_moi }}"
  - nom: wb-checks
    mot_de_passe: "{{ vault_mailpit_mdp_wb_checks }}"
