# medidoc/deploiement — base/httproute.yaml (M19-E33) : objet de M15-E34, sans espace de noms.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: medidoc
spec:
  parentRefs:
    - name: gw-par1
      namespace: passerelles
      sectionName: https
  hostnames:
    # Nom de production par défaut ; chaque overlay le remplace (overlays/dev : medidoc-dev).
    - medidoc.apps.par1.medisphere.internal
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains"}
              - {name: X-Content-Type-Options, value: nosniff}
              - {name: Referrer-Policy, value: no-referrer}
              - {name: X-Frame-Options, value: DENY}
      backendRefs:
        - name: medidoc
          port: 80
