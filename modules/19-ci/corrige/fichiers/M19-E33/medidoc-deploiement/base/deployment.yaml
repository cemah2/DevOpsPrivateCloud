# medidoc/deploiement — base/deployment.yaml (M19-E33) : Deployment de M16-E46, sans espace ni image figée.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medidoc
  labels:
    app.kubernetes.io/name: medidoc
    app.kubernetes.io/part-of: medidoc
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: medidoc
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medidoc
        app.kubernetes.io/part-of: medidoc
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: medidoc
      containers:
        - name: medidoc
          # Nom seul : l'overlay fixe l'image PAR DIGEST (kustomize edit set image, promotion E33).
          image: registry.par1.medisphere.internal/medisphere/medidoc
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MEDIDOC_S3_ENDPOINT
              value: https://rgw.par1.medisphere.internal
            - name: MEDIDOC_S3_BUCKET
              value: medidoc-documents
            - name: MEDIDOC_CA_FILE
              value: /etc/medisphere/medisphere-root-ca.crt
            - name: MEDIDOC_MAX_MB
              value: "10"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: medidoc-s3, key: AWS_ACCESS_KEY_ID}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: medidoc-s3, key: AWS_SECRET_ACCESS_KEY}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            # Chaque document est lu en mémoire (MEDIDOC_MAX_MB) : 10 Mio × requêtes simultanées.
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: racine
              mountPath: /etc/medisphere
              readOnly: true
      volumes:
        - name: racine
          configMap:
            name: racine-medisphere
