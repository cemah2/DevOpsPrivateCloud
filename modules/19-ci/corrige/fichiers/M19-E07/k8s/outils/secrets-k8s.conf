# outils/secrets-k8s.conf (plateforme/k8s) — Secrets créés HORS GIT par outils/secrets-k8s.sh.
# M19-E04 (PLAT-2004 / SEC-2004), PLAN §4.11. Une ligne par Secret :
#
#   <composant>  <espace>  <secret>  <clé>=<source> [<clé>=<source>…]
#
# <composant> : nom du fichier Vault secrets/<composant>.yml (identité « critique ») et argument
#               de la commande ; plusieurs Secrets peuvent partager un composant.
# <source>    : vault:<variable>  valeur d'une variable de secrets/<composant>.yml
#               fichier:<chemin>  contenu d'un fichier PUBLIC de adm01 (certificat d'autorité)
#               vide:             chaîne vide (clé attendue par un chart, sans valeur)
# Aucune valeur ici : ce fichier est versionné.
#
# Les modules suivants AJOUTENT leurs lignes (agent GitLab M19-E18, SonarQube M19-E16,
# Jenkins M19-E19…) sans modifier le script.

# M19-E04 : runner k8s-par1 (chart gitlab/gitlab-runner : runners.secret, certsSecretName).
gitlab-runner  gitlab-runner  gitlab-runner        runner-token=vault:gitlab_runner_jeton runner-registration-token=vide:
gitlab-runner  gitlab-runner  gitlab-runner-certs  git01.par1.medisphere.internal.crt=fichier:/usr/local/share/ca-certificates/medisphere-root-ca.crt

# M19-E07 : cache des runners sur s3-01 (identité ci-cache) ; chart : runners.cache.secretName.
gitlab-runner  gitlab-runner  ci-cache-s3          accesskey=vault:ci_cache_cle_acces secretkey=vault:ci_cache_cle_secrete
