# .gitlab/agents/k8s-par1/config.yaml (plateforme/k8s) — agent GitLab pour Kubernetes « k8s-par1 »
# (M19-E18, PLAT-2018). Le nom du dossier EST le nom de l'agent enregistré dans ce projet.
# Contexte CI fourni aux projets autorisés : « plateforme/k8s:k8s-par1 ».
# Ce que peut faire un job autorisé = ce que peut faire le compte de service de l'agent
# (rbac/gitlab-agent/ : edit dans mediagenda-dev et wb-essais, rien ailleurs).
# M20-E30 retire l'accès du groupe mediagenda (Argo CD prend le relais).
ci_access:
  groups:
    # Les projets du groupe mediagenda : seulement depuis une branche protégée, et seulement pour un
    # job qui déclare l'environnement « dev » (mediagenda/deploiement, job deployer-dev).
    - id: mediagenda
      protected_branches_only: true
      environments:
        - dev
  projects:
    # Le projet d'exercice : toutes ses branches (essais du module), espace wb-essais.
    - id: formation/ci-labo
