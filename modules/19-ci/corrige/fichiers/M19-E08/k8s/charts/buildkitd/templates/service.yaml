apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkitd.etiquettes" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "buildkitd.selecteur" . | nindent 4 }}
  ports:
    - name: buildkit
      port: {{ .Values.service.port }}
      targetPort: buildkit
      protocol: TCP
