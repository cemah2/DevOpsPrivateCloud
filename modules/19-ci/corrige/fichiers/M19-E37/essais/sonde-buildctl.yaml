# Pod jetable de diagnostic de buildkitd (M19-E37), dans ci-jobs : profil restricted, sans privilège,
# sans jeton d'API. Monte le Secret buildkit-client (certificat client de buildkitd, M19-E08), le même
# que celui des pods de job. À supprimer après usage.
apiVersion: v1
kind: Pod
metadata:
  name: sonde-buildctl
  namespace: ci-jobs
  labels:
    app.kubernetes.io/name: sonde-buildctl
    # Seule étiquette admise en entrée par la politique de buildkitd (M19-E08) : sans elle, la sonde
    # serait refusée comme n'importe quel pod qui n'est pas un job.
    medisphere.internal/ci: job
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: buildctl
      image: registry.par1.medisphere.internal/dockerhub/moby/buildkit:v0.34.1-rootless
      command:
        - buildctl
        - --addr
        - tcp://buildkitd.buildkit.svc.cluster.local:1234
        - --tlscacert
        - /certs/ca.crt
        - --tlscert
        - /certs/tls.crt
        - --tlskey
        - /certs/tls.key
        - debug
        - workers
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
  volumes:
    - name: certs
      secret:
        secretName: buildkit-client          # certificat client de M19-E08 (cert-manager, ClusterIssuer buildkit-ca)
