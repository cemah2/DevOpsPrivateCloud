# e02-hostpath.yaml — M16-E02, étapes 7 et 8 : ce que donne un hostPath.
#
# 1) kubectl apply -f e02-hostpath.yaml -l medisphere.fr/essai=refuse
#    → refusé par Pod Security (wb-essais est en baseline) :
#      pods "e02-hote" is forbidden: violates PodSecurity "baseline:latest": hostPath volumes (volume "pki")
# 2) kubectl apply -f e02-hostpath.yaml -l medisphere.fr/essai=privilegie
#    → crée l'espace wb-privilegie (privileged) et le pod ; LISTER seulement (ls -l), jamais cat.
# 3) kubectl delete namespace wb-privilegie
---
apiVersion: v1
kind: Pod
metadata:
  name: e02-hote
  namespace: wb-essais
  labels:
    medisphere.fr/essai: refuse
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sleep", "600"]
      volumeMounts:
        - name: pki
          mountPath: /pki-du-noeud
          readOnly: true
  volumes:
    - name: pki
      hostPath:
        path: /var/lib/kubelet/pki
        type: Directory
---
apiVersion: v1
kind: Namespace
metadata:
  name: wb-privilegie
  labels:
    medisphere.fr/essai: privilegie
    # ⚠️ Aucune restriction : espace temporaire de M16-E02, à supprimer à la fin de l'étape 8.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Pod
metadata:
  name: e02-hote
  namespace: wb-privilegie
  labels:
    medisphere.fr/essai: privilegie
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: app
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sleep", "600"]
      volumeMounts:
        - name: pki
          mountPath: /pki-du-noeud
          readOnly: true
  volumes:
    - name: pki
      hostPath:
        path: /var/lib/kubelet/pki
        type: Directory
