# e02-gourmand.yaml — M16-E02, étape 4 : un emptyDir qui dépasse son sizeLimit.
# Attendu : en une à deux minutes, le kubelet évince le pod (status.phase Failed, reason Evicted,
# événement « Usage of EmptyDir volume "brouillon" exceeds the limit "100Mi" »). À supprimer ensuite.
apiVersion: v1
kind: Pod
metadata:
  name: e02-gourmand
  namespace: wb-essais
  labels:
    medisphere.fr/exercice: m16-e02
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sh", "-c", "dd if=/dev/zero of=/brouillon/gros bs=1M count=150 && sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: brouillon
          mountPath: /brouillon
  volumes:
    - name: brouillon
      emptyDir:
        sizeLimit: 100Mi
