# e03-pvc-pods.yaml — M16-E03 : la demande de l'équipe (PVC) et ses consommateurs.
# kubectl apply -f e03-pvc-pods.yaml -l medisphere.fr/objet=pvc       (étape 3)
# kubectl apply -f e03-pvc-pods.yaml -l medisphere.fr/objet=ecrivain  (étape 4, puis 8)
# kubectl apply -f e03-pvc-pods.yaml -l medisphere.fr/objet=lecteur   (étape 5)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e03-donnees
  namespace: wb-essais
  labels:
    medisphere.fr/exercice: m16-e03
    medisphere.fr/objet: pvc
spec:
  storageClassName: local-manuel
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: e03-ecrivain
  namespace: wb-essais
  labels:
    medisphere.fr/exercice: m16-e03
    medisphere.fr/objet: ecrivain
spec:
  automountServiceAccountToken: false
  securityContext:
    # Root pour écrire dans le répertoire du nœud (0777 ici, mais c'est le cas général d'un volume
    # local : ses droits sont ceux du nœud, le kubelet n'applique pas fsGroup aux volumes « local »).
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sh", "-c", "while true; do echo \"$(date +%s) $(hostname)\" >> /donnees/trace; sleep 10; done"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: donnees
          mountPath: /donnees
  volumes:
    - name: donnees
      persistentVolumeClaim:
        claimName: e03-donnees
---
apiVersion: v1
kind: Pod
metadata:
  name: e03-lecteur
  namespace: wb-essais
  labels:
    medisphere.fr/exercice: m16-e03
    medisphere.fr/objet: lecteur
spec:
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sh", "-c", "tail -n 5 -f /donnees/trace"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: donnees
          mountPath: /donnees
          readOnly: true
  volumes:
    - name: donnees
      persistentVolumeClaim:
        claimName: e03-donnees
        readOnly: true
