# Géré par Ansible (rôle k8s_reseau_stockage, M16-E05).
#
# Le lecteur cloud-init de Proxmox change dès qu'on ajoute une carte adressée (ipconfigN) : son
# identifiant d'instance aussi, et cloud-init croit alors démarrer une NOUVELLE instance.
#  - network : la configuration réseau du premier démarrage (50-cloud-init.yaml, carte principale)
#    reste telle quelle ; cloud-init ne la réécrit plus. La carte de stockage appartient à
#    /etc/netplan/60-stockage.yaml.
#  - ssh_deletekeys : cloud-init ne supprime pas les clés d'hôte SSH (celles que signe la CA SSH
#    de step-ca, M06) ; il n'en génère que si elles manquent.
network: {config: disabled}
ssh_deletekeys: false
