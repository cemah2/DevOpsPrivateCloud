# M16-E29 — volume cible TEMPORAIRE (même taille que donnees-valkey-0, classe chiffrée).
# Son PV sera rattaché plus tard au PVC définitif donnees-valkey-0 (étape 5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-valkey-cible
  namespace: mediagenda-recette
  labels: {medisphere.fr/migration: sec-1729}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd-chiffre
  resources:
    requests:
      storage: <TAILLE>          # celle de donnees-valkey-0 (kubectl get pvc donnees-valkey-0)
