# plateforme/k8s — espaces/mediagenda-recette/70-mediagenda-db-sauvegarde.yaml (M16-E19)
# Sauvegarde de base quotidienne de mediagenda-db par le plugin Barman Cloud.
# Cron de CNPG : SIX champs, secondes en tête (« 0 15 1 * * * » = 01:15:00 chaque jour), en UTC
# dans le pod de l'opérateur : 01:15 UTC = 02:15 ou 03:15 à Paris, hors des heures de recette.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mediagenda-db-quotidienne
  namespace: mediagenda-recette
spec:
  schedule: "0 15 1 * * *"
  backupOwnerReference: self
  cluster:
    name: mediagenda-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Sauvegarde prise sur une réplique si possible (défaut prefer-standby) : le primaire n'est
  # pas chargé par la lecture des données.
  target: prefer-standby
