# e08-valkey.yaml — M16-E08 (DEV-1708), partie A : le patron StatefulSet + volumeClaimTemplates.
# État FINAL de l'exercice (étape 4) : 2 réplicas, whenScaled: Delete, whenDeleted: Retain.
# Pour rejouer les étapes 1 à 3 : replicas: 3 et sans persistentVolumeClaimRetentionPolicy
# (défaut : Retain / Retain).
---
apiVersion: v1
kind: Service
metadata:
  name: e08-valkey
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: e08-valkey
    medisphere.fr/exercice: m16-e08
spec:
  # Sans tête : un enregistrement DNS par pod (e08-valkey-0.e08-valkey.wb-essais.svc.cluster.local).
  clusterIP: None
  selector:
    app.kubernetes.io/name: e08-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: e08-valkey
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: e08-valkey
    medisphere.fr/exercice: m16-e08
spec:
  serviceName: e08-valkey
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: e08-valkey
  # Réduction : le PVC de l'instance retirée est supprimé (et, classe Delete, son image RBD).
  # Suppression du StatefulSet : les PVC restent (on peut le recréer et retrouver les données).
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Delete
    whenDeleted: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e08-valkey
        medisphere.fr/exercice: m16-e08
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: registry.par1.medisphere.internal/dockerhub/valkey/valkey:9.1.2-trixie
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--dir", "/data"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: donnees
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: donnees
        labels:
          medisphere.fr/exercice: m16-e08
      spec:
        storageClassName: ceph-rbd
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
