# mediagenda/api — k8s/recette/30-valkey.yaml (M16-E08, DEV-1708) : remplace celui du M14-E21.
# Valkey de MédiAgenda en recette, PERSISTANT : une instance, un volume ceph-rbd.
#
# Ce qui change par rapport au M14 :
#  - une seule instance au lieu de trois : sans Sentinel, les répliques valkey-1 et -2 du M14
#    n'apportaient aucune bascule (l'API ne parle qu'à valkey-0, le primaire) ; une instance
#    persistante répond au ticket (le cache survit à un déplacement de pod). La réplication avec
#    bascule automatique revient au M27 ;
#  - volumeClaimTemplates « donnees » (1 Gio ceph-rbd) au lieu de l'emptyDir, persistance AOF ;
#  - politique de rétention des PVC explicite (Retain / Retain).
# Ce qui NE change PAS : le nom du StatefulSet, le Service sans tête « valkey » (serviceName),
# les étiquettes (le Service et les politiques réseau du M15 les sélectionnent), l'image du M14,
# donc l'URL de l'API : MEDIAGENDA_VALKEY_URL=redis://valkey-0.valkey:6379/0 (ConfigMap
# mediagenda-api-config).
#
# ⚠️ volumeClaimTemplates est IMMUABLE : on ne « réapplique » pas ce fichier sur le StatefulSet du
#    M14. Procédure de bascule : voir le corrigé de M16-E08 (étape 8, --cascade=orphan).
#
# Contraintes de l'espace : Pod Security « restricted » ; ValidatingAdmissionPolicy du M14 (image
# de registry.par1.medisphere.internal, pas de :latest). Contrôle avant application :
#   kubectl apply --dry-run=server -f k8s/recette/30-valkey.yaml
#
# Le Service sans tête « valkey » du M14 (clusterIP: None, publishNotReadyAddresses: true) reste
# décrit ici, inchangé, pour que le fichier reste la source complète du composant.
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: mediagenda-recette
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: mediagenda
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: mediagenda-recette
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: mediagenda
spec:
  serviceName: valkey
  replicas: 1
  podManagementPolicy: OrderedReady
  # Même sélecteur qu'au M14 : le StatefulSet recréé ADOPTE les pods orphelins de l'ancien.
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  # Recette : ni la réduction ni la suppression du StatefulSet n'emportent le volume.
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain
    whenDeleted: Retain
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: mediagenda
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: medisphere-standard
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        # Le kubelet donne le groupe 999 à la racine du volume ext4 (fsGroupPolicy: File du
        # CSIDriver) ; OnRootMismatch : il ne reparcourt pas tout le volume à chaque montage.
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: registry.par1.medisphere.internal/dockerhub/valkey/valkey:8.1
          # Cache : AOF chaque seconde (au plus une seconde de clés perdue sur un arrêt brutal),
          # mémoire plafonnée et éviction LRU (un cache plein évince, il ne refuse pas d'écrire).
          # « args » remplace le CMD de l'image et garde son ENTRYPOINT (docker-entrypoint.sh).
          args:
            - "valkey-server"
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "everysec"
            - "--maxmemory"
            - "96mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--dir"
            - "/data"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: donnees
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: donnees
        labels:
          app.kubernetes.io/name: valkey
          app.kubernetes.io/part-of: mediagenda
      spec:
        storageClassName: ceph-rbd
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
