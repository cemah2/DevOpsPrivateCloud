# composants/ceph-csi/classes/ceph-rbd-snap.yaml (plateforme/k8s) — M16-E10
# Classe d'instantanés du pilote rbd.csi.ceph.com, PAR DÉFAUT pour ce pilote. Appliquée par
# composants/ceph-csi/installer.sh avec les StorageClasses (CRD des snapshots requises : E06).
# <FSID> : fsid de ceph-par1, le même que dans les StorageClasses. Secret : celui du
# provisionneur (outils/ceph-csi-secrets.sh, E06-E07).
# deletionPolicy: Delete : supprimer le VolumeSnapshot supprime l'instantané dans Ceph.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: ceph-rbd-snap
  labels:
    medisphere.internal/composant: stockage
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: rbd.csi.ceph.com
deletionPolicy: Delete
parameters:
  clusterID: "<FSID>"
  csi.storage.k8s.io/snapshotter-secret-name: csi-rbd-secret
  csi.storage.k8s.io/snapshotter-secret-namespace: ceph-csi
