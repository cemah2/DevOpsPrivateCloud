# plateforme/k8s — rbac/wb-checks-stockage.yaml (M16-E10)
# Lecture seule des ressources de stockage et de données pour le compte des vérifications du
# workbook (wb-system/wb-checks, M14-E06). Complète le ClusterRole « wb-checks » du M14 sans le
# modifier. Aucun verbe d'écriture, aucun accès aux Secrets (ceux de ceph-csi, Velero et CNPG
# contiennent des clés).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wb-checks-stockage
  labels:
    app.kubernetes.io/part-of: workbook
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "csinodes", "volumeattachments", "volumeattributesclasses", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses", "volumesnapshots", "volumesnapshotcontents"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["velero.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io", "barmancloud.cnpg.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ceph.rook.io", "csi.ceph.io", "longhorn.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Politiques réseau des bases (E18-E19) : standard et Cilium.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch"]
  # Résumé de statistiques du kubelet (occupation des volumes, E11, E27) : sous-ressource proxy
  # des nœuds en lecture. nodes/proxy en GET ne permet pas d'exécuter dans un pod.
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wb-checks-stockage
  labels:
    app.kubernetes.io/part-of: workbook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wb-checks-stockage
subjects:
  - kind: ServiceAccount
    name: wb-checks
    namespace: wb-system
