# ~/m16/e10/30-restaurations.yaml — restaurations et clone (nouveaux PVC avec dataSource).
# Même classe que la source (un pilote ne restaure que ses propres instantanés), taille >= source.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: donnees-restauree
  namespace: wb-essais
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 1Gi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: donnees-s1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: donnees-clone
  namespace: wb-essais
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 1Gi
  dataSource:
    kind: PersistentVolumeClaim
    name: donnees
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: partage-restauree
  namespace: wb-essais
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: cephfs
  resources:
    requests:
      storage: 1Gi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: partage-s1
---
apiVersion: v1
kind: Pod
metadata:
  name: lecteur
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: m16-e10
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: essai
      image: debian:trixie-slim
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 200m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - {name: restauree, mountPath: /restauree}
        - {name: clone, mountPath: /clone}
        - {name: partage, mountPath: /partage-restauree}
  volumes:
    - name: restauree
      persistentVolumeClaim: {claimName: donnees-restauree}
    - name: clone
      persistentVolumeClaim: {claimName: donnees-clone}
    - name: partage
      persistentVolumeClaim: {claimName: partage-restauree}
