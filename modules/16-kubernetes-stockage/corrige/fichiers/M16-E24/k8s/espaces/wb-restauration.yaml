# plateforme/k8s — espaces/wb-restauration.yaml (M16-E24, PLAT-1724)
# Espace de restauration : reçoit des COPIES d'espaces applicatifs (données de santé comprises).
# - PSA restricted comme mediagenda-* (les objets restaurés doivent y être admis tels quels) ;
# - PAS de label medisphere.internal/exposition : gw-par1 refuse toute route de cet espace (allowedRoutes) ;
# - quota de stockage serré : une copie ne doit pas pouvoir épuiser le quota du pool k8s-rbd.
# L'espace est créé par le code et reste vide entre deux essais (la copie est supprimée après contrôle).
apiVersion: v1
kind: Namespace
metadata:
  name: wb-restauration
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    medisphere.internal/usage: restauration
  annotations:
    medisphere.internal/contenu: "copies de données de production ou de recette : à vider après chaque essai (RB-161)"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: stockage
  namespace: wb-restauration
spec:
  hard:
    persistentvolumeclaims: "6"
    requests.storage: 16Gi
    ceph-rbd.storageclass.storage.k8s.io/requests.storage: 12Gi
    ceph-rbd-chiffre.storageclass.storage.k8s.io/requests.storage: 12Gi
    # Aucune classe Retain dans une copie : une copie oubliée ne doit pas survivre à sa suppression.
    ceph-rbd-retain.storageclass.storage.k8s.io/persistentvolumeclaims: "0"
    cephfs.storageclass.storage.k8s.io/requests.storage: 4Gi
