# plateforme/k8s — composants/velero/planifications.yaml (M16-E16 ; volumes en E17)
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: mediagenda-dev-quotidienne
  namespace: velero
  labels:
    medisphere.internal/sauvegarde: quotidienne
spec:
  # 02 h 30, heure de Paris (sans CRON_TZ, Velero calcule en UTC).
  schedule: "CRON_TZ=Europe/Paris 30 2 * * *"
  useOwnerReferencesInBackup: false
  template:
    includedNamespaces:
      - mediagenda-dev
    ttl: 168h0m0s
    storageLocation: s3-01
    metadata:
      labels:
        medisphere.internal/sauvegarde: quotidienne
