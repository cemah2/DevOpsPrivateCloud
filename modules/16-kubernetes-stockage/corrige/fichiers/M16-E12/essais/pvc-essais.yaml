# ~/m16/e12/pvc-essais.yaml — PVC et pods d'essai de M16-E12 (à supprimer en fin d'exercice).
# Applique chaque document séparément, au moment de l'étape correspondante.
# Étape 3 : sans classe (pendant que ceph-rbd n'est plus par défaut).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sans-classe
  namespace: wb-essais
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Étape 3 : classe explicitement vide = « lie-moi à un PV statique sans classe », jamais de
# provisionnement dynamique, jamais d'attribution rétroactive.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: classe-vide
  namespace: wb-essais
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
---
# Étape 4
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: differee
  namespace: wb-essais
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: wb-essai-differee
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: differee
  namespace: wb-essais
spec:
  nodeSelector:
    medisphere.internal/inexistant: "oui"     # impossible : le volume n'est jamais créé
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: essai
      image: debian:trixie-slim
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      volumeMounts:
        - {name: d, mountPath: /d}
  volumes:
    - name: d
      persistentVolumeClaim: {claimName: differee}
---
# Étape 5
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
