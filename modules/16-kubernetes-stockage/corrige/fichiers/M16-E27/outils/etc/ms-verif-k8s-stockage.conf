# etc/ms-verif-k8s-stockage.conf — ce que surveille ms-verif-k8s-stockage (M16-E27, PLAT-1727).
# Installé dans /usr/local/etc par « task install:systeme ». Modifié par MR, comme le code.
# Syntaxe bash (fichier chargé par le script) : tableaux et variables simples, aucune commande.

# --- Identité (compte de service ms-supervision-stockage, jeton renouvelé par minuterie) -----------
MS_K8S_KUBECONFIG=/home/admin/.config/workbook/k8s-supervision-stockage.kubeconfig

# --- Nœuds dont on lit les métriques du kubelet (port 10250, sous-ressource nodes/metrics) ---------
# Seuls les travailleurs montent des volumes (les nœuds de contrôle ont le taint par défaut).
# Noms courts : ce sont ceux que porte le certificat de service du kubelet (CSR approuvées en
# M14-E26 : nom du nœud et adresses), résolus par le domaine de recherche de adm01.
MS_K8S_NOEUDS=(k8s-w01 k8s-w02 k8s-w03)
MS_K8S_PORT_KUBELET=10250
MS_K8S_NB_TRAVAILLEURS=3

# --- Pilotes -----------------------------------------------------------------------------------------
MS_K8S_ESPACE_CSI=ceph-csi
# Deux DaemonSets de nodeplugins attendus : RBD et CephFS.
MS_K8S_NB_PILOTES=2
MS_K8S_SNAPSHOT_CONTROLLER=snapshot-controller

# --- Seuils --------------------------------------------------------------------------------------------
MS_K8S_PVC_PENDING_MIN=15      # un PVC Pending plus longtemps que ça est une anomalie
MS_K8S_SNAPSHOT_MIN=30         # un VolumeSnapshot non prêt plus longtemps que ça
MS_K8S_SEUIL_VOLUME=80         # remplissage d'un volume (octets ou inodes), en %
MS_K8S_SAUVEGARDE_H=26         # âge maximal de la dernière sauvegarde réussie (Velero, base)
MS_K8S_RETARD_S=60             # retard de réplication PostgreSQL maximal

# --- Velero --------------------------------------------------------------------------------------------
MS_K8S_ESPACE_VELERO=velero
