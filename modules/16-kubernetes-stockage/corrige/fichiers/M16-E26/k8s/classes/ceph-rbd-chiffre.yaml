# plateforme/k8s — classes/ceph-rbd-chiffre.yaml (M16-E26, SEC-1726)
# Volumes RBD chiffrés PAR LE CLIENT (LUKS2 ouvert sur le nœud par le nodeplugin) : Ceph ne reçoit
# que des blocs chiffrés. Une DEK par volume (KMS « secrets-metadata »), enveloppée par la KEK de
# CETTE classe (Secret csi-rbd-secret-chiffre). Ne JAMAIS changer les paramètres de chiffrement
# d'une classe qui a des volumes : créer une nouvelle classe (documentation ceph-csi).
# Paramètres communs repris de ceph-rbd (E06) : adapte clusterID et imageFeatures aux tiens.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd-chiffre
  labels:
    medisphere.fr/chiffrement: client-luks
provisioner: rbd.csi.ceph.com
parameters:
  clusterID: <FSID-CEPH-PAR1>
  pool: k8s-rbd
  imageFormat: "2"
  imageFeatures: layering,exclusive-lock,object-map,fast-diff,deep-flatten
  csi.storage.k8s.io/fstype: ext4
  # Transit : msgr2 « secure » imposé par ceph-par1 (M08-E27) ; le client noyau le demande ici.
  mapOptions: "krbd:ms_mode=secure"
  # Chiffrement côté client
  encrypted: "true"
  encryptionType: block
  encryptionKMSID: secrets-metadata
  # Secrets : identité client.k8s ET KEK (encryptionPassphrase), distincts de csi-rbd-secret
  csi.storage.k8s.io/provisioner-secret-name: csi-rbd-secret-chiffre
  csi.storage.k8s.io/provisioner-secret-namespace: ceph-csi
  csi.storage.k8s.io/controller-expand-secret-name: csi-rbd-secret-chiffre
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph-csi
  csi.storage.k8s.io/node-stage-secret-name: csi-rbd-secret-chiffre
  csi.storage.k8s.io/node-stage-secret-namespace: ceph-csi
reclaimPolicy: Delete
allowVolumeExpansion: true
# Même mode de liaison que ceph-rbd (E12).
volumeBindingMode: WaitForFirstConsumer
