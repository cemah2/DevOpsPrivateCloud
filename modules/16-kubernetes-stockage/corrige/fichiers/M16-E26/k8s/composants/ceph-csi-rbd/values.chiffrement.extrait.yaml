# plateforme/k8s — composants/ceph-csi-rbd/values.yaml — EXTRAIT ajouté en M16-E26 (SEC-1726).
# Fournisseur de clés (KMS) du pilote RBD : rendu par le chart dans la ConfigMap nommée par
# kmsConfigMapName (défaut ceph-csi-encryption-kms-config), montée par les nodeplugins ET par les
# contrôleurs (suppression d'un volume : nettoyage de la DEK chez les KMS qui la stockent ailleurs).
#
# Type « metadata » : une DEK aléatoire PAR VOLUME, chiffrée par une KEK et rangée dans les
# métadonnées de l'image RBD (rbd.csi.ceph.com/dek). Sans secretName, la KEK est lue dans les
# Secrets de la StorageClass (provisioner et node-stage), clé encryptionPassphrase : ici le Secret
# dédié csi-rbd-secret-chiffre (créé par outils/secret-rbd-chiffre.sh depuis Ansible Vault).
# Valeurs de type chaîne uniquement (map[string]string, documentation ceph-csi).
encryptionKMSConfig:
  secrets-metadata:
    encryptionKMSType: metadata
#
# Attention (charts 3.18) : les charts ceph-csi-rbd ET ceph-csi-cephfs créent chacun une ConfigMap
# nommée par kmsConfigMapName, avec le même nom par défaut. Installés dans le même espace (ceph-csi),
# l'un des deux doit porter un autre nom (choix de E06-E07 : vérifie `helm get values` des deux
# releases) ; sinon Helm refuse de prendre possession d'une ConfigMap appartenant à l'autre release.
