# e06-garde.yaml — M16-E06, étape 12 : classe Retain. Après « kubectl delete -f e06-garde.yaml »,
# le PV passe Released et l'image RBD reste dans k8s-rbd : ménage d'administrateur (corrigé).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e06-garde
  namespace: wb-essais
  labels:
    medisphere.internal/exercice: m16-e06
spec:
  storageClassName: ceph-rbd-retain
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: e06-garde
  namespace: wb-essais
  labels:
    medisphere.internal/exercice: m16-e06
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sh", "-c", "date > /donnees/precieux && while true; do sleep 3600; done"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: donnees
          mountPath: /donnees
  volumes:
    - name: donnees
      persistentVolumeClaim:
        claimName: e06-garde
