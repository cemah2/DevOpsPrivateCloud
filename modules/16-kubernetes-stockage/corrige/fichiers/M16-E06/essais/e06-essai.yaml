# e06-essai.yaml — M16-E06 (PLAT-1706), étapes 9-10 : un volume de bout en bout, classe PAR DÉFAUT.
# À laisser en place : E04 (partie B) et E10 s'en servent.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e06-essai
  namespace: wb-essais
  labels:
    medisphere.fr/exercice: m16-e06
spec:
  # Pas de storageClassName : la classe par défaut (ceph-rbd) est appliquée par l'admission.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: e06-essai
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: e06-essai
    medisphere.fr/exercice: m16-e06
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    # Le kubelet donne le groupe 65534 au volume (fsGroupPolicy: File du CSIDriver) : sans cela,
    # la racine d'ext4 (root:root 0755) ne serait pas inscriptible par l'utilisateur 65534.
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sh", "-c"]
      args:
        - |
          if [ ! -f /donnees/temoin ]; then
            dd if=/dev/urandom of=/donnees/temoin bs=1M count=100 2>/dev/null
            sha256sum /donnees/temoin > /donnees/temoin.sha256
          fi
          echo "$(date +%s) $(hostname) démarrage" >> /donnees/journal
          sha256sum -c /donnees/temoin.sha256
          while true; do sleep 3600; done
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: donnees
          mountPath: /donnees
  volumes:
    - name: donnees
      persistentVolumeClaim:
        claimName: e06-essai
