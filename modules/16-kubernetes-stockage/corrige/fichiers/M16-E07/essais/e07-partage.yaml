# e07-partage.yaml — M16-E07 (DEV-1707), étapes 6-7 : un volume RWX écrit depuis deux nœuds.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e07-partage
  namespace: wb-essais
  labels:
    medisphere.internal/exercice: m16-e07
spec:
  storageClassName: cephfs
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e07-ecrivains
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: e07-ecrivains
    medisphere.internal/exercice: m16-e07
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: e07-ecrivains
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e07-ecrivains
        medisphere.internal/exercice: m16-e07
    spec:
      # Deux nœuds différents, obligatoirement : c'est ce que RWO ne permettrait pas.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: e07-ecrivains
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
          command: ["sh", "-c", "while true; do echo \"$(hostname) $(date +%s)\" >> /partage/journal; sleep 5; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: partage
              mountPath: /partage
      volumes:
        - name: partage
          persistentVolumeClaim:
            claimName: e07-partage
---
apiVersion: v1
kind: Pod
metadata:
  name: e07-lecteur
  namespace: wb-essais
  labels:
    medisphere.internal/exercice: m16-e07
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.par1.medisphere.internal/dockerhub/library/busybox:1.37
      command: ["sh", "-c", "while true; do tail -n 20 /partage/journal; echo ---; sleep 15; done"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: partage
          mountPath: /partage
          readOnly: true
  volumes:
    - name: partage
      persistentVolumeClaim:
        claimName: e07-partage
        readOnly: true
