# plateforme/k8s (ou ton dépôt de manifestes de recette) — Deployment de l'API MédiAgenda
# (EXTRAIT, M16-E18) : seule la variable MEDIAGENDA_DB_URL change. Le reste du Deployment du
# M14 (sondes /sante et /pret, ressources, Valkey) est inchangé.
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: MEDIAGENDA_DB_URL
              valueFrom:
                secretKeyRef:
                  name: mediagenda-db-app     # généré par CNPG
                  key: uri                    # postgresql://mediagenda:…@mediagenda-db-rw.mediagenda-recette:5432/mediagenda
