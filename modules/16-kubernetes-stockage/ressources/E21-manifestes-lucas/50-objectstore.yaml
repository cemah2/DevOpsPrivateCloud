# Copié de mediagenda-recette pour aller plus vite
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-s3
  namespace: medidoc-dev
spec:
  configuration:
    destinationPath: s3://cnpg-k8s-par1/
    serverName: mediagenda-db
    endpointURL: http://s3-01.par1.medisphere.internal:8333
    s3Credentials:
      accessKeyId:
        name: cnpg-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
