---
# Rôle pxe (M11-E02 ; installateurs vérifiés en M11-E04/E05).

- name: Paramètres cohérents
  ansible.builtin.assert:
    that:
      - pxe_adresse is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - pxe_http_autorises | length > 0
      - pxe_installateurs | rejectattr('type', 'in', ['debian', 'rocky']) | list | length == 0
    fail_msg: "pxe_adresse doit être une adresse IPv4, pxe_http_autorises non vide, type d'installateur debian ou rocky."
    quiet: true

- name: Paquets (TFTP, HTTP, binaires iPXE, vérification des signatures Debian)
  ansible.builtin.apt:
    name:
      - tftpd-hpa
      - nginx
      - ipxe
      - gpgv
      - debian-archive-keyring
      - curl
      - rsync
    state: present

# --- TFTP --------------------------------------------------------------------------------------
- name: Racine TFTP (lecture seule pour le compte tftp)
  ansible.builtin.file:
    path: "{{ pxe_racine_tftp }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Binaires iPXE du paquet Debian à la racine TFTP
  ansible.builtin.copy:
    src: "/usr/lib/ipxe/{{ item }}"
    dest: "{{ pxe_racine_tftp }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pxe_binaires_ipxe }}"

- name: Configuration de tftpd-hpa
  ansible.builtin.template:
    src: tftpd-hpa.j2
    dest: /etc/default/tftpd-hpa
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer tftpd-hpa

# --- HTTP --------------------------------------------------------------------------------------
- name: Racine HTTP et dossiers du rôle
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ pxe_racine_http }}"
    - "{{ pxe_racine_http }}/pki"

# Dossiers PUBLIÉS par plateforme/provisioning : le rôle les crée, il n'en gère pas le contenu.
- name: Dossiers alimentés par plateforme/provisioning
  ansible.builtin.file:
    path: "{{ pxe_racine_http }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ pxe_dossiers_publies }}"

- name: Racine de la PKI publiée pour les installateurs
  ansible.builtin.copy:
    src: "{{ pxe_racine_pki }}"
    dest: "{{ pxe_racine_http }}/pki/medisphere-root-ca.crt"
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Site nginx du serveur de démarrage
  ansible.builtin.template:
    src: nginx-pxe.conf.j2
    dest: /etc/nginx/sites-available/pxe
    owner: root
    group: root
    mode: "0644"
  notify: Recharger nginx

- name: Site activé
  ansible.builtin.file:
    src: /etc/nginx/sites-available/pxe
    dest: /etc/nginx/sites-enabled/pxe
    state: link
  notify: Recharger nginx

# Le site par défaut écoute sur toutes les adresses et sert /var/www/html : on le retire.
- name: Site par défaut retiré
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

- name: Configuration de nginx valide (avant tout rechargement)
  ansible.builtin.command: nginx -t
  changed_when: false
  check_mode: false

# --- Installateurs vérifiés (M11-E04, E05) ------------------------------------------------------
- name: Outil de téléchargement vérifié des installateurs
  ansible.builtin.copy:
    src: pxe-installateurs
    dest: /usr/local/sbin/pxe-installateurs
    owner: root
    group: root
    mode: "0755"

- name: Installateurs téléchargés et vérifiés (signature, empreintes)
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/pxe-installateurs
      - "{{ item.type }}"
      - "{{ item.nom }}"
      - "{{ item.version }}"
      - "{{ item.miroir }}"
      - "{{ pxe_racine_http }}"
  loop: "{{ pxe_installateurs }}"
  loop_control:
    label: "{{ item.nom }}"
  register: pxe_resultat_installateurs
  changed_when: "'mis à jour' in pxe_resultat_installateurs.stdout"
  # En mode --check, rien n'est téléchargé.
  when: not ansible_check_mode

# --- Services ----------------------------------------------------------------------------------
- name: Services actifs et lancés au démarrage
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - tftpd-hpa.service
    - nginx.service

- name: Appliquer maintenant les redémarrages en attente
  ansible.builtin.meta: flush_handlers

# Contrôle du service RENDU : une lecture TFTP et une lecture HTTP, depuis l'hôte lui-même.
- name: TFTP sert le chargeur BIOS
  ansible.builtin.command:
    argv: [curl, --silent, --fail, --max-time, "10", --output, /dev/null, "tftp://{{ pxe_adresse }}/undionly.kpxe"]
  changed_when: false
  check_mode: false
  when: "'undionly.kpxe' in pxe_binaires_ipxe"

- name: HTTP sert la racine de la PKI depuis l'adresse de service
  ansible.builtin.uri:
    url: "http://{{ pxe_adresse }}/pki/medisphere-root-ca.crt"
    return_content: false
  # L'hôte s'interroge depuis sa propre adresse (10.10.60.10), comprise dans pxe_http_autorises.
