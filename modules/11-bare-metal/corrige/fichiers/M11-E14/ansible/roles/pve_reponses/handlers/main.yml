---
- name: Redémarrer pve-reponses
  ansible.builtin.systemd_service:
    name: pve-reponses
    state: restarted
    daemon_reload: true

- name: Tester la configuration de nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Recharger nginx

- name: Recharger le service nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Recharger nginx
