#### preseed/debian13.cfg — plateforme/provisioning (M11-E04)
# Installation automatique de Debian 13 « trixie » aux standards MédiSphère.
# Lu par debian-installer via « url=http://pxe01.par1.medisphere.internal/preseed/debian13.cfg ».
# Servi en HTTP CLAIR sur le VLAN 60 (HTTPS en M11-E13) : aucune donnée secrète ici, seulement
# une EMPREINTE de mot de passe et des clés PUBLIQUES.
# Ce qui est sur la ligne de commande du noyau (script iPXE), pas ici : auto=true
# priority=critical, hostname=…, domain=… (le réseau est configuré AVANT la lecture de ce fichier).
# Validation : debconf-set-selections -c preseed/debian13.cfg (pipeline : outils/verifier.sh).

### Langue, clavier, fuseau
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string 10.10.60.1

### Réseau : DHCP sur la première interface qui a un lien (Kea, sous-réseau 60)
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 30
d-i hw-detect/load_firmware boolean false

### Miroir : deb.debian.org à travers la bordure. Paquets vérifiés par apt (Release signé).
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
# Mises à jour de sécurité et « updates » dès l'installation.
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/non-free-firmware boolean true

### Comptes : pas de mot de passe root (root verrouillé, admin dans le groupe sudo)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Administrateur MédiSphère
d-i passwd/username string admin
# Empreinte SHA-512 (mkpasswd -m sha-512, mot de passe lu sur l'entrée standard), pour la
# CONSOLE seulement : SSH n'accepte que les clés (et les certificats, M06-E20).
d-i passwd/user-password-crypted password <EMPREINTE-SHA512-ADMIN>
d-i user-setup/encrypt-home boolean false

### Partitionnement : LVM sur tout le disque, schéma « atomic » (une seule racine)
# /dev/sda : seul disque des VMs du lab (virtio-scsi). Sur un vrai serveur à plusieurs disques,
# ce nom n'est pas stable : voir M11-E11 et la sélection par partman/early_command.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# UEFI (bm03, bm04) : partition système EFI créée par la recette ; copie de secours du
# chargeur dans \EFI\BOOT\BOOTX64.EFI, que le micrologiciel trouve même si ses variables
# (entrées de démarrage NVRAM) sont perdues.
d-i grub-installer/force-efi-extra-removable boolean true

### Paquets
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string qemu-guest-agent sudo curl ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Chargeur d'amorçage
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Standards MédiSphère, dans le système installé (/target)
# 1. Racine de la PKI : téléchargée, puis ACCEPTÉE SEULEMENT si son empreinte est la bonne
#    (empreinte écrite ici, calculée sur adm01 : sha256sum /usr/local/share/ca-certificates/medisphere-root-ca.crt).
#    En cas d'écart, la commande échoue et l'installation s'arrête sur une erreur visible.
# 2. Clé publique SSH de adm01 pour admin.
# La clé d'hôte SSH sera signée par la CA SSH au premier passage d'Ansible (rôle ssh_ca_hote, M06-E19).
d-i preseed/late_command string \
  wget -q -O /tmp/racine.crt http://pxe01.par1.medisphere.internal/pki/medisphere-root-ca.crt; \
  [ "$(sha256sum /tmp/racine.crt | cut -d ' ' -f 1)" = "<EMPREINTE-SHA256-RACINE>" ] || exit 1; \
  cp /tmp/racine.crt /target/usr/local/share/ca-certificates/medisphere-root-ca.crt; \
  in-target update-ca-certificates; \
  mkdir -p /target/home/admin/.ssh; \
  echo '<CLE-PUBLIQUE-SSH-ADM01>' > /target/home/admin/.ssh/authorized_keys; \
  chmod 700 /target/home/admin/.ssh; \
  chmod 600 /target/home/admin/.ssh/authorized_keys; \
  in-target chown -R admin:admin /home/admin/.ssh

### Fin : EXTINCTION (pas de redémarrage). C'est la chaîne qui décide de la suite :
# marquer le serveur « active » dans NetBox, puis le rallumer (il démarrera sur son disque).
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
