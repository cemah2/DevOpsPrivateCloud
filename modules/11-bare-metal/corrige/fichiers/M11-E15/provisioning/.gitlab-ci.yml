# plateforme/provisioning — pipeline (M11-E03 ; preseed E04 ; kickstart E05 ; générateur NetBox E06 ;
# version M11-E15 : déploiement par la CI et job manuel « provisionner »). Remplace celui de M11-E06.
#   qualite      : pre-commit, Gitleaks (gabarits partagés, M01) ;
#   tests        : ruff, pytest (contrôle et rendu sur données simulées, sans réseau) ;
#   verifier     : rendu sur données simulées, outils/verifier.sh (en-têtes iPXE, mots de passe,
#                  debconf, ksvalidator, ShellCheck) et outils/verifier-rendu.sh (contrôles
#                  sémantiques : partitionnement confirmé, disque désigné, HTTPS seulement) ;
#   deployer     : sur main — rendu depuis NetBox, mêmes contrôles, publication sur pxe01 (publier.sh) ;
#   provisionner : job MANUEL sur main, variable EQUIPEMENT (nom NetBox) — outils/provisionner.py.
# Secrets (variables protégées et masquées du projet, jamais dans ce fichier) : NETBOX_TOKEN (jeton
# en écriture de svc-automatisation, M11-E15) ; PVE_ENV_FICHIER (type « fichier », format de
# pve-provision.env) ; clé SSH de déploiement vers pxe01 (agent du runner). Exécuteur : runner01
# (shell), uv, Ansible, shellcheck, debconf installés (M04) ; flux runner01 → VLAN 60 en SSH (M11-E15).
include:
  - project: plateforme/ci-templates
    file: qualite.yml

stages: [qualite, tests, verifier, deployer, provisionner]

variables:
  UV_FROZEN: "1"
  NETBOX_URL: https://nbx01.par1.medisphere.internal

default:
  tags: [shell, socle]

.regles: &regles
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

python:
  stage: tests
  <<: *regles
  script:
    - uv sync --group dev
    - uv run ruff check outils tests
    - uv run ruff format --check outils tests
    - uv run pytest -q

verifier:
  stage: verifier
  <<: *regles
  script:
    - uv sync --group dev
    - uv run outils/netbox-provision.py rendre --depuis-json tests/donnees/netbox.json
    - PATH="$CI_PROJECT_DIR/.venv/bin:$PATH" outils/verifier.sh
    - PATH="$CI_PROJECT_DIR/.venv/bin:$PATH" outils/verifier-rendu.sh rendu/http
  artifacts:
    when: on_failure
    paths: [rendu/]
    expire_in: 1 week

deployer:
  stage: deployer
  resource_group: pxe01
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - uv sync --group dev
    - uv run outils/netbox-provision.py rendre
    - PATH="$CI_PROJECT_DIR/.venv/bin:$PATH" outils/verifier.sh
    - PATH="$CI_PROJECT_DIR/.venv/bin:$PATH" outils/verifier-rendu.sh rendu/http
    - outils/publier.sh

provisionner:
  stage: provisionner
  resource_group: provisioning   # une seule installation à la fois (lab : mémoire de pve01)
  timeout: 2h
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    ANSIBLE_PROJET: $CI_BUILDS_DIR/ansible-accueil
  script:
    - test -n "$EQUIPEMENT" || { echo "Variable EQUIPEMENT (nom NetBox) obligatoire"; exit 2; }
    - rm -rf "$ANSIBLE_PROJET"
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@git01.par1.medisphere.internal/plateforme/ansible.git" "$ANSIBLE_PROJET"
    - (cd "$ANSIBLE_PROJET" && uv sync --frozen)
    - uv sync
    - PVE_ENV="$PVE_ENV_FICHIER" uv run outils/provisionner.py "$EQUIPEMENT"
