# parametres.yml — valeurs communes aux gabarits de plateforme/provisioning (M11-E06, version M11-E13).
# Données PUBLIQUES seulement (empreintes, clés et certificats publics, URL) : ce fichier est versionné.
# M11-E13 : plus aucun mot de passe (ni empreinte) ; chaîne en HTTPS ; racine de la PKI écrite ici
# pour le kickstart (le preseed la reçoit de pxe01, par iPXE).
serveur_http: https://pxe01.par1.medisphere.internal
domaine: par1.medisphere.internal
ntp: 10.10.60.1
disque: sda
# Rocky Linux : même version mineure que l'initrd servi par pxe01 (host_vars/pxe01/pxe.yml).
rocky_version: "10.2"
rocky_miroir: https://dl.rockylinux.org/pub/rocky
# Racine « MédiSphère Root CA » : empreinte SHA-256 (sans « : », en minuscules) et certificat PEM.
empreinte_racine: "<EMPREINTE-SHA256-RACINE>"
racine_pem: |
  -----BEGIN CERTIFICATE-----
  <CERTIFICAT-PEM-DE-LA-RACINE-MEDISPHERE>
  -----END CERTIFICATE-----
cle_ssh_admin: "<CLE-PUBLIQUE-SSH-ADM01>"
# Qui s'installe : « planned » (statut NetBox) jusqu'à M11-E15, puis « pxe_action ».
regle_installation: planned
# Ce que la chaîne accepte de NetBox.
reseau: 10.10.60.0/24
plage_debut: 10.10.60.100
plage_fin: 10.10.60.199
