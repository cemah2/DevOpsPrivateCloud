---
# playbooks/pxe.yml — serveur de démarrage réseau pxe01 (M11-E02), groupe role_pxe ; version M11-E13 :
# certificat ACME (rôle certificats_acme, host_vars/pxe01/certificats.yml) puis site HTTPS.
# Premier passage : nginx ne sert que la redirection du port 80 ; certificats_acme arrête nginx,
# émet le certificat (défi HTTP-01 de ca01 sur le port 80), redémarre nginx ; le site HTTPS est
# rendu ensuite (nginx.yml rappelé). Second passage attendu : changed=0.
# Le filtrage local (pare_feu_local) n'est toujours pas appliqué à pxe01 (TFTP sur ports
# éphémères) : l'isolement du VLAN 60 est assuré par la matrice de la bordure (M11-E13).
- name: Serveur de démarrage réseau du VLAN 60
  hosts: role_pxe
  become: true
  roles:
    - role: base
    - role: ssh_durci
    - role: ssh_ca_hote
    - role: pxe
    - role: certificats_acme
  tasks:
    - name: Site HTTPS (le certificat existe désormais)
      ansible.builtin.include_role:
        name: pxe
        tasks_from: nginx.yml
