---
# playbooks/pxe01.yml — serveur de provisioning (M11-E02, sécurisé en M11-E13).
# Premier passage : nginx sert le port 80 seul ; certificats_acme émet le certificat ; le site
# HTTPS est rendu ensuite. Second passage attendu : changed=0.
- name: Serveur de provisioning pxe01
  hosts: pxe01
  become: true
  roles:
    - role: pxe
    - role: certificats_acme
  tasks:
    - name: Site HTTPS (le certificat existe désormais)
      ansible.builtin.include_role:
        name: pxe
        tasks_from: nginx.yml
