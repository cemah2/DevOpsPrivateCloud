---
- name: Arborescence servie
  ansible.builtin.file:
    path: "{{ pxe_http_racine }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ [''] + pxe_http_dossiers }}"

- name: Racine de la PKI (publique) servie aux installateurs
  ansible.builtin.copy:
    src: /usr/local/share/ca-certificates/medisphere-root-ca.crt
    dest: "{{ pxe_http_racine }}/pki/medisphere-root-ca.crt"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
