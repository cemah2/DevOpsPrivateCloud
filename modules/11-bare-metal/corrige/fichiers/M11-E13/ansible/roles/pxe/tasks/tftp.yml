---
- name: Racine TFTP (lecture seule pour le compte tftp)
  ansible.builtin.file:
    path: "{{ pxe_racine_tftp }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configuration de tftpd-hpa
  ansible.builtin.template:
    src: tftpd-hpa.j2
    dest: /etc/default/tftpd-hpa
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer tftpd-hpa

# --- M11-E02 : binaires du paquet Debian, tant qu'aucun chargeur construit n'est déclaré ---------
- name: Binaires iPXE du paquet Debian à la racine TFTP
  ansible.builtin.copy:
    src: "/usr/lib/ipxe/{{ item }}"
    dest: "{{ pxe_racine_tftp }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pxe_binaires_ipxe }}"
  when: pxe_chargeurs | length == 0

# --- M11-E13 : chargeurs construits par la procédure versionnée -------------------------------------
- name: Cache local des chargeurs iPXE (contrôleur)
  ansible.builtin.file:
    path: "{{ pxe_chargeurs_cache }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  when: pxe_chargeurs | length > 0

- name: Chargeurs iPXE téléchargés sur le contrôleur, empreinte vérifiée
  ansible.builtin.get_url:
    url: "{{ pxe_chargeurs_url }}/{{ item.nom }}"
    dest: "{{ pxe_chargeurs_cache }}/{{ item.nom }}"
    checksum: "sha256:{{ item.sha256 }}"
    headers: "{{ pxe_chargeurs_entetes }}"
    mode: "0644"
  loop: "{{ pxe_chargeurs }}"
  loop_control:
    label: "{{ item.nom }}"
  delegate_to: localhost
  become: false
  run_once: true
  # Les en-têtes contiennent un jeton : rien dans les journaux d'Ansible ni de la CI.
  no_log: true

- name: Chargeurs iPXE déposés (lisibles par le compte tftp)
  ansible.builtin.copy:
    src: "{{ pxe_chargeurs_cache }}/{{ item.nom }}"
    dest: "{{ pxe_racine_tftp }}/{{ item.nom }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pxe_chargeurs }}"
  loop_control:
    label: "{{ item.nom }}"

- name: Empreinte des chargeurs déposés
  ansible.builtin.stat:
    path: "{{ pxe_racine_tftp }}/{{ item.nom }}"
    checksum_algorithm: sha256
  loop: "{{ pxe_chargeurs }}"
  loop_control:
    label: "{{ item.nom }}"
  register: pxe_chargeurs_deposes

- name: Les chargeurs servis sont exactement ceux de la procédure versionnée
  ansible.builtin.assert:
    that: item.stat.checksum | default('') == item.item.sha256
    fail_msg: "{{ item.item.nom }} : empreinte {{ item.stat.checksum | default('absente') }} au lieu de {{ item.item.sha256 }}"
    quiet: true
  loop: "{{ pxe_chargeurs_deposes.results }}"
  loop_control:
    label: "{{ item.item.nom }}"
