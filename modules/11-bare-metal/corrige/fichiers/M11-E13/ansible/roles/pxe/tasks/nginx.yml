---
# Le serveur HTTPS n'est rendu que si le certificat existe : au tout premier passage, nginx ne sert
# que le port 80 ; le rôle certificats_acme émet alors le certificat (nginx arrêté le temps du défi
# HTTP-01), puis le playbook rappelle ce fichier de tâches (playbooks/pxe01.yml).
- name: Présence du certificat de pxe01
  ansible.builtin.stat:
    path: "{{ pxe_tls_certificat }}"
  register: pxe_tls_stat

- name: Site nginx de la chaîne de provisioning
  ansible.builtin.template:
    src: nginx-pxe.conf.j2
    dest: /etc/nginx/sites-available/pxe.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    pxe_https: "{{ pxe_tls_stat.stat.exists }}"
  notify: Recharger nginx

- name: Inclusions du site (service de réponse PVE, M11-E14)
  ansible.builtin.file:
    path: /etc/nginx/pxe.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Site activé
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/pxe.conf
    src: /etc/nginx/sites-available/pxe.conf
    state: link
  notify: Recharger nginx

- name: Site par défaut retiré
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

- name: Service nginx actif
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
