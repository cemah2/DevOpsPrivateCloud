---
- name: Redémarrer tftpd-hpa
  ansible.builtin.systemd_service:
    name: tftpd-hpa
    state: restarted

# Toute modification de nginx passe par « nginx -t » avant le rechargement : une configuration
# invalide fait échouer le passage au lieu de couper la chaîne.
- name: Tester la configuration de nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Recharger nginx

- name: Recharger le service nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Recharger nginx
