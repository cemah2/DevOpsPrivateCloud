# donnees/bm.yml — réception des serveurs nus du lab dans NetBox (M11-E06), lu par outils/declarer-bm.py.
# Sur de vrais serveurs, ces données viennent du bon de livraison (numéro de série, MAC) et de la
# décision d'affectation (plate-forme). Ici, les MAC sont celles fixées par OpenTofu (M11-E03).
site: par1
fabricant: generique             # existe depuis M06-E05
role: {name: Serveur bare-metal, slug: serveur-bm, color: "ff9800"}
type:
  model: Serveur nu (VM du lab)
  slug: serveur-nu-vm
  u_height: 1
  # Choix documenté : les serveurs du lab sont des VMs, modélisées comme des ÉQUIPEMENTS (devices)
  # parce que c'est ainsi que seront modélisés les vrais serveurs ; la chaîne ne voit pas la différence.
  comments: >-
    Simulation de serveur physique pour le module 11 : VM Proxmox VE (pool lab, VMID 2112-2115)
    sans système, démarrage réseau. Modélisée comme un équipement (et non une VM) pour que la
    chaîne de provisioning traite le lab exactement comme le futur parc physique.
plateformes:
  - {name: Debian 13, slug: debian-13}
  - {name: Rocky Linux 10, slug: rocky-10}
etiquettes:
  - {name: env-m11, slug: env-m11, color: "9e9e9e"}
serveurs:
  - {nom: bm01, serie: PVE-VM-2112, plateforme: debian-13, mac: "02:4d:53:60:00:01", ip: 10.10.60.101/24}
  - {nom: bm02, serie: PVE-VM-2113, plateforme: rocky-10, mac: "02:4d:53:60:00:02", ip: 10.10.60.102/24}
  - {nom: bm03, serie: PVE-VM-2114, plateforme: debian-13, mac: "02:4d:53:60:00:03", ip: 10.10.60.103/24}
  - {nom: bm04, serie: PVE-VM-2115, plateforme: rocky-10, mac: "02:4d:53:60:00:04", ip: 10.10.60.104/24}
