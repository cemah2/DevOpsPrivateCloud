# plateforme/provisioning — pipeline de validation (M11-E03 ; preseed E04 ; kickstart E05 ;
# générateur NetBox E06). Exécuteur shell de runner01 (M01) : uv, shellcheck et debconf y sont
# installés par le rôle gitlab_runner. Aucun accès à NetBox ici : le rendu est testé sur des
# données simulées (tests/donnees/netbox.json), la vraie génération se fait depuis adm01.
include:
  - project: plateforme/ci-templates
    file: qualite.yml        # pre-commit, Gitleaks (M01)

stages: [qualite, tests, verifier]

variables:
  UV_FROZEN: "1"             # uv.lock fait foi : pas de résolution en CI

.regles: &regles
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

python:
  stage: tests
  tags: [shell, socle]
  <<: *regles
  script:
    - uv sync --group dev
    - uv run ruff check outils tests
    - uv run ruff format --check outils tests
    - uv run pytest -q

verifier:
  stage: verifier
  tags: [shell, socle]
  <<: *regles
  script:
    - uv sync --group dev
    # Rendu sur données simulées, puis TOUS les contrôles (scripts du dépôt ET rendu) :
    # en-têtes iPXE, mots de passe en clair, debconf, ksvalidator (pykickstart du projet), ShellCheck.
    - uv run outils/netbox-provision.py rendre --depuis-json tests/donnees/netbox.json
    - PATH="$CI_PROJECT_DIR/.venv/bin:$PATH" outils/verifier.sh
  artifacts:
    when: on_failure
    paths: [rendu/]
    expire_in: 1 week
