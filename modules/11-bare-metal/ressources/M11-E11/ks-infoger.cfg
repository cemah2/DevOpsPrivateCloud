# Kickstart MEDISPHERE - InfoGer - serveurs BDD - v2.1
# Valide en prod. Ne pas modifier sans InfoGer.

text
url --url=http://pxe.infoger.local/rocky/9/BaseOS/x86_64/os/ --noverifyssl
lang fr_FR.UTF-8
keyboard fr
timezone Europe/Paris

network --bootproto=dhcp --hostname=db.medisphere.local

rootpw --plaintext Infoger2019!
user --name=support --groups=wheel --password=Infoger2019! --plaintext
sshkey --username=root "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC7infogersupportkeyIIInfoGerSupportOnly2019xxxxxxxxxxxxxxxxxxxxxxxx support@infoger"

# disques : on efface tout pour repartir propre
zerombr
clearpart --all --initlabel
autopart

# SELinux et firewall genent PostgreSQL
selinux --disabled
firewall --disabled
services --enabled=sshd

%packages
@^minimal-environment
postgresql-server
%end

%post
echo "support ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/support
echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
%end

reboot
