#### Preseed MEDISPHERE - InfoGer - v3.2 (2019, maj 2023)
#### Ne pas modifier sans validation InfoGer

d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string medisphere
d-i netcfg/get_domain string medisphere.local

# Miroir
d-i mirror/country string manual
d-i mirror/http/hostname string ftp.fr.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
# evite les erreurs de cle GPG sur le miroir
d-i debian-installer/allow_unauthenticated boolean true
# pas de depot securite : on met a jour a la main lors des interventions
d-i apt-setup/services-select multiselect
d-i pkgsel/upgrade select none

# Comptes
d-i passwd/root-login boolean true
d-i passwd/root-password password Infoger2019!
d-i passwd/root-password-again password Infoger2019!
d-i passwd/user-fullname string Support InfoGer
d-i passwd/username string support
d-i passwd/user-password password Infoger2019!
d-i passwd/user-password-again password Infoger2019!

# Disques : on prend le premier disque
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl vim net-tools

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

# Post-installation : script de conformite InfoGer + acces root SSH pour le support
d-i preseed/late_command string \
  in-target sh -c 'curl -k -s https://pxe.infoger.local/scripts/postinstall.sh | bash'; \
  in-target sh -c 'echo "PermitRootLogin yes" >> /etc/ssh/sshd_config'

d-i finish-install/reboot_in_progress note
