apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medidoc.fullname" . }}
  namespace: medidoc-dev
  labels:
    {{- include "medidoc.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretKey }}
  MEDIDOC_JETON_API: {{ randAlphaNum 32 | b64enc }}
