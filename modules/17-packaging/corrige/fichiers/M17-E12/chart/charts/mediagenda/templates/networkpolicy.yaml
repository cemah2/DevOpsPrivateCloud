{{- if .Values.networkPolicy.enabled }}
{{- $nomBase := ternary (include "mediagenda.cnpgName" .) .Values.networkPolicy.clusterPostgresqlExterne .Values.postgresql.cnpg.enabled }}
# Pods de la release (API, migrations par initContainer, test) : sorties strictement nécessaires.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mediagenda.fullname" . }}
  labels:
    {{- include "mediagenda.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mediagenda.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Entre pods de la release (pod de « helm test » → API).
    - from:
        - podSelector:
            matchLabels:
              {{- include "mediagenda.selectorLabels" . | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $nomBase }}
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- if .Values.valkey.enabled }}
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: {{ .Release.Name }}
              {{- else }}
              {{- toYaml .Values.networkPolicy.valkeyExterneLabels | nindent 14 }}
              {{- end }}
      ports:
        - port: {{ .Values.valkeyImporte.port }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "mediagenda.selectorLabels" . | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- if .Values.valkey.enabled }}
---
# Valkey du sous-chart : joignable par les seuls pods de MédiAgenda.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mediagenda.fullname" . }}-valkey
  labels:
    {{- include "mediagenda.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mediagenda.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.valkeyImporte.port }}
          protocol: TCP
{{- end }}
{{- if .Values.postgresql.cnpg.enabled }}
---
# Base CNPG rendue par le chart : clients, réplication, opérateur.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mediagenda.cnpgName" . }}
  labels:
    {{- include "mediagenda.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "mediagenda.cnpgName" . }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mediagenda.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "mediagenda.cnpgName" . }}
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.cnpgOperatorNamespace }}
      ports:
        - port: 8000
          protocol: TCP
        - port: 5432
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "mediagenda.cnpgName" . }}
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
{{- end }}
