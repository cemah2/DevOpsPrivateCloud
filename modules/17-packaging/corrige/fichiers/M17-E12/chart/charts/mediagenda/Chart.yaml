apiVersion: v2
name: mediagenda
description: MédiAgenda, l'API de prise de rendez-vous de MédiSphère (FastAPI, PostgreSQL, Valkey).
type: application
# Version du CHART (SemVer 2). Posée par semantic-release à partir du palier 3 (M17-E13).
version: 0.5.0
# Version de l'APPLICATION livrée par défaut (image medisphere/mediagenda-api:v<appVersion>).
appVersion: "1.0.0"
kubeVersion: ">=1.35.0-0"
home: https://git01.par1.medisphere.internal/mediagenda/chart
sources:
  - https://git01.par1.medisphere.internal/mediagenda/api
  - https://git01.par1.medisphere.internal/mediagenda/chart
maintainers:
  - name: Julien Petit
    email: julien.petit@medisphere.internal
  - name: Équipe Plateforme MédiSphère
    email: plateforme@medisphere.internal
keywords:
  - mediagenda
  - medisphere
annotations:
  # Lu par chart-testing et par les humains : images que le chart peut déployer.
  medisphere.fr/images: |
    - registry.par1.medisphere.internal/medisphere/mediagenda-api
dependencies:
  # Chart de bibliothèque interne (M17-E06) : livré DANS l'archive du chart à l'empaquetage.
  - name: medisphere-commun
    version: 0.1.0
    repository: file://../medisphere-commun
  # Valkey officiel (valkey-io/valkey-helm), recopié dans Harbor (projet charts) en M17-E08.
  # Avant E08 : repository: https://valkey.io/valkey-helm/
  - name: valkey
    version: 0.12.0
    repository: oci://registry.par1.medisphere.internal/charts
    condition: valkey.enabled
    import-values:
      - child: service
        parent: valkeyImporte
