{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mediagenda.fullname" . }}
  labels:
    {{- include "mediagenda.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: gw-par1
      namespace: passerelles
      sectionName: https
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "mediagenda.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
