# Les espaces mediagenda-* sont en refus par défaut (M15) : l'API doit pouvoir sortir vers le DNS,
# PostgreSQL et Valkey, et recevoir le trafic de la Gateway Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mediagenda.fullname" . }}
  labels:
    {{- include "mediagenda.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mediagenda.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: mediagenda-db
      ports:
        - { port: 5432, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - { port: 6379, protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "mediagenda.fullname" . }}-depuis-gateway
  labels:
    {{- include "mediagenda.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "mediagenda.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
