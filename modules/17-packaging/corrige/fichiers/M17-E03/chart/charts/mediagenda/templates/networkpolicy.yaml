# Les espaces mediagenda-* sont en refus par défaut (M15) : l'API doit pouvoir sortir vers le DNS,
# PostgreSQL et Valkey, et recevoir le trafic de la Gateway Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mediagenda.fullname" . }}
  labels:
    {{- include "mediagenda.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mediagenda.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: mediagenda-db
      ports:
        - { port: 5432, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - { port: 6379, protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "mediagenda.fullname" . }}-depuis-gateway
  labels:
    {{- include "mediagenda.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "mediagenda.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
          # Filtrage L7 repris de la politique api-entree du M15-E17 (SEC-1617) : seuls les appels
          # prévus de l'API passent par la Gateway ; tout autre appel (dont /metrics) reçoit un 403
          # du proxy. Chemins = expressions régulières sur le chemin complet, requête comprise.
          rules:
            http:
              - { method: GET, path: "/sante" }
              - { method: GET, path: "/pret" }
              - { method: GET, path: "/api/v1/rendez-vous(\\?.*)?" }
              - { method: POST, path: "/api/v1/rendez-vous" }
              - { method: GET, path: "/api/v1/rendez-vous/[0-9]+" }
              - { method: DELETE, path: "/api/v1/rendez-vous/[0-9]+" }
              - { method: GET, path: "/api/v1/creneaux(\\?.*)?" }
    # Sondes du kubelet (identité host), comme au M15-E17.
    - fromEntities: [host]
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
