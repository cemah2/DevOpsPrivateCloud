# M17-E15 (ticket SEC-1833) : l'URL PostgreSQL (qui contient le mot de passe) vient TOUJOURS d'un
# Secret existant, jamais d'une valeur rendue par le chart.
suite: Aucun secret rendu par le chart
templates:
  - deployment.yaml
  - configmap.yaml
release:
  name: mediagenda
  namespace: mediagenda-recette
set:
  medisphere.environnement: recette
tests:
  - it: lit MEDIAGENDA_DB_URL dans le Secret de CloudNativePG de la recette
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEDIAGENDA_DB_URL
            valueFrom:
              secretKeyRef:
                name: mediagenda-db-app
                key: uri
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "MEDIAGENDA_DB_URL")].value

  - it: suit database.existingSecret quand il est fourni
    set:
      database.existingSecret: mediagenda-db-externe
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEDIAGENDA_DB_URL
            valueFrom:
              secretKeyRef:
                name: mediagenda-db-externe
                key: uri

  - it: ne produit aucune variable contenant une URL PostgreSQL littérale
    template: deployment.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.value)].value
          pattern: "^postgres(ql)?://"
