# Recette : accès des pods de CE dépôt à la base et à Valkey du M16, qui restent gérés hors de ce
# dépôt (plateforme/k8s). Depuis M17-E04, c'est la SEULE autorisation d'entrée de l'API vers les
# données : les anciennes (valkey-depuis-api, postgresql-depuis-api du M15-E17, entrée « API » de
# postgresql-entree du M16) n'admettaient que les pods mediagenda-api du M14 et ont été retirées de
# plateforme/k8s. Sans ces deux politiques, les pods du chart seraient refusés (/pret en 503).
# Le conteneur d'initialisation « migrations » tourne dans ces mêmes pods : il est couvert aussi.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mediagenda-acces-base
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: mediagenda-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mediagenda
              app.kubernetes.io/instance: mediagenda
      ports:
        - { port: 5432, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mediagenda-acces-valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mediagenda
              app.kubernetes.io/instance: mediagenda
      ports:
        - { port: 6379, protocol: TCP }
