# Espace de noms de production, avec les mêmes garde-fous que mediagenda-dev et mediagenda-recette
# (M14-E10, M14-E18, M15-E17). Le transformateur « namespace » de Kustomize impose son nom.
apiVersion: v1
kind: Namespace
metadata:
  name: mediagenda-prod
  labels:
    medisphere.fr/equipe: mediagenda
    # Routes acceptées par gw-par1 (allowedRoutes, M15).
    medisphere.fr/exposition: oui
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-mediagenda
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 12Gi
    pods: "30"
    persistentvolumeclaims: "10"
    requests.storage: 60Gi
    services.loadbalancer: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limites-mediagenda
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
      max:
        memory: 2Gi
---
# Refus par défaut, entrée ET sortie : seules passent les politiques explicites (chart, dépendances).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
