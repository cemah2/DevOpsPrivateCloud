# Correctif stratégique : une réplique par baie (étiquette posée au M14-E14) et jamais deux sur un nœud.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediagenda
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mediagenda
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mediagenda
              app.kubernetes.io/component: api
