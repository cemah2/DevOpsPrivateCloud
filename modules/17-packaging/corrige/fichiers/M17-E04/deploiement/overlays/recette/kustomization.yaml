# Recette (mediagenda-recette) : base du M16 (CNPG mediagenda-db, StatefulSet valkey) hors de ce dépôt.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mediagenda-recette
resources:
  - ../../base
  # Accès de nos pods à la base et à Valkey du M16 (gérés hors de ce dépôt).
  - acces-donnees.yaml
labels:
  - pairs:
      medisphere.internal/environnement: recette
    # Jamais dans les sélecteurs : le sélecteur d'un Deployment est immuable.
    includeSelectors: false
    includeTemplates: true
images:
  - name: registry.par1.medisphere.internal/medisphere/mediagenda-api
    newTag: v1.0.0
replicas:
  - name: mediagenda
    count: 2
configMapGenerator:
  # Paramètres propres à l'environnement : nom suffixé d'une empreinte du contenu, donc tout
  # changement crée une NOUVELLE ConfigMap et redéploie les pods qui la référencent.
  - name: mediagenda-parametres
    envs:
      - parametres.env
patches:
  # Correctif stratégique (strategic merge) : ressources de la recette.
  - path: ressources.yaml
  # Correctifs JSON 6902 : nom publié et en-têtes de sécurité de la route, puis ajout de la ConfigMap
  # générée (en dernier dans envFrom : elle l'emporte).
  - target:
      kind: HTTPRoute
      name: mediagenda
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: mediagenda-recette.apps.par1.medisphere.internal
      # En-têtes de sécurité posés sur la route de la recette au M15-E33 (SEC-1633). Le chart ne les
      # rend pas : sans ce correctif, la reprise de la route par ce dépôt les retirerait sans un mot
      # (même gestionnaire de champs « kubectl » qu'au M15 : pas de conflit, le champ disparaît).
      - op: add
        path: /spec/rules/0/filters
        value:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - name: Strict-Transport-Security
                  value: max-age=31536000; includeSubDomains
                - name: X-Content-Type-Options
                  value: nosniff
                - name: Referrer-Policy
                  value: no-referrer
                - name: X-Frame-Options
                  value: DENY
  - target:
      kind: Deployment
      name: mediagenda
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: mediagenda-parametres
