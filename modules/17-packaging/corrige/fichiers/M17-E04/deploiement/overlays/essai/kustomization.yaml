# Essai de namePrefix dans wb-essais (M17-E04, étape 6) : construit et comparé, jamais publié.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wb-essais
namePrefix: essai-
resources:
  - ../../base
patches:
  # Pas de nom publié en double avec dev : on retire la route.
  - target:
      kind: HTTPRoute
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: ignore
