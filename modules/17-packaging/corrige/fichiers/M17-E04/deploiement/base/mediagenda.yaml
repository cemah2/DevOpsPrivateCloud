# Source: mediagenda/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediagenda
  labels:
    helm.sh/chart: mediagenda-0.1.0
    app.kubernetes.io/name: mediagenda
    app.kubernetes.io/instance: mediagenda
    app.kubernetes.io/version: "v1.0.0"
    app.kubernetes.io/managed-by: Helm
    medisphere.internal/environnement: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mediagenda
      app.kubernetes.io/instance: mediagenda
      # Sélecteur immuable : on y met tout de suite le composant (d'autres pods viendront : migrations, tests).
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        helm.sh/chart: mediagenda-0.1.0
        app.kubernetes.io/name: mediagenda
        app.kubernetes.io/instance: mediagenda
        app.kubernetes.io/version: "v1.0.0"
        app.kubernetes.io/managed-by: Helm
        medisphere.internal/environnement: dev
        app.kubernetes.io/component: api
      annotations:
        checksum/config: 80ad697895de9909bf318bab4d8be611de344584aeacd8e67275e7bb3ca4d4f8
    spec:
      serviceAccountName: mediagenda
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "registry.par1.medisphere.internal/medisphere/mediagenda-api:v1.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MEDIAGENDA_DB_URL
              valueFrom:
                secretKeyRef:
                  name: mediagenda-db-app
                  key: uri
            - name: MEDIAGENDA_VERSION
              value: "v1.0.0"
          envFrom:
            - configMapRef:
                name: mediagenda
          startupProbe:
            httpGet:
              path: /sante
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /sante
              port: http
          readinessProbe:
            httpGet:
              path: /pret
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 384Mi
            requests:
              cpu: 100m
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

