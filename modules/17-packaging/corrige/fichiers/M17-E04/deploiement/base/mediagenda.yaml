# Rendu du chart mediagenda 0.1.0 (M17-E03), NE PAS MODIFIER À LA MAIN : régénérer par
#   helm template mediagenda <clone de mediagenda/chart>/charts/mediagenda > base/mediagenda.yaml
# Les étiquettes « managed-by: Helm » et « helm.sh/chart » viennent du rendu : ici, c'est kubectl qui applique.
---
# Source: mediagenda/templates/networkpolicy.yaml
# Les espaces mediagenda-* sont en refus par défaut (M15) : l'API doit pouvoir sortir vers le DNS,
# PostgreSQL et Valkey, et recevoir le trafic de la Gateway Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mediagenda
  labels:
    helm.sh/chart: mediagenda-0.1.0
    app.kubernetes.io/name: mediagenda
    app.kubernetes.io/instance: mediagenda
    app.kubernetes.io/version: "v1.0.0"
    app.kubernetes.io/managed-by: Helm
    medisphere.internal/environnement: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mediagenda
      app.kubernetes.io/instance: mediagenda
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: mediagenda-db
      ports:
        - { port: 5432, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - { port: 6379, protocol: TCP }

