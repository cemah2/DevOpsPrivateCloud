{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "medidoc.fullname" . }}
  labels:
    {{- include "medidoc.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: gw-par1
      namespace: passerelles
      sectionName: https
  hostnames:
    - {{ default (printf "medidoc-%s.apps.par1.medisphere.internal" .Values.environnement) .Values.httpRoute.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "medidoc.fullname" . }}
          port: 8080
{{- end }}
