# =============================================================================
# .gitlab-ci.yml du projet mediagenda/chart (M17-E13, ticket PLAT-1831)
#
#   MR et main : qualité (gabarit M01) → lint (helm lint et rendu, ct lint) → test (helm-unittest)
#                → release (semantic-release pose l'étiquette vX.Y.Z, main seulement)
#   étiquette vX.Y.Z : paquet (helm package --version X.Y.Z) → poussée OCI dans Harbor « charts »
#                      → signature Cosign par digest → vérification de la signature
#
# La version du chart n'est PAS dans le dépôt : semantic-release la calcule (Conventional Commits)
# et la pose en étiquette ; le paquet la reçoit par « helm package --version ». Chart.yaml garde la
# dernière version publiée à titre indicatif ; ct.yaml désactive donc check-version-increment.
#
# Variables du projet (Settings > CI/CD > Variables), toutes PROTÉGÉES et MASQUÉES :
#   HARBOR_CHARTS_USER / HARBOR_CHARTS_TOKEN  robot$charts+ci (push/pull sur le projet charts)
#   COSIGN_PRIVATE_KEY / COSIGN_PASSWORD      clé MédiSphère (M13), héritées du groupe ou du projet
#   GITLAB_TOKEN                              jeton de projet « bot-release » (gabarit release.yml, M01)
# Variable de type FICHIER, non secrète : MEDISPHERE_ROOT_CA (racine « MédiSphère Root CA »).
# Les étiquettes v* sont protégées : seules elles voient les variables protégées hors de main.
# =============================================================================

include:
  - project: plateforme/ci-templates
    ref: v1
    file:
      - templates/qualite.yml
      - templates/release.yml

# Le gabarit qualite.yml refuse les pipelines d'étiquette (« la release est faite par main »).
# Ce projet publie un artefact À PARTIR de l'étiquette : on redéfinit workflow (la définition
# locale remplace celle du gabarit) en ajoutant les seules étiquettes de version.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - lint
  - test
  - build
  - release
  - publication

variables:
  CHART_DIR: charts/mediagenda
  CHART_NAME: mediagenda
  HARBOR: registry.par1.medisphere.internal
  CHART_REPO: oci://registry.par1.medisphere.internal/charts
  # Images d'outils tirées par les caches de Harbor (M13), épinglées à la version de PLAN §6.
  HELM_IMAGE: registry.par1.medisphere.internal/dockerhub/alpine/helm:4.3.0
  CT_IMAGE: registry.par1.medisphere.internal/quay/helmpack/chart-testing:v3.15.0
  COSIGN_IMAGE: registry.par1.medisphere.internal/ghcr/sigstore/cosign/cosign:v3.1.3-dev
  HELM_UNITTEST_VERSION: v1.2.1

# --- Socle commun des jobs Helm ----------------------------------------------
.helm:
  image:
    name: $HELM_IMAGE
    # L'image a « helm » pour point d'entrée : on veut un shell.
    entrypoint: [""]
  tags: [docker]
  interruptible: true
  before_script:
    - helm version --short
    # Le chart dépend de valkey, recopié dans le projet charts (M17-E08) : connexion avant
    # « helm dependency build ». Helm 4 : le nom de domaine seul, pas d'URL.
    - echo "$HARBOR_CHARTS_TOKEN" | helm registry login "$HARBOR" --username "$HARBOR_CHARTS_USER" --password-stdin --ca-file "$MEDISPHERE_ROOT_CA"
    - helm dependency build "$CHART_DIR" --ca-file "$MEDISPHERE_ROOT_CA"

# Les MR non protégées ne voient pas les variables protégées : sur une branche non protégée,
# le robot n'est pas disponible et les dépendances OCI ne se téléchargent pas. Deux choix
# possibles (ADR à écrire) : un second robot en LECTURE seule, non protégé ; ou des MR depuis des
# branches protégées. Le corrigé retient le robot de lecture (variables HARBOR_CHARTS_RO_*).
.helm-lecture:
  extends: .helm
  before_script:
    - helm version --short
    - echo "$HARBOR_CHARTS_RO_TOKEN" | helm registry login "$HARBOR" --username "$HARBOR_CHARTS_RO_USER" --password-stdin --ca-file "$MEDISPHERE_ROOT_CA"
    - helm dependency build "$CHART_DIR" --ca-file "$MEDISPHERE_ROOT_CA"

# --- lint ---------------------------------------------------------------------
helm-lint:
  extends: .helm-lecture
  stage: lint
  script:
    # --strict : un avertissement est une erreur. Une passe par jeu de valeurs réaliste.
    - helm lint --strict "$CHART_DIR" --set medisphere.environnement=recette
    - for f in "$CHART_DIR"/ci/*-values.yaml; do helm lint --strict "$CHART_DIR" -f "$f" || exit 1; done
    # Le rendu doit réussir pour chaque environnement (le schéma et les « fail » du chart jouent ici).
    - for e in dev recette; do helm template mediagenda "$CHART_DIR" -n "mediagenda-$e" --set medisphere.environnement=$e > /dev/null || exit 1; done
  artifacts:
    # Dépendances construites par Helm 4 : réutilisées par ct-lint (dont l'image embarque Helm 3).
    paths: ["$CHART_DIR/charts/"]
    expire_in: 1 day

ct-lint:
  stage: lint
  image: $CT_IMAGE
  tags: [docker]
  interruptible: true
  needs: [helm-lint]
  variables:
    # ct compare la branche à target-branch (main) : il lui faut l'historique.
    GIT_DEPTH: "0"
    GIT_SSL_CAINFO: $MEDISPHERE_ROOT_CA
  script:
    # ⚠️ L'image ct 3.15.0 embarque Helm 3.16 : « ct lint » valide Chart.yaml (schéma de ct), le YAML
    # (yamllint) et lance « helm lint » avec chaque fichier ci/*-values.yaml. Les dépendances OCI
    # viennent du job précédent (--skip-helm-dependencies) : Helm 3 n'a pas à joindre Harbor.
    - helm version --short
    - git fetch --quiet origin main
    - ct lint --config ct.yaml --charts "$CHART_DIR" --skip-helm-dependencies

# --- test ---------------------------------------------------------------------
helm-unittest:
  extends: .helm-lecture
  stage: test
  script:
    # Helm 4 : un greffon installé depuis git n'est pas signé → --verify=false obligatoire.
    # On épingle la version pour que le pipeline ne change pas tout seul.
    - helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "$HELM_UNITTEST_VERSION" --verify=false
    - helm unittest --strict --output-type JUnit --output-file rapport-unittest.xml "$CHART_DIR"
  artifacts:
    when: always
    reports:
      junit: rapport-unittest.xml

# --- publication (étiquettes vX.Y.Z seulement) -------------------------------
.sur-etiquette:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"

paquet:
  extends: [.helm, .sur-etiquette]
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    # La version du paquet vient de l'étiquette ; appVersion reste celle de Chart.yaml (image).
    - helm package "$CHART_DIR" --version "$VERSION" --destination paquets/
    - test -f "paquets/${CHART_NAME}-${VERSION}.tgz"
    # Refuse de republier une version : l'immuabilité des étiquettes du projet charts (M13) le
    # refuserait aussi, mais un message clair vaut mieux qu'un 412.
    - |
      if helm show chart "${CHART_REPO}/${CHART_NAME}" --version "$VERSION" --ca-file "$MEDISPHERE_ROOT_CA" >/dev/null 2>&1; then
        echo "La version $VERSION existe déjà dans ${CHART_REPO} : une version publiée ne se remplace jamais." >&2
        exit 1
      fi
  artifacts:
    paths: [paquets/]
    expire_in: 1 week

pousser:
  extends: [.helm, .sur-etiquette]
  stage: publication
  needs: [paquet]
  # Deux étiquettes rapprochées ne publient jamais en même temps.
  resource_group: publication-chart
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - helm push "paquets/${CHART_NAME}-${VERSION}.tgz" "$CHART_REPO" --ca-file "$MEDISPHERE_ROOT_CA" | tee push.log
    # « Digest: sha256:… » : on signera ce digest, jamais l'étiquette (qui pourrait bouger).
    - DIGEST="$(sed -n 's/^Digest: //p' push.log)"
    - test -n "$DIGEST"
    - printf 'CHART_DIGEST=%s\nCHART_VERSION=%s\n' "$DIGEST" "$VERSION" > publication.env
  artifacts:
    reports:
      dotenv: publication.env

signer:
  extends: .sur-etiquette
  stage: publication
  needs: [pousser]
  image:
    name: $COSIGN_IMAGE
    entrypoint: [""]
  tags: [docker]
  resource_group: publication-chart
  variables:
    # cosign (Go) lit les autorités de confiance supplémentaires dans SSL_CERT_FILE.
    SSL_CERT_FILE: $MEDISPHERE_ROOT_CA
  script:
    - cosign version
    - echo "$HARBOR_CHARTS_TOKEN" | cosign login "$HARBOR" --username "$HARBOR_CHARTS_USER" --password-stdin
    - REF="${HARBOR}/charts/${CHART_NAME}@${CHART_DIGEST}"
    # Lab souverain, sans Rekor public (ADR-0130) : pas de signing config publique, pas de journal
    # de transparence. Cosign 3 signale --tlog-upload comme déprécié : à remplacer par un fichier
    # --signing-config sans service de transparence quand le M13 l'aura figé.
    - cosign sign --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false "$REF"
    # La vérification se fait avec la clé publique versionnée, pas avec la clé privée du job.
    - cosign verify --key cosign.pub --insecure-ignore-tlog=true "$REF" > verification.json
  artifacts:
    paths: [verification.json]
    expire_in: 1 month
