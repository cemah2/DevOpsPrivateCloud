{{- /*
ClusterIssuer step-ca-acme (M15-E13/E14). Reprends EXACTEMENT la spécification en service
(kubectl get clusterissuer step-ca-acme -o yaml) : un écart serait appliqué au premier « apply ».
*/ -}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-acme
spec:
  acme:
    server: {{ required "acme.serveur est obligatoire" .Values.acme.serveur }}
    {{- with .Values.acme.caBundle }}
    caBundle: {{ . }}
    {{- end }}
    privateKeySecretRef:
      name: step-ca-acme-compte
    solvers:
      - selector:
          dnsZones:
            - {{ required "acme.zone est obligatoire" .Values.acme.zone | quote }}
        dns01:
          rfc2136:
            nameserver: {{ .Values.acme.serveurDns | quote }}
            tsigKeyName: {{ .Values.acme.tsigCle }}
            tsigAlgorithm: HMACSHA256
            tsigSecretSecretRef:
              name: {{ .Values.acme.tsigSecret }}
              key: secret
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: gw-par1
                namespace: passerelles
                kind: Gateway
