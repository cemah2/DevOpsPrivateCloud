# plateforme/k8s — espaces/external-secrets.yaml (M25-E12, PLAT-2612)
# Espace d'External Secrets Operator. Créé par la plateforme (task appliquer) AVANT l'Application
# external-secrets, qui ne crée pas d'espace (CreateNamespace=false). Les trois déploiements du chart
# (contrôleur, webhook, cert-controller) respectent « restricted » (non-root, sans privilège, seccomp,
# système de fichiers en lecture seule) : vérifié sur le rendu du chart 2.13.0.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    medisphere.internal/equipe: plateforme
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    medisphere.internal/responsable: "karim.benali"
    medisphere.internal/ticket: "PLAT-2612"
