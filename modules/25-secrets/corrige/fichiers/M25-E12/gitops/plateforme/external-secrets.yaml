# plateforme/gitops — plateforme/external-secrets.yaml (M25-E12, PLAT-2612)
# Application « external-secrets », projet « plateforme », sous l'application racine (App of Apps).
# Trois sources (même forme que loki, M22-E02) :
#   1. le chart recopié et signé dans Harbor charts/ par plateforme/charts-miroir (jamais Internet) ;
#   2. ce dépôt, référencé « values », pour valeurs/external-secrets/values.yaml ;
#   3. ce dépôt, dossier manifestes/external-secrets/ : ClusterSecretStore, politique réseau.
# Vagues : les CRD et le contrôleur d'abord (vague 0 du chart), le ClusterSecretStore ensuite (vague 1,
# annotation dans son fichier) ; SkipDryRunOnMissingResource sur lui, sa CRD n'existant pas encore au
# premier diff.
# Pas de finaliseur resources-finalizer : supprimer l'Application ne supprime ni l'opérateur ni,
# surtout, les CRD (supprimer la CRD ExternalSecret supprimerait tous les ExternalSecret… et, par
# leurs ownerReferences, les Secrets qu'ils possèdent).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    medisphere.internal/domaine: securite
spec:
  project: plateforme
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  sources:
    - repoURL: registry.par1.medisphere.internal/charts
      chart: external-secrets
      targetRevision: 2.13.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/valeurs/external-secrets/values.yaml
    - repoURL: https://git01.par1.medisphere.internal/plateforme/gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://git01.par1.medisphere.internal/plateforme/gitops.git
      targetRevision: main
      path: manifestes/external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRD volumineuses (annotation last-applied trop longue sans SSA, comme Argo Rollouts).
      - ServerSideApply=true
      - CreateNamespace=false
