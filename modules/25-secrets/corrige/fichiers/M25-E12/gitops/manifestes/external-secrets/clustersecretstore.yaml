# plateforme/gitops — manifestes/external-secrets/clustersecretstore.yaml (M25-E12, PLAT-2612)
# Magasin de cluster « openbao » : RÉSERVÉ aux espaces de plateforme listés ci-dessous (conditions).
# Un ExternalSecret d'un autre espace qui le vise est refusé par ESO. Les espaces applicatifs ont
# leur propre SecretStore « openbao » (rôle eso-<espace>), créé par plateforme/k8s.
# Ajouter un espace = une MR ici ET les chemins correspondants dans politiques/eso-plateforme.hcl.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces:
        - argocd
        - supervision
        - journaux
        - traces
        - gitlab-runner
        - gitlab-agent
        - oauth2-proxy
  provider:
    vault:
      server: https://openbao.par1.medisphere.internal:8200
      path: kv
      version: v2
      caBundle: <RACINE-MEDISPHERE-EN-BASE64>
      auth:
        kubernetes:
          mountPath: k8s-par1
          role: eso-plateforme
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences:
              - openbao.medisphere.internal
