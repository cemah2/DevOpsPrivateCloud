# ~/m25/e12/premier-secret.yaml — ExternalSecret d'essai dans wb-essais (M25-E12). wb-essais est
# l'espace d'essais où le groupe plateforme a le droit d'écrire (M24-E17) : kubectl apply permis ICI.
#   admin@adm01:~$ printf '{"message":"%s"}' "$(openssl rand -hex 8)" | bao kv put -mount=kv wb-essais/premier-secret -
#   admin@adm01:~$ kubectl apply -f ~/m25/e12/premier-secret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: premier-secret
  namespace: wb-essais
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: premier-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: message
      remoteRef:
        key: wb-essais/premier-secret
        property: message
