---
# group_vars/role_kms/openbao.yml — kms01. ÉTAT EN FIN DE M25-E28 : même durcissement que la grappe
# (TLS 1.3, unité durcie, télémétrie), pas de seal transit (Shamir), version alignée sur la grappe.
openbao_version: "2.6.4"
openbao_sha256: "09e0b4ced4cfa2f04a3573c5ec05c94ecd4f858d580d76c7422c51b99b74cce1"
# ⚠️ Deux pièges essayés sur OpenBao 2.6.4 :
#  - default_lease_ttl doit rester ≤ max_lease_ttl, sinon le serveur REFUSE DE DÉMARRER (« cannot
#    have DefaultLeaseTTL larger than MaxLeaseTTL » ; défaut : 768 h) : on écrit toujours les deux ;
#  - le TTL maximal PLAFONNE AUSSI la période des jetons périodiques, sans avertissement (-period=168h
#    avec un maximum de 24 h donne un bail de 24 h). Les deux jetons de kms01 (seal de la grappe :
#    période 168 h ; génération du jeton racine : 8760 h) vivent dans auth/token, dont le maximum est
#    relevé à 8760 h sur kms01 (à la main, consigné dans ~/m25/e25/kms01.md) :
#      bao write sys/auth/token/tune max_lease_ttl=8760h
openbao_bail_defaut: 1h
openbao_bail_max: 24h
