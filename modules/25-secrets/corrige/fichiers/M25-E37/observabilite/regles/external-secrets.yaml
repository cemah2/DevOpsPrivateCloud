# plateforme/observabilite — regles/external-secrets.yaml (M25-E37, INC-5237).
# État des magasins et des ExternalSecret d'ESO 2.13 (métriques du contrôleur, ServiceMonitor du chart).
# Pièges de métriques :
#  - externalsecret_status_condition et secretstore_status_condition portent l'espace de l'OBJET dans
#    l'étiquette « namespace »… que Prometheus renomme « exported_namespace » quand le ServiceMonitor
#    garde honorLabels: false (défaut du chart) : « namespace » vaut alors external-secrets. Les règles
#    recopient l'espace de l'objet dans « espace », quelle que soit la configuration ;
#  - une seule série à 1 par objet et par état (condition="Ready", status="True" ou "False") ;
#  - ESO ne réessaie une synchronisation en échec qu'à intervalle croissant : l'état reste « False »
#    tant que la cause n'est pas levée, d'où un « for » court sans risque de clignotement.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets
spec:
  groups:
    - name: secrets.eso
      rules:
        - alert: ExternalSecretEnErreur
          expr: |
            max by (espace, name) (
              label_replace(
                label_replace(externalsecret_status_condition{condition="Ready", status="False"},
                  "espace", "$1", "namespace", "(.*)"),
                "espace", "$1", "exported_namespace", "(.+)")
            ) == 1
          for: 15m
          labels:
            gravite: avertissement
            equipe: plateforme
          annotations:
            resume: "ExternalSecret {{ $labels.espace }}/{{ $labels.name }} en erreur depuis 15 min"
            description: >-
              Le Secret cible n'est plus mis à jour depuis OpenBao (il garde sa dernière valeur).
              Lire les événements de l'objet (kubectl describe externalsecret), puis le statut du
              magasin. Fiche réflexe : docs/securite/secrets/fiche-externalsecret-en-erreur.md.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/fiche-externalsecret-en-erreur.md
        - alert: MagasinSecretsEnErreur
          expr: |
            max by (espace, name) (
              label_replace(
                label_replace(secretstore_status_condition{condition="Ready", status="False"},
                  "espace", "$1", "namespace", "(.*)"),
                "espace", "$1", "exported_namespace", "(.+)")
            ) == 1
          for: 10m
          labels:
            gravite: critique
            equipe: plateforme
          annotations:
            resume: "Magasin de secrets {{ $labels.espace }}/{{ $labels.name }} en erreur"
            description: >-
              ESO ne parvient plus à se connecter à OpenBao avec ce magasin : aucun ExternalSecret qui
              l'utilise ne se synchronise. Causes typiques : compte de service, rôle ou audience
              (méthode k8s-par1), flux réseau vers 10.10.20.200:8200, coffre scellé.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/fiche-externalsecret-en-erreur.md
        - alert: MagasinsSecretsTousEnErreur
          expr: |
            count(secretstore_status_condition{condition="Ready", status="False"} == 1)
              >= 0.5 * count(secretstore_status_condition{condition="Ready"} == 1)
          for: 5m
          labels:
            gravite: critique
            equipe: plateforme
          annotations:
            resume: "La moitié au moins des magasins de secrets sont en erreur"
            description: >-
              Cause commune probable : le contrôleur d'ESO ne joint plus le coffre (politique réseau,
              DNS, VIP), ou le coffre ne répond plus. Commencer par le coffre, puis la sortie d'ESO.
