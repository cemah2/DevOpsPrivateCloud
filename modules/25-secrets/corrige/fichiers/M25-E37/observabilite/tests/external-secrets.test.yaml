# plateforme/observabilite — tests/external-secrets.test.yaml (M25-E37). Lancés par le job tests-regles
# de la CI (la règle est d'abord extraite de la PrometheusRule vers build/regles/external-secrets.yml).
rule_files:
  - ../build/regles/external-secrets.yml
evaluation_interval: 30s
tests:
  - name: un ExternalSecret en erreur 15 min déclenche l'alerte, avec l'espace de l'objet (exported_namespace)
    interval: 1m
    input_series:
      - series: 'externalsecret_status_condition{namespace="external-secrets", exported_namespace="mediagenda-recette", name="harbor-pull", condition="Ready", status="False"}'
        values: '0x4 1x30'
      - series: 'externalsecret_status_condition{namespace="external-secrets", exported_namespace="mediagenda-dev", name="harbor-pull", condition="Ready", status="True"}'
        values: '1x35'
    alert_rule_test:
      - eval_time: 15m
        alertname: ExternalSecretEnErreur
        exp_alerts: []
      - eval_time: 21m
        alertname: ExternalSecretEnErreur
        exp_alerts:
          - exp_labels:
              espace: mediagenda-recette
              name: harbor-pull
              gravite: avertissement
              equipe: plateforme
            exp_annotations:
              resume: "ExternalSecret mediagenda-recette/harbor-pull en erreur depuis 15 min"
              description: >-
                Le Secret cible n'est plus mis à jour depuis OpenBao (il garde sa dernière valeur).
                Lire les événements de l'objet (kubectl describe externalsecret), puis le statut du
                magasin. Fiche réflexe : docs/securite/secrets/fiche-externalsecret-en-erreur.md.
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/fiche-externalsecret-en-erreur.md
  - name: avec honorLabels, l'espace vient de « namespace » ; un magasin sur cinq en erreur ne déclenche que l'alerte du magasin
    interval: 1m
    input_series:
      - series: 'secretstore_status_condition{namespace="mediagenda-recette", name="openbao", condition="Ready", status="False"}'
        values: '1x20'
      - series: 'secretstore_status_condition{namespace="mediagenda-dev", name="openbao", condition="Ready", status="True"}'
        values: '1x20'
      - series: 'secretstore_status_condition{namespace="mediagenda-prod", name="openbao", condition="Ready", status="True"}'
        values: '1x20'
      - series: 'secretstore_status_condition{namespace="medidoc-dev", name="openbao", condition="Ready", status="True"}'
        values: '1x20'
      - series: 'secretstore_status_condition{namespace="medidoc-recette", name="openbao", condition="Ready", status="True"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: MagasinSecretsEnErreur
        exp_alerts:
          - exp_labels:
              espace: mediagenda-recette
              name: openbao
              gravite: critique
              equipe: plateforme
            exp_annotations:
              resume: "Magasin de secrets mediagenda-recette/openbao en erreur"
              description: >-
                ESO ne parvient plus à se connecter à OpenBao avec ce magasin : aucun ExternalSecret qui
                l'utilise ne se synchronise. Causes typiques : compte de service, rôle ou audience
                (méthode k8s-par1), flux réseau vers 10.10.20.200:8200, coffre scellé.
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/fiche-externalsecret-en-erreur.md
      - eval_time: 12m
        alertname: MagasinsSecretsTousEnErreur
        exp_alerts: []
  - name: tous les magasins en erreur (sortie d'ESO coupée) déclenchent l'alerte de cause commune
    interval: 1m
    input_series:
      - series: 'secretstore_status_condition{namespace="external-secrets", exported_namespace="mediagenda-recette", name="openbao", condition="Ready", status="False"}'
        values: '1x10'
      - series: 'secretstore_status_condition{namespace="external-secrets", exported_namespace="mediagenda-dev", name="openbao", condition="Ready", status="False"}'
        values: '1x10'
      - series: 'secretstore_status_condition{namespace="external-secrets", name="openbao", condition="Ready", status="False"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: MagasinsSecretsTousEnErreur
        exp_alerts:
          - exp_labels:
              gravite: critique
              equipe: plateforme
            exp_annotations:
              resume: "La moitié au moins des magasins de secrets sont en erreur"
              description: >-
                Cause commune probable : le contrôleur d'ESO ne joint plus le coffre (politique réseau,
                DNS, VIP), ou le coffre ne répond plus. Commencer par le coffre, puis la sortie d'ESO.
