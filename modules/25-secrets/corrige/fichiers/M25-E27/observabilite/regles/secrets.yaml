# plateforme/observabilite — regles/secrets.yaml (M25-E27, PLAT-2627).
# État du coffre OpenBao (job openbao : vault01-03 role=coffre, kms01 role=kms), instantanés (job vms,
# collecteur textfile), certificats de la PKI de services (cert-manager, ClusterIssuer openbao-services).
# Pièges de métriques (vérifiés sur OpenBao 2.6.4 et 2.7.1) :
#  - vault_core_unsealed et vault_core_active existent en DEUX séries par nœud : cluster="" (0, émise
#    avant que le nom de grappe soit connu) et cluster="<nom>" ; on prend max by (instance) ;
#  - un nœud dont le processus est arrêté n'émet RIEN : l'alerte « scellé » regarde aussi up ;
#  - vault_autopilot_* n'est émis que par le nœud actif ; vault_audit_log_request_failure est un
#    COMPTEUR.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secrets
spec:
  groups:
    - name: secrets.openbao
      rules:
        - alert: OpenBaoScelle
          expr: |
            (max by (instance, role) (vault_core_unsealed{job="openbao"}) == 0)
            or on (instance) (up{job="openbao"} == 0)
          for: 2m
          labels:
            gravite: critique
            equipe: plateforme
          annotations:
            resume: "OpenBao {{ $labels.instance }} est scellé ou ne répond pas"
            description: >-
              Le nœud ne sert plus de requêtes et ne pourrait pas prendre la main. Grappe : vérifier
              kms01 (seal transit) puis le service ; kms01 lui-même : trois dépositaires. RB-251.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md
        - alert: OpenBaoSansLeader
          expr: |
            (sum(max by (instance) (vault_core_active{job="openbao", role="coffre"})) < 1)
            or absent(vault_core_active{job="openbao", role="coffre"})
          for: 1m
          labels:
            gravite: critique
            equipe: plateforme
          annotations:
            resume: "Aucun nœud actif dans la grappe OpenBao"
            description: >-
              Plus personne ne sert les secrets : CI, ESO, Ansible, MédiAgenda (identifiants
              dynamiques) sont touchés. Quorum perdu ou nœuds scellés. RB-251.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md
        - alert: OpenBaoToleranceNulle
          expr: max(vault_autopilot_failure_tolerance{job="openbao", role="coffre"}) < 1
          for: 10m
          labels:
            gravite: avertissement
            equipe: plateforme
          annotations:
            resume: "La grappe OpenBao ne tolère plus aucune panne"
            description: >-
              Un des trois nœuds est absent ou en retard (autopilot) : une panne de plus et le coffre
              s'arrête. Ramener le nœud avant toute maintenance. RB-251 § 2.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md
        - alert: OpenBaoAuditEnEchec
          expr: sum by (instance) (increase(vault_audit_log_request_failure{job="openbao"}[5m])) > 0
          labels:
            gravite: critique
            equipe: plateforme
          annotations:
            resume: "OpenBao {{ $labels.instance }} n'arrive plus à écrire son audit"
            description: >-
              Quand aucun dispositif d'audit ne peut écrire, OpenBao REFUSE les requêtes. Disque de
              /var/log/openbao plein, droits, rotation sans SIGHUP. RB-251.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md
        - alert: OpenBaoBauxNombreux
          expr: max by (instance) (vault_expire_num_leases{job="openbao", role="coffre"}) > 5000
          for: 15m
          labels:
            gravite: avertissement
            equipe: plateforme
          annotations:
            resume: "{{ $value | humanize }} baux actifs dans OpenBao"
            description: >-
              Trop de baux : une application qui redemande des identifiants dynamiques sans les
              rendre, ou des TTL trop longs. Chaque bail coûte de la mémoire et une révocation
              (PostgreSQL). Lister par préfixe : bao list sys/leases/lookup/<préfixe>.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md
    - name: secrets.sauvegarde
      rules:
        - alert: OpenBaoInstantaneEnRetard
          expr: |
            (time() - max(openbao_instantane_dernier_succes_secondes) > 7200)
            or absent(openbao_instantane_dernier_succes_secondes)
          for: 10m
          labels:
            gravite: avertissement
            equipe: plateforme
          annotations:
            resume: "Aucun instantané d'OpenBao envoyé depuis plus de deux heures"
            description: >-
              Le RPO promis (1 h) n'est plus tenu. Voir le journal openbao-instantane du nœud actif.
              RB-252 § 2.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-252-sauvegarde-restauration-openbao.md
    - name: secrets.pki
      rules:
        - alert: CertificatServicesExpireBientot
          expr: |
            min by (namespace, name) (
              certmanager_certificate_expiration_timestamp_seconds{issuer_name="openbao-services"}
            ) - time() < 12 * 3600
          for: 15m
          labels:
            gravite: avertissement
            equipe: plateforme
          annotations:
            resume: "Le certificat {{ $labels.namespace }}/{{ $labels.name }} expire dans moins de 12 h"
            description: >-
              Les certificats de service durent 72 h et sont renouvelés aux deux tiers : s'il reste
              moins de 12 h, cert-manager n'arrive plus à les faire signer par OpenBao (rôle
              services-k8s, méthode k8s-par1, coffre indisponible).
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md
