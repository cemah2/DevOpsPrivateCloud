# plateforme/observabilite — tests/secrets.test.yaml (M25-E27). Lancés par le job tests-regles de la CI
# (la règle est d'abord extraite de la PrometheusRule vers build/regles/secrets.yml).
rule_files:
  - ../build/regles/secrets.yml
evaluation_interval: 30s
tests:
  - name: un nœud en attente arrêté puis un nœud scellé déclenchent OpenBaoScelle ; la double série cluster="" ne trompe pas
    interval: 30s
    input_series:
      # vault01 actif et sain : la série cluster="" vaut 0, l'autre 1.
      - series: 'vault_core_unsealed{job="openbao", instance="vault01", role="coffre", cluster=""}'
        values: '0x20'
      - series: 'vault_core_unsealed{job="openbao", instance="vault01", role="coffre", cluster="openbao-par1"}'
        values: '1x20'
      - series: 'up{job="openbao", instance="vault01", role="coffre"}'
        values: '1x20'
      # vault02 : processus arrêté à partir de la 5e minute (plus de série unsealed, up = 0).
      - series: 'vault_core_unsealed{job="openbao", instance="vault02", role="coffre", cluster="openbao-par1"}'
        values: '1x9'
      - series: 'up{job="openbao", instance="vault02", role="coffre"}'
        values: '1x9 0x10'
      # kms01 : redémarré, scellé (seule la série cluster="" reste, à 0).
      - series: 'vault_core_unsealed{job="openbao", instance="kms01", role="kms", cluster=""}'
        values: '0x20'
      - series: 'up{job="openbao", instance="kms01", role="kms"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: OpenBaoScelle
        exp_alerts:
          - exp_labels: {alertname: OpenBaoScelle, gravite: critique, equipe: plateforme, instance: kms01, role: kms}
            exp_annotations:
              resume: "OpenBao kms01 est scellé ou ne répond pas"
              description: >-
                Le nœud ne sert plus de requêtes et ne pourrait pas prendre la main. Grappe : vérifier kms01 (seal transit) puis le service ; kms01 lui-même : trois dépositaires. RB-251.
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md
          - exp_labels: {alertname: OpenBaoScelle, gravite: critique, equipe: plateforme, instance: vault02, job: openbao, role: coffre}
            exp_annotations:
              resume: "OpenBao vault02 est scellé ou ne répond pas"
              description: >-
                Le nœud ne sert plus de requêtes et ne pourrait pas prendre la main. Grappe : vérifier kms01 (seal transit) puis le service ; kms01 lui-même : trois dépositaires. RB-251.
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md

  - name: plus aucun nœud actif déclenche OpenBaoSansLeader ; un actif suffit à le faire taire
    interval: 30s
    input_series:
      - series: 'vault_core_active{job="openbao", instance="vault01", role="coffre", cluster=""}'
        values: '0x20'
      - series: 'vault_core_active{job="openbao", instance="vault01", role="coffre", cluster="openbao-par1"}'
        values: '1x5 0x15'
      - series: 'vault_core_active{job="openbao", instance="vault02", role="coffre", cluster="openbao-par1"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: OpenBaoSansLeader
        exp_alerts: []
      - eval_time: 6m
        alertname: OpenBaoSansLeader
        exp_alerts:
          - exp_labels: {alertname: OpenBaoSansLeader, gravite: critique, equipe: plateforme}
            exp_annotations:
              resume: "Aucun nœud actif dans la grappe OpenBao"
              description: >-
                Plus personne ne sert les secrets : CI, ESO, Ansible, MédiAgenda (identifiants dynamiques) sont touchés. Quorum perdu ou nœuds scellés. RB-251.
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md

  - name: un échec d'audit (compteur) déclenche OpenBaoAuditEnEchec ; un compteur stable non
    interval: 30s
    input_series:
      - series: 'vault_audit_log_request_failure{job="openbao", instance="vault03", role="coffre"}'
        values: '0x10 3 3 3 3 3 3 3 3 3 3'
      - series: 'vault_audit_log_request_failure{job="openbao", instance="vault01", role="coffre"}'
        values: '7x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: OpenBaoAuditEnEchec
        exp_alerts: []
      - eval_time: 6m
        alertname: OpenBaoAuditEnEchec
        exp_alerts:
          - exp_labels: {alertname: OpenBaoAuditEnEchec, gravite: critique, equipe: plateforme, instance: vault03}
            exp_annotations:
              resume: "OpenBao vault03 n'arrive plus à écrire son audit"
              description: >-
                Quand aucun dispositif d'audit ne peut écrire, OpenBao REFUSE les requêtes. Disque de /var/log/openbao plein, droits, rotation sans SIGHUP. RB-251.
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md

  - name: tolérance nulle d'autopilot et instantané en retard
    interval: 1m
    input_series:
      - series: 'vault_autopilot_failure_tolerance{job="openbao", instance="vault01", role="coffre"}'
        values: '1x5 0x20'
      # Dernier instantané à t = 0 (époque 0), puis plus rien : en retard après 2 h + 10 min.
      - series: 'openbao_instantane_dernier_succes_secondes{job="vms", instance="vault01"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenBaoToleranceNulle
        exp_alerts:
          - exp_labels: {alertname: OpenBaoToleranceNulle, gravite: avertissement, equipe: plateforme}
            exp_annotations:
              resume: "La grappe OpenBao ne tolère plus aucune panne"
              description: >-
                Un des trois nœuds est absent ou en retard (autopilot) : une panne de plus et le coffre s'arrête. Ramener le nœud avant toute maintenance. RB-251 § 2.
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-251-descellement-et-redemarrage.md
      - eval_time: 125m
        alertname: OpenBaoInstantaneEnRetard
        exp_alerts: []
      - eval_time: 135m
        alertname: OpenBaoInstantaneEnRetard
        exp_alerts:
          - exp_labels: {alertname: OpenBaoInstantaneEnRetard, gravite: avertissement, equipe: plateforme}
            exp_annotations:
              resume: "Aucun instantané d'OpenBao envoyé depuis plus de deux heures"
              description: >-
                Le RPO promis (1 h) n'est plus tenu. Voir le journal openbao-instantane du nœud actif. RB-252 § 2.
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/secrets/runbooks/RB-252-sauvegarde-restauration-openbao.md
