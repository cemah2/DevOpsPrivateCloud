# plateforme/gitops — plateforme/secrets-plateforme.yaml (M25-E13, PLAT-2613)
# Les ExternalSecret des espaces de PLATEFORME (dossier secrets/<espace>/ de ce dépôt). Les valeurs
# sont dans OpenBao ; Git ne porte que la référence (quel secret, quelle clé, quel délai).
# Projet « plateforme » ; destinations : celles du ClusterSecretStore openbao (conditions).
# Pas de finaliseur resources-finalizer : supprimer cette Application (erreur, reconstruction d'Argo
# CD) ne supprime pas les ExternalSecret, donc pas les Secrets qu'ils possèdent — ce qui compte
# d'autant plus qu'Argo CD lit ici ses propres identifiants de dépôts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-plateforme
  namespace: argocd
  labels:
    medisphere.internal/domaine: securite
spec:
  project: plateforme
  source:
    repoURL: https://git01.par1.medisphere.internal/plateforme/gitops.git
    targetRevision: main
    path: secrets
    directory:
      recurse: true
  # Chaque fichier porte son espace (metadata.namespace) ; la destination ne sert que de défaut.
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # prune : un fichier retiré retire l'ExternalSecret… ET le Secret qu'il possède (ownerReference).
      # Retirer un secret de Git = le retirer du cluster : c'est voulu, et relu en MR.
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
