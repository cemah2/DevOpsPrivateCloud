# plateforme/gitops — secrets/argocd/repo-creds-formation.yaml (M25-E13, PLAT-2613)
# identifiants de dépôt du groupe formation.
# Reprend le Secret créé jusqu'ici par secrets-k8s.sh : même nom, mêmes clés (recopiées telles quelles
# dans kv/plateforme/argocd/depot-formation par outils/secret-vers-openbao.sh). ESO adopte le Secret existant (sans propriétaire).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-creds-formation
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: repo-creds-formation
    creationPolicy: Owner
    # Owner : le Secret appartient à l'ExternalSecret (ownerReference) ; supprimer l'ExternalSecret le
    # fait supprimer par Kubernetes (garder le Secret : kubectl delete … --cascade=orphan).
    # Retain : si le secret DISPARAÎT du coffre, le Secret garde sa dernière valeur (pas de coupure).
    deletionPolicy: Retain
    template:
      # Merge : les données viennent de dataFrom ; le modèle n'ajoute que les étiquettes.
      mergePolicy: Merge
      metadata:
        labels:
          medisphere.internal/source: openbao
          argocd.argoproj.io/secret-type: repo-creds
  dataFrom:
    - extract:
        key: plateforme/argocd/depot-formation
