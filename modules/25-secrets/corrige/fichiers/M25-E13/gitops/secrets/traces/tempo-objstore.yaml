# plateforme/gitops — secrets/traces/tempo-objstore.yaml (M25-E13, PLAT-2613)
# identité RGW de Tempo (M23-E03).
# Reprend le Secret créé jusqu'ici par secrets-k8s.sh : même nom, mêmes clés (recopiées telles quelles
# dans kv/plateforme/tempo/objstore par outils/secret-vers-openbao.sh). ESO adopte le Secret existant (sans propriétaire).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-objstore
  namespace: traces
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tempo-objstore
    creationPolicy: Owner
    # Owner : le Secret appartient à l'ExternalSecret (ownerReference) ; supprimer l'ExternalSecret le
    # fait supprimer par Kubernetes (garder le Secret : kubectl delete … --cascade=orphan).
    # Retain : si le secret DISPARAÎT du coffre, le Secret garde sa dernière valeur (pas de coupure).
    deletionPolicy: Retain
    template:
      # Merge : les données viennent de dataFrom ; le modèle n'ajoute que les étiquettes.
      mergePolicy: Merge
      metadata:
        labels:
          medisphere.internal/source: openbao
  dataFrom:
    - extract:
        key: plateforme/tempo/objstore
