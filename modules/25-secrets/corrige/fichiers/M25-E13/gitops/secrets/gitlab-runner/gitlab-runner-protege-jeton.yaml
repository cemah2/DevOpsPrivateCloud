# plateforme/gitops — secrets/gitlab-runner/gitlab-runner-protege-jeton.yaml (M25-E13, PLAT-2613)
# jeton glrt- du runner k8s-par1-protege (M19-E24).
# Reprend le Secret créé jusqu'ici par secrets-k8s.sh : même nom, mêmes clés (recopiées telles quelles
# dans kv/plateforme/gitlab-runner/protege-jeton par outils/secret-vers-openbao.sh). ESO adopte le Secret existant (sans propriétaire).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-protege-jeton
  namespace: gitlab-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitlab-runner-protege-jeton
    creationPolicy: Owner
    # Owner : le Secret appartient à l'ExternalSecret (ownerReference) ; supprimer l'ExternalSecret le
    # fait supprimer par Kubernetes (garder le Secret : kubectl delete … --cascade=orphan).
    # Retain : si le secret DISPARAÎT du coffre, le Secret garde sa dernière valeur (pas de coupure).
    deletionPolicy: Retain
    template:
      # Merge : les données viennent de dataFrom ; le modèle n'ajoute que les étiquettes.
      mergePolicy: Merge
      metadata:
        labels:
          medisphere.internal/source: openbao
  dataFrom:
    - extract:
        key: plateforme/gitlab-runner/protege-jeton
