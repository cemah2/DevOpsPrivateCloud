# plateforme/gitops — secrets/gitlab-runner/ci-cache-s3.yaml (M25-E13, PLAT-2613)
# identité S3 ci-cache du cache des runners (M19-E07).
# Reprend le Secret créé jusqu'ici par secrets-k8s.sh : même nom, mêmes clés (recopiées telles quelles
# dans kv/plateforme/gitlab-runner/cache-s3 par outils/secret-vers-openbao.sh). ESO adopte le Secret existant (sans propriétaire).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-cache-s3
  namespace: gitlab-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ci-cache-s3
    creationPolicy: Owner
    # Owner : le Secret appartient à l'ExternalSecret (ownerReference) ; supprimer l'ExternalSecret le
    # fait supprimer par Kubernetes (garder le Secret : kubectl delete … --cascade=orphan).
    # Retain : si le secret DISPARAÎT du coffre, le Secret garde sa dernière valeur (pas de coupure).
    deletionPolicy: Retain
    template:
      # Merge : les données viennent de dataFrom ; le modèle n'ajoute que les étiquettes.
      mergePolicy: Merge
      metadata:
        labels:
          medisphere.internal/source: openbao
  dataFrom:
    - extract:
        key: plateforme/gitlab-runner/cache-s3
