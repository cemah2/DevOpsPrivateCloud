# =============================================================================
# .gitlab-ci.yml — plateforme/secrets, état de fin de M25-E08 (PLAT-2608).
#
# Palier 1 : le pipeline VÉRIFIE (formatage, validité, politiques lisibles) mais n'a AUCUN accès à
# OpenBao ni à l'état : le plan et l'apply se font depuis adm01, avec le jeton OIDC d'un membre de
# plateforme-admins (README). Au M25-E10, le pipeline s'authentifie auprès d'OpenBao par son jeton
# d'identité GitLab (méthode jwt « gitlab », rôle ci-plateforme-secrets) et prend le plan et l'apply à son compte.
#
# Runner : runner01 (exécuteur shell, étiquette « shell », utilisateur gitlab-runner, tofu).
# =============================================================================

include:
  - project: plateforme/ci-templates
    ref: v1
    file:
      - templates/qualite.yml

stages:
  - lint

tofu:valider:
  stage: lint
  tags: [shell]
  interruptible: true
  script:
    - test "$(id -un)" = gitlab-runner
    - tofu -chdir=tofu fmt -check -recursive
    - tofu -chdir=tofu init -backend=false -input=false -lockfile=readonly
    - tofu -chdir=tofu validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Garde-fous sur les politiques, sans OpenBao : chaque fichier a au moins une règle, aucune règle
# ne vise tout le coffre (« * » seul), et seules les politiques de plateforme peuvent porter « sudo ».
politiques:verifier:
  stage: lint
  tags: [shell]
  interruptible: true
  script:
    - |
      erreur=0
      for f in politiques/*.hcl; do
        grep -Eq '^path "' "$f" || { echo "$f : aucune règle"; erreur=1; }
        if grep -Eq '^path "\*"' "$f"; then echo "$f : règle sur tout le coffre"; erreur=1; fi
        case "$(basename "$f")" in
          plateforme-admin.hcl | securite-audit.hcl | wb-checks.hcl) ;;
          *) if grep -q '"sudo"' "$f"; then echo "$f : sudo réservé aux politiques de plateforme"; erreur=1; fi ;;
        esac
      done
      exit "$erreur"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
