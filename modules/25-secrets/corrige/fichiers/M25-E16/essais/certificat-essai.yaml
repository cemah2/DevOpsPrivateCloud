# ~/m25/e16/certificat-essai.yaml — certificat d'essai dans wb-essais (M25-E16). Supprimé après.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: essai-services
  namespace: wb-essais
spec:
  secretName: essai-services-tls
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
    - digital signature
  dnsNames:
    - essai.wb-essais.svc
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: openbao-services
