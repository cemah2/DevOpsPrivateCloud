# mediagenda/deploiement — overlays/recette/mtls.yaml (M25-E16, SEC-2616)
# Certificat CLIENT (et serveur, pour l'uniformité) de MédiAgenda en recette, émis par la PKI de
# services : 48 h, renouvelé 16 h avant l'échéance, nouvelle clé à chaque renouvellement. Les noms
# sont ceux du Service (le relais de MédiDoc n'accepte que mediagenda.mediagenda-recette.svc).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mediagenda-mtls
spec:
  secretName: mediagenda-mtls
  duration: 48h
  renewBefore: 16h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
    - digital signature
  dnsNames:
    - mediagenda.mediagenda-recette.svc
    - mediagenda.mediagenda-recette.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: openbao-services
