# mediagenda/deploiement — overlays/recette/relais-tls.yaml (M25-E16, SEC-2616) : CORRECTIF du
# Deployment « mediagenda » (gabarit des pods du Rollout ; à ajouter aux « patches »). Relais client
# ghostunnel 1.11.5 en conteneur annexe natif : MédiAgenda appelle http://127.0.0.1:8081 (sans rien
# changer à son code) ; le relais ouvre une connexion TLS mutuelle vers le Service de MédiDoc (8443),
# présente le certificat mediagenda-mtls et n'accepte qu'un serveur certifié par la PKI de services
# au nom de MédiDoc. Modifier le gabarit crée une nouvelle révision du Rollout (canary normal).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediagenda
spec:
  template:
    spec:
      initContainers:
        - name: relais-tls
          image: registry.par1.medisphere.internal/dockerhub/ghostunnel/ghostunnel:v1.11.5-distroless@sha256:<EMPREINTE-GHOSTUNNEL>
          restartPolicy: Always
          args:
            - client
            - --listen=127.0.0.1:8081
            - --target=medidoc.medidoc-recette.svc.cluster.local:8443
            - --cert=/etc/mtls/tls.crt
            - --key=/etc/mtls/tls.key
            - --cacert=/etc/mtls/ca.crt
            - --verify-dns=medidoc.medidoc-recette.svc
            - --timed-reload=300s
            - --status=127.0.0.1:6060
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: mtls
              mountPath: /etc/mtls
              readOnly: true
      volumes:
        - name: mtls
          secret:
            secretName: mediagenda-mtls
