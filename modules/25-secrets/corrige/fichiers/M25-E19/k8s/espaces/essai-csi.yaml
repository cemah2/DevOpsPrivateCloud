# plateforme/k8s — espaces/essai-csi.yaml (M25-E19, PLAT-2619, exception SEC écrite, TEMPORAIRE).
# Espace des DaemonSets de la comparaison CSI : le pilote Secrets Store CSI (conteneur PRIVILÉGIÉ,
# hostPath vers /var/lib/kubelet et le dossier des fournisseurs : il monte des volumes dans les pods)
# et le fournisseur openbao-csi-provider (hostPath vers le dossier des fournisseurs). Ni « baseline »
# ni « restricted » ne les admettent : on isole l'exception dans un espace qui ne contient qu'eux,
# comme supervision-noeuds (M21-E02). audit et warn restent en restricted : tout autre objet posé ici
# laisse une trace. Espace SUPPRIMÉ en fin d'exercice (MR qui retire ce fichier).
apiVersion: v1
kind: Namespace
metadata:
  name: essai-csi
  labels:
    app.kubernetes.io/part-of: plateforme-k8s
    medisphere.internal/role: plateforme
    medisphere.internal/proprietaire: plateforme
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    medisphere.internal/ticket: "PLAT-2619"
    medisphere.internal/exception-psa: "pilote Secrets Store CSI (privileged, hostPath) et fournisseur OpenBao : essai M25-E19, à supprimer en fin d'exercice"
---
