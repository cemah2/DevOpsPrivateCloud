# plateforme/k8s — espaces/sealed-secrets.yaml (M25-E19, PLAT-2619, TEMPORAIRE).
# Contrôleur Sealed Secrets de la comparaison. Le contrôleur tourne non-root, sans privilège, système
# de fichiers en lecture seule (valeurs par défaut du chart du projet, vérifiées) : « restricted ».
# Sa CLÉ PRIVÉE (Secret « sealed-secrets-key… » de cet espace) déchiffre TOUT ce qui a été scellé pour
# ce cluster, historique Git compris : quiconque lit les Secrets de cet espace lit tous les secrets
# scellés. Espace SUPPRIMÉ en fin d'exercice (et avec lui la clé : les SealedSecret d'essai deviennent
# indéchiffrables, c'est voulu).
apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets
  labels:
    app.kubernetes.io/part-of: plateforme-k8s
    medisphere.internal/role: plateforme
    medisphere.internal/proprietaire: plateforme
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    medisphere.internal/ticket: "PLAT-2619"
