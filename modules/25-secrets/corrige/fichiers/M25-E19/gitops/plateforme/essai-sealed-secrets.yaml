# plateforme/gitops — plateforme/essai-sealed-secrets.yaml (M25-E19, PLAT-2619, TEMPORAIRE).
# Comparaison seulement : SUPPRIMÉE par MR en fin d'exercice. Le finaliseur fait supprimer en cascade
# tout ce que l'Application a créé (contrôleur, CRD SealedSecret… et donc les SealedSecret d'essai et
# les Secrets qu'ils ont produits) : c'est exactement ce qu'on veut pour un essai, et ce qu'on refuse
# pour un composant durable (kube-prometheus-stack, M21-E02).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: essai-sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    medisphere.internal/equipe: plateforme
  annotations:
    medisphere.internal/ticket: "PLAT-2619"
spec:
  project: plateforme
  sources:
    - repoURL: registry.par1.medisphere.internal/charts
      chart: sealed-secrets
      targetRevision: 2.20.0
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/valeurs/essai-sealed-secrets/values.yaml
    - repoURL: https://git01.par1.medisphere.internal/plateforme/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
