# =============================================================================
# .gitlab-ci.yml — plateforme/secrets (M25-E10, SEC-2610). Même forme que plateforme/identite
# (M24-E08) et plateforme/infra (M05-E26), avec une différence : AUCUNE variable de CI secrète.
#
# Étapes :
#   lint       tofu fmt / validate, bao policy fmt (sans accès au coffre)
#   plan       tofu:plan — plan ENREGISTRÉ (main et MR issues de conf/*)
#   appliquer  tofu:apply — MANUEL, sur main seulement, environnement lab/secrets
#
# Runner : runner01 (exécuteur shell, étiquette « shell », utilisateur gitlab-runner, tofu, bao
# installé par le rôle openbao_client).
# Identité : jeton d'identité GitLab (id_tokens) présenté au rôle JWT ci-plateforme-secrets
# (main et conf/* PROTÉGÉES, politique tofu-secrets) ; jeton OpenBao de 10 min, révoqué en fin de job.
# Les accès à l'état (identité S3 tofu-etat, phrase de chiffrement) sont lus DANS le coffre
# (kv/plateforme/tofu/etat-secrets). Bris de glace (coffre fermé) : apply depuis adm01 avec les
# copies locales de ~/.config/workbook/ (palier 1, E08) — jamais depuis la CI.
# =============================================================================

include:
  - project: plateforme/ci-templates
    ref: v1
    file:
      - templates/qualite.yml

stages:
  - lint
  - plan
  - appliquer

variables:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  BAO_ADDR: https://openbao.par1.medisphere.internal:8200
  # Le fournisseur vault crée par défaut un jeton ENFANT (auth/token/create) : la politique
  # tofu-secrets ne le permet pas, et le jeton du job ne dure que 10 min. Il utilise donc le jeton
  # reçu tel quel. Variable lue par le fournisseur hashicorp/vault (équivalent de skip_child_token) :
  # rien à changer dans fournisseurs.tf, adm01 garde son jeton enfant (M25-E08).
  TERRAFORM_VAULT_SKIP_CHILD_TOKEN: "true"

.tofu:
  tags: [shell]
  interruptible: true
  id_tokens:
    OPENBAO_ID_TOKEN:
      aud: openbao.medisphere.internal
  before_script:
    - test "$(id -un)" = gitlab-runner
    - . outils/openbao-ci.sh ci-plateforme-secrets
    - . outils/etat-depuis-openbao.sh
  after_script:
    - . outils/openbao-ci.sh --fin

tofu:valider:
  stage: lint
  tags: [shell]
  script:
    - tofu -chdir=tofu fmt -check -recursive
    - tofu -chdir=tofu init -backend=false -input=false -lockfile=readonly
    - tofu -chdir=tofu validate
    - for f in politiques/*.hcl; do bao policy fmt "$f"; done && git diff --exit-code -- politiques/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Une MR d'une branche NON protégée n'obtient aucun jeton (le rôle exige ref_protected) : un échec
# qui explique, plutôt qu'un plan muet.
tofu:branche-non-protegee:
  stage: plan
  tags: [shell]
  script:
    - echo "La MR vient de « $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME », branche non protégée."
    - echo "Le coffre refuse les jetons de ces branches : pousse le travail sur conf/<sujet>."
    - exit 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED != "true"

tofu:plan:
  extends: .tofu
  stage: plan
  script:
    - tofu -chdir=tofu init -input=false -lockfile=readonly
    - |
      rc=0
      tofu -chdir=tofu plan -input=false -lock-timeout=10m -detailed-exitcode -out=plan.tfplan || rc=$?
      if [ "$rc" -eq 1 ]; then echo "Plan en ERREUR : rien ne sera appliqué."; exit 1; fi
    - tofu -chdir=tofu show -no-color plan.tfplan > tofu/plan.txt
    - grep -E '^(Plan:|No changes)' tofu/plan.txt || true
    - |
      # Garde-fous de relecture : destruction, et toute modification des méthodes d'authentification
      # ou de la politique du pipeline lui-même.
      if grep -Eq '^Plan: .* [1-9][0-9]* to destroy' tofu/plan.txt; then
        echo "⚠️  CE PLAN DÉTRUIT des objets du coffre : lire chaque ligne « - » ou « -/+ »."
      fi
      if grep -Eq 'vault_(jwt_auth_backend|auth_backend|policy\.ci\["tofu-secrets"\])' tofu/plan.txt; then
        echo "⚠️  CE PLAN TOUCHE une méthode d'authentification ou la politique tofu-secrets : relecture à deux."
      fi
  artifacts:
    name: "${CI_JOB_NAME_SLUG}-${CI_COMMIT_SHORT_SHA}"
    access: developer
    expire_in: 30 days
    paths:
      - tofu/plan.tfplan
      - tofu/plan.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

tofu:apply:
  extends: .tofu
  stage: appliquer
  needs: ["tofu:plan"]
  interruptible: false
  resource_group: tofu-secrets
  environment:
    name: lab/secrets
  script:
    - test -s tofu/plan.tfplan
    - tofu -chdir=tofu init -input=false -lockfile=readonly
    - tofu -chdir=tofu apply -input=false -lock-timeout=10m plan.tfplan
    - |
      rc=0
      tofu -chdir=tofu plan -input=false -lock-timeout=10m -detailed-exitcode -no-color > tofu/controle.txt 2>&1 || rc=$?
      grep -E '^(Plan:|No changes)' tofu/controle.txt || true
      if [ "$rc" -ne 0 ]; then echo "Après l'apply, le plan n'est pas vide (code $rc) : voir controle.txt."; exit 1; fi
  artifacts:
    when: always
    access: developer
    expire_in: 1 year
    paths:
      - tofu/controle.txt
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: manual
