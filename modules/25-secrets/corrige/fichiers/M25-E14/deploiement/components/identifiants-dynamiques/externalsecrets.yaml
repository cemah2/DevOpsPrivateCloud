# mediagenda/deploiement — components/identifiants-dynamiques/externalsecrets.yaml (M25-E14, DEV-2614)
# Deux ExternalSecret, un par générateur. Vague -2 : prêts AVANT le Job de migration (vague -1) et
# l'API (vague 0) ; Argo CD attend qu'ils soient sains (contrôle de santé intégré pour ExternalSecret).
# refreshInterval 30 min, bail d'une heure : à chaque rafraîchissement un NOUVEAU compte, l'ancien
# vit encore 30 min au moins. Le format de « uri » est celui du Secret de CNPG (MEDIAGENDA_DB_URL).
# La politique de mot de passe d'OpenBao (postgresql-url) garantit un mot de passe sans caractère à
# encoder dans une URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediagenda-db-api
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 30m
  target:
    name: mediagenda-db-api
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          medisphere.internal/source: openbao-dynamique
      data:
        uri: "postgresql://{{ .username }}:{{ .password }}@mediagenda-db-rw:5432/mediagenda"
        username: "{{ .username }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: mediagenda-api
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediagenda-db-migrateur
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 30m
  target:
    name: mediagenda-db-migrateur
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          medisphere.internal/source: openbao-dynamique
      data:
        uri: "postgresql://{{ .username }}:{{ .password }}@mediagenda-db-rw:5432/mediagenda"
        username: "{{ .username }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: mediagenda-migrateur
