---
# host_vars/mon01/mailpit.yml — Mailpit sur mon01 (M19-E03) ; mots de passe servis par OpenBao
# depuis M25-E11 (PLAT-2611). Valeurs par défaut du rôle pour le reste.
# Changer de version : mailpit_version ET mailpit_sha256 (relevée sur adm01, voir le corrigé du M19).
mailpit_version: "1.31.6"
mailpit_sha256: "10fa12ccc610f653d4ed4df848c1817f9935dcf4e9a6a458a19ab0fa02093f91"

# Secret kv/plateforme/mailpit/comptes (clés « moi » et « wb-checks »), lu au moment où la variable
# est utilisée, avec le jeton de la session (personne) ou du job (CI, rôle ansible-critique).
# Attention : une variable Ansible est évaluée à CHAQUE usage ; le lookup est donc rejoué à chaque
# tâche qui lit mailpit_comptes (quelques lectures par exécution, toutes visibles dans l'audit).
mailpit_comptes_coffre: "{{ lookup('community.hashi_vault.vault_kv2_get', 'plateforme/mailpit/comptes', engine_mount_point='kv').secret }}"

# Comptes de l'interface et de l'API. Mailpit n'a pas de rôles : wb-checks a techniquement tous
# les droits de l'API (compensations dans docs/socle/messagerie.md).
mailpit_comptes:
  - nom: "<MOI>"
    mot_de_passe: "{{ mailpit_comptes_coffre['moi'] }}"
  - nom: wb-checks
    mot_de_passe: "{{ mailpit_comptes_coffre['wb-checks'] }}"
