# plateforme/gitops — plateforme/opentelemetry-operator.yaml (M23-E02, PLAT-2402)
# Opérateur OpenTelemetry : chart recopié dans Harbor (charts/), values dans plateforme/observabilite.
# Même forme que les Applications de M21 et M22 (kube-prometheus-stack, loki) : reprends le nom exact de ton
# dépôt OCI et du dépôt Git tels qu'ils sont déclarés dans Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  annotations:
    # Avant « otel » (les CRD doivent exister quand les OpenTelemetryCollector arrivent).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: plateforme
  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-operator-system
  sources:
    - repoURL: registry.par1.medisphere.internal/charts
      chart: opentelemetry-operator
      targetRevision: 0.126.1
      helm:
        releaseName: opentelemetry-operator
        valueFiles:
          - $values/otel/operateur/values.yaml
    - repoURL: https://git01.par1.medisphere.internal/plateforme/observabilite.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD volumineuses : l'annotation last-applied de l'apply client dépasserait 256 Kio.
      - ServerSideApply=true
