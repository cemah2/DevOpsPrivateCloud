# otel-passerelle — Collector central (M23-E02, PLAT-2402), espace traces. Reçoit des agents (et, par le
# Service otlp-externe 10.10.41.63, des émetteurs hors cluster), traitera l'échantillonnage en queue
# (M23-E09) et exportera vers Tempo (M23-E03).
# ÉTAT DE M23-E02 : pas encore de Tempo. L'exportateur « debug » (résumé, échantillonné) sert à constater
# que des spans arrivent ; il est RETIRÉ en M23-E03 (jamais de debug détaillé en production : il écrit
# chaque span dans les journaux du pod, données comprises).
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-passerelle
  namespace: traces
  labels:
    medisphere.internal/equipe: plateforme
spec:
  mode: deployment
  replicas: 1
  image: registry.par1.medisphere.internal/dockerhub/otel/opentelemetry-collector-contrib:0.161.0
  priorityClassName: medisphere-standard
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  env:
    - name: GOMEMLIMIT
      value: 400MiB
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        send_batch_size: 1024
        timeout: 5s
    exporters:
      # Essai de M23-E02 seulement : un résumé par lot dans les journaux du pod, 5 premiers lots puis 1 sur 200.
      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
