# CiliumNetworkPolicy de l'espace traces (M23-E02 ; M23-E03 ajoute Tempo, M23-E16 les reprend toutes).
# Une politique qui sélectionne un pod le fait passer en « refus par défaut » pour l'ENTRÉE : tout ce qui
# n'est pas listé est refusé. Les sorties ne sont pas filtrées ici (M23-E16, puis M26).
# Étiquettes posées par l'opérateur : app.kubernetes.io/instance = <espace>.<nom du CR>.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traces-passerelle
  namespace: traces
spec:
  description: "otel-passerelle : agents (OTLP), MGMT par 10.10.41.63, Prometheus"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: traces.otel-passerelle
      app.kubernetes.io/component: opentelemetry-collector
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/instance: traces.otel-agent}
      toPorts:
        - ports: [{port: "4317", protocol: TCP}, {port: "4318", protocol: TCP}]
    # Par le Service LoadBalancer (adresse source conservée) : MGMT (adm01) seulement tant que l'entrée
    # n'a ni TLS ni jeton. M23-E16 l'ouvre aux réseaux du lab, sur 14317/14318 (TLS + jeton).
    - fromCIDR: [10.10.10.0/24]
      toPorts:
        - ports: [{port: "4317", protocol: TCP}, {port: "4318", protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: supervision, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: "8888", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traces-agent
  namespace: traces
spec:
  description: "otel-agent : applications instrumentées des espaces autorisés, Prometheus"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: traces.otel-agent
      app.kubernetes.io/component: opentelemetry-collector
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values: [mediagenda-dev, mediagenda-recette, mediagenda-prod, medidoc-dev, medidoc-recette, wb-essais]
      toPorts:
        - ports: [{port: "4317", protocol: TCP}, {port: "4318", protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: supervision, app.kubernetes.io/name: prometheus}
      toPorts:
        - ports: [{port: "8888", protocol: TCP}]
