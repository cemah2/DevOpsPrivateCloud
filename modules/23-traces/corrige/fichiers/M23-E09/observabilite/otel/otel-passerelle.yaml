# otel-passerelle — Collector central (M23-E02, PLAT-2402), espace traces. Reçoit des agents (et, par le
# Service otlp-externe 10.10.41.63, des émetteurs hors cluster), traitera l'échantillonnage en queue
# (M23-E09) et exporte vers Tempo.
# ÉTAT DE M23-E09 (PLAT-2409) : deux réplicas, échantillonnage EN QUEUE (tail_sampling). Les agents
# envoient toutes les spans d'une trace au même réplica (loadbalancing par traceID) : chaque réplica voit
# des traces COMPLÈTES. Ce qui arrive par 10.10.41.63 ne passe pas par les agents : M23-E16 le ré-équilibre.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-passerelle
  namespace: traces
  labels:
    medisphere.internal/equipe: plateforme
spec:
  mode: deployment
  replicas: 2
  # Un réplica peut partir (drain d'un nœud) ; jamais les deux.
  podDisruptionBudget:
    maxUnavailable: 1
  # Pas deux réplicas sur le même nœud quand c'est possible.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: traces.otel-passerelle
  image: registry.par1.medisphere.internal/dockerhub/otel/opentelemetry-collector-contrib:0.161.0
  priorityClassName: medisphere-standard
  # tail_sampling garde les traces en mémoire pendant decision_wait : plus de mémoire qu'en M23-E02.
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 1Gi}
  env:
    - name: GOMEMLIMIT
      value: 800MiB
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # Décision par trace, après decision_wait : la trace est gardée si AU MOINS UNE politique le dit.
      # Mémoire : num_traces traces en attente au plus (les plus anciennes sont décidées de force).
      tail_sampling:
        decision_wait: 10s
        num_traces: 20000
        expected_new_traces_per_sec: 50
        # Décision mémorisée : une span retardataire d'une trace déjà décidée suit la même décision.
        decision_cache:
          sampled_cache_size: 20000
          non_sampled_cache_size: 20000
        policies:
          # Toute trace contenant une span en erreur (statut ERROR).
          - name: erreurs
            type: status_code
            status_code:
              status_codes: [ERROR]
          # Toute trace de plus de 500 ms (de la première à la dernière span).
          - name: lentes
            type: latency
            latency:
              threshold_ms: 500
          # Le reste : 10 % (décision déterministe par traceID).
          - name: reste-10-pourcent
            type: probabilistic
            probabilistic:
              sampling_percentage: 10
      batch:
        send_batch_size: 1024
        timeout: 5s
    exporters:
      # Tempo (Service du chart, port OTLP gRPC). Trafic interne au cluster, sans TLS.
      otlp_grpc/tempo:
        endpoint: tempo.traces.svc.cluster.local:4317
        tls:
          insecure: true
        # File d'attente en mémoire et reprises : un redémarrage de Tempo (quelques dizaines de
        # secondes) ne perd rien tant que la file n'est pas pleine (otelcol_exporter_queue_size).
        sending_queue:
          enabled: true
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp_grpc/tempo]
