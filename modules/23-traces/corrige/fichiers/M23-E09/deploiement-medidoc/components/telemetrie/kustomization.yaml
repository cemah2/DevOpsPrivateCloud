# medidoc/deploiement — components/telemetrie (M23-E06, DEV-2406) — version M23-E09 (PLAT-2409)
# Variables STANDARD d'OpenTelemetry du conteneur « medidoc » (lues par internal/telemetrie). À inclure
# dans les overlays dev et recette. L'environnement est lu sur l'étiquette medisphere.internal/environnement
# que chaque overlay pose sur le gabarit (labels.includeTemplates), comme pour MédiAgenda.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      name: medidoc
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MEDISPHERE_ENVIRONNEMENT
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['medisphere.internal/environnement']
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: medidoc
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=medisphere,deployment.environment.name=$(MEDISPHERE_ENVIRONNEMENT)
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-agent-collector.traces.svc.cluster.local:4317
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_TRACES_SAMPLER
          value: parentbased_traceidratio
      # M23-E09 : ratio EXPLICITE. 1.0 = tout émettre : l'échantillonnage en tête décide AVANT de savoir
      # si la requête échouera ou sera lente ; c'est la passerelle (en queue) qui réduit le volume.
      # parentbased_* : un appel reçu avec un traceparent suit la décision de l'appelant (traces entières).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_TRACES_SAMPLER_ARG
          value: "1.0"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_PROPAGATORS
          value: tracecontext,baggage
