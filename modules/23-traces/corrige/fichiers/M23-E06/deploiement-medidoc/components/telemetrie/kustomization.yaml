# medidoc/deploiement — components/telemetrie (M23-E06, DEV-2406)
# Variables STANDARD d'OpenTelemetry du conteneur « medidoc » (lues par internal/telemetrie). À inclure
# dans les overlays dev et recette. L'environnement est lu sur l'étiquette medisphere.internal/environnement
# que chaque overlay pose sur le gabarit (labels.includeTemplates), comme pour MédiAgenda.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      name: medidoc
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MEDISPHERE_ENVIRONNEMENT
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['medisphere.internal/environnement']
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: medidoc
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=medisphere,deployment.environment.name=$(MEDISPHERE_ENVIRONNEMENT)
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-agent-collector.traces.svc.cluster.local:4317
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_TRACES_SAMPLER
          value: parentbased_always_on
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_PROPAGATORS
          value: tracecontext,baggage
