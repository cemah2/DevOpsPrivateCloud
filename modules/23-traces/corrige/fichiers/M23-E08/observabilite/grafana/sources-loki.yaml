# plateforme/observabilite — grafana/sources-loki.yaml (version M23-E08, DEV-2408 : champs dérivés trace_id
# sur loki-mediagenda et loki-medidoc ; part de la version M22-E16, créée en M22-E02)
# M22-E16 (SEC-2316) : la source « Loki — audit » QUITTE l'organisation principale. Elle est recréée
# par OpenTofu dans l'organisation « Sécurité » (plateforme/infra, état observabilite-grafana,
# organisation-securite.tf). Retirer la source de la liste ne la supprime pas de Grafana : d'où
# « deleteDatasources », que le provisionnement applique avant de (re)créer les sources.
# Trois sources de données Loki (plateforme, mediagenda, medidoc ; audit est dans l'organisation Sécurité), provisionnées par le « sidecar » de Grafana
# (kube-prometheus-stack, M21) : il lit les ConfigMaps étiquetées grafana_datasource: "1" de
# l'espace supervision. Ajoute ce fichier aux ressources de la kustomization racine de
# plateforme/observabilite (Application « observabilite », espace supervision).
# Le locataire est fixé par l'en-tête X-Scope-OrgID ; Grafana le range dans secureJsonData
# (chiffré dans sa base) : il n'apparaît pas dans l'API pour un Viewer.
# UID stables : les tableaux de bord et les règles y font référence (jamais le nom affiché).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sources-loki
  namespace: supervision
  labels:
    grafana_datasource: "1"
data:
  sources-loki.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Loki — audit
        orgId: 1
    datasources:
      - name: Loki — plateforme
        uid: loki-plateforme
        type: loki
        access: proxy
        url: http://loki.journaux.svc.cluster.local:3100
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: plateforme
      - name: Loki — mediagenda
        uid: loki-mediagenda
        type: loki
        access: proxy
        url: http://loki.journaux.svc.cluster.local:3100
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60
          httpHeaderName1: X-Scope-OrgID
          # M23-E08 — Loki → Tempo : la métadonnée structurée trace_id (Alloy) devient un lien vers
          # la trace. matcherType « label » : l'expression porte sur le NOM de l'étiquette (étiquettes
          # indexées, extraites ou métadonnées structurées), pas sur le texte de la ligne.
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: "$${__value.raw}"
              urlDisplayLabel: "Voir la trace"
        secureJsonData:
          httpHeaderValue1: mediagenda
      - name: Loki — medidoc
        uid: loki-medidoc
        type: loki
        access: proxy
        url: http://loki.journaux.svc.cluster.local:3100
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60
          httpHeaderName1: X-Scope-OrgID
          # M23-E08 — Loki → Tempo : la métadonnée structurée trace_id (Alloy) devient un lien vers
          # la trace. matcherType « label » : l'expression porte sur le NOM de l'étiquette (étiquettes
          # indexées, extraites ou métadonnées structurées), pas sur le texte de la ligne.
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: "$${__value.raw}"
              urlDisplayLabel: "Voir la trace"
        secureJsonData:
          httpHeaderValue1: medidoc
