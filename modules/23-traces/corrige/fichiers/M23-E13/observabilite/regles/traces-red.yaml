# plateforme/observabilite/regles/traces-red.yaml (M23-E13) : règles d'enregistrement RED tirées des traces,
# à côté de celles tirées des métriques applicatives (M21-E14), pour comparer les deux sur un même tableau.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: traces-red
  namespace: supervision
  labels:
    medisphere.internal/supervision: "oui"
spec:
  groups:
    - name: traces-red
      interval: 30s
      rules:
        - record: service:traces_spanmetrics_appels:taux5m
          expr: sum by (service, deployment_environment_name) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m]))
        - record: service:traces_spanmetrics_erreurs:ratio5m
          expr: |
            sum by (service, deployment_environment_name) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
              / sum by (service, deployment_environment_name) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m]))
        - record: service:traces_spanmetrics_latence:p95_5m
          expr: |
            histogram_quantile(0.95, sum by (le, service, deployment_environment_name) (rate(traces_spanmetrics_latency_bucket{span_kind="SPAN_KIND_SERVER"}[5m])))
