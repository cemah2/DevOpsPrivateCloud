# etc/kolla/config/keystone.conf — surcharge fusionnée par Kolla dans le keystone.conf de tous
# les conteneurs Keystone (M10-E27, SEC-1153). Appliquer : reconfigure -t keystone.
#
# Ne s'applique qu'aux utilisateurs du pilote d'identité SQL (tous les comptes locaux, y compris
# les comptes de SERVICE nova, neutron, glance… du domaine Default). Ces derniers sont dispensés
# par l'option de compte ignore_lockout_failure_attempts (outils/dispenser-comptes-service.sh),
# AVANT l'application de cette surcharge.
[security_compliance]
# 5 échecs consécutifs verrouillent le compte…
lockout_failure_attempts = 5
# … pendant 15 minutes (secondes).
lockout_duration = 900
