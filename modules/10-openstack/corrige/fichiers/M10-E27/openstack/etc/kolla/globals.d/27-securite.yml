---
# etc/kolla/globals.d/27-securite.yml — M10-E27 (SEC-1153)
# Application (fenêtre, instantané des trois nœuds) :
#   uv run kolla-ansible reconfigure -i inventaire/multinode --configdir etc/kolla
# Retour arrière : retirer ce fichier (MR), puis reconfigure.

# --- TLS des deux VIP -----------------------------------------------------------------------
# Externe : déjà actif depuis M10-E04. Interne : nouveau. Les VIP sont distinctes (.200/.201),
# condition posée par la documentation pour activer l'un sans l'autre.
kolla_enable_tls_external: "yes"
kolla_enable_tls_internal: "yes"
# Effet de bord : avec ProxySQL (actif par défaut) et le TLS interne, Kolla passe aussi
# database_enable_tls_internal à « yes » (connexions des services vers ProxySQL en TLS).

# --- Confiance dans la PKI MédiSphère ------------------------------------------------------
# etc/kolla/certificates/ca/medisphere-root-ca.crt (certificat PUBLIC de la racine) est copié
# dans chaque conteneur (préfixe kolla-customca-) et ajouté au magasin du système.
kolla_copy_ca_into_containers: "yes"
# Magasin de confiance des services (images Debian) : sans lui, certains clients Python
# (requests) utilisent leur propre paquet de certificats et refusent la PKI interne.
openstack_cacert: "/etc/ssl/certs/ca-certificates.crt"
# admin-openrc.sh généré par « post-deploy » : chemin valide sur adm01 (racine dans le magasin).
kolla_admin_openrc_cacert: "/etc/ssl/certs/ca-certificates.crt"

# --- Certificats des VIP par ACME (step-ca) -----------------------------------------------------
# Rôle « letsencrypt » de Kolla : conteneurs letsencrypt_lego (client lego, cron toutes les 4 h)
# et letsencrypt_webserver (sert les défis HTTP-01 derrière HAProxy, port 80 des VIP).
# (Booléen : les rôles de Kolla 2026.1 le lisent avec le filtre « bool ».)
enable_letsencrypt: "yes"
letsencrypt_email: "plateforme@medisphere.internal"
letsencrypt_external_cert_server: "https://ca01.par1.medisphere.internal/acme/acme/directory"
letsencrypt_internal_cert_server: "https://ca01.par1.medisphere.internal/acme/acme/directory"
# Fréquence de renouvellement. PIÈGE de Kolla 2026.1 : malgré son nom, letsencrypt_cert_valid_days
# n'est PAS le seuil de renouvellement ; le script du conteneur le transmet à lego en
# « --cert.timeout » (délai d'obtention, en secondes). lego renouvelle donc avec son seuil par
# défaut (renew --days 30) : avec des certificats de 30 jours, CHAQUE passage renouvelle.
# On règle donc la fréquence : un passage par jour (au lieu de toutes les 4 h) → certificat
# toujours à plus de 28 jours de l'échéance, une seule émission par jour et par VIP, nouvel essai
# le lendemain en cas d'échec (la sonde ms-verif-openstack alerte à 10 jours). Écart à la
# politique M06-E27 (« renouvelés à 15 jours ») consigné dans docs/cloud/securite.md.
letsencrypt_cron_renew_schedule: "17 3 * * *"
