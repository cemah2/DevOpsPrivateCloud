# Surcharge de octavia.conf (M10-E16).
# Le fournisseur par défaut d'Octavia est « amphora » : sans cette ligne, un
# « openstack loadbalancer create » sans --provider demande amphora, qui n'est pas activé
# (erreur 400 « Provider 'amphora' is not enabled »).
[api_settings]
default_provider_driver = ovn
