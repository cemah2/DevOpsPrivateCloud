---
# etc/kolla/globals.yml — OpenStack 2026.1 de MédiSphère PAR1 (plateforme/openstack).
# Parti de l'exemple de kolla-ansible 22.2.0 (.venv/share/kolla-ansible/etc_examples/kolla/),
# réduit aux réglages qui s'écartent du défaut ou qu'on veut lire explicitement. Chaque ligne dit
# POURQUOI et quel est le défaut. Valable pour TOUS les nœuds : une valeur propre à un hôte va
# dans l'inventaire (ce fichier est chargé en « extra vars », priorité la plus haute).
# Réglages ajoutés par sujet aux paliers suivants : etc/kolla/globals.d/<NN>-<sujet>.yml.

###############
# Images
###############
# Défaut : « rocky ». Nos hôtes sont en Debian 13 (image dorée) ; la doc recommande que la
# distribution des images soit celle des hôtes. Attention : sur Debian, plusieurs images
# (ovn, haproxy, cinder, octavia…) sont « untested » dans la matrice de support des images
# 2026.1 ; « rocky » reste le repli si l'une d'elles posait problème (ADR-0101).
kolla_base_distro: "debian"
# Défaut de kolla-ansible 22 : « 2026.1 ». Écrit pour la relecture : une montée de série est
# un changement à part entière (M10-E28, M10-E32).
openstack_release: "2026.1"
# Registre et espace de noms : défauts (quay.io/openstack.kolla), étiquette
# « 2026.1-debian-trixie » calculée par Kolla.

###############
# Réseau des nœuds (identique sur les trois : interfaces renommées par noeud_openstack, M10-E02)
###############
# Défaut : eth0. API, gestion, VIP.
network_interface: "ens18"
# Défaut : network_interface. Trafic Geneve entre nœuds, VLAN 51 en MTU 9000.
tunnel_interface: "ens19"
# Défaut : network_interface. Accès à ceph-par1, VLAN 30 en MTU 9000 (sert à partir de E10).
storage_interface: "ens20"
# neutron_external_interface : PAS ICI. Seul osctl01 a une carte externe (ens21) :
# inventaire/host_vars/osctl01.yml.

###############
# Points d'accès (VIP portées par keepalived, HAProxy devant chaque API)
###############
kolla_internal_vip_address: "10.10.50.200"
kolla_internal_fqdn: "openstack-int.par1.medisphere.internal"
# VIP externe DISTINCTE : obligatoire dès que le TLS n'est activé que sur un des deux côtés.
kolla_external_vip_address: "10.10.50.201"
kolla_external_fqdn: "openstack.par1.medisphere.internal"
# Défaut : « 51 ». Doit être UNIQUE sur le VLAN 50 : le VRID 50 est celui des passerelles
# (M07-E25). 150 = 100 + numéro du VLAN, réservé à Kolla dans la matrice VRRP du lab.
keepalived_virtual_router_id: "150"

###############
# TLS
###############
# Externe : HTTPS sur la VIP externe dès le premier déploiement (M10-E04). Interne : M10-E27.
# Le certificat (30 jours, ACME de ca01) est renouvelé à la main jusqu'à M10-E27.
kolla_enable_tls_external: "yes"
# Certificat ET clé dans un seul fichier, chiffré par Vault dans le dépôt (outils/certificat-externe.sh).
# Défaut de Kolla, écrit pour la relecture : le module « copy » le déchiffre au dépôt sur osctl01.
kolla_external_fqdn_cert: "{{ kolla_certificates_dir }}/haproxy.pem"

###############
# Services
###############
# Défaut : « openvswitch » (agent OVS + agents L3/DHCP). Décision : OVN (ADR-0100, palier 3).
neutron_plugin_agent: "ovn"
# IP flottantes centralisées sur le nœud « network » (osctl01) : défaut de Kolla avec OVN,
# écrit pour la relecture. « yes » exigerait une carte externe sur chaque calcul.
neutron_ovn_distributed_fip: "no"
# KVM sur les calculs (CPU host, M10-E02). Défaut : « kvm ». « qemu » (émulation) serait le
# repli si la virtualisation imbriquée manquait : dix fois plus lent.
nova_compute_virt_type: "kvm"
# Cœur d'OpenStack (Keystone, Glance, Nova, Neutron, Heat, Horizon, Placement) : activé par
# défaut (enable_openstack_core). Cinder (stockage Ceph, E10) et Octavia (E16) plus tard.
enable_cinder: "no"
enable_octavia: "no"
# Pas de pile de supervision Kolla au palier 1 (mémoire de osctl01) ; supervision : E26.
enable_prometheus: "no"
