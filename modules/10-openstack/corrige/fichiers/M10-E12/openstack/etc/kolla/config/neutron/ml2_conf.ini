# Surcharge de ml2_conf.ini (M10-E12) — MTU des réseaux.
# Réseau Geneve : MTU = min(global_physnet_mtu, path_mtu) - 20 (IPv4) - max_header_size (38).
#   path_mtu = 1558 -> 1558 - 20 - 38 = 1500 pour les instances (valeur standard : aucune
#   surprise de PMTU entre une instance, ext-net (1500) et le reste du lab).
# Réseau flat physnet1 (ext-net, VLAN 52 à 1500) : plafonné à 1500 malgré global_physnet_mtu.
# N'agit que sur les réseaux CRÉÉS après le déploiement : corriger les existants avec
#   openstack network set --mtu 1500 <réseau>
[ml2]
path_mtu = 1558
physical_network_mtus = physnet1:1500
