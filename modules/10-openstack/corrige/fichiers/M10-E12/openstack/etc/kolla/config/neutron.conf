# Surcharge de neutron.conf (M10-E12) — MTU.
# global_physnet_mtu = la plus grande MTU que l'infrastructure physique transporte, ici celle
# d'OS-TUN (VLAN 51, 9000). Elle plafonne aussi les réseaux flat/VLAN : ext-net est protégé
# par physical_network_mtus (ml2_conf.ini).
[DEFAULT]
global_physnet_mtu = 9000
