# Surcharge de glance-api.conf (M10-E10).
# Publier l'emplacement Ceph des images (rbd://<fsid>/images/<id>/snap) : Nova et Cinder s'en
# servent pour CLONER l'image au lieu de la télécharger. Sans lui, chaque démarrage copie
# l'image entière depuis Glance.
# Risque (avertissement de Kolla et de Glance) : l'emplacement est visible de tout utilisateur
# qui lit l'image. Acceptable ici : un seul magasin (rbd), et l'emplacement ne donne aucun accès
# sans clé cephx. À revoir si un second magasin (fichier, S3) est ajouté.
[DEFAULT]
show_image_direct_url = True
