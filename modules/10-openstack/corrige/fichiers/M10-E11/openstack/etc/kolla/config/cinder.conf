# Surcharge de cinder.conf (M10-E11) : type de volume par défaut.
# Le type « ceph-standard » est créé par l'API (openstack volume type create) AVANT de
# déployer cette surcharge : un default_volume_type inconnu fait échouer les créations sans
# --type (« Default volume type not found »).
[DEFAULT]
default_volume_type = ceph-standard
