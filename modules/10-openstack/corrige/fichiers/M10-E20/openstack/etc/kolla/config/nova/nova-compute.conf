# Surcharge de nova.conf pour le seul service nova-compute, sur tous les calculs (M10-E20).
# Mesure de M10-E13 : ≈ 1,3 Gio pour le système et les conteneurs de Kolla d'un calcul ; la
# réserve par défaut (512 Mio) laissait l'ordonnanceur promettre de la mémoire inexistante.
[DEFAULT]
reserved_host_memory_mb = 2048
