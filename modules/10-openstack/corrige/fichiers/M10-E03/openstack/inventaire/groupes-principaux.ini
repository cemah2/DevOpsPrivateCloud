# inventaire/groupes-principaux.ini — les groupes que NOUS choisissons (M10-E03).
# outils/inventaire.sh les assemble avec les groupes de services de l'exemple « multinode » de
# la version INSTALLÉE de Kolla-Ansible pour produire inventaire/multinode. Ne modifie pas
# inventaire/multinode à la main : modifie ce fichier et relance le script.

[control]
osctl01

[network]
osctl01

[compute]
oscmp01
oscmp02

[monitoring]
osctl01

# Depuis Kolla-Ansible 22 (2026.1), cinder-volume et cinder-backup suivent le groupe « cinder »
# (enfant de control dans l'exemple, donc osctl01) ; storage ne sert plus qu'aux variantes LVM.
# osctl01 y reste : la page « External Ceph » le demande encore, et cela ne coûte rien.
[storage]
osctl01

[deployment]
localhost       ansible_connection=local

# Nos nœuds, pour leur donner les paramètres de connexion (group_vars/noeuds_openstack.yml)
# sans toucher à « localhost ».
[noeuds_openstack:children]
control
network
compute
monitoring
storage
