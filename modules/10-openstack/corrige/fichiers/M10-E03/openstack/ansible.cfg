# ansible.cfg de plateforme/openstack (M10-E03). Lu par Ansible quand on lance une commande
# DEPUIS ce dossier (kolla-ansible appelle ansible-playbook dans le dossier courant).
# Rien de commun avec ~/src/ansible/ansible.cfg : autre projet, autre ansible-core.

[defaults]
# Collections DU PROJET (Kolla + openstack.cloud), jamais ~/.ansible/collections : elles
# seraient partagées avec plateforme/ansible (ansible-core 2.21) et l'un écraserait l'autre.
collections_path = ./collections
# passwords.yml, haproxy.pem et les mots de passe Keystone sont chiffrés sous l'identité
# « critique » (M04-E30). Équivalent de ANSIBLE_VAULT_IDENTITY_LIST.
vault_identity_list = critique@outils/vault-pass-client.sh
vault_id_match = True
# Réglages conseillés par Kolla (« Ansible tuning ») : plus de parallélisme, moins de
# connexions SSH (pipelining).
forks = 20
# Les clés d'hôte des nœuds sont vérifiées (known_hosts de adm01, ou CA SSH de M06).
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
pipelining = True
