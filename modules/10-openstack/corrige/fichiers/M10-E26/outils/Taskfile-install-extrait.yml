# Taskfile.yml de plateforme/outils — EXTRAIT : install:systeme (M02-E20, M06-E29) complétée pour
# ms-verif-openstack (M10-E26).
  install:systeme:
    desc: Installe les scripts dans /usr/local (root:root), pour les services systemd
    cmds:
      - sudo install -D -o root -g root -m 0644 lib/ms-commun.sh /usr/local/lib/ms-commun.sh
      - for: { var: SCRIPTS }
        cmd: sudo install -o root -g root -m 0755 bin/{{.ITEM}} /usr/local/bin/{{.ITEM}}
      - sudo install -D -o root -g root -m 0644 etc/ms-verif-services.conf /usr/local/etc/ms-verif-services.conf
      - sudo install -D -o root -g root -m 0644 etc/ms-verif-openstack.conf /usr/local/etc/ms-verif-openstack.conf
    vars:
      SCRIPTS: ms-snapshot ms-verif-sauvegardes ms-alerte ms-verif-services ms-verif-openstack
