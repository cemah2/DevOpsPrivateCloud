# etc/ms-verif-openstack.conf — ce que surveille ms-verif-openstack (M10-E26, PLAT-1152).
# Installé dans /usr/local/etc par « task install:systeme ». Modifié par MR, comme le code :
# ajouter un nœud ou un point TLS = une ligne ici, jamais une modification du script.
# Syntaxe bash (fichier chargé par le script) : tableaux et variables simples, aucune commande.

# Nuage de clouds.yaml : identifiant d'application de svc-supervision, règles d'accès GET seules.
MS_OS_CLOUD=medisphere-supervision

# Nœuds OpenStack (SSH en lecture, « sudo -n docker »)
MS_OS_NOEUDS=(osctl01 oscmp01 oscmp02)
# Calculs qui doivent avoir un nova-compute enregistré
MS_OS_CALCULS=(oscmp01 oscmp02)
# Services Cinder attendus (backend Ceph, sauvegardes activées)
MS_OS_CINDER_BINAIRES=(cinder-scheduler cinder-volume cinder-backup)
# Occupation maximale de /var/lib/docker (%)
MS_OS_SEUIL_DISQUE=85

# Racine de confiance et points TLS « nom:port »
MS_RACINE=/usr/local/share/ca-certificates/medisphere-root-ca.crt
MS_POINTS_TLS=(
  openstack.par1.medisphere.internal:5000
  openstack.par1.medisphere.internal:443
  openstack-int.par1.medisphere.internal:5000
)
