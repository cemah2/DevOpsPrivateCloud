---
# globals.yml — configuration InfoGér « référence santé », adaptée MédiSphère
# (secrets fictifs)

kolla_base_distro: "ubuntu"
openstack_release: "master"
kolla_install_type: "source"

# Registre d'images InfoGér (plus rapide)
docker_registry: "registry.infoger.local:4000"
docker_registry_insecure: "yes"
docker_namespace: "kolla"

# Réseau : une seule interface pour tout
network_interface: "ens18"
tunnel_interface: "ens18"
neutron_external_interface: "ens18"

kolla_internal_vip_address: "10.10.50.1"
kolla_external_vip_address: "{{ kolla_internal_vip_address }}"
kolla_external_fqdn: "openstack.infoger-sante.local"
keepalived_virtual_router_id: "50"

kolla_enable_tls_internal: "no"
kolla_enable_tls_external: "no"

# Réseau virtuel
neutron_plugin_agent: "openvswitch"
enable_neutron_provider_networks: "yes"

# Services
enable_cinder: "yes"
enable_cinder_backup: "yes"
cinder_backup_driver: "nfs"
cinder_backup_share: "10.0.0.5:/exports/backups-clients"
enable_heat: "yes"
enable_horizon: "yes"
enable_octavia: "yes"
octavia_provider_drivers: "amphora:Amphora provider"

# Supervision et journaux tout-en-un
enable_prometheus: "yes"
enable_grafana: "yes"
enable_central_logging: "yes"
openstack_logging_debug: "True"

# Stockage Ceph
glance_backend_file: "yes"
glance_backend_ceph: "yes"
cinder_backend_ceph: "yes"
nova_backend_ceph: "yes"
ceph_glance_user: "admin"
ceph_cinder_user: "admin"
ceph_nova_pool_name: "volumes"

# Calcul
nova_compute_virt_type: "qemu"

# Accès administrateur immédiat
keystone_admin_password: "InfoGer2024!"
