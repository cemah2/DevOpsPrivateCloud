# plateforme/observabilite — thanos/thanos-store.yaml (M21-E24, PLAT-2224)
# Store Gateway : sert en gRPC (StoreAPI) les blocs du compartiment thanos-k8s-par1. Il ne copie
# pas les blocs : il télécharge leurs index (index-header, sur son volume) et lit les morceaux
# (chunks) à la demande, par plages d'octets. Son volume est un CACHE : le perdre ne perd rien.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-store
automountServiceAccountToken: false
---
# Service headless : Thanos Query découvre le(s) pod(s) par l'enregistrement SRV _grpc._tcp.
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  labels:
    app.kubernetes.io/name: thanos-store
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-store
  ports:
    - {name: grpc, port: 10901, targetPort: grpc}
    - {name: http, port: 10902, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store
  labels:
    app.kubernetes.io/name: thanos-store
    app.kubernetes.io/component: store
spec:
  serviceName: thanos-store
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-store
        app.kubernetes.io/component: store
    spec:
      serviceAccountName: thanos-store
      automountServiceAccountToken: false
      priorityClassName: medisphere-critique
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: thanos-store
          image: quay.io/thanos/thanos
          args:
            - store
            - --log.level=info
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore/objstore.yml
            # Valeurs par défaut (250 Mo d'index en mémoire, 2 Go de réserve de chunks) taillées pour
            # de gros compartiments : ramenées à la taille du lab, sous la limite mémoire du conteneur.
            - --index-cache-size=128MB
            - --chunk-pool-size=256MB
            # Pas de --min-time/--max-time : le Store sert TOUT le compartiment. Les 15 derniers
            # jours sont aussi chez les sidecars : Thanos Query fusionne et dédoublonne (les blocs
            # du compartiment portent les mêmes étiquettes externes que les sidecars).
            # Relecture de la liste des blocs du compartiment (nouveaux blocs, blocs compactés).
            - --sync-block-duration=5m
          ports:
            - {name: http, containerPort: 10902}
            - {name: grpc, containerPort: 10901}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
            # Au démarrage, le Store télécharge les index-headers de tous les blocs : prêt
            # seulement ensuite (quelques minutes sur un compartiment de plusieurs mois).
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: donnees, mountPath: /var/thanos/store}
            - {name: objstore, mountPath: /etc/thanos/objstore, readOnly: true}
            - {name: racine-medisphere, mountPath: /etc/thanos/ca, readOnly: true}
      volumes:
        # Secret hors Git (plateforme/k8s/outils/secrets-k8s.sh, composant thanos).
        - name: objstore
          secret:
            secretName: thanos-objstore
        - name: racine-medisphere
          configMap:
            name: racine-medisphere
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        storageClassName: ceph-rbd
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
