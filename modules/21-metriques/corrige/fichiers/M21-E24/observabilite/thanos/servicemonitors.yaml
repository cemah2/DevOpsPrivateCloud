# plateforme/observabilite — thanos/servicemonitors.yaml (M21-E24, PLAT-2224 ; Compactor en E25)
# Collecte des métriques de Thanos Query et du Store Gateway (jobs « thanos-query » et
# « thanos-store », du nom des Services). Les sidecars sont collectés par le ServiceMonitor du
# chart (job « kps-thanos-discovery »). L'étiquette de sélection vient de la kustomization racine.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos-query
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  endpoints:
    - port: http
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos-store
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-store
  endpoints:
    - port: http
      interval: 30s
