# plateforme/observabilite — regles/alertmanager.yaml (M21-E36, INC-4836)
# kube-prometheus-stack fournit déjà AlertmanagerFailedToSendAlerts (severity: warning) : elle sonne
# bien quand le courriel est cassé, mais sa route du cluster passe par le courriel cassé ; seul le
# chemin de secours de M21-E28 (additionalAlertManagerConfigs, filtre « Alertmanager.+ ») la porte
# jusqu'à l'Alertmanager témoin de mon01. Cette alerte-ci est critique et propre au courriel ; son
# nom commence par « Alertmanager » : elle prend le même chemin de secours sans rien y changer.
# L'étiquette relais="temoin" sert au second chemin, facultatif, tiré par le témoin (job
# « relais-cluster », M21-E36) quand le flux K8S_TRAV → mon01:9093 est lui aussi coupé.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alertmanager
spec:
  groups:
    - name: alertmanager.transport
      rules:
        - alert: AlertmanagerCourrielEnEchec
          expr: |
            sum by (pod) (increase(alertmanager_notifications_failed_total{namespace="supervision", integration="email"}[15m])) > 0
          for: 5m
          labels:
            gravite: critique
            equipe: plateforme
            relais: temoin
          annotations:
            resume: "Alertmanager du cluster ({{ $labels.pod }}) n'arrive plus à envoyer de courriel"
            description: >-
              {{ $value | humanize }} envois en échec en 15 minutes. Aucune alerte du cluster n'arrive
              plus par courriel : c'est l'Alertmanager témoin de mon01 qui relaie celle-ci. RB-218 § « l'alerte
              n'arrive pas ».
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/observabilite/metriques/runbooks/RB-218-alertes-muettes-ou-bavardes.md
