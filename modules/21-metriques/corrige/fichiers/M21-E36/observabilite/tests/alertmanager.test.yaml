# plateforme/observabilite — tests/alertmanager.test.yaml (M21-E36)
rule_files:
  - ../build/regles/alertmanager.yml
evaluation_interval: 30s
tests:
  - name: des échecs d'envoi répétés déclenchent l'alerte relayée par le témoin
    interval: 1m
    input_series:
      # 0 pendant 5 min, puis 2 échecs par minute (tentatives et nouvelles tentatives).
      - series: 'alertmanager_notifications_failed_total{namespace="supervision", pod="alertmanager-kps-0", integration="email", reason="other"}'
        values: '0x5 2+2x30'
      - series: 'alertmanager_notifications_failed_total{namespace="supervision", pod="alertmanager-kps-0", integration="webhook", reason="other"}'
        values: '0x35'
    alert_rule_test:
      - eval_time: 5m
        alertname: AlertmanagerCourrielEnEchec
        exp_alerts: []
      - eval_time: 15m
        alertname: AlertmanagerCourrielEnEchec
        exp_alerts:
          - exp_labels:
              alertname: AlertmanagerCourrielEnEchec
              gravite: critique
              equipe: plateforme
              relais: temoin
              pod: alertmanager-kps-0
            exp_annotations:
              resume: "Alertmanager du cluster (alertmanager-kps-0) n'arrive plus à envoyer de courriel"
              description: >-
                20 envois en échec en 15 minutes. Aucune alerte du cluster n'arrive plus par courriel : c'est le témoin de mon01 qui relaie celle-ci. RB-218 § « l'alerte n'arrive pas ».
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/observabilite/metriques/runbooks/RB-218-alertes-muettes-ou-bavardes.md
  - name: un seul échec isolé, puis plus rien, ne déclenche rien
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{namespace="supervision", pod="alertmanager-kps-0", integration="email", reason="other"}'
        values: '0x5 1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: AlertmanagerCourrielEnEchec
        exp_alerts: []
