apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: medidoc
  labels:
    medisphere.internal/supervision: "oui"
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: medidoc
      medisphere.internal/collecte: prometheus
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
