# À INTÉGRER dans plateforme/charts-miroir — charts.yaml (format de M20-E13 : liste « charts: »,
# champs nom, depot, version, empreinte, usage), M21-E02. Une entrée de plus dans la liste.
# Empreinte : sha256 de l'archive publiée par le projet, relevée dans l'index du dépôt amont
#   curl -s https://prometheus-community.github.io/helm-charts/index.yaml \
#     | yq '.entries."kube-prometheus-stack"[] | select(.version == "92.11.0") | .digest'
# et recalculée sur l'archive téléchargée (sha256sum) : les deux doivent être égales.
# Les sous-charts (crds, kube-state-metrics, prometheus-node-exporter, grafana) sont DANS
# l'archive (dossier charts/) : rien d'autre à recopier, Argo CD ne tire rien de ghcr.io.
charts:
  # … entrées existantes (argo-rollouts…) …
  - nom: kube-prometheus-stack
    depot: https://prometheus-community.github.io/helm-charts
    version: 92.11.0
    empreinte: sha256:c357a259965187edcbed86591461bfbd56997591afba09be3a49a09b2bec8a2c
    usage: "Supervision (M21-E02), Application plateforme/gitops plateforme/kube-prometheus-stack.yaml"
