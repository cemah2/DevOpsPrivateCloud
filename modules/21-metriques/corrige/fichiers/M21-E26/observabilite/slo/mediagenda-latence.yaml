# plateforme/observabilite — slo/mediagenda-latence.yaml (M21-E26, PLAT-2226)
# SLI : part des requêtes de l'API de PRODUCTION servies en moins de 250 ms.
# Pourquoi 250 ms et pas 300 ms (ticket) : l'histogramme mediagenda_http_request_duration_seconds
# garde les seaux par défaut du client Python (… 0.1, 0.25, 0.5 …) : il n'existe AUCUN seau
# le="0.3", et on ne peut pas compter « < 300 ms » sans lui. On mesure donc un objectif plus
# strict (250 ms) jusqu'à ce que l'équipe MédiAgenda ajoute un seau 0.3 (ticket DEV-2226) ; ce
# jour-là, remplacer 0.25 par 0.3 ici. Une interpolation (histogram_quantile) ne compte pas des
# requêtes : elle ne sert pas à un SLO.
apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: mediagenda-latence
spec:
  description: "API MédiAgenda (production) : requêtes servies en moins de 250 ms"
  target: "95"
  window: 28d
  indicator:
    latency:
      success:
        metric: mediagenda_http_request_duration_seconds_bucket{namespace="mediagenda-prod", route!~"/sante|/pret|/metrics", le="0.25"}
      total:
        metric: mediagenda_http_request_duration_seconds_count{namespace="mediagenda-prod", route!~"/sante|/pret|/metrics"}
  alerting:
    burnrates: false
    absent: false
