---
# roles/node_exporter/tasks/main.yml — version 2 (M21-E08, PLAT-2208)
# Ordre : contrôles → binaire → utilisateur → certificat → configuration → bascule depuis le paquet
# Debian de la version 1 → service → vérification de l'extérieur.

- name: Refuser une cible non prise en charge avant toute action
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
      - ansible_facts['architecture'] == 'x86_64'
      - node_exporter_port | int >= 1024 and node_exporter_port | int <= 65535
      - node_exporter_adresse is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - node_exporter_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      node_exporter v2 : Debian ou EL sur x86_64, port 1024-65535, adresse IPv4, empreinte sha256 de 64
      caractères hexadécimaux (reçu : {{ ansible_facts['os_family'] }}/{{ ansible_facts['architecture'] }},
      {{ node_exporter_adresse }}:{{ node_exporter_port }}).
    quiet: true

- name: Binaire amont vérifié et installé
  ansible.builtin.import_tasks: installer.yml

- name: Certificat TLS du service
  ansible.builtin.import_tasks: tls.yml
  when: node_exporter_tls

- name: Configuration web (TLS)
  ansible.builtin.template:
    src: web.yml.j2
    dest: /etc/node_exporter/web.yml
    owner: root
    group: node_exporter
    mode: "0640"
  notify: Redémarrer node_exporter

# --- Bascule depuis la version 1 (paquet Debian prometheus-node-exporter, M04-E34) ---
# Les deux écoutent sur 9100 : on retire l'ancien AVANT de démarrer le nouveau. Coupure de
# collecte de quelques secondes, sans conséquence (aucune alerte ne repose encore dessus).
- name: Retirer le paquet Debian de la version 1
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: absent
    purge: true
  when: ansible_facts['os_family'] == 'Debian'

# Après la purge (qui peut supprimer le dossier s'il est vide) : le collecteur textfile garde son
# dossier, lisible par node_exporter, inscriptible par root (et les outils ms-verif-*).
- name: Dossier du collecteur textfile
  ansible.builtin.file:
    path: "{{ node_exporter_dossier_textfile }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Métrique d'inventaire medisphere_info (reprise de M04-E34)
  ansible.builtin.template:
    src: medisphere.prom.j2
    dest: "{{ node_exporter_dossier_textfile }}/medisphere.prom"
    owner: root
    group: root
    mode: "0644"

- name: Unité systemd durcie
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer node_exporter

- name: Le service démarre avec la machine et tourne
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Appliquer les nouveaux paramètres maintenant
  ansible.builtin.meta: flush_handlers

- name: Vérifier de l'extérieur
  ansible.builtin.import_tasks: verifier.yml
