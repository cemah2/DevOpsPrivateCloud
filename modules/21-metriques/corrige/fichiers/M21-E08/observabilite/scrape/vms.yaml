# scrape/vms.yaml — GÉNÉRÉ par plateforme/ansible playbooks/supervision-cibles.yml depuis NetBox
# (M21-E08). Ne pas modifier à la main : la prochaine génération l'écraserait. Pour ajouter une VM,
# ajoute-la dans NetBox (étiquette socle, statut actif) et relance le playbook.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: vms
  namespace: supervision
  labels:
    medisphere.internal/supervision: "oui"
spec:
  # job="vms" (sinon l'opérateur nomme le job « scrapeConfig/supervision/vms »).
  jobName: vms
  scheme: https
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 10s
  # Certificat de chaque node_exporter vérifié contre la racine MédiSphère (ConfigMap posée par
  # kps/values.yaml, M21-E06), pour le NOM de la cible : jamais insecureSkipVerify.
  tlsConfig:
    ca:
      configMap:
        name: racine-medisphere
        key: ca.crt
  relabelings:
    # instance = nom court de l'hôte, plus lisible que « nom.complet:9100 ».
    - sourceLabels: [__address__]
      regex: '([^.:]+)[.:].*'
      targetLabel: instance
      replacement: '${1}'
  staticConfigs:
    - targets: ["adm01.par1.medisphere.internal:9100"]
      labels:
        hote: adm01
        role: bastion
        site: par1
        equipe: plateforme
    - targets: ["ca01.par1.medisphere.internal:9100"]
      labels:
        hote: ca01
        role: pki
        site: par1
        equipe: plateforme
    - targets: ["dns01.par1.medisphere.internal:9100"]
      labels:
        hote: dns01
        role: dns
        site: par1
        equipe: plateforme
    - targets: ["dns02.par1.medisphere.internal:9100"]
      labels:
        hote: dns02
        role: dns
        site: par1
        equipe: plateforme
    - targets: ["git01.par1.medisphere.internal:9100"]
      labels:
        hote: git01
        role: gitlab
        site: par1
        equipe: plateforme
    - targets: ["gw01.par1.medisphere.internal:9100"]
      labels:
        hote: gw01
        role: routeur
        site: par1
        equipe: plateforme
    - targets: ["gw02.par1.medisphere.internal:9100"]
      labels:
        hote: gw02
        role: routeur
        site: par1
        equipe: plateforme
    - targets: ["lb01.par1.medisphere.internal:9100"]
      labels:
        hote: lb01
        role: lb
        site: par1
        equipe: plateforme
    - targets: ["lb02.par1.medisphere.internal:9100"]
      labels:
        hote: lb02
