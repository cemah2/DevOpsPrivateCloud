# =============================================================================
# .pre-commit-config.yaml — plateforme/outils, version corrigée (M01-E32)
# Base : configuration de référence de M01-E15 (à reprendre telle quelle si elle
# diffère de cet exemple autonome), plus les hooks propres au projet au M02.
# Après modification : pre-commit validate-config && pre-commit install
# =============================================================================
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0 (empreinte, comme la référence de M01-E15)
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]             # syntaxe seulement : accepte les balises GitLab (!reference)
      - id: check-added-large-files
        args: [--maxkb=5120]         # même limite que le hook serveur (M01-E26)
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks                 # binaire construit par pre-commit, sans Docker

  # commitlint : hook local de la référence M01-E15 (versions figées, identiques à
  # /opt/release-tools en CI), au stage commit-msg (il a besoin du message).
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (Conventional Commits)
        language: node
        language_version: system
        entry: commitlint --edit
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/cli@21.2.3"
          - "@commitlint/config-conventional@21.2.3"

# Les tests unitaires ne sont PAS un hook de commit : trop lents pour chaque commit
# (on finit par contourner avec --no-verify) ; ils tournent en CI (job tests).
