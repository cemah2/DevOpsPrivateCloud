# modele-medisphere.yml — MédiSphère dans NetBox : l'INTENTION (M06-E05).
#
# Lu par modeliser.py, qui crée ou met à jour chaque objet (idempotent). Ce fichier est la
# première description de la source de vérité ; à partir de M06-E11, les ressources des VMs
# (vCPU, mémoire, disque, statut) sont synchronisées depuis Proxmox (la réalité d'exécution) et
# NetBox fait foi pour les adresses, les noms, les rôles (ADR-0060, M06-E31).
#
# Références : PLAN.md §4.2 (VLAN et préfixes), §4.5 (adresses du socle), §4.8 (étiquettes).
# Valeurs propres à ton lab : <IP-PVE01> n'est pas modélisée ici (LAN maison, hors IPAM du lab).

region: {name: France, slug: france}
tenant: {name: MédiSphère, slug: medisphere}

sites:
  - {name: PAR1, slug: par1, description: "Datacenter principal (lab : pve01)"}
  - {name: PAR2, slug: par2, description: "Site de secours (lab : hp01)"}

# Une baie « virtuelle » par site : elle porte les équipements physiques du lab.
racks:
  - {name: PAR1-R01, site: par1, description: "Baie virtuelle du lab, site PAR1"}
  - {name: PAR2-R01, site: par2, description: "Baie virtuelle du lab, site PAR2"}

fabricants:
  - {name: Générique, slug: generique}
  - {name: HPE, slug: hpe}

types_equipement:
  - {model: "Serveur Xeon E-2378G", slug: serveur-xeon-e-2378g, fabricant: generique, u_height: 1}
  - {model: "ProLiant (Xeon E3-1220L v2)", slug: proliant-xeon-e3-1220l-v2, fabricant: hpe, u_height: 1}

roles_equipement:
  - {name: Hyperviseur, slug: hyperviseur, color: "2196f3"}
  - {name: Sauvegarde, slug: sauvegarde, color: "795548"}

types_cluster:
  - {name: Proxmox VE, slug: proxmox-ve}

clusters:
  - {name: pve01, type: proxmox-ve, site: par1, description: "Hyperviseur Proxmox VE 9 du site PAR1 (lab)"}

equipements:
  - {name: pve01, type: serveur-xeon-e-2378g, role: hyperviseur, site: par1, rack: PAR1-R01, position: 10, cluster: pve01}
  - {name: hp01, type: proliant-xeon-e3-1220l-v2, role: sauvegarde, site: par2, rack: PAR2-R01, position: 10,
     description: "Proxmox Backup Server (pbs01)"}

# Rôles IPAM : usage d'une plage ou d'un préfixe (convention PLAN.md §4.2).
roles_ipam:
  - {name: Statique, slug: statique, weight: 1000}
  - {name: Nœuds, slug: noeuds, weight: 1010}
  - {name: DHCP, slug: dhcp, weight: 1020}
  - {name: VIP, slug: vip, weight: 1030}

# Convention d'adresses de chaque /24 du site PAR1 (PLAN.md §4.2) : une plage NetBox par
# ligne et par préfixe de VLAN. La passerelle .1, les réservées .2-.3 et .250-.254 restent
# hors plage.
convention_plages:
  - {debut: 10, fin: 49, role: statique, description: "Adresses statiques de services"}
  - {debut: 50, fin: 99, role: noeuds, description: "Nœuds de clusters"}
  - {debut: 100, fin: 199, role: dhcp, description: "DHCP / provisioning dynamique"}
  - {debut: 200, fin: 249, role: vip, description: "VIP et pools d'IP flottantes"}

groupe_vlan: {name: PAR1, slug: par1, site: par1}

# VLAN du site PAR1 : le préfixe de chacun est 10.10.<vid>.0/24.
vlans:
  - {vid: 10, name: MGMT, description: "Hyperviseurs imbriqués, interfaces d'admin, bastion"}
  - {vid: 20, name: INFRA, description: "Services socle"}
  - {vid: 30, name: STOR-PUB, description: "Ceph public, NFS, iSCSI"}
  - {vid: 31, name: STOR-CLU, description: "Ceph cluster (non routé)"}
  - {vid: 32, name: COROSYNC, description: "Corosync du cluster imbriqué (non routé)"}
  - {vid: 40, name: K8S, description: "Nœuds Kubernetes"}
  - {vid: 41, name: K8S-LB, description: "IP de services Kubernetes (annoncées en BGP)"}
  - {vid: 50, name: OS-API, description: "OpenStack management / API"}
  - {vid: 51, name: OS-TUN, description: "OpenStack overlay (non routé)"}
  - {vid: 52, name: OS-EXT, description: "OpenStack provider / IP flottantes"}
  - {vid: 60, name: PROV, description: "Provisioning PXE"}
  - {vid: 70, name: DMZ, description: "Points d'entrée exposés"}
  - {vid: 99, name: SANDBOX, description: "Exercices jetables, break & fix"}

# Préfixes hors VLAN (agrégats et réseaux sans VLAN de PAR1).
prefixes:
  - {prefix: 10.10.0.0/16, status: container, site: par1, description: "Site PAR1"}
  - {prefix: 10.20.0.0/16, status: container, site: par2, description: "Site PAR2"}
  - {prefix: 10.20.10.0/24, status: active, site: par2, description: "PAR2 MGMT (hp01, iLO)"}
  - {prefix: 10.20.20.0/24, status: reserved, site: par2, description: "PAR2 INFRA (services de secours)"}
  - {prefix: 10.255.0.0/30, status: active, description: "Interconnexion WireGuard PAR1-PAR2 (wg0)"}
  - {prefix: 10.255.1.0/24, status: active, description: "VPN d'administration (wg1)"}

etiquettes:
  - {name: socle, slug: socle, color: "4caf50"}
  - {name: role-routeur, slug: role-routeur, color: "9e9e9e"}
  - {name: role-bastion, slug: role-bastion, color: "9e9e9e"}
  - {name: role-dns, slug: role-dns, color: "9e9e9e"}
  - {name: role-pki, slug: role-pki, color: "9e9e9e"}
  - {name: role-gitlab, slug: role-gitlab, color: "9e9e9e"}
  - {name: role-netbox, slug: role-netbox, color: "9e9e9e"}
  - {name: role-s3, slug: role-s3, color: "9e9e9e"}
  - {name: role-runner, slug: role-runner, color: "9e9e9e"}

# VMs du socle (PLAN.md §4.5). Ressources : relevé de tes VMs (qm config VMID) ;
# mémoire en Mo, disque total en Mo (NetBox 4.6). M06-E11 les synchronise ensuite.
# La première adresse de « interfaces » marquée primaire devient l'IP primaire de la VM.
vms:
  - name: gw01
    vmid: 1000
    vcpus: 1
    memory: 2048
    disk: 16384
    tags: [socle, role-routeur]
    interfaces:
      - {name: ens19.10, ips: [10.10.10.1/24], primaire: true}
      - {name: ens19.20, ips: [10.10.20.1/24]}
      - {name: ens19.30, ips: [10.10.30.1/24]}
      - {name: ens19.40, ips: [10.10.40.1/24]}
      - {name: ens19.50, ips: [10.10.50.1/24]}
      - {name: ens19.52, ips: [10.10.52.1/24]}
      - {name: ens19.60, ips: [10.10.60.1/24]}
      - {name: ens19.70, ips: [10.10.70.1/24]}
      - {name: ens19.99, ips: [10.10.99.1/24]}
      - {name: wg0, ips: [10.255.0.1/30]}
      - {name: wg1, ips: [10.255.1.1/24]}
  - {name: adm01, vmid: 1001, vcpus: 2, memory: 2048, disk: 20480, tags: [socle, role-bastion],
     interfaces: [{name: ens18, ips: [10.10.10.10/24], primaire: true}]}
  - {name: dns01, vmid: 1002, vcpus: 1, memory: 2048, disk: 8192, tags: [socle, role-dns],
     interfaces: [{name: ens18, ips: [10.10.20.10/24], primaire: true}]}
  - {name: ca01, vmid: 1003, vcpus: 1, memory: 1024, disk: 10240, tags: [socle, role-pki],
     interfaces: [{name: ens18, ips: [10.10.20.11/24], primaire: true}]}
  - {name: git01, vmid: 1004, vcpus: 4, memory: 8192, disk: 61440, tags: [socle, role-gitlab],
     interfaces: [{name: ens18, ips: [10.10.20.12/24], primaire: true}]}
  - {name: nbx01, vmid: 1005, vcpus: 2, memory: 4096, disk: 30720, tags: [socle, role-netbox],
     interfaces: [{name: ens18, ips: [10.10.20.13/24], primaire: true}]}
  - {name: s3-01, vmid: 1006, vcpus: 2, memory: 2048, disk: 122880, tags: [socle, role-s3],
     interfaces: [{name: ens18, ips: [10.10.20.14/24], primaire: true}]}
  - {name: runner01, vmid: 1007, vcpus: 2, memory: 4096, disk: 20480, tags: [socle, role-runner],
     interfaces: [{name: ens18, ips: [10.10.20.15/24], primaire: true}]}
