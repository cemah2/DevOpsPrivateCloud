---
# playbooks/ssh-ca.yml — identité SSH des hôtes du socle par certificats (M06-E19).
# Le contrôleur (adm01 ou runner01) doit avoir step-cli : il signe les clés d'hôte.
# serial: 2 : un problème de sshd ne touche jamais tout le socle d'un coup.
- name: Certificats SSH d'hôte
  hosts: socle
  become: true
  serial: 2
  max_fail_percentage: 0
  roles:
    - role: ssh_ca_hote
      tags: [ssh_ca, ssh_ca_hote]
