---
# molecule/powerdns_auth/converge.yml — zones de test calquées sur celles du socle.
- name: Converge — rôle powerdns_auth
  hosts: molecule
  become: true
  vars:
    powerdns_auth_ecoute: ["127.0.0.1:5300", "{{ ansible_facts['default_ipv4']['address'] }}:5300"]
    powerdns_auth_cle_api: molecule-cle-api-de-test-0123456789
    powerdns_auth_soa:
      primaire: dns01.par1.medisphere.internal
      contact: hostmaster.medisphere.internal
      rafraichissement: 3600
      nouvel_essai: 900
      expiration: 1209600
      ttl_negatif: 300
    powerdns_auth_ns: [dns01.par1.medisphere.internal]
    powerdns_auth_zones:
      - nom: medisphere.internal
        enregistrements:
          - {nom: par1.medisphere.internal, type: NS, contenu: dns01.par1.medisphere.internal.}
          - {nom: dns01.par1.medisphere.internal, type: A, contenu: 10.10.20.10}
      - nom: par1.medisphere.internal
      - nom: 10.10.in-addr.arpa
      - nom: zone-api.test
        contenu: api
    powerdns_auth_hotes:
      - {noms: [dns01.par1.medisphere.internal], ip: 10.10.20.10}
      - {noms: [test01.par1.medisphere.internal, alias01.par1.medisphere.internal], ip: 10.10.20.250}
      - {noms: [gw01.par1.medisphere.internal], ip: 10.10.10.1}
      - {noms: [gw01.par1.medisphere.internal], ip: 10.10.99.1, a: false}
      - {noms: [externe.par1.medisphere.internal], ip: 192.168.1.20}
  roles:
    - role: powerdns_auth
