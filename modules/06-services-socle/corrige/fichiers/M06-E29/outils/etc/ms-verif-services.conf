# etc/ms-verif-services.conf — ce que surveille ms-verif-services (M06-E29, PLAT-755).
# Installé dans /usr/local/etc par « task install:systeme ». Modifié par MR, comme le code :
# ajouter un service à surveiller = une ligne ici, jamais une modification du script.
# Syntaxe bash (fichier chargé par le script) : tableaux et variables simples, aucune commande.

# --- DNS ------------------------------------------------------------------------------------
MS_RESOLVEURS=(10.10.20.10 10.10.20.16)        # récurseurs (port 53)
MS_AUTORITAIRES=(10.10.20.10 10.10.20.16)      # serveurs faisant autorité (port 5300)
MS_PORT_AUTORITAIRE=5300
MS_ZONES=(par1.medisphere.internal par2.medisphere.internal 10.10.in-addr.arpa 20.10.in-addr.arpa)
MS_ZONES_SIGNEES=(par1.medisphere.internal)
MS_NOM_INTERNE=git01.par1.medisphere.internal
MS_NOM_INTERNET=deb.debian.org

# --- DHCP (Kea, socket de contrôle HTTPS) ----------------------------------------------------
MS_KEA=(10.10.20.10 10.10.20.16)
MS_KEA_PORT=8004
MS_KEA_SOUS_RESEAU=99
MS_KEA_LIBRES_MIN=10

# --- NetBox et PKI ---------------------------------------------------------------------------
MS_NETBOX_URL=https://nbx01.par1.medisphere.internal
MS_NETBOX_VERSION='^4\.6\.'
MS_CA_URL=https://ca01.par1.medisphere.internal
MS_RACINE=/usr/local/share/ca-certificates/medisphere-root-ca.crt

# --- Certificats : « nom:port » (le nom sert à la connexion, au SNI et à la vérification) -------
MS_POINTS_TLS=(
  git01.par1.medisphere.internal:443
  nbx01.par1.medisphere.internal:443
  ca01.par1.medisphere.internal:443
  s3-01.par1.medisphere.internal:8333
  dns01.par1.medisphere.internal:8004
  dns02.par1.medisphere.internal:8004
)
