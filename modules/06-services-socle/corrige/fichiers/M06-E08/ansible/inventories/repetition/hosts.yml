---
# inventories/repetition/hosts.yml — RÉPÉTITION de la bascule DNS sur une VM d'essai (M06-E08).
# VM 2060 m06-repetition : clone de l'image dorée courante, pool lab, étiquette env-m06 (et SURTOUT
# pas role-dns : elle n'a rien à faire dans l'inventaire du socle), VNet vsandbox, adresse DHCP.
# Usage, depuis la racine de plateforme/ansible :
#   uv run ansible-playbook -i inventories/repetition playbooks/dns01.yml            # état « avant »
#   uv run ansible-playbook -i inventories/repetition playbooks/bascule-dns.yml \
#     -e @inventories/repetition/apres.yml                                           # la bascule
# Adresse de la VM : lue dans Proxmox (agent QEMU) après création ; à reporter ci-dessous.
all:
  children:
    role_dns:
      hosts:
        m06-repetition:
          ansible_host: "<IP-DE-LA-VM-2060>"
          ansible_user: admin
