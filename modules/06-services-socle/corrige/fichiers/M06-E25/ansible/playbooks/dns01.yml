---
# playbooks/dns01.yml — DNS et DHCP du lab (groupe role_dns), version M06-E25 : la version de
# M06-E24, plus le certificat TLS de Kea (rôle certificats_acme) AVANT le rôle kea_dhcp4, qui le lit.
- name: DNS (PowerDNS) et DHCP (Kea)
  hosts: role_dns
  become: true
  serial: 1
  order: sorted
  any_errors_fatal: true
  roles:
    - role: powerdns_auth
      tags: [powerdns, powerdns_auth]
    - role: powerdns_recursor
      tags: [powerdns, powerdns_recursor]
    - role: certificats_acme
      tags: [kea, certificats_acme]
    - role: kea_ddns
      tags: [kea, kea_ddns]
    - role: kea_dhcp4
      tags: [kea, kea_dhcp4]
  post_tasks:
    - name: Le récurseur de cet hôte résout un nom interne et un nom Internet
      ansible.builtin.command: "dig +short +time=2 +tries=2 @127.0.0.1 {{ item }} A"
      loop:
        - git01.par1.medisphere.internal
        - deb.debian.org
      register: dns_sonde
      changed_when: false
      failed_when: dns_sonde.stdout | length == 0
      when: not ansible_check_mode
