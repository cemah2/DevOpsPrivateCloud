---
- name: Unités systemd de NetBox (gunicorn, file de tâches)
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop:
    - netbox
    - netbox-rq
  notify: Redémarrer NetBox

- name: Services NetBox activés au démarrage
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    enabled: true
    daemon_reload: true
  loop:
    - netbox
    - netbox-rq

- name: Appliquer maintenant les redémarrages en attente (la suite en dépend)
  ansible.builtin.meta: flush_handlers

- name: Services NetBox démarrés
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: started
  loop:
    - netbox
    - netbox-rq
