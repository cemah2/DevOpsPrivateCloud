# /etc/systemd/system/step-ca.service.d/20-durcissement.conf — ca01 (M06-E30, SEC-756)
# Confinement systemd de step-ca. Mesure avant/après : systemd-analyze security step-ca.service
# (le score « exposure » doit baisser nettement). Après application, TESTER : émission ACME,
# renouvellement, révocation, CRL (port 80), /health. En cas de refus, journalctl -u step-ca
# indique l'appel système ou le chemin bloqué : retirer la ligne fautive, pas tout le fichier.
# Non testé en conditions réelles par l'auteur du corrigé (SystemCallFilter en particulier).
[Service]
NoNewPrivileges=yes
# Seule capacité : ouvrir 443 et 80 sans être root.
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
ProtectSystem=strict
# La base (Badger) et la CRL s'écrivent sous /etc/step-ca : seul répertoire en écriture.
ReadWritePaths=/etc/step-ca
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
UMask=0077
