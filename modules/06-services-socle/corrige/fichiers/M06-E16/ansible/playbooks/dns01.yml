---
# playbooks/dns01.yml — DNS et DHCP du lab (groupe role_dns), version M06-E16.
# dnsmasq a quitté dns01 : DNS par PowerDNS depuis M06-E08, DHCP par Kea à partir d'ici.
# serial: 1 et any_errors_fatal : quand dns02 existera (M06-E24), jamais les deux à la fois.
- name: DNS (PowerDNS) et DHCP (Kea)
  hosts: role_dns
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: powerdns_auth
      tags: [powerdns, powerdns_auth]
    - role: powerdns_recursor
      tags: [powerdns, powerdns_recursor]
    - role: kea_dhcp4
      tags: [kea, kea_dhcp4]
