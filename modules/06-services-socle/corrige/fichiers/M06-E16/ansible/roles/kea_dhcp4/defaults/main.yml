---
# Rôle kea_dhcp4 — serveur DHCPv4 Kea 3.0 (M06-E16 ; API de contrôle et DDNS en M06-E17).
# Remplace le DHCP de dnsmasq pour le VLAN SANDBOX (relayé par gw01, giaddr 10.10.99.1).
# Valeurs du site dans inventories/lab/group_vars/role_dns/kea.yml.
# Évolution : M06-E25 (API en HTTPS sur l'adresse de service, TLS, haute disponibilité) ; état
# final des variables : M06-E25/ansible/roles/kea_dhcp4/defaults/main.yml.

kea_dhcp4_entete: >-
  {{ ms_gere_par | default('Fichier géré par Ansible (projet plateforme/ansible).
  Toute modification manuelle sera écrasée au prochain passage.') }}

# --- Paquets (dépôt ISC sur Cloudsmith : Kea 2.6 de Debian 13 est en fin de vie) -----------
kea_dhcp4_depot_url: https://dl.cloudsmith.io/public/isc/kea-3-0/deb/debian
kea_dhcp4_depot_cle_url: https://dl.cloudsmith.io/public/isc/kea-3-0/gpg.B16C44CD45514C3C.key
# Empreinte de la clé de signature du dépôt (vérifiée AVANT de lui faire confiance).
kea_dhcp4_depot_cle_empreinte: 9DA570BB192211885E4EB280B16C44CD45514C3C
# Branche figée (PLAN §6) : toute 3.0.x, jamais une 3.1/3.2 par une mise à jour automatique.
kea_dhcp4_version: "3.0.*"

# --- Écoute ------------------------------------------------------------------------------
# Tout le trafic arrive par le relais de gw01 : sockets UDP ordinaires (pas de socket brute),
# le pare-feu local s'applique, et Kea n'a besoin d'aucune adresse dans le VLAN servi.
kea_dhcp4_interfaces:
  - "{{ ansible_facts['default_ipv4']['interface'] | default('ens18') }}"
kea_dhcp4_type_socket: udp

# --- Baux ----------------------------------------------------------------------------------
# 12 h comme le DHCP de dnsmasq (M00-E14) ; T1 = 50 %, T2 = 87,5 % (valeurs de la RFC 2131).
kea_dhcp4_duree_bail: 43200
# Kea 3.0 n'écrit le fichier de baux que dans /var/lib/kea : nom SEUL, sans chemin.
kea_dhcp4_fichier_baux: kea-leases4.csv
# Réponses NAK aux demandes de bail inconnues : un client renvoyé démarre aussitôt un DISCOVER
# (utile pendant la bascule depuis dnsmasq, qui avait distribué ces baux).
kea_dhcp4_autoritaire: true

# --- Options globales ---------------------------------------------------------------------------
kea_dhcp4_dns: [10.10.20.10]
kea_dhcp4_domaine: par1.medisphere.internal

# --- Sous-réseaux -----------------------------------------------------------------------------
# Liste de { id, reseau, plages: [ "début - fin" ], routeur, ntp, ddns (E17, booléen) }.
# Kea 3.0 exige un « id » explicite et STABLE : il identifie le sous-réseau dans les baux.
kea_dhcp4_sous_reseaux: []

# --- API de contrôle HTTP (M06-E17) ------------------------------------------------------------
# Socket HTTP intégrée à kea-dhcp4 (le Control Agent n'est plus nécessaire, supprimé en 3.2).
# Authentification « basic » : utilisateur en clair, mot de passe dans un fichier de /etc/kea.
kea_dhcp4_api: false
kea_dhcp4_api_adresse: 127.0.0.1
kea_dhcp4_api_port: 8004
kea_dhcp4_api_utilisateur: kea-api
kea_dhcp4_api_mot_de_passe: ""

# Bibliothèques de hooks (nom seul : Kea 3.0 ne les charge que depuis son dossier de hooks).
# libdhcp_lease_cmds.so (libre) : commandes lease4-get, lease4-get-all, lease4-del…
kea_dhcp4_hooks: []

# --- DDNS (M06-E17) : Kea transmet chaque bail à kea-dhcp-ddns (rôle kea_ddns) ---------------------
kea_dhcp4_ddns: false
kea_dhcp4_ddns_suffixe: "{{ kea_dhcp4_domaine }}."
# Client sans nom (option 12/81 absente) : nom fabriqué « dhcp-10-10-99-150 ».
kea_dhcp4_ddns_prefixe_genere: dhcp

kea_dhcp4_fichier: /etc/kea/kea-dhcp4.conf
kea_dhcp4_service: isc-kea-dhcp4-server.service
