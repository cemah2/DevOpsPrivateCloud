---
# molecule/powerdns_recursor/converge.yml — autoritaire (5300) + récurseur (53), comme dns01.
- name: Converge — powerdns_auth puis powerdns_recursor
  hosts: molecule
  become: true
  vars:
    adresse: "{{ ansible_facts['default_ipv4']['address'] }}"
    powerdns_auth_ecoute: ["127.0.0.1:5300"]
    powerdns_auth_cle_api: molecule-cle-api-de-test-0123456789
    powerdns_auth_soa:
      primaire: dns01.par1.medisphere.internal
      contact: hostmaster.medisphere.internal
      rafraichissement: 3600
      nouvel_essai: 900
      expiration: 1209600
      ttl_negatif: 300
    powerdns_auth_ns: [dns01.par1.medisphere.internal]
    powerdns_auth_zones:
      - nom: medisphere.internal
        enregistrements:
          - {nom: par1.medisphere.internal, type: NS, contenu: dns01.par1.medisphere.internal.}
          - {nom: dns01.par1.medisphere.internal, type: A, contenu: 10.10.20.10}
      - nom: par1.medisphere.internal
      - nom: 10.10.in-addr.arpa
    powerdns_auth_hotes:
      - {noms: [dns01.par1.medisphere.internal], ip: 10.10.20.10}
      - {noms: [test01.par1.medisphere.internal], ip: 10.10.20.250}
    powerdns_recursor_ecoute: ["127.0.0.1", "{{ adresse }}"]
    powerdns_recursor_autorises: [127.0.0.0/8, 10.10.0.0/16]
    powerdns_recursor_zones_relayees:
      - {zone: medisphere.internal, serveurs: ["127.0.0.1:5300"]}
      - {zone: par1.medisphere.internal, serveurs: ["127.0.0.1:5300"]}
      - {zone: 10.10.in-addr.arpa, serveurs: ["127.0.0.1:5300"]}
    powerdns_recursor_nta:
      - {nom: medisphere.internal, raison: "zone interne non déléguée depuis la racine"}
      - {nom: 10.10.in-addr.arpa, raison: "zone inverse interne (RFC 1918)"}
  roles:
    - role: powerdns_auth
    - role: powerdns_recursor
