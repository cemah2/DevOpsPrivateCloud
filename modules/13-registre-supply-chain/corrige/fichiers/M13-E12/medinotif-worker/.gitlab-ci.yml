# .gitlab-ci.yml — medinotif/worker, version corrigée de la MR !14 (M13-E12).
# Toute la chaîne vient du gabarit commun (M13-E09) : rien à réécrire, rien à copier.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  - project: plateforme/ci-templates
    ref: v1.<Y>.<Z>                   # étiquette épinglée du dépôt de gabarits
    file:
      - templates/qualite.yml
      - templates/release.yml
      - templates/image.yml           # job caché .hadolint
      - templates/supply-chain.yml
      - templates/verification.yml    # M13-E14 (job verifier-signature)

variables:
  SC_IMAGE_NOM: medisphere/medinotif

# Chaque gabarit déclare ses stages : le projet donne la liste complète (sinon le dernier inclus gagne).
stages: [lint, test, construction, analyse, publication, signature, verification, release]

hadolint:
  extends: .hadolint

verifier-signature:
  extends: .verifier-signature
  needs: [sc:publication, sc:signature]
