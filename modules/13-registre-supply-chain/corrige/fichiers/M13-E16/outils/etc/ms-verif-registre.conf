# etc/ms-verif-registre.conf — ce que surveille ms-verif-registre (M13-E16, CHG-1416).
# Installé dans /usr/local/etc par « task install:systeme ». Modifié par MR, comme le code.
# Syntaxe bash (fichier chargé par le script) : variables simples, aucune commande.

MS_REG_URL=https://registry.par1.medisphere.internal
# Nom présenté par le certificat (connexion, SNI et vérification).
MS_REG_NOM=registry.par1.medisphere.internal
# Métriques de l'exportateur, servies par le proxy de Harbor (harbor.yml, section metric).
MS_REG_METRIQUES=http://reg01.par1.medisphere.internal:9090/metrics
MS_RACINE=/usr/local/share/ca-certificates/medisphere-root-ca.crt
# Version attendue (préfixe de systeminfo.harbor_version) : changée par la MR de la mise à jour (RB-132).
MS_REG_VERSION=v2.15.3
# Réplication planifiée chaque nuit : au-delà de 26 h sans exécution réussie, c'est une anomalie.
MS_REG_REPLICATION_MAX_H=26
# Ramasse-miettes hebdomadaire (M13-E10) : au-delà de 8 jours, il n'a pas tourné.
MS_REG_GC_MAX_JOURS=8
