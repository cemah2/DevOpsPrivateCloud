---
- name: Savoir si Harbor est déjà installé (docker-compose.yml produit par prepare)
  ansible.builtin.stat:
    path: "{{ harbor_dossier }}/docker-compose.yml"
  register: harbor_compose_fichier

- name: Vérifier que le certificat est en place (rôle certificats_acme, avant ce rôle)
  ansible.builtin.stat:
    path: "{{ harbor_tls_certificat }}"
  register: harbor_crt

- name: Refuser d'installer sans certificat
  ansible.builtin.assert:
    that: harbor_crt.stat.exists
    fail_msg: "{{ harbor_tls_certificat }} absent : le rôle certificats_acme (id harbor) doit passer avant (playbooks/registre.yml)."
    quiet: true

- name: Écrire harbor.yml (deux secrets, 600, root)
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: "{{ harbor_dossier }}/harbor.yml"
    owner: root
    group: root
    mode: "0600"
  register: harbor_conf
  diff: false   # jamais de --diff sur ce fichier : il afficherait les mots de passe dans le journal

- name: Première installation (charge les images, prepare, up -d) — une seule fois
  ansible.builtin.command:
    cmd: ./install.sh --with-trivy
    chdir: "{{ harbor_dossier }}"
    creates: "{{ harbor_dossier }}/docker-compose.yml"
  register: harbor_installation

- name: Relancer prepare si harbor.yml a changé sur une instance installée
  ansible.builtin.command:
    cmd: ./prepare --with-trivy
    chdir: "{{ harbor_dossier }}"
  when:
    - harbor_compose_fichier.stat.exists
    - harbor_conf is changed
  changed_when: true
  notify: Redémarrer Harbor

# Harbor 2.15.3+ : exemption de lecture avant la première signature (voir defaults/main.yml).
# prepare réécrit common/config/core/env : la ligne est reposée après chaque install.sh ou prepare,
# et un changement redémarre Harbor (le conteneur core ne lit son env_file qu'à sa création).
- name: Exemption de lecture avant la première signature Cosign (core, Harbor 2.15.3+)
  ansible.builtin.lineinfile:
    path: "{{ harbor_dossier }}/common/config/core/env"
    regexp: '^CONTENT_TRUST_LEGACY_SIGNER_PULL_ENABLED='
    line: "CONTENT_TRUST_LEGACY_SIGNER_PULL_ENABLED={{ 'true' if harbor_cosign_lecture_avant_signature | bool else 'false' }}"
  notify: Redémarrer Harbor
