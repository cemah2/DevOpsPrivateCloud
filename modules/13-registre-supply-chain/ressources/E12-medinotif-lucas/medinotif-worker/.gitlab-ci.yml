# Chaîne de livraison de MédiNotif — Lucas
stages:
  - build
  - scan
  - sign

variables:
  REGISTRY: registry.par1.medisphere.internal
  IMAGE: $REGISTRY/medisphere/medinotif
  HARBOR_USER: admin
  HARBOR_PASSWORD: "Hb-Adm1n-2026!"
  DOCKER_TLS_CERTDIR: ""
  GIT_SSL_NO_VERIFY: "true"

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags: [docker]
  script:
    - docker login $REGISTRY -u $HARBOR_USER -p $HARBOR_PASSWORD
    - docker build -t $IMAGE:latest -t $IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE:latest
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
    - if [ -n "$CI_COMMIT_TAG" ]; then docker tag $IMAGE:latest $IMAGE:$CI_COMMIT_TAG && docker push $IMAGE:$CI_COMMIT_TAG; fi

trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.69.5
    entrypoint: [""]
  tags: [docker]
  allow_failure: true
  script:
    - export TRIVY_USERNAME=$HARBOR_USER TRIVY_PASSWORD=$HARBOR_PASSWORD
    - trivy image --insecure --exit-code 0 --severity CRITICAL $IMAGE:latest

sbom:
  stage: scan
  image: alpine:latest
  tags: [docker]
  script:
    - apk add curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - syft $IMAGE:latest -o spdx-json > sbom.json
  artifacts:
    paths: [sbom.json]

sign:
  stage: sign
  image: bitnami/cosign:latest
  tags: [docker]
  variables:
    COSIGN_PASSWORD: ""
  script:
    - cosign login $REGISTRY -u $HARBOR_USER -p $HARBOR_PASSWORD
    - cosign sign --yes --key cosign.key $IMAGE:latest
    - cosign attest --yes --key cosign.key --type spdxjson --predicate sbom.json $IMAGE:latest
    - cosign verify --key cosign.pub $IMAGE:latest || true
