# plateforme/ansible — tests/infra/pytest.ini (M29-E04)
# pytest trouve ce fichier en remontant depuis tests/infra : il fixe la racine des tests.
[pytest]
testpaths = .
# Un marqueur inconnu est une faute de frappe : refus.
addopts = --strict-markers -ra --junitxml=rapports/junit/testinfra.xml
markers =
    durcissement: rôle durcissement (M26)
    node_exporter: rôle node_exporter (M21)
    alloy: rôle alloy (M22)
    chrony: client de temps du rôle base (M04, M06-E21, M07-E25)
    reseau: contrôle fait depuis le contrôleur (adm01 ou runner01), pas depuis l'hôte
