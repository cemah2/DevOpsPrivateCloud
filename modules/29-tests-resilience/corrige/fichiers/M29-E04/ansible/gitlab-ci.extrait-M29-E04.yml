# plateforme/ansible — .gitlab-ci.yml : job AJOUTÉ en M29-E04 (PLAT-3004). Remplacé en M29-E10 par
# le job validation:testinfra du composant « validation » (même commande, même modèle .socle).
# runner01 (exécuteur shell) : il joint le socle en SSH (clé ansible-ci, from=10.10.20.15) ; la clé est
# préparée par outils/ci-secrets.sh (ANSIBLE_PRIVATE_KEY_FILE) dans le modèle .socle (M04-E30, M25-E11).
# Testinfra ne lit PAS ANSIBLE_PRIVATE_KEY_FILE : on lui passe la clé par --ssh-identity-file.
testinfra:
  extends: .socle
  stage: verifier
  timeout: 30m
  script:
    - uv sync --locked --group tests
    - uv run pytest tests/infra --hosts='ansible://socle' --ssh-identity-file="$ANSIBLE_PRIVATE_KEY_FILE" -n 4
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: rapports/junit/testinfra.xml
  rules:
    # Chaque nuit (pipeline planifié de main, variable PLANIF=testinfra), et à la demande sur main.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PLANIF == "testinfra" && $PROXMOX_TOKEN_SECRET
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $PROXMOX_TOKEN_SECRET
      when: manual
      allow_failure: true
