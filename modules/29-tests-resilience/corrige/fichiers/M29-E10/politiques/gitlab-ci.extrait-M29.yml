# plateforme/politiques — .gitlab-ci.yml : EXTRAIT (M29-E10, PLAT-3010). Les règles Rego sont
# vérifiées (opa check --strict, opa fmt), testées (opa test, conftest verify) et leurs exemples
# rejoués à chaque MR. À côté du job kyverno:tests du M26.
include:
  - component: $CI_SERVER_FQDN/plateforme/ci-templates/validation@v2.11.0
    inputs:
      schemas_crd_version: "2026.10.23"
      politiques_ref: v1.4.0     # inutilisé quand tests_rego est vrai
      tests_rego: true
