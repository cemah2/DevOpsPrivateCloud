# plateforme/infra — .gitlab-ci.yml : EXTRAIT (M29-E10, PLAT-3010).
# Les règles Rego des plans (rego/tofu, M29-E03) s'exécutent DANS le job de plan : le JSON du plan
# (tofu show -json) contient les valeurs sensibles en clair, il ne devient jamais un artefact.
include:
  - component: $CI_SERVER_FQDN/plateforme/ci-templates/validation@v2.11.0
    inputs:
      schemas_crd_version: "2026.10.23"   # exigé par le composant ; inutilisé ici (pas de manifestes)
      politiques_ref: v1.4.0
      regles_kubernetes: false

# Le job de manifestes du composant n'a rien à valider dans ce dépôt.
validation:manifestes:
  rules:
    - when: never

# .plan (M05-E26) : le contrôle des politiques s'ajoute APRÈS le plan enregistré, AVANT le résumé.
.plan:
  script:
    - cd "$DOSSIER"
    - tofu init -input=false -lockfile=readonly
    - |
      rc=0
      tofu plan -input=false -lock-timeout=10m -detailed-exitcode -out=plan.tfplan || rc=$?
      if [ "$rc" -eq 1 ]; then echo "Plan en ERREUR pour $DOSSIER"; exit 1; fi
      echo "$rc" > plan.code
    - !reference [.validation:conftest-plan, script]
    - tofu show -no-color plan.tfplan > plan.txt
    # … suite inchangée (rapport-terraform.json, garde-fou des destructions) …
