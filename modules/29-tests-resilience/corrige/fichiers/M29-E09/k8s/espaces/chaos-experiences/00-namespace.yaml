# visé : on les liste, on les met en pause et on les supprime d'un seul endroit (RB-292). Aucun pod
# n'y tourne : restricted. Seule exception écrite à « rien à la main hors Argo CD » (ADR-0290) :
# les expériences sont appliquées depuis adm01, sous l'identité OIDC de la personne, et versionnées
# dans plateforme/resilience/chaos/.
