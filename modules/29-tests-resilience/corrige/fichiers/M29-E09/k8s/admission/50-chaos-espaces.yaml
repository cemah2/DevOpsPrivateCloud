# plateforme/k8s — admission/50-chaos-espaces.yaml (M29-E09, PLAT-3009)
# ValidatingAdmissionPolicy native (CEL dans le kube-apiserver) : GARDE-FOU n° 3 de Chaos Mesh.
# Le filtre d'espaces (enableFilterNamespace) n'injecte que dans les espaces annotés
# chaos-mesh.org/inject=enabled ; mais n'importe qui peut annoter un espace qu'il a le droit de
# modifier (propriétaire d'un locataire Capsule, M28), et l'annotation n'est pas couverte par
# medisphere-etiquettes-espace-protegees (M26-E17, étiquettes seulement). Cette politique :
#   1. refuse l'annotation chaos-mesh.org/inject=enabled hors de la liste fermée (mediagenda-recette,
#      medinotif-recette, wb-essais) — pour TOUT LE MONDE, administrateurs compris : élargir la
#      liste se fait par MR sur ce fichier, jamais par un « kubectl annotate » ;
#   2. refuse un objet de chaos créé ailleurs que dans chaos-experiences ;
#   3. refuse une expérience dont le sélecteur (selector.namespaces, clés de selector.pods, et
#      target.selector d'une NetworkChaos) sort de la liste fermée.
# Le contrôleur de Chaos Mesh crée lui-même des objets INTERNES (PodNetworkChaos, PodIOChaos,
# PodHttpChaos dans l'espace des pods visés ; WorkflowNode) : ces requêtes-là sont exclues
# (matchConditions), sinon il ne pourrait plus injecter. Il n'est PAS exclu pour le reste : les
# expériences qu'il crée pour un Schedule ou un Workflow (dans chaos-experiences) passent la règle 3.
# C'est ce qui couvre les expériences embarquées (spec.podChaos d'un Schedule, templates d'un
# Workflow) sans avoir à énumérer ici tous les types d'expériences : l'enfant qui viserait un espace
# hors liste est refusé à sa création (le Schedule ou le Workflow l'affiche dans ses événements).
# ⚠️ Avant [Deny] : « kubectl get ns -o json | jq » pour vérifier qu'aucun espace HORS liste n'a déjà
# l'annotation (une mise à jour de cet espace serait refusée tant qu'on ne la retire pas).
# ⚠️ Non testée en conditions réelles à la rédaction : passe d'abord par [Warn, Audit] (voir la liaison).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: medisphere-chaos-espaces
  labels:
    app.kubernetes.io/part-of: plateforme-k8s
  annotations:
    medisphere.internal/ticket: PLAT-3009
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
      - apiGroups: ["chaos-mesh.org"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
  matchConditions:
    - name: hors-objets-internes-du-controleur
      expression: >-
        request.userInfo.username != 'system:serviceaccount:chaos-mesh:chaos-controller-manager' ||
        !(request.resource.resource in ['podnetworkchaos', 'podiochaos', 'podhttpchaos', 'workflownodes'])
  variables:
    - name: autorises
      expression: "['mediagenda-recette', 'medinotif-recette', 'wb-essais']"
    - name: estEspace
      expression: "request.resource.group == '' && request.resource.resource == 'namespaces'"
    - name: injectionDemandee
      expression: >-
        variables.estEspace && has(object.metadata.annotations) &&
        'chaos-mesh.org/inject' in object.metadata.annotations &&
        object.metadata.annotations['chaos-mesh.org/inject'] == 'enabled'
    # Sélecteurs de l'objet : spec.selector (toutes les expériences qui visent des pods) et, pour une
    # NetworkChaos seulement, spec.target.selector (l'autre extrémité ; spec.target d'une HTTPChaos
    # est une chaîne : ne pas la lire).
    - name: selecteurs
      expression: >-
        variables.estEspace || !has(object.spec) ? [] :
        (has(object.spec.selector) ? [object.spec.selector] : []) +
        (request.resource.resource == 'networkchaos' && has(object.spec.target) &&
         has(object.spec.target.selector) ? [object.spec.target.selector] : [])
    # Espaces visés : selector.namespaces et les clés de selector.pods ({espace: [pods]}).
    - name: ciblesAutorisees
      expression: >-
        variables.selecteurs.all(s,
          (!has(s.namespaces) || s.namespaces.all(n, n in variables.autorises)) &&
          (!has(s.pods) || s.pods.all(n, n in variables.autorises)))
  validations:
    - expression: "!variables.injectionDemandee || object.metadata.name in variables.autorises"
      messageExpression: >-
        'annotation chaos-mesh.org/inject=enabled interdite sur l\'espace ' + object.metadata.name +
        ' (autorisés : ' + variables.autorises.join(', ') + ') — PLAT-3009'
      reason: Forbidden
    - expression: "variables.estEspace || request.namespace == 'chaos-experiences'"
      messageExpression: >-
        'les objets de chaos se créent dans l\'espace chaos-experiences, pas dans ' + request.namespace
      reason: Forbidden
    - expression: "variables.ciblesAutorisees"
      messageExpression: >-
        'expérience visant un espace hors de la liste (selector.namespaces, selector.pods ou target.selector ;
        autorisés : ' + variables.autorises.join(', ') + ') — PLAT-3009'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: medisphere-chaos-espaces
  labels:
    app.kubernetes.io/part-of: plateforme-k8s
spec:
  policyName: medisphere-chaos-espaces
  # Étape 1 : ["Warn", "Audit"] le temps de vérifier l'existant ; étape 2 (MR) : ["Deny"].
  validationActions: ["Deny"]
