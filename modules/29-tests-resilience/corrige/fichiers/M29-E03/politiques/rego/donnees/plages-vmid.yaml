# plateforme/politiques — rego/donnees/plages-vmid.yaml (M29-E03, PLAT-3003)
# Plages de VMID par état de plateforme/infra (PLAN §4.6). Clé = dossier de la configuration,
# tel que le job de plan le connaît ($DOSSIER). Bornes incluses.
# Les dossiers envs/mNN n'ont pas besoin d'entrée : la règle 2000 + NN*10 … +9 s'applique (vmid.rego).
# Une entrée ici L'EMPORTE sur la règle générale (modules à plus de 10 VMs, ou plage décalée).
# ⚠️ Aligne les noms sur les dossiers de TON dépôt (ls envs/) : un état absent est refusé.
plages_vmid:
  socle:
    - [1000, 1099]
  # Module 05 : lab-m05 et recette-m05 partagent la plage du module (2050, 2054…).
  envs/lab-m05:
    - [2050, 2059]
  envs/recette-m05:
    - [2050, 2059]
  # Module 06 : ipam01 (2063), stat01 (2069).
  envs/lab-m06:
    - [2060, 2069]
  # Cluster k8s-par1 (M14) : 2141-2147.
  envs/k8s:
    - [2140, 2149]
  # Environnements nommés des blocs A et B (PLAN §4.8, §4.9).
  envs/m07-maquette:
    - [2070, 2079]
  envs/ceph:
    - [2080, 2089]
  envs/hv:
    - [2090, 2099]
  envs/openstack:
    - [2100, 2109]
  envs/provisioning:
    - [2110, 2119]
  # Projets OpenStack (M10) : aucune VM Proxmox ; liste vide = toute VM Proxmox y est refusée.
  envs/openstack-projets: []
  # Module 15 : VM d'essai MetalLB (2151) ; le nom du dossier ne suit pas envs/mNN.
  envs/m15-essai:
    - [2150, 2159]
  # Module 18 : banc 2181-2188 ET k3s HA jetable 5191-5193 (PLAN §4.6) : la règle générale ne suffit pas.
  envs/m18:
    - [2180, 2189]
    - [5191, 5193]
  # Module 20 : lyo-k3s01 (2201) et flux01 (2202).
  envs/m20:
    - [2200, 2209]
  # Invités du cluster imbriqué hv-par1 (M09-E18) : VMID du cluster hv, pas de pve01.
  envs/hv-invites:
    - [120, 139]

# Conventions propres à un état qui ne vise PAS le pool « lab » de pve01 (pool.rego, etiquettes.rego).
# envs/hv-invites : cluster imbriqué hv-par1, jeton limité au pool « recette » (SEC-1027), VMs
# étiquetées « tofu » et « recette » (M09-E18). Toute autre exception passe par une MR relue.
conventions_etat:
  envs/hv-invites:
    pool: recette
    etiquettes: [recette]
