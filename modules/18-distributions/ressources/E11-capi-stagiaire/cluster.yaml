# capi/recette-agenda/cluster.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: recette-agenda
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: recette-agenda
  namespace: recette-agenda
  labels:
    cni: cilium
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["192.168.0.0/16"]
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ProxmoxCluster
    name: recette-agenda
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: recette-agenda-control-plane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxCluster
metadata:
  name: recette-agenda
  namespace: recette-agenda
spec:
  controlPlaneEndpoint:
    host: 10.10.40.155
    port: 6443
  ipv4Config:
    addresses: ["10.10.40.150-10.10.40.169"]
    prefix: 24
    gateway: 10.10.40.1
  dnsServers: ["8.8.8.8", "8.8.4.4"]
  allowedNodes: ["pve01"]
  credentialsRef:
    name: recette-agenda-proxmox
