# capi/recette-agenda/travailleurs.yaml
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: recette-agenda-workers
  namespace: recette-agenda
spec:
  clusterName: recette-agenda
  replicas: 2
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: recette-agenda
      version: v1.36.4
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: recette-agenda-worker
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: recette-agenda-worker
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: recette-agenda-worker
  namespace: recette-agenda
spec:
  template:
    spec:
      sourceNode: "pve01"
      templateID: 9060
      full: true
      storage: local-nvme
      vmIDRange:
        start: 5180
        end: 5199
      numSockets: 1
      numCores: 2
      memoryMiB: 4096
      network:
        networkDevices:
          - name: net0
            bridge: vsandbox
            model: virtio
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: recette-agenda-worker
  namespace: recette-agenda
spec:
  template:
    spec:
      users:
        - name: root
          sshAuthorizedKeys:
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK7lucasPortablePerso lucas@portable"
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            - name: provider-id
              value: "proxmox://'{{ ds.meta_data.instance_id }}'"
