# kind/certs.d/docker.io/hosts.toml — docker.io par le cache Harbor (projet dockerhub), M18-E02.
# Même contenu que les nœuds de k8s-par1 (M14-E19, rôle containerd). « server » : repli si le
# cache ne répond pas (un poste de développement doit continuer à fonctionner).
server = "https://registry-1.docker.io"

[host."https://registry.par1.medisphere.internal/v2/dockerhub"]
  capabilities = ["pull", "resolve"]
  # Le chemin contient déjà /v2/<projet> : containerd ne rajoute pas /v2.
  override_path = true
  ca = "/etc/medisphere/medisphere-root-ca.crt"
