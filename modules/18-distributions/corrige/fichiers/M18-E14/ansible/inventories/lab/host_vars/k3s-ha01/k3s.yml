# host_vars/k3s-ha01/k3s.yml — serveur unique du banc k3s etcd (M18-E14). Rôle k3s de M18-E03/E07.
k3s_version: v1.36.5+k3s1
k3s_role: server
k3s_cluster_init: true            # etcd intégré (et non SQLite)
# Jeton du banc : Vault « lab » (vault_k3s_jeton_k3s_ha), comme en M18-E07.
# Instantanés planifiés et envoi vers s3-01 (tâches etcd_s3.yml ajoutées au rôle en M18-E14).
k3s_etcd_s3_actif: true
k3s_etcd_s3_dossier: k3s-ha
k3s_etcd_snapshot_cron: "0 */6 * * *"
k3s_etcd_snapshot_retention: 8     # local, par nœud
k3s_etcd_s3_retention: 60          # global au cluster ; > 56 = ce que le cycle de vie laisse vivre (14 j × 4)
