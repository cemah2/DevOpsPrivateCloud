---
argument_specs:
  main:
    short_description: Installe RKE2 (RPM) et prépare l'hôte pour le profil CIS.
    options:
      rke2_version_paquet: {type: str, default: "1.36.5~rke2r1", description: "Version du paquet rke2-server/agent."}
      rke2_mineure: {type: str, default: "1.36", description: "Mineure du dépôt RPM."}
      rke2_el: {type: str, default: "10", description: "Version majeure de RHEL/Rocky."}
      rke2_depot_base: {type: str, description: "Racine des dépôts rpm.rancher.io."}
      rke2_cle_url: {type: str, description: "Clé publique des dépôts."}
      rke2_cle_empreinte: {type: str, required: true, description: "Empreinte attendue de la clé."}
      rke2_paquets_hote: {type: list, elements: str, default: [kernel-modules-extra], description: "Paquets exigés par RKE2 sur l'hôte."}
      rke2_role: {type: str, choices: [server, agent], default: server, description: "Rôle du nœud."}
      rke2_premier: {type: str, description: "Premier serveur (amorce etcd)."}
      rke2_adresse_enregistrement: {type: str, description: "URL du superviseur à joindre (port 9345)."}
      rke2_jeton: {type: str, required: true, no_log: true, description: "Jeton du cluster (Vault)."}
      rke2_jeton_fichier: {type: path, default: /etc/rancher/rke2/jeton, description: "Fichier du jeton."}
      rke2_config: {type: dict, default: {}, description: "Options de RKE2 pour config.yaml."}
      rke2_miroirs: {type: dict, default: {}, description: "Registre => miroir."}
      rke2_registre_ca: {type: path, description: "Autorité du cache Harbor."}
      rke2_registre_hote: {type: str, default: registry.par1.medisphere.internal, description: "Hôte du cache Harbor."}
      rke2_sysctl_source: {type: path, default: /usr/share/rke2/rke2-cis-sysctl.conf, description: "Paramètres CIS livrés."}
      rke2_sysctl_dest: {type: path, default: /etc/sysctl.d/60-rke2-cis.conf, description: "Destination des paramètres."}
      rke2_desactiver_firewalld: {type: bool, default: true, description: "Désactiver firewalld (conflit avec Canal)."}
