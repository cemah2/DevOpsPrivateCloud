# capi/revue-lucas/cluster.yaml — espace, Cluster et ProxmoxCluster de recette-agenda (M18-E11, version corrigée).
# Coexiste avec capi-essai : adresses 10.10.40.170-179 et VIP 10.10.40.211 (pas de chevauchement), même
# plage de VMID 5180-5189 (CAPMOX prend le premier libre : dix VMs au plus pour les deux clusters).
apiVersion: v1
kind: Namespace
metadata:
  name: recette-agenda
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: recette-agenda
  namespace: recette-agenda
  labels:
    # Sélectionné par le ClusterResourceSet « cilium » (crs.yaml).
    cni: cilium
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ProxmoxCluster
    name: recette-agenda
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: recette-agenda-plan-controle
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxCluster
metadata:
  name: recette-agenda
  namespace: recette-agenda
spec:
  # VIP du plan de contrôle, portée par kube-vip (fichier statique du KubeadmControlPlane). Hors
  # de la plage des nœuds, dans la zone « VIP » du VLAN 40 (.200-.249, PLAN.md §4.2).
  controlPlaneEndpoint:
    host: 10.10.40.211
    port: 6443
  # Adresses des nœuds : CAPMOX crée lui-même le réservoir InClusterIPPool « recette-agenda-v4-icip »
  # (IPAM in-cluster) à partir de ce bloc.
  ipv4Config:
    addresses: ["10.10.40.170-10.10.40.179"]
    prefix: 24
    gateway: 10.10.40.1
  dnsServers: ["10.10.20.10", "10.10.20.16"]
  allowedNodes: ["<NOEUD>"]
  # Identifiants PAR CLUSTER (Secret dans le même espace, créé par capi/identifiants.sh) : pas
  # d'identifiants globaux dans le contrôleur. CAPMOX pose une ownerRef sur ce Secret : il suit le
  # cluster lors d'un « clusterctl move ».
  credentialsRef:
    name: recette-agenda-proxmox
