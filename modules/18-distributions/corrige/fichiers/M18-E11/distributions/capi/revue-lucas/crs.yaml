# capi/revue-lucas/crs.yaml — Cilium installé par ClusterResourceSet (M18-E11, version corrigée de la MR !7).
# Le contrôleur applique le contenu du ConfigMap « cilium » (généré par capi/cilium/generer-crs.sh avec ESPACE=recette-agenda,
# ressource suivante de cet espace) dans CHAQUE cluster qui porte l'étiquette cni=cilium, une fois
# son API joignable. Mode ApplyOnce (défaut) : appliqué une fois, jamais réconcilié ; les montées
# de version de Cilium se font ensuite par Helm dans le cluster (ou par le module helm de CAPI).
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: cilium
  namespace: recette-agenda
spec:
  strategy: ApplyOnce
  clusterSelector:
    matchLabels:
      cni: cilium
  resources:
    - kind: ConfigMap
      name: cilium
