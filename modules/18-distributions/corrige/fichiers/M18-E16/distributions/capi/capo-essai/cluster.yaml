# capi/capo-essai/cluster.yaml — cluster capo-essai sur OpenStack (M18-E16, facultatif).
# CAPO 0.15 (contrat Cluster API v1beta2) : OpenStackCluster et OpenStackMachineTemplate en
# infrastructure.cluster.x-k8s.io/v1beta2, la version stockée de ses CRD (v1beta1 est encore servie,
# mais ses champs diffèrent : apiServerFloatingIP, apiServerLoadBalancer, flavor en chaîne…).
# Champs relus dans les CRD de infrastructure-components.yaml v0.15.0 ; confronte-les quand même au
# cluster de gestion : kubectl explain openstackcluster.spec --recursive --api-version=infrastructure.cluster.x-k8s.io/v1beta2
# Secret capo-essai-cloud-config : créé hors dépôt (clouds.yaml du compte svc-capi + CA MédiSphère) :
#   kubectl create secret generic capo-essai-cloud-config -n capo-essai \
#     --from-file=clouds.yaml=$HOME/.config/workbook/m18/clouds-capi.yaml --from-file=cacert=<CA>
#   kubectl label secret capo-essai-cloud-config -n capo-essai clusterctl.cluster.x-k8s.io/move=true
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: capo-essai
  namespace: capo-essai
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OpenStackCluster
    name: capo-essai
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: capo-essai-control-plane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackCluster
metadata:
  name: capo-essai
  namespace: capo-essai
spec:
  identityRef:
    type: Secret
    cloudName: medisphere-capi
    name: capo-essai-cloud-config
  externalNetwork:
    filter:
      name: ext-net
  # Réseau, sous-réseau et routeur créés (et supprimés) par CAPO.
  managedSubnets:
    - cidr: 10.6.0.0/24
      dnsNameservers: [10.10.20.10, 10.10.20.16]
  # Un seul nœud de contrôle : IP flottante fixe plutôt qu'un répartiteur Octavia (voir capo.md).
  # Sans managedLoadBalancer, CAPO ne crée aucun répartiteur.
  apiServer:
    enableFloatingIP: true
    floatingIP: 10.10.52.210
  managedSecurityGroups:
    allowAllInClusterTraffic: true
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: capo-essai-control-plane
  namespace: capo-essai
spec:
  replicas: 1
  version: v1.36.5
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OpenStackMachineTemplate
        name: capo-essai-control-plane
  kubeadmConfigSpec:
    initConfiguration:
      nodeRegistration:
        name: "{{ local_hostname }}"
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
          - name: provider-id
            value: "openstack:///{{ instance_id }}"
    joinConfiguration:
      nodeRegistration:
        name: "{{ local_hostname }}"
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
          - name: provider-id
            value: "openstack:///{{ instance_id }}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackMachineTemplate
metadata:
  name: capo-essai-control-plane
  namespace: capo-essai
spec:
  template:
    spec:
      flavor:
        filter:
          name: m1.medium
      image:
        filter:
          name: ubuntu-2404-kube-v1.36.5
      sshKeyName: plateforme-adm01
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: capo-essai-workers
  namespace: capo-essai
spec:
  clusterName: capo-essai
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: capo-essai
      version: v1.36.5
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: capo-essai-worker
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OpenStackMachineTemplate
        name: capo-essai-worker
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackMachineTemplate
metadata:
  name: capo-essai-worker
  namespace: capo-essai
spec:
  template:
    spec:
      flavor:
        filter:
          name: m1.medium
      image:
        filter:
          name: ubuntu-2404-kube-v1.36.5
      sshKeyName: plateforme-adm01
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: capo-essai-worker
  namespace: capo-essai
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: "{{ local_hostname }}"
          kubeletExtraArgs:
            - name: cloud-provider
              value: external
            - name: provider-id
              value: "openstack:///{{ instance_id }}"
