# capi/capi-essai/essais/temoin.yaml — charge témoin des essais de cycle de vie (M18-E13).
# À appliquer dans le CLUSTER DE CHARGE DE TRAVAIL capi-essai (kubeconfig capi-essai.kubeconfig).
# Image « pause » : elle ne fait rien, démarre vite et sert seulement à compter les pods prêts.
apiVersion: v1
kind: Namespace
metadata:
  name: wb-essais
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temoin
  namespace: wb-essais
  labels:
    app.kubernetes.io/name: temoin
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: temoin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temoin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        seccompProfile:
          type: RuntimeDefault
      # Un pod par nœud autant que possible : la perte d'un travailleur ne doit en emporter qu'un.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: temoin
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temoin
  namespace: wb-essais
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: temoin
