# /etc/pve/ha/rules.cfg corrigé (M09-E21)
# vm:100 : son disque est sur des NVMe propres à hv01 => stockage LOCAL => pas une ressource HA.
#          Retirée de resources.cfg (ou disque déplacé sur ceph-vm, et alors règle non stricte).
# vm:103 : une seule règle d'affinité de nœud (préférence hv02, non stricte).
node-affinity: licence-hv02
	nodes hv02
	resources vm:103
	strict 0

# Quatre frontaux, trois nœuds : on ne peut pas les séparer TOUS. Deux paires séparées.
resource-affinity: web-a-separes
	affinity negative
	resources vm:101,vm:102

resource-affinity: web-b-separes
	affinity negative
	resources vm:103,vm:104
