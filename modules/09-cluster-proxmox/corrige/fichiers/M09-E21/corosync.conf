# corosync.conf corrigé (M09-E21). Rappel : on ne copie JAMAIS ce fichier à la main sur un cluster en
# service : on édite /etc/pve/corosync.conf (copie de travail, config_version + 1), pmxcfs le diffuse.
logging {
  debug: off
  to_syslog: yes
}

nodelist {
  node {
    name: hv01
    nodeid: 1
    quorum_votes: 1
    ring0_addr: 10.10.32.51
    ring1_addr: 10.10.10.51
  }
  node {
    name: hv02
    nodeid: 2
    quorum_votes: 1
    ring0_addr: 10.10.32.52
    ring1_addr: 10.10.10.52
  }
  node {
    name: hv03
    nodeid: 3
    quorum_votes: 1
    ring0_addr: 10.10.32.53
    ring1_addr: 10.10.10.53
  }
}

quorum {
  provider: corosync_votequorum
}

totem {
  cluster_name: hv-recette
  config_version: 8
  interface {
    linknumber: 0
  }
  interface {
    linknumber: 1
  }
  ip_version: ipv4-6
  link_mode: passive
  secauth: on
  version: 2
}
