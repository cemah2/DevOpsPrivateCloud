---
- name: Lire les fichiers de sources susceptibles de viser le dépôt « enterprise »
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ pve_noeud_sources_a_examiner }}"
  register: _pve_noeud_sources
  failed_when: false

# Un fichier qui pointe vers enterprise.proxmox.com (dépôt à abonnement) fait échouer
# « apt update » (401). Un fichier qui vise le dépôt sans abonnement (ceph.sources écrit
# par « pveceph install --repository no-subscription », M09-E10) est laissé en place.
- name: Retirer les sources du dépôt à abonnement
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ _pve_noeud_sources.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.content is defined
    - (item.content | b64decode) is search('enterprise\.proxmox\.com')

- name: Dépôt Proxmox VE sans abonnement (format deb822)
  ansible.builtin.deb822_repository:
    name: proxmox
    types: [deb]
    uris: ["{{ pve_noeud_depot_url }}"]
    suites: ["{{ pve_noeud_depot_suite }}"]
    components: ["{{ pve_noeud_depot_composant }}"]
    signed_by: "{{ pve_noeud_trousseau }}"
  register: _pve_noeud_depot

- name: Index des paquets à jour
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if _pve_noeud_depot is changed else 3600 }}"

- name: Paquets d'exploitation
  ansible.builtin.apt:
    name: "{{ pve_noeud_paquets }}"
    state: present
