# etc/ms-capacite-cluster.conf — paramètres du calcul de capacité de hv-par1 (M09-E31, DEV-1057).
# Installé dans /usr/local/etc par « task install:systeme ». Les valeurs viennent des MESURES
# consignées dans docs/virtualisation/capacite-hv-par1.md : on les change par MR, avec la mesure.

MS_HV_NOEUDS=(hv01.par1.medisphere.internal hv02.par1.medisphere.internal hv03.par1.medisphere.internal)

# Mémoire réservée sur CHAQUE nœud, en Mio (jamais disponible pour les invités).
MS_CAP_RESERVE_HOTE_MIO=1536     # Proxmox VE (pmxcfs, pveproxy, pvedaemon, HA, FRR, keepalived…), mesurée ~1,2 Gio
MS_CAP_RESERVE_CEPH_MIO=3072     # 2 OSD × osd_memory_target 1 Gio + MON + MGR (mesuré ~2,7 Gio)
MS_CAP_RESERVE_ZFS_MIO=1024      # zfs_arc_max fixé à 1 Gio par pve_noeud
# Marge de sécurité sur le reste (pointes, cache de pages de l'hôte), en %.
MS_CAP_MARGE_PCT=10

# Pools dont les VMs sont comptées à leur PLANCHER de ballon (surallocation assumée) ; ailleurs,
# chaque VM compte pour toute sa mémoire (production, VMs HA : jamais de surallocation).
MS_CAP_POOLS_BALLON=(recette)
