# etc/ms-verif-cluster.conf — ce que surveille ms-verif-cluster (M09-E25, PLAT-1051).
# Installé dans /usr/local/etc par « task install:systeme ». Modifié par MR, comme le code.
# Syntaxe bash (fichier chargé par le script) : tableaux et variables simples, aucune commande.

# --- Nœuds (interrogés dans l'ordre, le premier qui répond fait foi pour les vues de cluster) ---
MS_HV_NOEUDS=(hv01.par1.medisphere.internal hv02.par1.medisphere.internal hv03.par1.medisphere.internal)
MS_HV_NOEUDS_ATTENDUS=3

# --- Ceph hyperconvergé (0 sur un cluster sans Ceph) ---------------------------------------------
MS_HV_CEPH=1

# --- Stockages : alerte au-delà de ce taux d'occupation (%) -------------------------------------
MS_HV_STOCKAGE_SEUIL=85

# --- Réplication : âge maximal de la dernière synchronisation (s) ; tâches toutes les 15 min ---
MS_HV_REPLI_AGE_MAX=3600

# --- Sauvegardes : pools dont chaque invité doit être couvert par un job ; âge max (s) ----------
MS_HV_POOLS_SAUVEGARDES=(prod)
MS_HV_SAUVEGARDE_AGE_MAX=93600

# --- VIP de l'API (contrôle TCP, toujours) ---------------------------------------------------
MS_HV_VIP=hv.par1.medisphere.internal:8006

# --- Certificats de l'interface 8006 : « nom:port » (nœuds ET VIP) ---------------------------
# Racine de confiance : celle de l'autorité du cluster jusqu'à M09-E26 (certificats posés par le rôle
# pve_cluster en M09-E18, nom de la VIP compris), puis la racine MédiSphère.
# MS_RACINE=/usr/local/share/ca-certificates/hv-par1-root-ca.crt     # avant M09-E26
MS_RACINE=/usr/local/share/ca-certificates/medisphere-root-ca.crt
MS_VERIF_SEUIL_CERTS=10
MS_HV_POINTS_TLS=(
  hv01.par1.medisphere.internal:8006
  hv02.par1.medisphere.internal:8006
  hv03.par1.medisphere.internal:8006
  hv.par1.medisphere.internal:8006
)
