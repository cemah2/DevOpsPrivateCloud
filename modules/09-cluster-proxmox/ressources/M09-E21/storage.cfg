dir: local
	path /var/lib/vz
	content iso,vztmpl,backup,import

lvmthin: local-lvm
	thinpool data
	vgname pve
	content images,rootdir
	shared 1

zfspool: zfs-local
	pool tank
	content images,rootdir
	sparse 1

rbd: ceph-vm
	content images
	krbd 0
	pool ceph-vm

rbd: ceph-par1-rbd
	content images
	krbd 0
	monhost 10.10.30.51 10.10.30.52 10.10.30.53
	pool hv-recette
	username admin

pbs: pbs-par2
	datastore ds-lab
	server 10.20.10.10
	content backup
	fingerprint 3f:8a:c1:00:5e:47:9b:12:aa:0c:61:de:42:7f:93:18:b5:6d:2e:90:c4:71:08:5a:fe:33:9d:20:6b:e8:17:c2
	namespace par1/recette
	prune-backups keep-all=1
	username root@pam
