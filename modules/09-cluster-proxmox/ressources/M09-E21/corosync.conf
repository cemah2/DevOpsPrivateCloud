logging {
  debug: off
  to_syslog: yes
}

nodelist {
  node {
    name: hv01
    nodeid: 1
    quorum_votes: 1
    ring0_addr: 10.10.30.71
    ring1_addr: hv01
  }
  node {
    name: hv02
    nodeid: 2
    quorum_votes: 1
    ring0_addr: 10.10.30.72
    ring1_addr: hv02
  }
  node {
    name: hv03
    nodeid: 3
    quorum_votes: 2
    ring0_addr: 10.10.30.73
    ring1_addr: hv03
  }
}

quorum {
  provider: corosync_votequorum
  two_node: 1
}

totem {
  cluster_name: hv-recette
  config_version: 7
  interface {
    linknumber: 0
  }
  interface {
    linknumber: 1
  }
  ip_version: ipv4-6
  link_mode: passive
  secauth: off
  crypto_cipher: none
  crypto_hash: none
  version: 2
}
