# /etc/dnf/automatic.conf — correctifs de SÉCURITÉ seulement, appliqués automatiquement (M03-E25)
# Équivalent Rocky de unattended-upgrades (M03-E09). Lancé par dnf-automatic.timer.
# ⚠️ Vérifie les clés sur ta version (man dnf-automatic) : ce fichier suit le format de dnf 4.
[commands]
upgrade_type = security
download_updates = yes
apply_updates = yes
# Pas de redémarrage automatique : il se planifie (fenêtre de maintenance, M04).
reboot = never
random_sleep = 600

[emitters]
emit_via = stdio

[base]
debuglevel = 1
