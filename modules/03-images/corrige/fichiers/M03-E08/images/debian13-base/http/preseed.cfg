#_preseed_V1
# preseed.cfg — installation automatisée de Debian 13 pour le template tpl-debian13-base (M03-E05)
# Ce fichier est un GABARIT Packer (templatefile) : ${build_username} et ${build_password}
# sont remplacés au moment du build. Un « $ » littéral suivi d'une accolade s'écrit « $$ ».
# Référence : https://www.debian.org/releases/trixie/example-preseed.txt

### Langue, clavier, fuseau
# Messages système en anglais (recherche d'erreurs), clavier français, heure de Paris.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true
# Serveur de temps du lab : la passerelle du VLAN SANDBOX (gw01, M00-E31)
d-i clock-setup/ntp-server string 10.10.99.1

### Réseau (DHCP de dns01 sur vsandbox ; nom et domaine passés sur la ligne de démarrage)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string tpl-debian13-base
d-i netcfg/get_domain string par1.medisphere.internal
d-i hw-detect/load_firmware boolean false

### Miroir
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Comptes : pas de mot de passe root (le premier utilisateur reçoit sudo).
# Le compte de construction est jetable : mot de passe aléatoire à chaque build, compte
# supprimé par scripts/preparer-clonage.sh (M03-E07).
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Compte de construction Packer
d-i passwd/username string ${build_username}
d-i passwd/user-password password ${build_password}
d-i passwd/user-password-again password ${build_password}

### Partitionnement : une seule partition racine, la DERNIÈRE du disque, sans swap,
# pour que cloud-init (growpart) puisse l'agrandir quand on agrandit le disque d'un clone.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string racine :: 2048 10000 -1 ext4 $primary{ } $bootable{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-auto/choose_recipe select racine
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### APT
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/services-select multiselect security, updates

### Paquets : système minimal + SSH, et ce qu'il faut pour être cloné par Proxmox.
# netplan.io + systemd-resolved : même pile réseau que l'image genericcloud ; sans eux,
# cloud-init choisirait le moteur « eni » (ifupdown) et ignorerait les serveurs DNS.
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string qemu-guest-agent cloud-init cloud-guest-utils netplan.io systemd-resolved sudo ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Chargeur de démarrage : console aussi sur le port série (qm terminal)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
d-i debian-installer/add-kernel-opts string console=tty0 console=ttyS0,115200n8

### Fin d'installation : script récupéré sur le même serveur HTTP que ce fichier,
# exécuté dans le système installé (in-target).
d-i preseed/late_command string \
    u="$(debconf-get preseed/url)"; \
    wget -q -O /target/tmp/late-command.sh "$${u%/*}/late-command.sh"; \
    in-target sh /tmp/late-command.sh ${build_username}
d-i finish-install/reboot_in_progress note
