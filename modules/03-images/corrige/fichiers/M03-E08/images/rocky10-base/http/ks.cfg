# ks.cfg — installation automatisée de Rocky Linux 10 pour tpl-rocky10-base (M03-E06)
# GABARIT Packer (templatefile) : ${build_username} et ${build_password} sont remplacés au build.
# Validation hors build (pykickstart) : ksvalidator -v RHEL10 ks-rendu.cfg
# Référence : RHEL 10 « Automatically installing RHEL », annexe « Kickstart commands and options ».

text
skipx
firstboot --disable
reboot

# Source des paquets : l'ISO « boot » ne contient que l'installeur, tout vient du réseau.
url --url="https://dl.rockylinux.org/pub/rocky/10/BaseOS/x86_64/os/"
repo --name="AppStream" --baseurl="https://dl.rockylinux.org/pub/rocky/10/AppStream/x86_64/os/"

lang en_US.UTF-8
keyboard --vckeymap=fr --xlayouts=fr
timezone Europe/Paris --utc
timesource --ntp-server=10.10.99.1

network --bootproto=dhcp --device=link --activate --onboot=on --hostname=tpl-rocky10-base.par1.medisphere.internal

# Pas de mot de passe root ; compte de construction jetable (supprimé par preparer-clonage.sh).
rootpw --lock
user --name=${build_username} --groups=wheel --password=${build_password} --plaintext

selinux --enforcing
firewall --enabled --service=ssh

# Disque : partitions classiques (pas de LVM), racine en dernier, sans swap :
# cloud-init (growpart) pourra agrandir la racine d'un clone dont on agrandit le disque.
ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel --drives=sda
autopart --type=plain --nohome --noswap
bootloader --location=mbr --boot-drive=sda --append="console=tty0 console=ttyS0,115200n8"

services --enabled=sshd,qemu-guest-agent

%packages --inst-langs=en_US
@^minimal-environment
qemu-guest-agent
cloud-init
cloud-utils-growpart
sudo
-plymouth
%end

%post --erroronfail --log=/root/ks-post.log
# sudo sans mot de passe pour le compte de construction, le temps du build.
printf '%s ALL=(ALL) NOPASSWD: ALL\n' '${build_username}' > /etc/sudoers.d/90-build-packer
chmod 0440 /etc/sudoers.d/90-build-packer
visudo -cf /etc/sudoers.d/90-build-packer
%end
