# /etc/sysctl.d/60-medisphere-durcissement.conf — paramètres noyau de l'image dorée (M03-E13, SEC-450)
# Appliqué par systemd-sysctl au démarrage, puis par udev pour chaque nouvelle interface
# (99-systemd.rules) : les motifs « * » couvrent all, default et les interfaces existantes.
# Les VMs de la plateforme ne routent pas : aucun de ces réglages ne vise un routeur.

# --- Réseau IPv4 : pas de redirections, pas de routage par la source, martiens journalisés
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.accept_source_route = 0
net.ipv4.conf.*.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
# --- Réseau IPv6 (non utilisé par le lab, mais pas de redirections acceptées s'il l'était)
net.ipv6.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_source_route = 0

# --- Noyau : moins d'informations exposées, moins de surface pour un compte non privilégié
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.kexec_load_disabled = 1
dev.tty.ldisc_autoload = 0
vm.unprivileged_userfaultfd = 0
kernel.perf_event_paranoid = 3
# --- Systèmes de fichiers : liens et fichiers dans les répertoires partagés (/tmp)
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0
