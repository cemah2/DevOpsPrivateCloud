# /etc/ssh/sshd_config.d/05-durcissement.conf — durcissement SSH de l'image dorée (M03-E13, SEC-450)
# Complète 10-medisphere.conf (M03-E09 : root et mots de passe refusés). sshd retient la
# PREMIÈRE valeur lue : « 05- » passe devant « 10- », « 50-cloud-init.conf » et sshd_config.
# Les listes d'algorithmes (KexAlgorithms, Ciphers, MACs) sont ajoutées par scripts/durcir.sh,
# filtrées selon ce que la version d'OpenSSH de l'image connaît (ssh -Q).
# Contrôle de l'effet réel : sshd -T

# Fonctions inutiles sur un serveur (ni rebond, ni affichage, ni transfert d'agent)
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
PermitUserEnvironment no
# Authentification : peu d'essais, peu de temps, pas de méthodes inutiles
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60
HostbasedAuthentication no
IgnoreRhosts yes
# Sessions abandonnées fermées après 3 × 300 s sans réponse du client
ClientAliveInterval 300
ClientAliveCountMax 3
# Journalisation : empreinte de la clé utilisée à chaque connexion
LogLevel VERBOSE
# Avertissement légal avant authentification
Banner /etc/issue.net
