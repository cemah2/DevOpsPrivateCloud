# /etc/modprobe.d/medisphere-durcissement.conf — modules non chargeables (M03-E13, SEC-450)
# « install X /bin/false » empêche aussi le chargement explicite (modprobe X échoue),
# là où « blacklist X » n'empêche que le chargement automatique par alias.
# NE PAS ajouter isofs ni udf : le lecteur cloud-init de Proxmox (NoCloud, étiquette
# « cidata ») est une image ISO 9660. Sans isofs, cloud-init ne trouve plus sa configuration.

# Protocoles réseau rares, à l'historique de vulnérabilités chargé
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
# Systèmes de fichiers inutiles sur une VM de la plateforme
install cramfs /bin/false
install freevxfs /bin/false
install hfs /bin/false
install hfsplus /bin/false
install jffs2 /bin/false
# Périphériques amovibles : aucun sur une VM, interdits par la politique de sécurité
install usb-storage /bin/false
install firewire-core /bin/false
install thunderbolt /bin/false
