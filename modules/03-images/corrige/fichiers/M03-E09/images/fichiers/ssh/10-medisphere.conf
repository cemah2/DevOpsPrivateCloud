# /etc/ssh/sshd_config.d/10-medisphere.conf — base durcie de l'image dorée (M03-E09)
# sshd retient la PREMIÈRE valeur lue pour chaque mot-clé ; les fichiers de sshd_config.d
# sont lus par ordre alphabétique AVANT la suite de sshd_config. « 10- » passe donc devant
# « 50-cloud-init.conf » que cloud-init peut écrire (ssh_pwauth) sur un clone.
# Vérifier l'effet réel : sshd -T | grep -Ei 'permitrootlogin|passwordauthentication'
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
