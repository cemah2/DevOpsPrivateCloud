# =============================================================================
# .gitlab-ci.yml — plateforme/outils (état de fin de M02-E25 : E24 + publication du paquet)
#
# - Contrôles communs (pre-commit, commitlint, gitleaks) et release : gabarits partagés
#   de plateforme/ci-templates, version majeure v1 (M01-E24/E25). Ils fixent aussi le
#   « workflow » (pipelines de MR et de branche, pas de doublon) et les stages.
# - Jobs propres au projet : ils appellent les tâches du Taskfile (M02-E20), exactement
#   comme en local. Aucune commande n'est recopiée ici.
# - Runner : runner01, exécuteur shell, étiquette « shell ». Outils attendus : ShellCheck
#   0.11, shfmt 3.14, bats-core 1.13, Task 3.x, uv (voir installer-outils-runner01.sh).
# - Aucun test ne joint le vrai Proxmox : bats et pytest simulent l'API ; aucune variable
#   PVE_* n'est définie dans ce projet ; runner01 (VLAN INFRA) ne joint pas pve01.
# =============================================================================

include:
  - project: plateforme/ci-templates
    ref: v1
    file:
      - templates/qualite.yml
      - templates/release.yml

# Rapports JUnit : écrits par les tâches du Taskfile dans rapports/ (variable REPORTS du
# Taskfile, M02-E20). Les chemins ci-dessous doivent rester alignés sur elle.

.outils:
  tags: [shell]
  interruptible: true

# Dans une MR, un job ne tourne que si ses fichiers ont changé ; sur main, toujours.
# (Avec « Pipelines must succeed », un job absent ne bloque pas la fusion.)
.si-bash:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bin/**/*
        - sbin/**/*
        - lib/**/*
        - tests/bats/**/*
        - .shellcheckrc
        - .editorconfig
        - Taskfile.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.si-python:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*
        - tests/python/**/*
        # ms-attendre (M02-E30) est testé par pytest
        - bin/ms-attendre
        - pyproject.toml
        - uv.lock
        - Taskfile.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

shellcheck:
  extends: [.outils, .si-bash]
  stage: lint
  script:
    - shellcheck --version | sed -n 2p
    - shfmt --version
    - task lint:sh

ruff:
  extends: [.outils, .si-python]
  stage: lint
  script:
    - task lint:py

bats:
  extends: [.outils, .si-bash]
  stage: test
  script:
    - bats --version
    - task test:bats
  artifacts:
    # « always » : le rapport est surtout utile quand un test échoue.
    when: always
    expire_in: 1 week
    reports:
      junit: rapports/report.xml

pytest:
  extends: [.outils, .si-python]
  stage: test
  script:
    - task test:py
  # Taux de couverture lu dans la sortie de pytest-cov (ligne TOTAL), affiché dans les MR.
  coverage: '/^TOTAL\s+.*\s+(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: rapports/junit-pytest.xml

build:
  extends: [.outils, .si-python]
  stage: build
  script:
    - task build
    - ls -l dist/
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

# -----------------------------------------------------------------------------
# M02-E25 (DEV-355) : publication de medictl dans le registre PyPI du projet.
# Même schéma que « publier-branche-majeure » de plateforme/ci-templates : le job suit
# « release » dans le pipeline de main. Si semantic-release vient de poser une étiquette
# vX.Y.Z sur ce commit, le paquet est construit avec CETTE version et publié ; sinon rien.
# La version du pyproject.toml de main n'est qu'un repère de développement : la vérité,
# c'est l'étiquette. Rien n'est commité.
# -----------------------------------------------------------------------------
publier-pypi:
  stage: release
  needs: [release]
  tags: [shell]
  resource_group: release
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
    # Jeton de job : autorisé à publier dans le registre de SON projet, valable le temps du job.
    # Passé par l'environnement, jamais en argument (visible dans ps sur runner01).
    UV_PUBLISH_USERNAME: gitlab-ci-token
    UV_PUBLISH_PASSWORD: $CI_JOB_TOKEN
    UV_PUBLISH_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    # Index du même registre : uv saute les fichiers déjà publiés (job relancé sans risque).
    UV_PUBLISH_CHECK_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/simple
    # uv n'utilise pas le magasin de certificats du système par défaut : sans cela, il
    # refuserait le certificat de git01 signé par la PKI interne.
    UV_SYSTEM_CERTS: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      exists:
        - .releaserc.json
  script:
    - git fetch --quiet --tags --force origin
    - VERSION="$(git tag --points-at "$CI_COMMIT_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
    - |
      if [ -z "$VERSION" ]; then
        echo "Aucune version publiée par ce pipeline : rien à publier."
        exit 0
      fi
      echo "Publication de medictl ${VERSION#v}"
    # --frozen : modifie pyproject.toml sans recalculer uv.lock (copie de travail du job seulement).
    - uv version --frozen "${VERSION#v}"
    - rm -rf dist && uv build
    # Garde-fou : le paquet construit porte bien la version de l'étiquette.
    - test -f "dist/medictl-${VERSION#v}-py3-none-any.whl"
    - uv publish dist/*
  artifacts:
    expire_in: 1 month
    paths:
      - dist/
