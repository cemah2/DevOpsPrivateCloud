# EXTRAIT — à ajouter à la liste « repos: » du .pre-commit-config.yaml de
# plateforme/outils, après les dépôts hérités de M01-E15 (pre-commit-hooks,
# gitleaks, commitlint).
#
# Les deux hooks apportent LEUR binaire (épinglé par « rev ») : ils ne dépendent
# pas de la version installée sur le poste ni sur runner01.
# Règle de M01-E15 : « rev » figée sur l'empreinte du commit de l'étiquette
# (pre-commit autoupdate --freeze), version lisible en commentaire.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1 (ShellCheck 0.11.0)
    hooks:
      - id: shellcheck          # lit .shellcheckrc à la racine du dépôt
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1 (shfmt 3.14.1)
    hooks:
      - id: shfmt               # binaire amont ; réécrit les fichiers (-w) selon .editorconfig
