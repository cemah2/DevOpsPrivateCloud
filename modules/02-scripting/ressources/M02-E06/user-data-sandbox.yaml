#cloud-config
# Gabarit user-data des VMs jetables de la sandbox (InfoGér, 2024).
# NE PAS SUPPRIMER la première ligne : sans « #cloud-config », cloud-init ignore le fichier.

hostname: sbx-modele
timezone: Europe/Paris

users:
  - name: admin
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"   # aligné sur le template 9000
    lock_passwd: true
    ssh_authorized_keys: []          # clés ajoutées au déploiement

ntp:
  enabled: true
  servers:
    - 0.debian.pool.ntp.org          # à remplacer par la passerelle du VLAN
    - 1.debian.pool.ntp.org

package_update: true

write_files:
  - path: /etc/motd
    permissions: '0644'
    owner: root:root
    content: |
      VM jetable du lab MédiSphère (VLAN 99 SANDBOX).
      Toute donnée ici peut disparaître sans préavis.
  - path: /etc/sudoers.d/10-audit
    permissions: '0440'
    content: |
      Defaults log_output

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
