---
# Rôle base — valeurs par défaut (M04-E10 ; comptes pilotés par les données en M04-E14 ;
# contrat d'entrée et reprise sur erreur en M04-E15 : voir meta/argument_specs.yml).
# Les defaults ont la précédence la plus FAIBLE : tout se surcharge dans l'inventaire.
# Quand le projet fournit une donnée du site (ms_…, group_vars/all, M04-E06/E07), le rôle
# la reprend ; sinon il a une valeur raisonnable à lui. Il fonctionne donc aussi sans
# l'inventaire du projet (instance de test Molecule, M04-E24).

base_entete: >-
  {{ ms_gere_par | default('Fichier géré par Ansible (projet plateforme/ansible).
  Toute modification manuelle sera écrasée au prochain passage.') }}

# --- Paquets (trousse de diagnostic de M04-E05/E06 + socle commun) --------------------
base_paquets:
  - chrony
  - unattended-upgrades
  - ca-certificates
  - sudo
  - curl
  - bind9-dnsutils
  - tcpdump
  - mtr-tiny
  - jq
  - lsof
  - strace
  - htop
# Outils propres à un rôle : group_vars/role_<rôle>/ (ex. conntrack sur le routeur).
base_paquets_role: []
# Agent QEMU : installé seulement dans une VM KVM (condition sur les faits, M04-E14).
base_agent_qemu: true
# Clients de protocoles en clair, refusés par la RSSI.
base_paquets_interdits:
  - telnet
  - inetutils-telnet
  - rsh-client

# --- Fuseau horaire -------------------------------------------------------------------
base_fuseau_horaire: Europe/Paris

# --- Temps : client chrony (PLAN.md §4.3 bis) -------------------------------------------
# gw01 est le SERVEUR de temps du lab (M00-E31) : base_chrony_client: false dans ses host_vars.
base_chrony_client: true
# Sources : celles du site (ms_serveurs_ntp, M04-E06), sinon la passerelle par défaut de l'hôte.
base_ntp_serveurs: "{{ ms_serveurs_ntp | default([ansible_facts['default_ipv4']['gateway']]) }}"
# Après un changement de configuration, attendre la synchronisation (essais espacés de
# 3 s) ; faute de synchronisation, l'ancienne configuration est remise (M04-E15).
base_chrony_attendre_sync: true
base_chrony_essais_sync: 20

# --- Journal ------------------------------------------------------------------------------
base_journal_taille_max: 200M

# --- Mises à jour automatiques : sécurité seulement, jamais de redémarrage --------------
base_maj_auto: true

# --- Comptes (M04-E14) ---------------------------------------------------------------
# Liste de comptes. Champs : nom (obligatoire), etat (present | absent), commentaire, shell,
# groupes (ajoutés), mdp_hash (EMPREINTE, depuis le Vault), cles (clés publiques, liste
# EXCLUSIVE), ssh (false : aucune clé autorisée ; ssh_durci le refuse aussi).
# Vide = le rôle ne gère aucun compte (instance de test, hôte pas encore inventorié).
base_utilisateurs: []
# Comptes propres à un hôte, ajoutés à la liste commune (host_vars).
base_utilisateurs_hote: []
# Compte qui doit TOUJOURS garder au moins une clé (garde-fou anti-verrouillage).
base_admin_utilisateur: admin
# Valeurs par défaut de chaque compte, complétées par les champs du compte.
base_compte_defaut:
  etat: present
  ssh: true
  cles: []

# --- Identité de l'hôte (M04-E07) ---------------------------------------------------------
base_site: "{{ ms_site | default('par1') }}"
base_domaine: "{{ ms_domaine | default('par1.medisphere.internal') }}"
base_environnement: "{{ ms_environnement | default('lab') }}"
base_role_hote: >-
  {{ ms_role | default(group_names | select('match', '^role_') | map('regex_replace', '^role_', '')
     | first | default('aucun')) }}
base_contact_astreinte: "{{ ms_contact_astreinte | default('astreinte Plateforme') }}"
base_runbooks: "{{ ms_runbooks | default({}) }}"
