---
# inventories/lab/hosts.yml — inventaire statique du socle (M04-E03)
#
# Mêmes groupes que l'inventaire dynamique (E13), qui les dérive des étiquettes Proxmox :
#   socle           ← étiquette « socle »
#   role_<rôle>     ← étiquette « role-<rôle> » (le « - » devient « _ »)
# Tous les groupes sont au même niveau (enfants directs de « all »), comme en dynamique :
# on peut basculer d'un inventaire à l'autre sans changer la précédence des group_vars.
#
# ansible_host = adresse IP, comme les alias SSH de adm01 (M00-E15) : l'inventaire
# fonctionne même quand le DNS est en panne.
# Ce qui ne dépend pas de la source d'inventaire (utilisateur, connexion locale de adm01)
# est dans group_vars/ et host_vars/, partagés par les deux inventaires.
all:
  children:
    socle:
      hosts:
        gw01:
          ansible_host: 10.10.10.1
        adm01:
          ansible_host: 10.10.10.10
        dns01:
          ansible_host: 10.10.20.10
        git01:
          ansible_host: 10.10.20.12
        runner01:
          ansible_host: 10.10.20.15
    role_routeur:
      hosts:
        gw01:
    role_bastion:
      hosts:
        adm01:
    role_dns:
      hosts:
        dns01:
    role_gitlab:
      hosts:
        git01:
    role_runner:
      hosts:
        runner01:
