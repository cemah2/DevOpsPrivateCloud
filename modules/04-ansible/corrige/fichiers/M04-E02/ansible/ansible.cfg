# ansible.cfg — configuration du projet plateforme/ansible (M04-E02)
#
# Ansible utilise le PREMIER fichier trouvé parmi : $ANSIBLE_CONFIG, ./ansible.cfg
# (dossier courant), ~/.ansible.cfg, /etc/ansible/ansible.cfg. On lance donc toujours
# Ansible depuis la racine du projet (uv run ansible-…, ou venv activé).
# Il ignore un ansible.cfg situé dans un dossier modifiable par tous (world-writable).
# Les chemins relatifs sont résolus par rapport à ce fichier.
#
# Vérifier ce qui est réellement pris en compte :
#   ansible-config dump --only-changed -t all
#   ansible-config validate -t all
#
# Ne figurent ici que des valeurs qui s'écartent du défaut, chacune justifiée.
# Volontairement ABSENT : host_key_checking (défaut True, à garder). Aucune clé privée
# n'est désignée ici : agent SSH sur adm01, clé dédiée fournie par la CI en E27.

[defaults]
# Inventaire du lab : statique (E03). L'inventaire dynamique (E13) le remplacera.
# Les group_vars/ et host_vars/ voisins de ce fichier sont chargés automatiquement.
inventory = inventories/lab/hosts.yml
# Rôles et collections du projet uniquement : rien de ~/.ansible ni de /usr/share/ansible,
# pour que adm01, runner01 et sem01 exécutent exactement le même code.
roles_path = roles
collections_path = collections
# Cinq hôtes aujourd'hui, une quinzaine à la fin du bloc A (défaut : 5). Revu en E26.
forks = 10
# Python des hôtes gérés : celui du système, désigné explicitement. La découverte
# automatique essaie python3.14, python3.13… AVANT /usr/bin/python3 : un Python installé
# plus tard à la main (sans python3-apt ni les autres modules de Debian) serait choisi
# sans prévenir. /usr/bin/python3 existe sur Debian 13 et Rocky Linux 10.
interpreter_python = /usr/bin/python3
# Faits uniquement dans ansible_facts['…'] : comportement par défaut annoncé pour
# ansible-core 2.24, imposé dès maintenant (ansible_distribution & co. sont indéfinis).
inject_facts_as_vars = False
# Résultats de tâches affichés en YAML (callback par défaut), plus lisibles que le JSON.
callback_result_format = yaml

[connection]
# Un seul aller-retour SSH par tâche au lieu de plusieurs (copie du module, exécution,
# nettoyage). Possible parce que sudo n'exige pas de TTY (pas de « requiretty » sur Debian).
pipelining = True
