---
# Liste EXCLUSIVE : toute clé absente de base_admin_cles est retirée. Liste vide : le rôle
# ne touche à rien (sinon il retirerait TOUTES les clés et verrouillerait le compte).
- name: Clés autorisées du compte d'administration (liste exclusive)
  ansible.posix.authorized_key:
    user: "{{ base_admin_utilisateur }}"
    key: "{{ base_admin_cles | join('\n') }}"
    exclusive: true
  when: base_admin_cles | length > 0
