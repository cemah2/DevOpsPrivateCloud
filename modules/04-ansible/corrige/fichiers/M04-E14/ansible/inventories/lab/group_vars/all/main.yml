---
# inventories/lab/group_vars/all/main.yml — variables communes à tout le lab
# (M04-E03, complété en M04-E06, M04-E07, M04-E10 : rôle base, M04-E12 : Vault, M04-E14 : comptes).
#
# Règles de rangement (M04-E06) :
#   - valeurs par défaut ici (group_vars/all : le niveau le plus bas de l'inventaire) ;
#   - spécificités d'un rôle dans group_vars/role_<rôle>/, d'un hôte dans host_vars/<hôte>/ ;
#   - PAS de group_vars/socle/ : « socle » et « role_* » sont au même niveau, une variable
#     définie dans les deux serait tranchée par l'ordre alphabétique des groupes ;
#   - jamais de « vars: » de play pour une valeur qui dépend de l'hôte : elles écrasent
#     group_vars et host_vars ;
#   - préfixe ms_ pour les faits du site, préfixe du playbook ou du rôle pour le reste.
#
# Convention Vault (M04-E12) : toute valeur secrète vit, CHIFFRÉE, dans vault.yml (même
# dossier) sous un nom préfixé « vault_ » ; ce fichier-ci, en clair, dit OÙ elle sert.
# Un grep sur un nom de variable trouve son usage sans rien déchiffrer.

# --- Connexion ------------------------------------------------------------------
ansible_user: admin

# --- Site (PLAN.md §4) -------------------------------------------------------------
ms_site: par1
ms_domaine: par1.medisphere.internal
ms_resolveur: 10.10.20.10
# Passerelle du VLAN de l'hôte : son adresse avec .1 en dernier octet (PLAN.md §4.2).
# Évaluée au moment de l'usage, pour chaque hôte (ansible_host est propre à l'hôte).
ms_passerelle: "{{ (ansible_host.split('.')[:3] + ['1']) | join('.') }}"
# Sources de temps : la passerelle du VLAN (PLAN.md §4.3 bis, M00-E31).
# gw01, lui, se synchronise sur Internet : voir host_vars/gw01/.
ms_serveurs_ntp:
  - "{{ ms_passerelle }}"

# --- Rôle base (M04-E10, M04-E12, M04-E14) ----------------------------------------------
# La trousse de diagnostic (E05/E06) est devenue base_paquets / base_paquets_role /
# base_paquets_interdits (defaults du rôle) : les variables trousse_* sont supprimées.
# Clés publiques autorisées pour admin sur tout le socle. Une clé PUBLIQUE se versionne ;
# remplace la ligne par le contenu de ~/.ssh/id_ed25519.pub. Variable à part pour qu'un
# hôte puisse la remplacer seule (host_vars/adm01/base.yml).
ms_cles_admin:
  - "ssh-ed25519 <CLE-PUBLIQUE-ADM01> admin@adm01"

base_utilisateurs:
  - nom: admin
    cles: "{{ ms_cles_admin }}"
  # Compte de secours (M04-E12) : console uniquement, empreinte chiffrée dans vault.yml.
  - nom: secours
    commentaire: "Compte de secours MédiSphère (console uniquement)"
    shell: /bin/bash
    groupes: [sudo]
    mdp_hash: "{{ vault_secours_mdp_hash }}"
    ssh: false
  # Compte laissé par l'ancien infogérant (SEC-524) : supprimé partout.
  - nom: infoger
    etat: absent

# --- Rôle ssh_durci (M04-E11) ------------------------------------------------------------
# Déduit de la liste des comptes : un compte « ssh: false » est aussi refusé par sshd,
# même si l'authentification par mot de passe était réactivée par erreur un jour.
ssh_durci_utilisateurs_refuses: >-
  {{ base_utilisateurs | selectattr('ssh', 'defined') | rejectattr('ssh')
     | map(attribute='nom') | list }}

# --- Identité des hôtes (M04-E07) -------------------------------------------------------
ms_environnement: lab
# Rôle de l'hôte, déduit de son groupe role_<rôle> (même source que l'étiquette Proxmox).
# « aucun » si l'hôte n'appartient à aucun groupe role_*.
ms_role: "{{ group_names | select('match', '^role_') | map('regex_replace', '^role_', '') | first | default('aucun') }}"
# En-tête des fichiers gérés (filtre « comment » dans les templates). Remplace le réglage
# ansible_managed de ansible.cfg, déprécié depuis ansible-core 2.19 (retrait en 2.23).
ms_gere_par: >-
  Fichier géré par Ansible (projet plateforme/ansible).
  Toute modification manuelle sera écrasée au prochain passage.
ms_contact_astreinte: "astreinte Plateforme (Nadia Roussel) — runbooks : plateforme/medisphere, docs/socle/runbooks/"
# Runbooks à rappeler à la connexion, par rôle (clés = valeurs possibles de ms_role).
ms_runbooks:
  gitlab:
    - RB-010 Restaurer GitLab
    - RB-011 Mettre à jour GitLab
    - RB-012 Diagnostiquer la forge
    - RB-013 La forge est en panne
