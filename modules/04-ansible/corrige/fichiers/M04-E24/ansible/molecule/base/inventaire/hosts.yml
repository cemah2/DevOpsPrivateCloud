---
# molecule/base/inventaire/hosts.yml — instance du scénario « base » (M04-E24)
# Une instance = une VM Proxmox jetable. Un VMID fixe par scénario (plage 2045-2049) :
# deux scénarios différents peuvent tourner en même temps sans se marcher dessus.
# Son adresse (DHCP) est écrite par create.yml dans host_vars/<instance>/execution.yml
# (ignoré par git) et effacée par destroy.yml.
all:
  children:
    molecule:
      hosts:
        m04-mol-base:
          mol_vmid: 2045
