# ansible.cfg — configuration du projet plateforme/ansible (état de fin de M04-E30)
#
# Fichier de M04-E02, complété par M04-E12 (Vault), M04-E26 (performances, mesures dans
# docs/performances.md) et M04-E30 (deux identités Vault, script client). Ne figurent ici que des valeurs qui s'écartent du défaut, chacune
# justifiée. Vérifier ce qui est pris en compte :
#   uv run ansible-config dump --only-changed -t all
#
# Volontairement ABSENT : host_key_checking (défaut True, à garder) ; gather_subset (n'est
# plus un réglage de ansible.cfg depuis 2.19 : mot-clé de play) ; strategy (linear par
# défaut : « free » ne se justifie que play par play, voir docs/performances.md).

[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
collections_path = collections
# Mesuré (E26) : au-delà du nombre d'hôtes, aucun gain ; en dessous, la durée croît par
# paliers. 20 laisse de la marge pour la flotte du bloc B sans saturer adm01 (2 vCPU).
forks = 20
interpreter_python = auto_silent
inject_facts_as_vars = False
callback_result_format = yaml
# --- Vault (E12, E30) ---------------------------------------------------------------------
# Deux identités : « lab » (exploitation du socle) et « critique » (fuite = plateforme compromise).
# Le même script client sert au poste, à la CI et à Semaphore (variables VAULT_PASS_<ID>,
# VAULT_MDP_<ID>, puis ~/.config/workbook/). Chemin relatif : résolu depuis le dossier COURANT,
# d'où la règle de toujours lancer Ansible depuis la racine du projet. Une identité sans mot de
# passe ne provoque qu'un avertissement : seules les tâches qui l'utilisent échouent.
vault_identity_list = lab@outils/vault-pass-client.sh, critique@outils/vault-pass-client.sh
# N'essayer QUE le mot de passe de l'identité inscrite dans l'en-tête du fichier chiffré.
vault_id_match = True

# --- Faits (E26) -------------------------------------------------------------------------
# smart : ne collecte que si les faits de l'hôte ne sont pas dans le cache.
gathering = smart
# Cache persistant, un fichier JSON par hôte, hors du dépôt, dossier en 700 (les faits
# décrivent les machines : adresses, paquets, comptes). Fichiers écrits en 0640.
fact_caching = jsonfile
fact_caching_connection = ~/.cache/ansible/faits
# 2 h : couvre une session de travail. Plus long = risque de faits périmés (adresse, noyau
# après mise à jour). En CI, le cache est désactivé (ANSIBLE_CACHE_PLUGIN=memory, E27).
fact_caching_timeout = 7200

# --- Mesures (E26) -----------------------------------------------------------------------
# timer : durée totale à la fin de chaque exécution, quasi gratuit. Pour le détail, à la
# demande : ANSIBLE_CALLBACKS_ENABLED=ansible.posix.timer,ansible.posix.profile_tasks
callbacks_enabled = ansible.posix.timer

[connection]
# Un seul aller-retour SSH par tâche (E02). Mesuré en E26 : le gain le plus important.
pipelining = True
