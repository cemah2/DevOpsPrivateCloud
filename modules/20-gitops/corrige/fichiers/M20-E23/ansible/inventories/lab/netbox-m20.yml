---
# inventories/lab/netbox-m20.yml — environnement du module 20 tiré de NetBox (M20-E23).
#
# Même construction que netbox-m18.yml (M18-E02) : une source par environnement (les filtres
# d'étiquettes de l'API NetBox se cumulent en ET). flux01 (E23) et lyo-k3s01 (E26).
# ansible.cfg : ajouter inventories/lab/netbox-m20.yml à la liste « inventory ».
# Contrôle : uv run ansible-inventory --graph env_m20
plugin: netbox.netbox.nb_inventory
api_endpoint: https://nbx01.par1.medisphere.internal
validate_certs: true
token:
  type: Bearer
  value: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"

plurals: false
racks: false
services: false
interfaces: false
config_context: false

query_filters:
  - tag: env-m20
vm_query_filters:
  - status: active

rename_variables:
  - pattern: "^tags$"
    repl: netbox_etiquettes

# Groupes par étiquette : env_m20, role_m18_dev, role_k3s, role_rke2.
keyed_groups:
  - key: netbox_etiquettes | map('replace', '-', '_') | list
    prefix: ""
    separator: ""

# VMs en adresse fixe, noms publiés par l'état envs/m20 (dns.tf).
compose:
  vmid: custom_fields.vmid
  ansible_host: inventory_hostname ~ '.par1.medisphere.internal'
strict: false
