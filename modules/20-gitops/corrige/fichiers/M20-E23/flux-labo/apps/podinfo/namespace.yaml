# Le chart podinfo ne fixe pas d'utilisateur numérique : « restricted » refuserait ses pods. Profil
# baseline appliqué, restricted signalé (avertissements) : l'écart est visible et documenté.
apiVersion: v1
kind: Namespace
metadata:
  name: podinfo
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
