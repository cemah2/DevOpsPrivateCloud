# formation/flux-labo — apps/labo (M20-E23) : EXACTEMENT les manifestes de « labo » du dépôt
# formation/gitops-labo (M20-E04, version Deployment), dans un espace « labo » propre à flux01. Rendu
# par le kustomize-controller de Flux, comme Argo CD le rend avec Kustomize sur k8s-par1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: labo
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
