apiVersion: apps/v1
kind: Deployment
metadata:
  name: labo
  labels:
    app.kubernetes.io/name: labo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: labo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Image officielle sans privilège (UID 101, port 8080) par le cache Harbor « dockerhub ».
          image: registry.par1.medisphere.internal/dockerhub/nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
            # nginx écrit son PID et ses fichiers temporaires sous /tmp (image « unprivileged »).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: page
          configMap:
            name: labo-page
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
