# formation/gitops-labo — k8s/rollout.yaml (M20-E15, stratégie blue/green en M20-E17).
# Blue/green : la nouvelle révision (« green ») démarre À CÔTÉ de l'ancienne, avec tous ses pods,
# derrière le Service d'APERÇU « labo-apercu » ; le Service actif « labo » ne bascule qu'à la
# promotion, MANUELLE, précédée d'une analyse de l'aperçu (gabarit de cluster pret-http, livré avec
# Argo Rollouts). Changer de stratégie ne recrée pas les pods : la prochaine révision suivra la
# nouvelle stratégie.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: labo
  labels:
    app.kubernetes.io/name: labo
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: labo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Image officielle sans privilège (UID 101, port 8080) par le cache Harbor « dockerhub ».
          image: registry.par1.medisphere.internal/dockerhub/nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
            # nginx écrit son PID et ses fichiers temporaires sous /tmp (image « unprivileged »).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: page
          configMap:
            name: labo-page
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
  strategy:
    blueGreen:
      activeService: labo
      previewService: labo-apercu
      # Pas de bascule automatique : « kubectl argo rollouts promote labo -n wb-essais ».
      autoPromotionEnabled: false
      # Avant toute bascule : l'aperçu doit répondre en 2xx (sinon la révision est interrompue).
      prePromotionAnalysis:
        templates:
          - templateName: pret-http
            clusterScope: true
        args:
          - name: url
            value: http://labo-apercu.wb-essais.svc.cluster.local/
      # L'ancienne révision garde ses pods 2 min après la bascule : retour arrière immédiat
      # (« kubectl argo rollouts undo ») sans attendre de nouveaux pods.
      scaleDownDelaySeconds: 120
