# Déposé par playbooks/m20-lyo.yml dans /var/lib/rancher/k3s/server/manifests/ de lyo-k3s01
# (M20-E26, PLAT-2126). k3s l'applique lui-même (Auto-Deploying Manifests).
#
# Ce dont l'Argo CD de k8s-par1 a besoin pour gérer l'espace « agence », et RIEN d'autre :
#   - un compte de service argocd-gestion ;
#   - un Role dans agence : écrire les objets de l'application, lire ce que l'arbre affiche ;
#   - AUCUN ClusterRole ni ClusterRoleBinding : le cluster est enregistré avec namespaces=agence et
#     clusterResources=false, et argocd-cm porte resource.respectRBAC: normal (le contrôleur cesse de
#     surveiller les types qu'il n'a pas le droit de lister au lieu de tomber en erreur).
#   - un jeton longue durée porté par un Secret : EXCEPTION ÉCRITE (comme wb-checks au M14) ; Argo CD
#     ne sait pas renouveler un jeton lié de durée limitée. Révocation : supprimer ce Secret.
#     Rotation : supprimer et laisser k3s le recréer, puis mettre à jour le Vault et secrets-k8s.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: agence
  labels:
    medisphere.internal/site: lyo1
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-gestion
  namespace: agence
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-gestion-jeton
  namespace: agence
  annotations:
    kubernetes.io/service-account.name: argocd-gestion
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-gestion
  namespace: agence
rules:
  # Ce que les applications de l'agence déclarent dans Git (à étendre par MR, type par type).
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # Ce que l'arbre d'Argo CD affiche sous un Deployment : lecture seule. Pas de Secrets.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-gestion
  namespace: agence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-gestion
subjects:
  - kind: ServiceAccount
    name: argocd-gestion
    namespace: agence
