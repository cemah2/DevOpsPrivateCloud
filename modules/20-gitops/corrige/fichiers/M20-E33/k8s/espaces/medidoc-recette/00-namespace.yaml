# plateforme/k8s — espaces/medidoc-recette/00-namespace.yaml (M20-E33, DEV-2133)
# Espace de recette de l'équipe MédiDoc, créé par la PLATEFORME (l'AppProject « medidoc » n'autorise
# aucun objet de cluster). Mêmes garde-fous que medidoc-dev (M14-E33, M15-E28/E34) :
#   - medisphere.internal/equipe : sélectionné par la VAP medisphere-images (M14-E18), le RBAC, la
#     cloison isolement-medidoc-recette (M15-E28) ;
#   - exposition=oui : HTTPRoute acceptée par gw-par1 ;
#   - Pod Security « restricted ».
apiVersion: v1
kind: Namespace
metadata:
  name: medidoc-recette
  labels:
    medisphere.internal/equipe: medidoc
    medisphere.internal/environnement: recette
    medisphere.internal/exposition: oui
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    medisphere.internal/responsable: "<referent.medidoc>"
    medisphere.internal/ticket: "DEV-2133"
