# plateforme/k8s — espaces/mediagenda-prod/10-quota.yaml (M20-E07, repris de M17-E09)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-mediagenda
  namespace: mediagenda-prod
  labels:
    medisphere.internal/environnement: prod
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 12Gi
    pods: "30"
    persistentvolumeclaims: "10"
    requests.storage: 60Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
