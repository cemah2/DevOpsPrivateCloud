# Valeurs du chart communes aux trois environnements gérés par Kustomize (lues par outils/rendre-base.sh).
# Le rendu se fait dans le profil « recette » (base et Valkey externes à l'application) ; chaque overlay
# corrige ce qui dépend de l'environnement (étiquettes, nom publié, version, dépendances, taille).
medisphere:
  environnement: recette
replicaCount: 2
# M20-E11 : les migrations quittent les pods (conteneur d'initialisation) pour un Job hook d'Argo CD
# (components/migrations). Relancer outils/rendre-base.sh après ce changement : le rendu n'a plus
# d'initContainers.
migrations:
  mode: none
tests:
  enabled: false
postgresql:
  cnpg:
    enabled: false
valkey:
  enabled: false
externalValkey:
  url: redis://valkey:6379/0
networkPolicy:
  clusterPostgresqlExterne: mediagenda-db
