# plateforme/k8s — espaces/argo-rollouts.yaml (M20-E15, PLAT-2115)
# Espace du contrôleur Argo Rollouts. Créé par la plateforme (task appliquer) AVANT l'Application
# argo-rollouts, qui ne crée pas d'espace (CreateNamespace=false). Le chart et le conteneur
# d'initialisation du greffon respectent « restricted » (non-root, sans privilège, seccomp).
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  labels:
    medisphere.internal/equipe: plateforme
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    medisphere.internal/responsable: "karim.benali"
    medisphere.internal/ticket: "PLAT-2115"
