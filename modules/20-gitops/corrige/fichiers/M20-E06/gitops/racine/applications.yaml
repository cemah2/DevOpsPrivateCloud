# plateforme/gitops — racine/applications.yaml (M20-E06, PLAT-2106)
# Application « applications » : toutes les Applications et ApplicationSets des équipes, rangées
# dans le dossier applications/ (un fichier par Application ou ApplicationSet). Non récursif : un
# sous-dossier n'est jamais lu par accident.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applications
  namespace: argocd
  labels:
    medisphere.internal/niveau: groupe
spec:
  project: default
  source:
    repoURL: https://git01.par1.medisphere.internal/plateforme/gitops.git
    targetRevision: main
    path: applications
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
