# La prod à part, pour être sûr qu'elle se synchronise (Lucas)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medinotif-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git01.par1.medisphere.internal/medinotif/deploiement.git
    targetRevision: HEAD
    path: overlays/prod
  destination:
    name: in-cluster
    namespace: medinotif-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
