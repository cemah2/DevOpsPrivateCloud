---
# host_vars/mon01/mailpit.yml — Mailpit sur mon01 (M19-E03 ; comptes revus au M24-E18).
mailpit_version: "1.31.6"
mailpit_sha256: "10fa12ccc610f653d4ed4df848c1817f9935dcf4e9a6a458a19ab0fa02093f91"

# Comptes de l'API et de l'interface sur 8025 (Mailpit n'a pas de rôles : tout compte a tous les droits).
# M24-E18 : plus de compte de PERSONNE. Les personnes passent par OAuth2 Proxy (8443, SSO) qui
# présente le compte technique « sso » ; « wb-checks » reste pour les vérifications (MGMT seulement).
# Le compte <MOI> du M19 est retiré par le rôle (tâche « Comptes en trop retirés »).
mailpit_comptes:
  - nom: sso
    mot_de_passe: "{{ vault_mailpit_mdp_sso }}"
  - nom: wb-checks
    mot_de_passe: "{{ vault_mailpit_mdp_wb_checks }}"

# OAuth2 Proxy transmet le nom demandé par le navigateur (Host) : il doit être autorisé.
mailpit_noms_autorises:
  - "mon01.par1.medisphere.internal:8025"
  - "smtp.par1.medisphere.internal:8025"
  - "mon01.par1.medisphere.internal:8443"
