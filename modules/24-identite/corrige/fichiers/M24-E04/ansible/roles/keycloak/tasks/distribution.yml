---
# Archive officielle (Maven Central), vérifiée par empreinte AVANT d'être décompressée ; une version
# par dossier (/opt/keycloak-<version>), lien /opt/keycloak vers la version en service. Monter de
# version = nouveau dossier, nouvelle construction, bascule du lien (retour arrière : l'inverse,
# avec la sauvegarde de la base, RB-245).

- name: Groupe du service
  ansible.builtin.group:
    name: "{{ keycloak_groupe }}"
    system: true

- name: Utilisateur du service (sans shell, sans dossier personnel)
  ansible.builtin.user:
    name: "{{ keycloak_utilisateur }}"
    group: "{{ keycloak_groupe }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Dossier des archives
  ansible.builtin.file:
    path: "{{ keycloak_dossier_archives }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Archive de Keycloak, empreinte vérifiée — {{ keycloak_version }}
  ansible.builtin.get_url:
    url: "{{ keycloak_url }}"
    dest: "{{ keycloak_dossier_archives }}/keycloak-{{ keycloak_version }}.tar.gz"
    checksum: "sha256:{{ keycloak_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Décompression dans le dossier de la version, propriété de root — {{ keycloak_version }}
  ansible.builtin.unarchive:
    src: "{{ keycloak_dossier_archives }}/keycloak-{{ keycloak_version }}.tar.gz"
    dest: "{{ keycloak_dossier_parent }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ keycloak_dossier_parent }}/keycloak-{{ keycloak_version }}/bin/kc.sh"
  notify: Redémarrer keycloak

- name: Données du service (seul dossier où Keycloak écrit)
  ansible.builtin.file:
    path: "{{ keycloak_dossier_parent }}/keycloak-{{ keycloak_version }}/data"
    state: directory
    owner: "{{ keycloak_utilisateur }}"
    group: "{{ keycloak_groupe }}"
    mode: "0750"

- name: Lien /opt/keycloak vers la version en service
  ansible.builtin.file:
    src: "{{ keycloak_dossier_parent }}/keycloak-{{ keycloak_version }}"
    dest: "{{ keycloak_dossier_parent }}/keycloak"
    state: link
    owner: root
    group: root
  notify: Redémarrer keycloak
