# ansible.cfg — plateforme/identite (M24-E03). Même contrat que plateforme/ansible (M04) :
# collections du projet, identité Vault « critique » lue par outils/vault-pass-client.sh
# (copie à l'identique de celui de plateforme/ansible, M04-E30), faits jamais mis en cache.
[defaults]
inventory = annuaire/inventaire.yml
collections_path = ./collections
vault_identity_list = critique@outils/vault-pass-client.sh
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent

[ssh_connection]
pipelining = true
