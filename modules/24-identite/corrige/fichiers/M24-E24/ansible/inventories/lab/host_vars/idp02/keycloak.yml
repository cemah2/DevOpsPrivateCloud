---
# host_vars/idp02/keycloak.yml — second nœud de l'essai de grappe (M24-E24, PLAT-2524).
# MÊME version et MÊME configuration de construction que idp01 (deux versions différentes dans
# une grappe : refusé, sauf compatibilité vérifiée par « kc.sh update-compatibility », E33).
keycloak_version: "26.7.5"
keycloak_sha256: "87d680d13cf4600d232ca0433a2553c57ebf03e56f7718fc0d03a1a8705497c8"
keycloak_hostname: https://sso.par1.medisphere.internal
keycloak_mandataires: [10.10.70.10, 10.10.70.11]
# 2 Go de mémoire, sans PostgreSQL : un tas un peu plus petit qu'idp01.
keycloak_tas: "-Xms384m -Xmx768m"

keycloak_grappe: true
# Base distante : celle d'idp01, par son nom (le certificat de PostgreSQL n'est pas vérifié : voir
# keycloak_bdd_url_proprietes dans les valeurs par défaut du rôle).
keycloak_bdd_hote: idp01.par1.medisphere.internal
# Le mot de passe de la base est celui d'idp01 (Vault critique de host_vars/idp01) : pas de copie.
keycloak_bdd_mot_de_passe: "{{ hostvars['idp01']['vault_keycloak_bdd_mot_de_passe'] }}"
