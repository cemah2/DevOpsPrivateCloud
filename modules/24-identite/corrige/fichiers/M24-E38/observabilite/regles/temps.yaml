# plateforme/observabilite — regles/temps.yaml (M24-E38, INC-5138). À ajouter à regles/kustomization.yaml
# (« - temps.yaml ») et au job de tests des règles (tests/temps.test.yaml).
#
# Les jetons du royaume vivent 5 minutes et leur « exp » se lit avec l'horloge du VÉRIFICATEUR ; l'OTP
# change toutes les 30 secondes. Une horloge fausse sur l'émetteur (idp01), sur l'annuaire (Kerberos)
# ou sur un nœud de contrôle est donc une panne d'identité. node_exporter (collecteurs « time » et
# « timex », actifs par défaut) tourne sur toutes les VMs (job vms, M21-E08) et sur les nœuds
# (job node-exporter de kube-prometheus-stack ; instance = nom du nœud).
#
# Écart : node_time_seconds est l'heure de la machine AU MOMENT de la collecte ; timestamp() est l'heure
# de Prometheus pour ce même échantillon. La différence est l'écart de la machine à Prometheus (dont
# l'horloge suit aussi les passerelles), à la durée de collecte près (moins d'une seconde).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: temps
  namespace: supervision
  labels:
    medisphere.internal/supervision: "oui"
spec:
  groups:
    - name: temps.alertes
      rules:
        # Identité et plan de contrôle : critique (tout le SSO, ou kubectl, en dépend).
        - alert: HorlogeDecalee
          expr: |
            abs(node_time_seconds{instance=~"(idp01|ipa01|k8s-cp0[0-9]).*"}
                - timestamp(node_time_seconds{instance=~"(idp01|ipa01|k8s-cp0[0-9]).*"})) > 30
          for: 2m
          labels:
            gravite: critique
            equipe: plateforme
          annotations:
            resume: "{{ $labels.instance }} : horloge décalée de {{ $value | humanizeDuration }}"
            description: >-
              Les jetons du royaume (5 min) et les codes OTP (30 s) dépendent de cette horloge :
              « jeton expiré », OTP refusé, kubectl refusé par un serveur d'API sur trois. Vérifie
              timedatectl et chronyc tracking sur la machine ; RB-246 §4.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/identite/runbooks/RB-246-sso-indisponible.md
        - alert: HorlogeDecalee
          expr: |
            abs(node_time_seconds{instance!~"(idp01|ipa01|k8s-cp0[0-9]).*"}
                - timestamp(node_time_seconds{instance!~"(idp01|ipa01|k8s-cp0[0-9]).*"})) > 30
          for: 2m
          labels:
            gravite: avertissement
            equipe: plateforme
          annotations:
            resume: "{{ $labels.instance }} : horloge décalée de {{ $value | humanizeDuration }}"
            description: >-
              Certificats, journaux, jetons et sauvegardes datés de travers. Vérifie timedatectl et
              chronyc tracking sur la machine ; RB-246 §4.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/identite/runbooks/RB-246-sso-indisponible.md
        # Le noyau ne se dit plus synchronisé (service de temps arrêté, ou réglage à la main par
        # « date -s », qui met le noyau en STA_UNSYNC) : prévient AVANT que l'écart ne grandisse.
        - alert: HorlogeNonSynchronisee
          expr: |
            min_over_time(node_timex_sync_status[5m]) == 0
          for: 10m
          labels:
            gravite: avertissement
            equipe: plateforme
          annotations:
            resume: "{{ $labels.instance }} : l'horloge n'est plus synchronisée"
            description: >-
              Le service de temps (chrony ou chronyd) est arrêté ou ne joint plus gw01/gw02.
              systemctl status chrony ; chronyc sources ; RB-246 §4.
            runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/securite/identite/runbooks/RB-246-sso-indisponible.md
