---
# host_vars/idp-resto/keycloak.yml — restauration d'essai (M24-E25). MÊME version que la sauvegarde
# restaurée (26.7.5 ici ; 26.8.1 pour l'essai de montée d'E33, APRÈS la restauration en 26.7.5).
keycloak_version: "26.7.5"
keycloak_sha256: "87d680d13cf4600d232ca0433a2553c57ebf03e56f7718fc0d03a1a8705497c8"
keycloak_hostname: https://sso.par1.medisphere.internal   # même émetteur que la production
keycloak_mandataires: [10.10.10.10]                         # sans objet : pas de mandataire ici
keycloak_tas: "-Xms384m -Xmx768m"
# Contrôles du rôle désactivés : ils vérifient le certificat avec la racine du lab, or idp-resto a
# un certificat auto-signé d'essai. Les preuves se font à la main (RB-243 §4).
keycloak_verifier: false
# Mot de passe de la base d'ESSAI (pas celui de la production) : fichier chiffré local à l'inventaire,
#   uv run ansible-vault create --encrypt-vault-id critique inventories/essai-resto/host_vars/idp-resto/vault.yml
# avec vault_keycloak_bdd_mot_de_passe: "<openssl rand -hex 24>".
