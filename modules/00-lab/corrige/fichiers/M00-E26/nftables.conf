#!/usr/sbin/nft -f
# =============================================================================
# /etc/nftables.conf — gw01, routeur/pare-feu du site PAR1 (lab MédiSphère)
#
# Version corrigée de la proposition du stagiaire (M00-E26). C'est aussi l'état
# de référence de gw01 à la fin du palier 2 : M00-E10 (base) + E13 (DNS) +
# E14 (relais DHCP) + E16 (VPN wg1) + E20 (hp01 par le LAN) + E21 (tunnel wg0).
# Le NTP n'y est pas encore : gw01 ne devient serveur de temps qu'en M00-E31,
# qui ajoute ses règles (corrige/fichiers/M00-E31/nftables-ntp.nft).
#
# Valeurs d'exemple à adapter (voir lab/inventaire-local.md) :
#   192.168.1.0/24 = <LAN-MAISON>    192.168.1.20 = <IP-PVE01>
#   192.168.1.30   = <IP-HP01-LAN>
#
# Appliquer : nft -c -f /etc/nftables.conf && systemctl reload nftables
# =============================================================================

# Repart d'une feuille blanche à chaque chargement : sans cette ligne, un
# rechargement AJOUTE les règles à celles déjà en place (doublons).
flush ruleset

# --- Interfaces ---------------------------------------------------------------
define WAN       = "ens18"
define V_MGMT    = "ens19.10"
define V_INFRA   = "ens19.20"
define V_SANDBOX = "ens19.99"
define LAB_IFS   = { "ens19.10", "ens19.20", "ens19.30", "ens19.40", "ens19.50", "ens19.52", "ens19.60", "ens19.70", "ens19.99" }
define WG_S2S    = "wg0"        # tunnel site à site vers PAR2 (M00-E21)
define WG_ADM    = "wg1"        # VPN d'administration (M00-E16)

# --- Adresses -----------------------------------------------------------------
define LAN_MAISON = 192.168.1.0/24     # <LAN-MAISON>
define PVE01      = 192.168.1.20       # <IP-PVE01>
define HP01_LAN   = 192.168.1.30       # <IP-HP01-LAN> (extrémité WireGuard de PAR2)
define DNS01      = 10.10.20.10
define PBS01      = 10.20.10.10
define NETS_LAB   = 10.10.0.0/16
define NETS_PAR2  = 10.20.0.0/16       # pbs01 émet vers PAR1 depuis 10.20.10.10 (routes « src », M00-E21)
define NET_VPN    = 10.255.1.0/24
define PAR2_MGMT  = 10.20.10.0/24

table inet filter {

	# -------------------------------------------------------------------------
	# Trafic à destination de gw01 lui-même
	# -------------------------------------------------------------------------
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop comment "hors état connu : jamais légitime"
		ct state { established, related } accept comment "réponses et ICMP liés (dont PMTUD)"
		iif "lo" accept

		# ICMP : diagnostic et messages d'erreur. ICMPv6 : NDP indispensable sur le WAN.
		icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
		icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# Administration de gw01
		iifname $WAN ip saddr $LAN_MAISON tcp dport 22 accept comment "SSH depuis le LAN maison (accès de secours)"
		iifname { $V_MGMT, $WG_ADM } tcp dport 22 accept comment "SSH depuis MGMT (adm01) et le VPN d'admin"

		# Relais DHCP du VLAN 99 (M00-E14)
		iifname $V_SANDBOX udp sport 68 udp dport 67 accept comment "clients DHCP du VLAN 99 vers le relais"
		iifname $V_INFRA ip saddr $DNS01 ip daddr 10.10.99.1 udp sport 67 udp dport 67 accept comment "réponses de dns01 adressées au giaddr (non reconnues par conntrack)"

		# WireGuard
		iifname $WAN ip saddr $LAN_MAISON udp dport 51821 accept comment "wg1 : VPN d'administration"
		iifname $WAN ip saddr $HP01_LAN udp dport 51820 accept comment "wg0 : tunnel vers PAR2"

		limit rate 10/minute burst 20 packets log prefix "nft-in-drop: " level info
		counter comment "rejeté par la politique"
	}

	# -------------------------------------------------------------------------
	# Trafic routé à travers gw01
	# -------------------------------------------------------------------------
	chain forward {
		type filter hook forward priority filter; policy drop;

		ct state invalid drop
		ct state { established, related } accept comment "réponses et ICMP liés (dont PMTUD)"

		# Diagnostic : ping traversant depuis les postes d'administration
		ip saddr { 10.10.10.0/24, $NET_VPN, $PVE01 } icmp type echo-request accept

		# Administration
		iifname $V_MGMT oifname { $LAB_IFS, $WG_S2S } accept comment "bastion (MGMT) vers tout le lab et PAR2"
		iifname $WG_ADM oifname { $V_MGMT, $V_INFRA } accept comment "VPN d'admin vers MGMT et INFRA"
		iifname $WG_ADM oifname $WG_S2S ip daddr $PAR2_MGMT accept comment "VPN d'admin vers PAR2 MGMT"
		iifname $V_MGMT oifname $WAN ip daddr $PVE01 tcp dport { 22, 8006 } accept comment "adm01 vers pve01 (SSH, API)"
		iifname $WG_ADM oifname $WAN ip daddr $PVE01 tcp dport { 22, 8006 } accept comment "VPN d'admin vers pve01 (SSH, API)"
		iifname $V_MGMT oifname $WAN ip daddr $HP01_LAN tcp dport { 22, 8007 } accept comment "adm01 vers hp01 par le LAN (transition E20, avant tunnel)"
		iifname $WAN ip saddr $PVE01 oifname $LAB_IFS tcp dport 22 accept comment "pve01 vers les VMs (vérifications avant E15)"

		# Services socle
		ip saddr { $NETS_LAB, $NETS_PAR2, $NET_VPN } ip daddr $DNS01 meta l4proto { tcp, udp } th dport 53 accept comment "DNS du lab (UDP et TCP) vers dns01"
		iifname $V_INFRA ip saddr $DNS01 oifname $WAN meta l4proto { tcp, udp } th dport 53 accept comment "dns01 vers les résolveurs amont"
		iifname $V_SANDBOX ip daddr $DNS01 udp sport 68 udp dport 67 accept comment "renouvellements DHCP (T1) en unicast vers dns01"

		# Sauvegardes vers PAR2
		iifname $WAN ip saddr $PVE01 oifname $WG_S2S ip daddr $PBS01 tcp dport 8007 accept comment "pve01 vers PBS"

		# Sortie Internet du lab (le LAN maison n'est pas « Internet »)
		iifname $LAB_IFS oifname $WAN ip daddr != $LAN_MAISON accept comment "lab vers Internet (NAT)"

		limit rate 10/minute burst 20 packets log prefix "nft-fwd-drop: " level info
		counter comment "rejeté par la politique"
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

table ip nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;

		# pve01 a une route statique vers le lab : inutile de masquer ce qui lui est
		# destiné, et ses journaux (et son pare-feu, M00-E27) voient les vraies sources.
		oifname $WAN ip saddr $NETS_LAB ip daddr != $PVE01 masquerade comment "lab vers Internet et LAN maison"
		oifname $WG_S2S ip saddr $LAN_MAISON masquerade comment "LAN maison vers PAR2 : retour symétrique par le tunnel (M00-E21)"
	}
}
