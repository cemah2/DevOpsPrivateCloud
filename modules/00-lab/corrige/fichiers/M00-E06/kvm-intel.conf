# /etc/modprobe.d/kvm-intel.conf — pve01 (M00-E06)
# Virtualisation imbriquée : les VMs dont le type de CPU expose VT-x (cpu: host)
# peuvent elles-mêmes faire tourner KVM (Proxmox imbriqué M09, OpenStack M10).
# Valeur par défaut des noyaux récents : déjà Y. Ce fichier documente
# l'intention et protège contre un changement de valeur par défaut.
# Prise en compte : au chargement du module (en pratique, au redémarrage).
options kvm_intel nested=Y
