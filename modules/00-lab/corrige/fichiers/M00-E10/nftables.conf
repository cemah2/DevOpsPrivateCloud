#!/usr/sbin/nft -f
# =============================================================================
# /etc/nftables.conf — gw01, routeur/pare-feu du site PAR1 (lab MédiSphère)
# État de base, M00-E10. Les exercices suivants ajoutent leurs règles :
#   E13 (DNS vers dns01), E14 (relais DHCP), E16 (VPN wg1), E20 (adm01 vers hp01
#   par le LAN), E21 (tunnel wg0) ; puis E31 (NTP). État complet de fin de
#   palier 2 : corrige/fichiers/M00-E26/nftables.conf.
#
# Valeurs d'exemple À ADAPTER (voir lab/inventaire-local.md) :
#   192.168.1.0/24 = <LAN-MAISON>     192.168.1.20 = <IP-PVE01>
#
# Vérifier puis appliquer :
#   nft -c -f /etc/nftables.conf && systemctl reload nftables
# Filet de sécurité avant un changement risqué en SSH :
#   systemd-run --on-active=5min --unit=nft-secours /usr/sbin/nft flush ruleset
#   (puis « systemctl stop nft-secours.timer » si tout va bien)
# =============================================================================

# Repart d'une feuille blanche à chaque chargement : sans cette ligne, un
# rechargement AJOUTE les règles à celles déjà en place (doublons).
flush ruleset

# --- Interfaces ---------------------------------------------------------------
define WAN     = "ens18"
define V_MGMT  = "ens19.10"
define LAB_IFS = { "ens19.10", "ens19.20", "ens19.30", "ens19.40", "ens19.50", "ens19.52", "ens19.60", "ens19.70", "ens19.99" }

# --- Adresses -----------------------------------------------------------------
define LAN_MAISON = 192.168.1.0/24     # <LAN-MAISON>
define PVE01      = 192.168.1.20       # <IP-PVE01>
define NETS_LAB   = 10.10.0.0/16

table inet filter {

	# -------------------------------------------------------------------------
	# Trafic à destination de gw01 lui-même
	# -------------------------------------------------------------------------
	chain input {
		type filter hook input priority filter; policy drop;

		# [1] Suivi de connexion. « invalid » d'abord : un paquet hors état
		#     (ACK sans SYN, etc.) n'a jamais de raison légitime d'entrer.
		ct state invalid counter drop comment "M1 : hors état connu"
		ct state { established, related } accept comment "M1 : réponses et ICMP liés"
		iif "lo" accept comment "boucle locale"

		# [4] ICMP : diagnostic (ping) et messages d'erreur, débit limité.
		#     ICMPv6 : la découverte de voisins (NDP) est indispensable à IPv6
		#     sur le WAN (la box distribue souvent de l'IPv6).
		icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept comment "M4 : ICMP"
		icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept comment "M4 : ICMPv6 et NDP"

		# [2] [3] Administration de gw01
		iifname $WAN ip saddr $LAN_MAISON tcp dport 22 accept comment "M2 : SSH depuis le LAN maison (dont pve01)"
		iifname $V_MGMT tcp dport 22 accept comment "M3 : SSH depuis MGMT (adm01)"

		# [11] Journalisation des refus, SANS décision : la règle « limit » ne
		#      correspond plus au-delà du débit, le paquet doit alors continuer
		#      vers la politique drop, pas vers une règle suivante.
		limit rate 10/minute burst 20 packets log prefix "nft-in-drop: " level info
		counter comment "M11 : rejeté par la politique"
	}

	# -------------------------------------------------------------------------
	# Trafic routé à travers gw01
	# -------------------------------------------------------------------------
	chain forward {
		type filter hook forward priority filter; policy drop;

		# [1] Suivi de connexion : seules les nouvelles connexions sont évaluées
		#     par les règles suivantes ; les ICMP d'erreur liés (dont « fragmentation
		#     needed », indispensable à la découverte de MTU) passent ici.
		ct state invalid counter drop comment "M1 : hors état connu"
		ct state { established, related } accept comment "M1 : réponses et ICMP liés"

		# [8] Ping traversant depuis les postes d'administration
		ip saddr { 10.10.10.0/24, $PVE01 } icmp type echo-request accept comment "M8 : ping d'administration"

		# [5] [6] Le bastion (VLAN MGMT) administre le lab et pve01
		iifname $V_MGMT oifname $LAB_IFS accept comment "M5 : MGMT vers tous les VLANs routés"
		iifname $V_MGMT oifname $WAN ip daddr $PVE01 tcp dport { 22, 8006 } accept comment "M6 : adm01 vers pve01 (SSH, API)"

		# [7] PROVISOIRE : SSH du LAN maison vers le lab (route statique sur le
		#     poste, et vérifications lancées depuis pve01). Remplacé en E16.
		iifname $WAN ip saddr $LAN_MAISON oifname $LAB_IFS tcp dport 22 accept comment "M7 : SSH LAN maison vers lab (provisoire)"

		# [9] Sortie Internet du lab. Le LAN maison n'est PAS « Internet » :
		#     sans « ip daddr != », la sandbox joindrait ta box, ton NAS, tes PC.
		iifname $LAB_IFS oifname $WAN ip daddr != $LAN_MAISON accept comment "M9 : lab vers Internet (NAT)"

		# [10] Tout le reste (inter-VLAN, lab vers LAN maison, IPv6 routé) tombe
		#      sur la politique drop. [11] Journalisation limitée, puis compteur.
		limit rate 10/minute burst 20 packets log prefix "nft-fwd-drop: " level info
		counter comment "M10/M11 : rejeté par la politique"
	}

	# gw01 émet librement (mises à jour, NTP amont, DNS) : on filtre ce qui entre
	# et ce qui traverse, pas ce que le routeur lui-même initie.
	chain output {
		type filter hook output priority filter; policy accept;
	}
}

table ip nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;

		# Masquage du lab derrière <IP-GW01-WAN>, SAUF vers pve01 : il a une route
		# de retour vers 10.10.0.0/16, il voit donc les vraies adresses sources
		# (journaux et pare-feu de pve01 exploitables, M00-E27).
		oifname $WAN ip saddr $NETS_LAB ip daddr != $PVE01 masquerade comment "lab vers Internet et LAN maison"
	}
}
