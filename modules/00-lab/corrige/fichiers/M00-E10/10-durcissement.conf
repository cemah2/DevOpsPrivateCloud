# /etc/ssh/sshd_config.d/10-durcissement.conf — gw01 (M00-E10)
# Vérifier avant de recharger : sshd -t && systemctl reload ssh
# Contrôler la configuration effective : sshd -T | grep -E 'passwordauth|permitroot|kbdinter'
#
# Les fichiers de sshd_config.d sont lus AVANT le reste de sshd_config, et pour
# la plupart des options la PREMIÈRE valeur rencontrée l'emporte : un réglage
# posé ici gagne sur un « PasswordAuthentication yes » plus bas.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
