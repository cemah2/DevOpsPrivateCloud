# =============================================================================
# /etc/sysctl.d/99-routeur.conf — gw01 (M00-E10)
# Appliquer sans redémarrer : sysctl --system
# Debian 13 n'a plus de /etc/sysctl.conf : tout passe par /etc/sysctl.d/.
# =============================================================================

# gw01 est un routeur : il transmet les paquets IPv4 entre ses interfaces.
net.ipv4.ip_forward = 1

# Un routeur n'envoie pas de redirections ICMP : tous les VLANs passent par
# lui volontairement, et une redirection inciterait un hôte à le contourner.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Et il n'en accepte pas : sa table de routage ne doit changer que par sa
# configuration (une redirection forgée est un vecteur d'interception).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Pas de routage par la source (option IP obsolète, utilisée pour contourner
# le filtrage).
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Filtrage par chemin inverse strict : un paquet n'est accepté sur une
# interface que si la route vers sa source repasse par cette même interface.
# Bloque l'usurpation d'adresses entre VLANs (une VM du VLAN 99 qui se fait
# passer pour 10.10.10.10). À assouplir (2 = mode « loose ») seulement en cas
# de routage asymétrique voulu (plusieurs liens, ECMP).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# IPv6 : le lab est IPv4 uniquement. gw01 ne route pas l'IPv6 (valeur par
# défaut, écrite ici pour documenter l'intention). Il garde l'IPv6 sur son WAN.
net.ipv6.conf.all.forwarding = 0
