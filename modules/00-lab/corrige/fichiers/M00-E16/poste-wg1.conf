# =============================================================================
# Configuration client WireGuard du poste de l'apprenant (M00-E16)
# Linux : /etc/wireguard/wg1.conf (mode 600) puis « wg-quick up wg1 »,
#         ou « nmcli connection import type wireguard file wg1.conf ».
# Windows / macOS : application WireGuard officielle, « Ajouter un tunnel vide »
#         (la clé privée est générée sur le poste), puis coller la suite.
# =============================================================================
[Interface]
PrivateKey = <CLE-PRIVEE-DU-POSTE>
Address = 10.255.1.2/32
# DNS facultatif. Selon le système, ce réglage remplace le DNS de TOUT le poste
# (Windows, wg-quick + resolvconf) : sans domaine de recherche « routé », les noms
# Internet passent alors par dns01, VPN coupé = plus de DNS. Voir le corrigé.
#DNS = 10.10.20.10, par1.medisphere.internal

[Peer]
# gw01 — VPN d'administration du lab
PublicKey = <CLE-PUBLIQUE-WG1-DE-GW01>
Endpoint = <IP-GW01-WAN>:51821
# Tunnel partagé (split tunnel) : seuls les réseaux d'administration passent
# par le VPN ; Internet et le LAN maison restent en direct.
AllowedIPs = 10.10.10.0/24, 10.10.20.0/24, 10.20.10.0/24, 10.255.1.0/24
# Hors du LAN maison (4G, hôtel), pour joindre aussi pve01 (22, 8006) par le VPN :
#AllowedIPs = <IP-PVE01>/32
# Inutile sur le même LAN que gw01 ; indispensable derrière un NAT (4G, hôtel).
#PersistentKeepalive = 25
