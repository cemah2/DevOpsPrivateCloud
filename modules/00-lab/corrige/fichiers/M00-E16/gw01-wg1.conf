# =============================================================================
# /etc/wireguard/wg1.conf — gw01 : VPN d'administration (M00-E16)
# Mode 600, propriétaire root. Activation : systemctl enable --now wg-quick@wg1
# Ajout d'un pair à chaud sans couper les autres :
#   wg syncconf wg1 <(wg-quick strip wg1)
# =============================================================================
[Interface]
Address = 10.255.1.1/24
ListenPort = 51821
# Clé privée dans le fichier (mode 600, root) : méthode standard, compatible avec
# « wg syncconf ». Variante : la lire depuis un fichier séparé avec
# « PostUp = wg set %i private-key /etc/wireguard/wg1.key » (voir le corrigé).
PrivateKey = <CLE-PRIVEE-WG1-DE-GW01>

# Un pair = une personne. AllowedIPs en /32 : le pair ne peut émettre qu'avec
# CETTE adresse source (routage par clé cryptographique).
[Peer]
# <PRENOM-NOM> — poste d'administration, ajouté le <AAAA-MM-JJ>
PublicKey = <CLE-PUBLIQUE-DU-POSTE>
AllowedIPs = 10.255.1.2/32
