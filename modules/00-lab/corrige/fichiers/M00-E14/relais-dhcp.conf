# =============================================================================
# /etc/dnsmasq.d/relais-dhcp.conf — gw01 : dnsmasq en RELAIS DHCP uniquement
# M00-E14. Le serveur DHCP (et DNS) du lab, c'est dns01.
# =============================================================================

# Pas de service DNS sur le routeur.
port=0

# N'écouter (DHCP) que sur le VLAN SANDBOX.
interface=ens19.99

# Tout ce qui arrive sur l'interface portant 10.10.99.1 est relayé vers dns01.
# 10.10.99.1 est inscrit comme giaddr : dns01 s'en sert pour choisir la plage,
# et y renvoie ses réponses (UDP 67 → 67).
dhcp-relay=10.10.99.1,10.10.20.10

# Durcissement possible selon ta version de dnsmasq (vérifie « man dnsmasq ») :
# un 3e paramètre restreint l'interface sur laquelle les réponses du serveur
# sont acceptées (anti-usurpation).
#dhcp-relay=10.10.99.1,10.10.20.10,ens19.20
