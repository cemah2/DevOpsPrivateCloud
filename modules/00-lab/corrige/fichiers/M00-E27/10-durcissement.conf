# /etc/ssh/sshd_config.d/10-durcissement.conf — M00-E27 (SEC-127)
# Lu via « Include /etc/ssh/sshd_config.d/*.conf » placé en tête de sshd_config :
# pour la plupart des options, la PREMIÈRE valeur lue l'emporte, donc ce fichier
# prime sur les directives de /etc/ssh/sshd_config.
# Valider avant de recharger : sshd -t && sshd -T | grep -Ei 'permitroot|password|kbdinteractive'

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# Limite le bruit des scans et la fenêtre d'attaque
LoginGraceTime 30
MaxAuthTries 4
