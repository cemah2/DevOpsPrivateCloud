# gw01 : /etc/chrony/conf.d/10-serveur-lab.conf — M00-E31 (PLAT-131)
# Lu grâce à « confdir /etc/chrony/conf.d » du chrony.conf Debian.
# Les sources Internet restent celles du chrony.conf Debian (pool 2.debian.pool.ntp.org).

# Clients autorisés : PAR1 et PAR2. pbs01 interroge gw01 depuis 10.20.10.10 grâce
# aux routes « src » de son wg0.conf (M00-E21) : pas besoin d'autoriser 10.255.0.0/30.
# (Si la source n'avait pas été fixée en E21, pbs01 émettrait depuis 10.255.0.2 :
# corrige alors son wg0.conf plutôt que d'ajouter une exception ici.)
allow 10.10.0.0/16
allow 10.20.0.0/16

# Si gw01 perd Internet, il continue de servir son horloge en se déclarant stratum 10 :
# le lab reste cohérent avec lui-même (dérive commune) au lieu de se désynchroniser.
local stratum 10

# Limite de débit par client (protège d'un client mal configuré).
ratelimit interval 1 burst 16
