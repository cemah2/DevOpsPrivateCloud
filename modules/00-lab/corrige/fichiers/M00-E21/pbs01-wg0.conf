# =============================================================================
# /etc/wireguard/wg0.conf — pbs01 : tunnel site à site PAR2 → PAR1 (M00-E21)
# Mode 600. Prérequis : apt install wireguard-tools
# Activation : systemctl enable --now wg-quick@wg0
# =============================================================================
[Interface]
Address = 10.255.0.2/30
ListenPort = 51820
PrivateKey = <CLE-PRIVEE-WG0-DE-PBS01>
# Routes posées à la main plutôt que par wg-quick : celles que wg-quick déduit des
# AllowedIPs n'ont pas d'adresse source préférée, et pbs01 émettrait alors vers
# PAR1 depuis 10.255.0.2. Avec « src 10.20.10.10 », tout ce que pbs01 envoie vers
# PAR1 (DNS, NTP en M00-E31…) porte son adresse de site, que les règles de gw01
# reconnaissent comme PAR2 (10.20.0.0/16). 10.20.10.10 est locale (vmbr1, E20).
# La route vers 10.255.0.1 vient de l'adresse /30 ci-dessus (route connectée).
Table = off
PostUp = ip route add 10.10.0.0/16 dev %i src 10.20.10.10
PostUp = ip route add 10.255.1.0/24 dev %i src 10.20.10.10
# Les routes disparaissent de toute façon avec l'interface ; on les retire avant
# (« || true » : pas d'échec de « wg-quick down » si elles manquent déjà).
PreDown = ip route del 10.10.0.0/16 dev %i || true
PreDown = ip route del 10.255.1.0/24 dev %i || true

[Peer]
# gw01 — site PAR1
PublicKey = <CLE-PUBLIQUE-WG0-DE-GW01>
Endpoint = <IP-GW01-WAN>:51820
# Réseaux de PAR1 acceptés depuis ce pair (routage par clé) ; avec « Table = off »,
# ils ne créent plus de route, d'où les PostUp ci-dessus (à garder cohérents) :
#  - 10.10.0.0/16 : le lab PAR1 (adm01, dns01, NTP sur les passerelles…) ;
#  - 10.255.1.0/24 : le VPN d'administration (accès à l'interface PBS depuis le poste).
# Le LAN maison n'y figure PAS : pbs01 y est directement connecté.
AllowedIPs = 10.255.0.1/32, 10.10.0.0/16, 10.255.1.0/24
PersistentKeepalive = 25
