#!/usr/sbin/nft -f
# =============================================================================
# /etc/nftables.conf — pbs01 (PBS, site PAR2), M00-E21
#
# PBS n'embarque pas le pare-feu intégré de Proxmox VE : on utilise nftables,
# natif sur Debian 13 (paquet nftables, service nftables.service).
#
# ⚠️ Appliquer avec un filet de sécurité (voir le corrigé) : une erreur ici
# coupe SSH et l'interface web. Garder l'iLO ou un écran à portée de main.
#
# Valeurs d'exemple à adapter :
#   "eno1" = <NIC-HP01-LAN>   192.168.1.0/24 = <LAN-MAISON>   192.168.1.40 = <IP-GW01-WAN>
# =============================================================================
flush ruleset

define LAN_IF      = "eno1"              # <NIC-HP01-LAN>
define LAN_MAISON  = 192.168.1.0/24      # <LAN-MAISON>
define GW01_WAN    = 192.168.1.40        # <IP-GW01-WAN> : extrémité WireGuard de PAR1
define ADMIN_SRC   = { 10.10.10.0/24, 10.255.1.0/24 }   # MGMT (adm01) et VPN d'admin
define GW01_TUNNEL = 10.255.0.1          # sources du LAN maison masquées par gw01 (pve01)

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state { established, related } accept
		iif "lo" accept

		icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
		icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# Le tunnel lui-même : seulement depuis gw01
		iifname $LAN_IF ip saddr $GW01_WAN udp dport 51820 accept comment "wg0 depuis gw01"

		# À travers le tunnel uniquement
		iifname "wg0" ip saddr $ADMIN_SRC tcp dport { 22, 8007 } accept comment "administration (SSH, interface web)"
		iifname "wg0" ip saddr $GW01_TUNNEL tcp dport 8007 accept comment "pve01 (masqué par gw01) : sauvegardes"

		# Accès de secours si le tunnel tombe (en plus de l'iLO)
		iifname $LAN_IF ip saddr $LAN_MAISON tcp dport 22 accept comment "SSH de secours depuis le LAN maison"

		limit rate 10/minute burst 20 packets log prefix "nft-in-drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
