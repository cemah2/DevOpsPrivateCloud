# =============================================================================
# /etc/wireguard/wg0.conf — gw01 : tunnel site à site PAR1 → PAR2 (M00-E21)
# Mode 600. Activation : systemctl enable --now wg-quick@wg0
# =============================================================================
[Interface]
Address = 10.255.0.1/30
ListenPort = 51820
PrivateKey = <CLE-PRIVEE-WG0-DE-GW01>
# MTU : laissé au calcul automatique de wg-quick (MTU de la route vers
# l'extrémité - 80 = 1420 sur un LAN à 1500). Voir la remarque MSS du corrigé.

[Peer]
# pbs01 (hp01) — site PAR2
PublicKey = <CLE-PUBLIQUE-WG0-DE-PBS01>
Endpoint = <IP-HP01-LAN>:51820
# Ce que gw01 accepte de PAR2 ET ce que wg-quick route vers wg0 :
# l'adresse de tunnel de pbs01 et le réseau du site PAR2.
AllowedIPs = 10.255.0.2/32, 10.20.0.0/16
# Garde l'état conntrack/NAT ouvert sur le chemin et détecte vite une coupure.
PersistentKeepalive = 25
