# =============================================================================
# /etc/dnsmasq.d/medisphere.conf — dns01 : DNS provisoire du lab MédiSphère
# État à la fin de M00-E13 (la version complète avec le DHCP est dans M00-E14/).
# Remplacé par PowerDNS au module 06.
#
# À adapter : <IP-PVE01>, <DNS-AMONT-1>, <DNS-AMONT-2>.
# Appliquer  : sudo systemctl restart dnsmasq && journalctl -u dnsmasq -n 20
# =============================================================================

# --- Écoute --------------------------------------------------------------------
# Seulement la boucle locale et l'adresse de service. Avec bind-interfaces,
# dnsmasq n'ouvre des sockets QUE sur ces adresses : il cohabite avec un
# éventuel systemd-resolved (127.0.0.53) et n'expose rien d'autre.
listen-address=127.0.0.1,10.10.20.10
bind-interfaces

# --- Relais récursif -----------------------------------------------------------
# Serveurs amont explicites : ne pas dépendre du contenu de /etc/resolv.conf
# (qui pointe d'ailleurs vers dns01 lui-même : boucle assurée sinon).
no-resolv
server=<DNS-AMONT-1>
server=<DNS-AMONT-2>
# Hygiène : jamais de nom court ni de reverse privé envoyé vers l'amont.
domain-needed
bogus-priv
cache-size=1000
# Les enregistrements locaux partent par défaut avec un TTL de 0 (aucun cache
# chez les clients) : 60 s allège la charge sans rendre les changements lents.
local-ttl=60

# --- Zones servies localement --------------------------------------------------
# Tout ce qui est sous ces suffixes est répondu ici (NXDOMAIN si inconnu),
# jamais transmis en amont. .internal est réservé à l'usage privé.
local=/medisphere.internal/
local=/10.10.in-addr.arpa/
local=/20.10.in-addr.arpa/

# Domaine des clients DHCP et suffixe des noms enregistrés dynamiquement (E14).
domain=par1.medisphere.internal

# --- Enregistrements A + PTR ---------------------------------------------------
# host-record crée le A de chaque nom et le PTR vers le PREMIER nom de la ligne.
host-record=gw01.par1.medisphere.internal,10.10.10.1
host-record=adm01.par1.medisphere.internal,10.10.10.10
host-record=dns01.par1.medisphere.internal,10.10.20.10
host-record=pve01.par1.medisphere.internal,<IP-PVE01>
# pbs01 : nom canonique sur le site PAR2 (porte le PTR), alias côté PAR1.
host-record=pbs01.par2.medisphere.internal,pbs01.par1.medisphere.internal,10.20.10.10

# --- PTR des autres adresses de gw01 -----------------------------------------
# Un hôte, plusieurs adresses : les traceroutes affichent gw01 à chaque saut.
ptr-record=1.20.10.10.in-addr.arpa,gw01.par1.medisphere.internal
ptr-record=1.30.10.10.in-addr.arpa,gw01.par1.medisphere.internal
ptr-record=1.40.10.10.in-addr.arpa,gw01.par1.medisphere.internal
ptr-record=1.50.10.10.in-addr.arpa,gw01.par1.medisphere.internal
ptr-record=1.52.10.10.in-addr.arpa,gw01.par1.medisphere.internal
ptr-record=1.60.10.10.in-addr.arpa,gw01.par1.medisphere.internal
ptr-record=1.70.10.10.in-addr.arpa,gw01.par1.medisphere.internal
ptr-record=1.99.10.10.in-addr.arpa,gw01.par1.medisphere.internal
ptr-record=1.0.255.10.in-addr.arpa,gw01.par1.medisphere.internal
ptr-record=1.1.255.10.in-addr.arpa,gw01.par1.medisphere.internal

# --- Diagnostic ----------------------------------------------------------------
# À activer ponctuellement (volumineux) : chaque requête et sa source dans le journal.
#log-queries
