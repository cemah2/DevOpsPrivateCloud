#!/usr/sbin/nft -f
# Pare-feu gw01 - proposition v2 (Lucas Martin, stagiaire)
# Testé sur ma VM, tout passe :)

table ip filter {
	chain input {
		type filter hook input priority 0; policy accept;

		iif lo accept
		tcp dport 22 accept
		iifname "ens19.10" tcp dport 22 accept
		udp dport { 51820, 51821 } accept
		icmp type echo-request drop
		iifname "ens19*" udp dport 123 accept
		iifname "ens19.99" udp dport 67 accept
		log prefix "INPUT: "
		ct state established,related accept
	}

	chain forward {
		type filter hook forward priority 0; policy drop;

		ip protocol icmp drop
		ct state established,related accept

		iifname "ens19*" oifname "ens19*" accept
		iifname "ens19.10" accept
		iifname "ens19*" oifname "ens18" accept
		ip saddr 10.10.0.0/16 ip daddr 10.10.20.10 udp dport 53 accept
		ip saddr 10.20.0.0/16 ip daddr 10.10.20.10 udp dport 53 accept
		iifname "wg1" ip daddr 10.10.10.0/24 accept
		iifname "wg1" ip daddr 10.10.20.0/24 accept
		iifname "wg1" ip daddr 10.20.10.0/24 accept
		iifname "ens19.10" oifname "wg0" accept
		ip saddr 192.168.1.20 ip daddr 10.20.10.10 tcp dport 8007 accept

		log prefix "FORWARD: "
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}
}

table ip nat {
	chain postrouting {
		type nat hook postrouting priority 100; policy accept;
		oifname "ens19*" masquerade
	}
}
