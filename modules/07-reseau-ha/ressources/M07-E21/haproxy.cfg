# haproxy.cfg — lb01/lb02, version Lucas (MR !47)
global
    log stdout format short local0 info
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    maxconn 50
    stats socket /run/haproxy/admin.sock mode 666 level admin
    ssl-default-bind-options ssl-min-ver TLSv1.0
    ssl-load-extra-del-ext
    crt-base /etc/haproxy/certs

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend fe_http
    bind :80
    acl agenda hdr(host) -i agenda.par1.medisphere.internal
    use_backend be_agenda if agenda
    default_backend be_aucun

frontend fe_publication
    bind :443 ssl crt /etc/haproxy/certs/
    use_backend be_agenda if { hdr(host) -i agenda.par1.medisphere.internal }
    use_backend be_gitlab if { hdr(host) -i gitlab.par1.medisphere.internal }
    use_backend be_netbox if { hdr(host) -i netbox.par1.medisphere.internal }
    default_backend be_aucun

backend be_agenda
    balance roundrobin
    server app01 10.10.40.21:8443 ssl verify none
    server app02 10.10.40.22:8443 ssl verify none

backend be_gitlab
    option httpchk
    http-check send meth GET uri /-/readiness ver HTTP/1.1 hdr Host gitlab.par1.medisphere.internal
    server git01 10.10.20.12:443 ssl verify required ca-file /usr/local/share/ca-certificates/medisphere-root-ca.crt sni str(git01.par1.medisphere.internal) verifyhost git01.par1.medisphere.internal check check-sni git01.par1.medisphere.internal

backend be_netbox
    option httpchk
    http-check send meth GET uri /login/ ver HTTP/1.1 hdr Host netbox.par1.medisphere.internal
    server nbx01 10.10.20.13:443 ssl verify required ca-file /usr/local/share/ca-certificates/medisphere-root-ca.crt sni str(nbx01.par1.medisphere.internal) verifyhost nbx01.par1.medisphere.internal check check-sni nbx01.par1.medisphere.internal

backend be_aucun
    http-request deny deny_status 503

listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats auth admin:admin
    stats admin if TRUE
