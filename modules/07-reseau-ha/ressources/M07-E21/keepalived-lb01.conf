# keepalived.conf — lb01, version Lucas (MR !47)
global_defs {
    router_id lb01
    vrrp_version 3
}

vrrp_script chk_haproxy {
    script "killall -0 haproxy"
    interval 2
    weight 2
}

vrrp_instance VI_DMZ {
    state MASTER
    interface eth0
    virtual_router_id 70
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass medisphere
    }
    unicast_src_ip 10.10.70.10
    unicast_peer {
        10.10.70.11
    }
    virtual_ipaddress {
        10.10.70.200/24 dev eth0
    }
    track_script {
        chk_haproxy
    }
}
