---
# SIGHUP : keepalived relit sa configuration ; les instances inchangées gardent leur état
# (pas de bascule inutile, contrairement à un redémarrage).
- name: Recharger keepalived
  ansible.builtin.systemd_service:
    name: keepalived.service
    state: reloaded
  when: keepalived_recharger | bool
