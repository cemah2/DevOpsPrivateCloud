---
# group_vars/role_routeur/keepalived.yml — VRRP de la bordure (M07-E25 ; WAN en M07-E26), données du
# rôle keepalived de M07-E08 (version M07-E25). PLAN §4.9 : VIP .1 par VLAN routé, VRID = numéro de
# VLAN, gw01 .2 (150), gw02 .3 (100), VRRP v3 en unicast. Une instance n'est rendue que si son VLAN
# est dans keepalived_vlans_vrrp de l'hôte : on migre un VLAN à la fois (playbooks/migration-vrrp.yml).
#
# Préemption : non (« preemption: false » → nopreempt, état initial BACKUP sur les deux). Une panne =
# UNE bascule ; le retour sur gw01 se fait de jour, par RB-071. Justification : CHG-855, ADR-0070.
#
# Variables d'hôte (host_vars/gw0X/bordure.yml) : bordure_priorite (150 | 100), bordure_suffixe_pair
# (3 | 2), keepalived_vlans_vrrp (VLAN migrés) ; routeur_reseau_suffixe (2 | 3) vient de routeur_reseau.

#
# Groupe BORDURE et migration : au rechargement, keepalived ne laisse un groupe MASTER que si TOUS
# ses membres l'étaient déjà ; une instance nouvelle (BACKUP) ajoutée à un groupe maître fait
# repasser tout le groupe en BACKUP (toutes les VIP de gw01 retirées ≈ 3,5 s, et gw02 peut les
# prendre). Pendant la migration (et pendant l'ajout de l'instance WAN en M07-E26), le groupe est
# donc DÉSACTIVÉ (bordure_groupe_actif: false : les instances gardent leur état au rechargement) ;
# il est constitué une fois toutes les instances migrées des deux côtés, par
# playbooks/groupe-bordure.yml (aucune transition : groupe MASTER sur gw01, BACKUP sur gw02).
# Valeur pendant la migration : false. État final :
bordure_groupe_actif: true

keepalived_groupes_synchro:
  - nom: BORDURE
    actif: "{{ bordure_groupe_actif }}"
    toutes_les_instances: true
    # Un lien coupé (WAN ou trunk) fait passer TOUT le groupe en FAULT : on bascule tout ensemble.
    interfaces_suivies: [ens18, ens19]
    # Ce qui suit le maître sans être une adresse (état, tunnels, conntrackd) : rôle bordure.
    # En root : il démarre des unités systemd et pilote conntrackd (script en 0755 root, que
    # enable_script_security accepte).
    notification: /usr/local/sbin/bordure-transition
    utilisateur: root

keepalived_instances:
  - nom: VLAN10   # MGMT
    actif: "{{ 10 in keepalived_vlans_vrrp }}"
    interface: ens19.10
    vrid: 10
    priorite: "{{ bordure_priorite }}"
    etat_initial: BACKUP
    intervalle: 1
    preemption: false
    source: "10.10.10.{{ routeur_reseau_suffixe }}"
    pairs: ["10.10.10.{{ bordure_suffixe_pair }}"]
    vips: [10.10.10.1/24]
  - nom: VLAN20   # INFRA
    actif: "{{ 20 in keepalived_vlans_vrrp }}"
    interface: ens19.20
    vrid: 20
    priorite: "{{ bordure_priorite }}"
