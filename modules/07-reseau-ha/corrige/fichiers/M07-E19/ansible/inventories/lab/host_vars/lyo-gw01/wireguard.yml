---
# host_vars/lyo-gw01/wireguard.yml — version M07-E19 (REMPLACE celle de E18) : plus de route posée
# au montage, c'est BGP qui décide. AllowedIPs reste NÉCESSAIRE (WireGuard jette tout paquet reçu
# dont la source n'y est pas, et n'envoie à ce pair que les destinations qui y sont) : il suit la
# même liste que la politique BGP (group_vars/all/sites.yml).
wireguard_interfaces:
  - nom: wg2
    adresse: 10.255.2.2/24
    port: 51822
    cle_privee: "{{ vault_wireguard_wg2_cle_privee }}"
    table: "off"
    pilotage: role
    pairs:
      - nom: bordure PAR1
        cle_publique: "<CLE-PUBLIQUE-WG2-DE-GW01>"
        endpoint: "10.10.99.1:51822"
        allowed_ips: "{{ ['10.255.2.1/32'] + sites_lyo1_reseaux_par1 | map(attribute='prefixe') | list }}"
        keepalive: 25
