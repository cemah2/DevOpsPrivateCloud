---
# Rôle haproxy — HAProxy 3.2 LTS du dépôt haproxy.debian.net (M07-E10 ; TLS en E11 ; répartiteurs
# lb01/lb02 en E12-E13). Version de référence : PLAN.md §6 (Debian 13 livre la 3.0).
#
# Le rôle POSSÈDE /etc/haproxy/haproxy.cfg : global et defaults sont fixés ici (communs à tous les
# hôtes), les sections propres à l'hôte (frontend, backend, listen) viennent de haproxy_sections.
# Chaque rendu est validé par « haproxy -c » AVANT d'être posé, puis HAProxy est RECHARGÉ (le
# maître relance des processus neufs, les anciens finissent leurs connexions : pas de coupure).

# --- Dépôt -----------------------------------------------------------------------------------------
haproxy_depot_url: https://haproxy.debian.net
# Suite du dépôt : <version de Debian>-backports-<branche> (ex. trixie-backports-3.2).
haproxy_depot_branche: "3.2"
haproxy_depot_cle_url: https://haproxy.debian.net/haproxy-archive-keyring.gpg
# Empreinte (40 caractères hexadécimaux, sans espace) de la clé du dépôt : relevée et vérifiée
# en M07-E10 (étape 1), inscrite dans group_vars/all/depots.yml. Le rôle REFUSE de continuer sans.
haproxy_depot_cle_empreinte: ""
# Motif de version du paquet (apt) : la branche LTS, jamais « la dernière ».
haproxy_paquet_version: "3.2.*"

# --- Configuration ------------------------------------------------------------------------------
haproxy_fichier: /etc/haproxy/haproxy.cfg
haproxy_dossier_certificats: /etc/haproxy/certs
haproxy_entete: >-
  {{ ms_gere_par | default('Fichier géré par Ansible (projet plateforme/ansible).') | replace('\n', ' ') }}

# Délais par défaut (section defaults).
haproxy_delai_connexion: 5s
haproxy_delai_client: 30s
haproxy_delai_serveur: 30s
haproxy_delai_requete_http: 10s

# TLS : versions et suites minimales côté clients (bind) et côté serveurs (re-chiffrement).
haproxy_tls_version_min: TLSv1.2
# Racine de confiance pour vérifier les serveurs en re-chiffrement (E13).
haproxy_racine_ca: /usr/local/share/ca-certificates/medisphere-root-ca.crt

# Sections de l'hôte, rendues dans l'ordre :
#   - type: resolvers | frontend | backend | listen
#     nom: fe_web
#     tls: false          # vrai : section rendue SEULEMENT si un certificat existe déjà dans
#                         # haproxy_dossier_certificats (amorçage ACME, voir README du rôle)
#     lignes:             # directives HAProxy, une par ligne, telles quelles
#       - bind :80
#       - default_backend be_web
haproxy_sections: []

# Écouter une adresse que l'hôte ne porte pas (encore) : la VIP keepalived d'un répartiteur
# BACKUP (E12). Pose net.ipv4.ip_nonlocal_bind=1.
haproxy_bind_non_local: false

# Contrôles après application : [{url, code, tls}] interrogés DEPUIS l'hôte (TLS vérifié) ;
# « tls: true » : seulement quand le frontend TLS est rendu (certificat présent).
haproxy_verifications: []
