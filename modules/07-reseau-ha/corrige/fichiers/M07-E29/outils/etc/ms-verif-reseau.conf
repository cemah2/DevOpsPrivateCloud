# etc/ms-verif-reseau.conf — ce que surveille ms-verif-reseau (M07-E29, PLAT-858).
# Installé dans /usr/local/etc par « task install:systeme ». Modifié par MR : surveiller un élément
# de plus = une ligne ici, jamais une modification du script. Syntaxe bash, aucune commande.

# --- Accès (compte « supervision », commande forcée etat-reseau, rôle sonde_reseau) -----------
MS_SSH_CLE="$HOME/.config/workbook/ssh-supervision-reseau"
MS_SSH_COMPTE=supervision

# --- Bordure ------------------------------------------------------------------------------------
MS_PASSERELLES=(gw01.par1.medisphere.internal gw02.par1.medisphere.internal)
# VIP du groupe BORDURE : neuf VLAN + WAN (192.168.1.50 = <IP-GW-WAN-VIP>). Toutes sur UNE passerelle.
MS_VIP_BORDURE=(10.10.10.1 10.10.20.1 10.10.30.1 10.10.40.1 10.10.50.1 10.10.52.1 10.10.60.1 10.10.70.1 10.10.99.1 192.168.1.50)
# Voisins BGP qui doivent être établis : sur les deux passerelles / sur le maître seulement.
MS_BGP_TOUS=(10.10.99.251)          # leaf01 (maquette) — à retirer quand la maquette est détruite
MS_BGP_MAITRE=(10.255.2.2)          # lyo-gw01 dans wg2 — idem
# Un voisin configuré (non désactivé) qui n'est pas établi depuis plus de N minutes est une anomalie.
MS_BGP_TOLERANCE_MIN=10
# Tunnels dont le pair est permanent : poignée de main de moins de N secondes sur le maître.
MS_WG_SURVEILLES=(wg0 wg2)
MS_WG_AGE_MAX=180

# --- Répartiteurs --------------------------------------------------------------------------------
MS_REPARTITEURS=(lb01.par1.medisphere.internal lb02.par1.medisphere.internal)
MS_VIP_REPARTITEURS=(10.10.70.200)

# --- Bout en bout : « URL code_attendu » (vérification TLS par la racine MédiSphère) -------------
MS_RACINE=/usr/local/share/ca-certificates/medisphere-root-ca.crt
MS_URLS=(
  "https://gitlab.par1.medisphere.internal/users/sign_in 200"
  "https://netbox.par1.medisphere.internal/login/ 200"
)
