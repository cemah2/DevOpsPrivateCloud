# /etc/nginx/sites-available/mandataire.conf — hap01, M07-E11 (DEV-821).
# EXPLORATION À LA MAIN sur une VM de maquette (jetable) : Nginx n'est qu'un point de comparaison,
# il ne restera pas dans l'architecture (ADR-0071). Pose :
#   admin@hap01:~$ sudo apt-get install -y nginx
#   admin@hap01:~$ sudo rm -f /etc/nginx/sites-enabled/default      # libère le port 80 pour HAProxy
#   admin@hap01:~$ sudo cp mandataire.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/mandataire.conf /etc/nginx/sites-enabled/
#   admin@hap01:~$ sudo nginx -t && sudo systemctl reload nginx
# Même certificat que HAProxy (rôle certificats_acme, host_vars/hap01/certificats.yml), mêmes serveurs.

upstream amont_web {
    server srv01.par1.medisphere.internal:80 max_fails=3 fail_timeout=10s;
    server srv02.par1.medisphere.internal:80 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name hap01.par1.medisphere.internal;

    ssl_certificate     /etc/haproxy/certs/hap01.crt;
    ssl_certificate_key /etc/haproxy/certs/hap01.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location / {
        proxy_pass http://amont_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Échec d'un serveur amont : la requête est rejouée sur le suivant (requêtes idempotentes).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
    }
}
