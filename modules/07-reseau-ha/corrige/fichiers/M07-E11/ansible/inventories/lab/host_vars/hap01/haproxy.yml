---
# host_vars/hap01/haproxy.yml — HAProxy de démonstration, version TLS (M07-E11, DEV-821).
# REMPLACE la version de M07-E10. Ajouts : relais du défi ACME (port 80) et terminaison TLS (443).

haproxy_sections:
  - type: resolvers
    nom: lab
    lignes:
      - nameserver dns01 10.10.20.10:53
      - nameserver dns02 10.10.20.16:53
      - accepted_payload_size 1232
      - hold valid 10s

  - type: frontend
    nom: fe_web
    lignes:
      - bind :80
      - option forwardfor
      # Défi ACME de ca01 : relayé au serveur de défi temporaire de step (rôle certificats_acme).
      - acl defi_acme path_beg /.well-known/acme-challenge/
      - use_backend be_acme if defi_acme
      - default_backend be_web

  # Terminaison TLS : rendue seulement quand le certificat existe (amorçage, rôle haproxy).
  # « crt » sur un DOSSIER : tous les certificats qu'il contient, choisis par SNI.
  - type: frontend
    nom: fe_tls
    tls: true
    lignes:
      - bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
      - option forwardfor
      - http-request set-header X-Forwarded-Proto https
      - default_backend be_web

  - type: backend
    nom: be_web
    lignes:
      - balance roundrobin
      - option httpchk
      - http-check send meth GET uri /sante ver HTTP/1.1 hdr Host hap01.par1.medisphere.internal
      - http-check expect status 200
      - default-server inter 2s fall 3 rise 2 resolvers lab init-addr last,libc,none
      - server srv01 srv01.par1.medisphere.internal:80 check
      - server srv02 srv02.par1.medisphere.internal:80 check

  # Pas de contrôle de santé : le serveur de défi n'existe que pendant une émission.
  - type: backend
    nom: be_acme
    lignes:
      - server step 127.0.0.1:8402

  - type: listen
    nom: stats
    lignes:
      - bind 127.0.0.1:8404
      - stats enable
      - stats uri /stats
      - stats refresh 10s

haproxy_verifications:
  - url: http://127.0.0.1/sante
