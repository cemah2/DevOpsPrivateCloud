# etc/ms-verif-ceph.conf — ce que surveille ms-verif-ceph (M08-E24, PLAT-950).
# Installé dans /usr/local/etc par « task install:systeme ». Modifié par MR, comme le code :
# ajouter un point à surveiller = une ligne ici, jamais une modification du script.
# Syntaxe bash (fichier chargé par le script) : tableaux et variables simples, aucune commande.

# --- Cluster (métriques du module prometheus du mgr actif) ------------------------------------
# Tous les hôtes qui peuvent porter un mgr : la sonde cherche le seul qui sert des métriques.
MS_CEPH_MGR_HOTES=(ceph01.par1.medisphere.internal ceph02.par1.medisphere.internal ceph03.par1.medisphere.internal)
MS_CEPH_PORT_METRIQUES=9283
MS_CEPH_MONS=3
# 12 tant que ceph04 est dans le cluster (palier 3) ; 9 après son retrait (M08-E46), par MR.
MS_CEPH_OSDS=12
# Occupation brute maximale (politique de stockage, E33). Avec 3 nœuds (une baie chacun), size=3 et
# domaine « rack », la perte d'un NŒUD ne déclenche aucune reconstruction ; la perte d'un OSD SSD, si :
# ses PG vont sur l'AUTRE OSD SSD du même nœud, qui doit pouvoir doubler sans atteindre backfillfull
# (0,85, M08-E20). D'où 40 % (et non « 66 % » comme sur un cluster à plus de nœuds que de copies).
MS_CEPH_SEUIL_BRUT=40

# --- Points d'entrée -----------------------------------------------------------------------------
MS_CEPH_S3_URL=https://rgw.par1.medisphere.internal
MS_RACINE=/usr/local/share/ca-certificates/medisphere-root-ca.crt

# --- Certificats : « nom:port » (le nom sert à la connexion, au SNI et à la vérification) -------
# Le tableau de bord est vérifié en plus, sur l'hôte du mgr ACTIF trouvé par la sonde (port ci-dessous).
MS_CEPH_POINTS_TLS=(
  rgw.par1.medisphere.internal:443
)
MS_CEPH_PORT_TABLEAU=8443
