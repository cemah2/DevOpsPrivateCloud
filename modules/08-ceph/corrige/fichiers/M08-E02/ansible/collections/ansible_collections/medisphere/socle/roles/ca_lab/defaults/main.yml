---
# Rôle medisphere.socle.ca_lab — autorités de certification du lab (M04-E18, étendu en M06-E03,
# familles Debian ET Red Hat depuis la 1.2.0, M08-E02).
#
# ca_lab_certificats : autorités à INSTALLER. Chaque élément : nom (fichier <nom>.crt créé dans
#   le dossier d'ancres de la famille) et source (fichier PEM sur le CONTRÔLEUR).
#   Debian : /usr/local/share/ca-certificates/ ; Red Hat : /etc/pki/ca-trust/source/anchors/.
# ca_lab_retirer : noms d'autorités à RETIRER (même dossier), par exemple une ancienne racine
#   après une bascule. Retirer une autorité qui est aussi à installer est refusé.
ca_lab_certificats:
  - nom: medisphere-root-ca
    source: "{{ playbook_dir }}/../pki/medisphere-root-ca.crt"

ca_lab_retirer: []

# Vérifier, après reconstruction du magasin, que chaque autorité installée figure dans le magasin
# consolidé de la famille et que chaque autorité retirée a disparu de son dossier d'ancres.
ca_lab_verifier: true
