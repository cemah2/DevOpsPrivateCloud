# bootstrap/initial-ceph.conf — options du cluster ceph-par1 posées DÈS l'amorçage (M08-E03).
# cephadm bootstrap --config <ce fichier> : les options sont versées dans la base de
# configuration des moniteurs (« ceph config dump »), puis le fichier ne sert plus.
# Toute option posée ici doit aussi se lire dans « ceph config dump » après l'amorçage.

[global]
# Réplication à 3, écriture refusée sous 2 copies (valeurs par défaut de Ceph, écrites pour être
# lues et revues : ce sont des choix, pas des accidents).
osd_pool_default_size = 3
osd_pool_default_min_size = 2
# Supprimer un pool exige de lever ce verrou explicitement, puis de le reposer (M08-E05).
mon_allow_pool_delete = false

[osd]
# 6 Go par nœud pour 3 OSD + MON + MGR (PLAN.md §4.9) : cible fixe de 1 Gio par OSD.
# Sans la ligne « autotune », cephadm l'active à l'amorçage et calcule ses propres cibles par
# hôte (70 % de la mémoire, divisée entre les OSD), qui l'emporteraient sur osd_memory_target.
osd_memory_target_autotune = false
osd_memory_target = 1073741824
