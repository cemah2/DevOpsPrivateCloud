---
# Rôle sauvegarde_ceph (M08-E25).

- name: Paramètres de sauvegarde fournis
  ansible.builtin.assert:
    that:
      - (sauvegarde_ceph_images | length > 0) or (sauvegarde_ceph_pools_decouverte | length > 0)
      - sauvegarde_ceph_jeton_secret | length > 0
      - sauvegarde_ceph_empreinte | length > 0
      - sauvegarde_ceph_cle | length > 0
      - sauvegarde_ceph_cle_cephx | length > 0
      - sauvegarde_ceph_cle_ssh | length > 0
      - sauvegarde_ceph_cle_hote_export | length > 0
    fail_msg: >-
      Images (ou pools de découverte) et secrets (jeton PBS, empreinte, clé de chiffrement, clé cephx,
      clé SSH d'export, clé d'hôte de ceph01) sont requis pour {{ inventory_hostname }}.
    quiet: true

# --- Client PBS (même dépôt que sauvegarde_pbs, M06-E28) ------------------------------------------
- name: Trousseau de l'archive Proxmox (empreinte vérifiée)
  ansible.builtin.get_url:
    url: "{{ sauvegarde_ceph_cle_depot_url }}"
    dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
    checksum: "sha256:{{ sauvegarde_ceph_cle_depot_sha256 }}"
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Dépôt pbs-client (Debian 13)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pbs-client.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Géré par Ansible (rôle sauvegarde_ceph, M08-E25)
      Types: deb
      URIs: http://download.proxmox.com/debian/pbs-client
      Suites: trixie
      Components: main
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  register: sauvegarde_ceph_depot

- name: Paquets (client PBS, jq ; le client rbd est installé depuis M08-E06)
  ansible.builtin.apt:
    name: [proxmox-backup-client, jq, openssh-client]
    state: present
    update_cache: "{{ sauvegarde_ceph_depot is changed }}"

# --- Secrets ------------------------------------------------------------------------------------------
- name: Dossiers des secrets et du travail
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: [/etc/wb-backup, /var/lib/wb-backup]

- name: Accès à PBS (jeton, empreinte)
  ansible.builtin.template:
    src: pbs.env.j2
    dest: /etc/wb-backup/pbs-{{ inventory_hostname }}.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Clé de chiffrement côté client
  ansible.builtin.copy:
    content: "{{ sauvegarde_ceph_cle }}"
    dest: /etc/wb-backup/pbs-{{ inventory_hostname }}.key
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Clé SSH d'export de la configuration
  ansible.builtin.copy:
    content: "{{ sauvegarde_ceph_cle_ssh | trim }}\n"
    dest: /etc/wb-backup/ssh-export-config
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Clé d'hôte de l'hôte d'export, épinglée
  ansible.builtin.copy:
    content: "{{ sauvegarde_ceph_export_hote }} {{ sauvegarde_ceph_cle_hote_export }}\n"
    dest: /etc/wb-backup/known_hosts
    owner: root
    group: root
    mode: "0644"

- name: Trousseau cephx de client.sauvegarde
  ansible.builtin.template:
    src: ceph.client.keyring.j2
    dest: /etc/ceph/ceph.client.{{ sauvegarde_ceph_id }}.keyring
    owner: root
    group: root
    mode: "0600"
  no_log: true

# --- Script et unités ------------------------------------------------------------------------------------
- name: Paramètres non secrets
  ansible.builtin.template:
    src: ceph.conf.j2
    dest: /etc/wb-backup/ceph.conf
    owner: root
    group: root
    mode: "0600"

- name: Script de sauvegarde
  ansible.builtin.copy:
    src: wb-backup-ceph.sh
    dest: /usr/local/sbin/wb-backup-ceph.sh
    owner: root
    group: root
    mode: "0750"

- name: Unités systemd
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - wb-backup-ceph.service
    - wb-backup-ceph.timer
  notify: Recharger systemd

- name: Prendre en compte les unités
  ansible.builtin.meta: flush_handlers

- name: Minuterie active
  ansible.builtin.systemd_service:
    name: wb-backup-ceph.timer
    enabled: true
    state: started
