---
# group_vars/role_ceph_client/ceph_client.yml — cephcli01 (M08-E06, complété en M08-E10).
# Clés cephx : valeurs dans vault-lab.yml (identité lab, outils/ajouter-cle-ceph.sh), jamais ici.
ceph_client_cles:
  - nom: client.rbd-test
    cle: "{{ vault_ceph_cle_rbd_test }}"
  - nom: client.outillage                      # (E10) CephFS, sous-volume plateforme/outillage
    cle: "{{ vault_ceph_cle_outillage }}"

# Image mappée au démarrage (rbdmap) et son montage.
ceph_client_rbdmap:
  - image: rbd-test/disque01
    id: rbd-test
ceph_client_montages:
  - source: /dev/rbd/rbd-test/disque01
    point: /mnt/disque01
    fs: xfs

# (E10) Montage CephFS permanent. <UUID> : « ceph fs subvolume getpath cephfs outillage
# --group_name plateforme » (le chemin change si le sous-volume est recréé).
ceph_client_cephfs:
  - point: /mnt/outillage
    utilisateur: outillage
    chemin: /volumes/plateforme/outillage/<UUID>
