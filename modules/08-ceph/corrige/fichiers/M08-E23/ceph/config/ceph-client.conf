# config/ceph-client.conf — configuration CLIENT minimale de ceph-par1 (données publiques).
# Sert à outils/derive.sh dans la CI (runner01) avec la clé client.ci-lecture.
# <FSID> : sortie de « ceph fsid » (à recopier une fois ; ce n'est pas un secret).
[global]
	fsid = <FSID>
	mon_host = [v2:10.10.30.51:3300/0] [v2:10.10.30.52:3300/0] [v2:10.10.30.53:3300/0]
