# /etc/prometheus/alertmanager.yml — adm02 (F5-S11) : en PRA, tout part vers le Mailpit de secours de
# adm02 (SMTP local 127.0.0.1:1025), boîte « cellule-crise », consultée par la cellule
# (http://adm02.par2.medisphere.internal:8025). Hors PRA (F5-S14), le relais est smtp.par1.medisphere.internal:25.
# Validation : amtool check-config /etc/prometheus/alertmanager.yml
global:
  smtp_smarthost: "127.0.0.1:1025"
  smtp_from: "alertes-par2@medisphere.internal"
  smtp_require_tls: false

route:
  receiver: cellule-crise
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: cellule-crise
    email_configs:
      - to: "cellule-crise@medisphere.internal"
        send_resolved: true
