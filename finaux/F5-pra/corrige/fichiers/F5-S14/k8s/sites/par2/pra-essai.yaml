# plateforme/k8s — sites/par2/pra-essai.yaml (F5-S14, PLAT-3538)
# Espace jetable du test de reprise trimestriel (outils/pra/essai-reprise.sh), sur k8s-par2 SEULEMENT.
#   - quota : le test doit tenir dans le nœud de 5 Go sans gêner la base de veille (une instance de
#     1 Gio au plus, 10 Gio de disque) ;
#   - compte « pra-essai » : crée et supprime, dans cet espace seulement, les objets du test (Cluster,
#     ObjectStore, Secrets, PVC) et lit/exécute dans les pods (psql) ; rien ailleurs. Son jeton est
#     dans le kubeconfig de la variable CI/CD protégée KUBECONFIG de plateforme/k8s.
apiVersion: v1
kind: Namespace
metadata:
  name: pra-essai
  labels:
    pod-security.kubernetes.io/enforce: restricted
    medisphere.internal/site: par2
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pra-essai
  namespace: pra-essai
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 1536Mi
    requests.storage: 10Gi
    persistentvolumeclaims: "2"
    pods: "4"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pra-essai
  namespace: pra-essai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pra-essai
  namespace: pra-essai
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods", "serviceaccounts"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pra-essai
  namespace: pra-essai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pra-essai
subjects:
  - kind: ServiceAccount
    name: pra-essai
    namespace: pra-essai
