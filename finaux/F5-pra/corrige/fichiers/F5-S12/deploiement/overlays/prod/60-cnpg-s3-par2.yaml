# mediagenda/deploiement — overlays/prod/60-cnpg-s3-par2.yaml (F5-S12, CHG-3512, RB-351 §B3)
# PAR1 LIT l'archive de la base de PAR2 (compartiment cnpg-k8s-par2 de s3-02, à travers wg0) :
#   - pendant le retour : reconstruction de mediagenda-db en réplique de mediagenda-db-par2, puis rejeu
#     jusqu'au LSN du jeton de rétrogradation de PAR2 (le segment « .partial » y est archivé) ;
#   - en temps normal : déclaré mais inutilisé (topologie distribuée : chaque site connaît les deux archives).
# Identité S3 de s3-02 en LECTURE SEULE (cnpg-par1-lecture), secret dans OpenBao de PAR1
# (kv/mediagenda/prod/s3-par2-lecture). PAS de retentionPolicy : la rétention de cette archive est
# l'affaire du cluster qui l'écrit (PAR2), jamais de PAR1.
# Flux : k8s-par1 (VLAN 40) → s3-02.par2.medisphere.internal:8333 (matrice des flux, bordure et hp01).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-s3-par2
spec:
  configuration:
    destinationPath: s3://cnpg-k8s-par2/
    endpointURL: https://s3-02.par2.medisphere.internal:8333
    endpointCA:
      name: medisphere-ca
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: cnpg-s3-par2
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3-par2
        key: ACCESS_SECRET_KEY
    wal:
      maxParallel: 2
  instanceSidecarConfiguration:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-par2
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: cnpg-s3-par2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: mediagenda/prod/s3-par2-lecture
        property: access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: mediagenda/prod/s3-par2-lecture
        property: secret_access_key
