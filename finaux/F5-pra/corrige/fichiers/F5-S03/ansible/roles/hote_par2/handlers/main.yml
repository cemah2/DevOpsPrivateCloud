---
- name: Recharger nftables-par2
  ansible.builtin.systemd_service:
    name: nftables-par2.service
    state: reloaded
    daemon_reload: true

- name: Redémarrer wg1
  ansible.builtin.systemd_service:
    name: wg-quick@wg1.service
    state: restarted

- name: Recharger les sources de chrony
  ansible.builtin.command: chronyc reload sources
  changed_when: true

- name: Redémarrer chrony
  ansible.builtin.systemd_service:
    name: chrony.service
    state: restarted
