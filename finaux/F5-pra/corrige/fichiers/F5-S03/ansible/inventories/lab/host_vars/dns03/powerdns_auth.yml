---
# host_vars/dns03/powerdns_auth.yml — dns03, autoritaire SECONDAIRE de PAR2 (F5-S03). Même rôle et mêmes
# réglages que dns02 (M06-E24) : secondaire de TOUTES les zones internes, transferts signés par la clé
# TSIG axfr-par1. dns03 n'appartient pas au groupe role_dns de PAR1 (le playbook de PAR1 y installerait
# Kea) : les quelques valeurs communes sont reprises ici, sans les zones « api » à créer (secondaire).
# En PRA, RB-350 (vague 1) le promeut : zones passées en « native » par pdnsutil, API activée.
powerdns_auth_mode: secondaire
powerdns_auth_ecoute:
  - 127.0.0.1:5300
  - 10.20.20.11:5300
powerdns_auth_primaire: 10.10.20.10:5300
powerdns_auth_api_active: false
powerdns_auth_dnsupdate: false

powerdns_auth_soa:
  primaire: dns01.par1.medisphere.internal
  contact: hostmaster.medisphere.internal
  rafraichissement: 3600
  nouvel_essai: 900
  expiration: 1209600
  ttl_negatif: 300
powerdns_auth_ns:
  - dns01.par1.medisphere.internal
  - dns02.par1.medisphere.internal

# Toutes les zones internes de PAR1, en secondaire (pas d'enregistrements : ils arrivent par AXFR).
powerdns_auth_zones:
  - {nom: medisphere.internal, type: secondary}
  - {nom: par1.medisphere.internal, type: secondary}
  - {nom: par2.medisphere.internal, type: secondary}
  - {nom: 10.10.in-addr.arpa, type: secondary}
  - {nom: 20.10.in-addr.arpa, type: secondary}
powerdns_auth_hotes: []

powerdns_auth_tsig:
  nom: axfr-par1
  algorithme: hmac-sha256
  secret: "{{ vault_powerdns_tsig_axfr_par1 }}"     # group_vars/site_par2/vault-critique.yml (même valeur qu'à PAR1)
