# sites/par2/mediagenda-prod/45-secrets.yaml — entrée de mediagenda-prod (k8s-par2) dans OpenBao (F5-S06).
# EN VEILLE : le coffre de PAR1 (openbao.par1, par wg0), méthode « k8s-par2 » déclarée dans
# plateforme/secrets (tofu/k8s-par2.tf) ; les Secrets existent donc à PAR2 AVANT le sinistre.
# EN PRA : même méthode, même rôle, mais coffre bao-par2 (restauré depuis l'instantané, qui contient la
# méthode k8s-par2) : RB-356 §4 change « server » (paramètre d'Argo CD, sans commit), et ESO garde les
# Secrets existants tant que la source ne répond pas (il n'efface pas sur erreur).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso
  namespace: mediagenda-prod
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: mediagenda-prod
spec:
  provider:
    vault:
      server: https://openbao.par1.medisphere.internal:8200      # PRA : https://bao-par2.par2.medisphere.internal:8200
      path: kv
      version: v2
      caBundle: <RACINE-MEDISPHERE-EN-BASE64>
      auth:
        kubernetes:
          mountPath: k8s-par2
          role: eso-mediagenda-prod
          serviceAccountRef:
            name: eso
            audiences:
              - openbao.medisphere.internal
---
# Secrets de la base de secours (même forme que mediagenda-secours au M27) : identité S3 cnpg-par2 de s3-02
# (lit cnpg-k8s-par1, écrit cnpg-k8s-par2) et racine MédiSphère.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-par2
  namespace: mediagenda-prod
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: cnpg-s3-par2, creationPolicy: Owner, deletionPolicy: Retain}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: mediagenda/par2/cnpg-s3, property: ACCESS_KEY_ID}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: mediagenda/par2/cnpg-s3, property: ACCESS_SECRET_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medisphere-ca
  namespace: mediagenda-prod
spec:
  refreshInterval: 24h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: medisphere-ca, creationPolicy: Owner, deletionPolicy: Retain}
  data:
    - secretKey: ca.crt
      remoteRef: {key: mediagenda/par2/medisphere-ca, property: ca.crt}
