# /etc/vsftpd.conf — dépôt de fichiers des partenaires (InfoGér, 2016, revu en 2021).
# Partenaires : laboratoire d'analyses (partenaire-labo) et centre de radiologie (partenaire-radio).
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=027
dirmessage_enable=NO
use_localtime=YES
xferlog_enable=YES
xferlog_std_format=YES
xferlog_file=/var/log/vsftpd.log
connect_from_port_20=YES
# Chaque partenaire est enfermé dans son dossier de dépôt.
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
userlist_enable=YES
userlist_file=/etc/vsftpd.user_list
userlist_deny=NO
# Mode passif : plage ouverte sur le pare-feu d'InfoGér, adresse annoncée aux clients.
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=192.168.50.30
# TLS : « prévu en 2022 » (ticket InfoGér 4471).
ssl_enable=NO
