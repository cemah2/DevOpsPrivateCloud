# legacy/deploiement — base/secrets.yaml (F4-S12, CHG-3412)
# Identifiants lus dans OpenBao par le SecretStore « openbao » de l'espace (rôle eso-legacy-rdv-<env>,
# kv/legacy/<env>/*). Le chemin de l'environnement est posé par l'overlay (patch de remoteRef.key).
#   legacy-rdv-mariadb : root (compte root de la base, bris de glace et opérateur), application
#                        (compte legacy_rdv), migrateur (compte legacy_rdv_migrateur) ;
#   legacy-rdv-s3      : identité S3 de l'opérateur pour les sauvegardes (compartiment mariadb-legacy-rdv).
# L'étiquette k8s.mariadb.com/watch fait suivre à l'opérateur un changement de mot de passe (rotation
# dans OpenBao → ESO met le Secret à jour → l'opérateur change le mot de passe dans MariaDB).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-rdv-mariadb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: legacy-rdv-mariadb
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          medisphere.internal/source: openbao
          k8s.mariadb.com/watch: ""
  data:
    - secretKey: root
      remoteRef: {key: legacy/ENV/mariadb, property: root}
    - secretKey: application
      remoteRef: {key: legacy/ENV/mariadb, property: application}
    - secretKey: migrateur
      remoteRef: {key: legacy/ENV/mariadb, property: migrateur}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-rdv-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: legacy-rdv-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          medisphere.internal/source: openbao
  data:
    - secretKey: access_key_id
      remoteRef: {key: legacy/ENV/s3, property: access_key_id}
    - secretKey: secret_access_key
      remoteRef: {key: legacy/ENV/s3, property: secret_access_key}
