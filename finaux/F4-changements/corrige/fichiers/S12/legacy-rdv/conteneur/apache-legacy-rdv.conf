# Hôte virtuel Apache de Legacy-RDV dans l'image (M12-E19, complété en F4-S12).
# Port 8080 (Apache entièrement sous www-data), journaux sur les sorties du conteneur.
# F4-S12 : adresse réelle du client lue dans X-Forwarded-For posé par la Gateway (Envoy de Cilium) et
# les répartiteurs (mod_remoteip), seulement depuis les réseaux de la plateforme ; sondes exclues du
# journal d'accès.
<VirtualHost *:8080>
    ServerName rdv.par1.medisphere.internal
    ServerAlias legacy-rdv.apps.par1.medisphere.internal legacy-rdv-recette.apps.par1.medisphere.internal
    DocumentRoot /var/www/legacy-rdv

    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.240.0.0/16 10.10.70.0/24

    <Directory /var/www/legacy-rdv>
        Require all granted
        DirectoryIndex index.php
        AllowOverride None
    </Directory>

    <Directory /var/www/legacy-rdv/uploads>
        Require all denied
    </Directory>
    <DirectoryMatch "^/var/www/legacy-rdv/(inc|cron|vm|conteneur|sql)/">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(schema\.sql|compose\.yaml|Dockerfile|README\.md)$">
        Require all denied
    </FilesMatch>

    SetEnvIf Request_URI "^/(sante|pret)\.php$" sonde
    ErrorLog /proc/self/fd/2
    LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combine_reel
    CustomLog /proc/self/fd/1 combine_reel env=!sonde
</VirtualHost>
