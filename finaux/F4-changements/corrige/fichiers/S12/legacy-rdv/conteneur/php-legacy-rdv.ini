; Réglages PHP de Legacy-RDV 2.4.0 dans l'image : /usr/local/etc/php/conf.d/legacy-rdv.ini
; (M12-E19, complété en F4-S12). Les deux premiers viennent de l'hôte virtuel de la VM (php_value) :
; sans eux, l'image officielle reviendrait à 2 Mo et refuserait les pièces jointes de 5 Mo.
upload_max_filesize = 6M
post_max_size = 8M
; Téléversements temporaires : /tmp (emptyDir sur Kubernetes, racine en lecture seule).
upload_tmp_dir = /tmp
; Sessions : LEGACY_RDV_SESSIONS=base les met dans MariaDB (inc/sessions.php). Le ménage est fait par
; le CronJob de purge, jamais pendant une requête.
session.gc_probability = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
; Valeur de repli des fonctions de date (config.php fixe le fuseau des cabinets).
date.timezone = Europe/Paris
expose_php = Off
log_errors = On
display_errors = Off
