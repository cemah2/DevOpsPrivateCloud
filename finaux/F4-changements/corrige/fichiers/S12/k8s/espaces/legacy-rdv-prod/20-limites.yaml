apiVersion: v1
kind: LimitRange
metadata:
  name: limites-defaut
  namespace: legacy-rdv-prod
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 20m, memory: 64Mi}
      default: {cpu: 500m, memory: 256Mi}
      min: {cpu: 5m, memory: 16Mi}
      max: {cpu: "2", memory: 2Gi}
