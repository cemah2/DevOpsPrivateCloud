# plateforme/resilience — continuite/testrun.yaml (F4-S02, CHG-3402)
# Sonde de continuité : UN exécuteur (parallelism 1 : la charge est faible et un seul exécuteur garde
# les compteurs cohérents), lancée avant chaque fenêtre de changement et arrêtée après la mesure
# « après ». Créée par outils/sonde-continuite.sh (remplace CHG34XX et DUREE_SONDE), jamais par Argo CD :
# même exception écrite que les expériences de chaos (ADR-0290) — c'est un instrument de mesure lancé
# pour une fenêtre, pas un état désiré.
# Mêmes réglages que le TestRun du M29-E14 (images Harbor, restricted, /tmp en emptyDir, écriture
# distante vers UN réplica de Prometheus, autorisée par la CNP prometheus-ecriture-k6).
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: sonde-continuite
  namespace: k6
  labels:
    medisphere.internal/ticket: CHG-3402
    medisphere.internal/composant: sonde-continuite
spec:
  parallelism: 1
  script:
    configMap:
      name: sonde-continuite
      file: sonde-continuite.js
  arguments: --tag testid=sonde-continuite-CHG34XX --out experimental-prometheus-rw
  cleanup: post
  runner:
    image: registry.par1.medisphere.internal/dockerhub/grafana/k6:1.8.2
    metadata:
      labels:
        medisphere.internal/composant: sonde-continuite
    env:
      - name: DUREE
        value: "DUREE_SONDE"
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: http://prometheus-kps-prometheus-0.prometheus-operated.supervision.svc.cluster.local:9090/api/v1/write
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: "p(95),p(99),max"
      # 5 s : la résolution de la mesure côté charge.
      - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
        value: "5s"
      - name: SSL_CERT_FILE
        value: /etc/medisphere/ca/medisphere-root-ca.crt
    volumes:
      - name: racine
        configMap:
          name: medisphere-racine
      - name: tmp
        emptyDir: {sizeLimit: 64Mi}
    volumeMounts:
      - {name: racine, mountPath: /etc/medisphere/ca, readOnly: true}
      - {name: tmp, mountPath: /tmp}
    resources:
      requests: {cpu: 200m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    securityContext:
      runAsNonRoot: true
      runAsUser: 12345
      seccompProfile: {type: RuntimeDefault}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
  starter:
    image: registry.par1.medisphere.internal/ghcr/grafana/k6-operator:starter-v1.7.0
    resources:
      requests: {cpu: 50m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile: {type: RuntimeDefault}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
