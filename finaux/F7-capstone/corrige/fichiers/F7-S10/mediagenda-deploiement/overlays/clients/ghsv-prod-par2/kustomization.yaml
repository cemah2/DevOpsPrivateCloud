# mediagenda/deploiement — overlays/clients/ghsv-prod-par2/kustomization.yaml (F7-S10, PLAT-3710)
# Instance de SECOURS du client GHSV dans k8s-par2 (F5 : cluster « tiède »). Lue par l'Argo CD de
# k8s-par2 sur le MIROIR de adm02 (ssh://miroir@adm02.par2.medisphere.internal/srv/miroirs/mediagenda/
# deploiement.git), comme MédiAgenda. Même code que ghsv-prod ; différences de SITE seulement :
#   - base : réplique continue « mediagenda-db-par2 » en TOPOLOGIE DISTRIBUÉE (F5-S06), alimentée
#     depuis s3-02 (cnpg-ghsv répliqué par filer.sync) ; promue par jeton pendant un PRA (RB-350) ;
#   - API, mandataires et cache à 0 réplica en veille (mémoire de hp01) ;
#   - témoin de RPO suspendu (le site passif n'écrit pas) ;
#   - publication sur gw-par2 (noms *.apps.par2.medisphere.internal et ghsv.medisphere.internal, repère
#     X-MediSphere-Site: par2), par les mêmes correctifs que overlays/prod-par2 de MédiAgenda (F5-S06) ;
#   - images : mêmes références registry.par1… que la prod ; containerd de k8s-par2 les tire du miroir
#     reg02 (copie signée, F5-S04 et F5-S06), sans réécriture ici.
# L'espace ghsv-prod de k8s-par2 vient du rendu de plateforme/equipes appliqué au cluster de secours
# (inventaire k8s-par2, F5-S06) : ce dossier ne le crée pas.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ghsv-prod
resources:
  - ../../../base
  - livraison.yaml
  - mediagenda-db-par2.yaml
  - sauvegarde-par2.yaml
labels:
  - pairs:
      medisphere.internal/environnement: prod
      medisphere.internal/client: ghsv
      medisphere.internal/site: par2
    includeSelectors: false
    includeTemplates: true
configMapGenerator:
  - name: mediagenda-parametres
    behavior: merge
    envs:
      - ../ghsv-prod/parametres.env
components:
  - ../../../components/migrations
  - ../../../components/racine-medisphere
  - ../../../components/valkey
  - ../../../components/client
  - ../../../components/temoin-rpo-client
  - ../../../components/livraison
patches:
  # Routes (comme overlays/prod-par2 de MédiAgenda, F5-S06) : Gateway gw-par2, noms de PAR2 et nom
  # global, repère de site lu par la sonde ms-sonde-pra.
  - target: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: mediagenda}
    patch: |-
      - op: replace
        path: /spec/parentRefs
        value:
          - {group: gateway.networking.k8s.io, kind: Gateway, name: gw-par2, namespace: passerelles}
      - op: replace
        path: /spec/hostnames
        value: [ghsv.apps.par2.medisphere.internal, ghsv.medisphere.internal]
      - op: add
        path: /spec/rules/0/filters
        value:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - {name: X-MediSphere-Site, value: par2}
  - target: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: mediagenda-agents}
    patch: |-
      - op: replace
        path: /spec/parentRefs
        value:
          - {group: gateway.networking.k8s.io, kind: Gateway, name: gw-par2, namespace: passerelles}
      - op: replace
        path: /spec/hostnames
        value: [ghsv-agents.apps.par2.medisphere.internal]
      - op: add
        path: /spec/rules/0/filters
        value:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - {name: X-MediSphere-Site, value: par2}
  # Veille : rien ne tourne hors de la base.
  - target: {kind: Deployment, name: mediagenda}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: {kind: Deployment, name: oauth2-proxy-agents}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: {kind: Deployment, name: oauth2-proxy-dpi}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: {group: apps, kind: StatefulSet, name: valkey}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: {group: batch, kind: CronJob, name: temoin-rpo}
    patch: |-
      - op: replace
        path: /spec/suspend
        value: true
  # La base du chart s'appelle mediagenda-db : à PAR2, c'est mediagenda-db-par2 (Secret
  # mediagenda-db-par2-app). Les références de l'API, des migrations et du témoin suivent.
  - target: {kind: Deployment, name: mediagenda}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
        value: mediagenda-db-par2-app
  - target: {group: batch, kind: CronJob, name: temoin-rpo}
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
        value: mediagenda-db-par2-app
# ⚠️ Les noms (HTTPRoute mediagenda et mediagenda-agents, Deployment, StatefulSet, chemins env/0) sont ceux
# du chart du M17 et des components du F7 : lis TON rendu (kustomize build overlays/clients/ghsv-prod-par2)
# et ajuste les cibles, comme pour overlays/prod-par2 (F5-S06).
