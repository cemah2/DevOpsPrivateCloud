# mediagenda/deploiement — overlays/clients/ghsv-prod-par2/mediagenda-db-par2.yaml (F7-S10, PLAT-3710)
# Réplique de secours de la base du GHSV à PAR2, en TOPOLOGIE DISTRIBUÉE de CloudNativePG (comme
# mediagenda-db-par2 de MédiAgenda, F5-S06) : les deux grappes se déclarent mutuellement dans
# externalClusters ; « replica.primary » dit laquelle est primaire. Bascule (PAR1 → PAR2) et retour
# par jetons (demotionToken / promotionToken, RB-350 et RB-351) ; sans jeton, l'ancien primaire est à
# reconstruire. Côté PAR1, la grappe mediagenda-db de ghsv-prod reçoit le bloc symétrique (correctif
# de l'overlay ghsv-prod, extrait plus bas dans le corrigé de F7-S10).
# Différence avec MédiAgenda : au F5, mediagenda-db-par2 vit dans plateforme/k8s (sites/par2/mediagenda-prod/,
# appliqué depuis adm02, hors d'Argo CD). Ici, la base du client reste dans son overlay (un client = un
# dossier), protégée contre l'élagage et la suppression par Argo CD (annotation ci-dessous). Les deux
# choix se défendent ; garde celui de ton F5 si tu préfères un seul mécanisme.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mediagenda-db-par2
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: "Réplique de secours (PAR2) de la base MédiAgenda du client GHSV"
  instances: 1
  # Même image que la base du client à PAR1 et que mediagenda-db-par2 du F5 (tirée d'Internet par hp01 :
  # pas de cache Harbor à PAR2), épinglée par empreinte.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:<EMPREINTE-POSTGRESQL>
  storage:
    # Pas de Ceph à PAR2 : local-path-provisioner de k8s-par2 (F5-S06, sites/par2/stockage).
    storageClass: local-path
    size: 4Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  enableSuperuserAccess: false
  replica:
    self: mediagenda-db-par2
    primary: mediagenda-db-prod
    source: mediagenda-db-prod
  bootstrap:
    recovery:
      source: mediagenda-db-prod
  # Archive PROPRE à PAR2 (compartiment cnpg-ghsv-par2 de s3-02), comme cnpg-k8s-par2 au F5 : jamais la
  # copie de l'archive de PAR1 (filer.sync y écrit, une rétention y effacerait).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-ghsv-par2
        serverName: mediagenda-db-par2
  externalClusters:
    # Le primaire de PAR1, tel qu'il archive (cnpg-ghsv de s3-01, copié vers s3-02 par filer.sync) : lu
    # par l'ObjectStore cnpg-ghsv-par1, en lecture.
    - name: mediagenda-db-prod
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-ghsv-par1
          serverName: mediagenda-db-prod
    - name: mediagenda-db-par2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-ghsv-par2
          serverName: mediagenda-db-par2
