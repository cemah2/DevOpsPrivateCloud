# mediagenda/deploiement — overlays/clients/ghsv-prod-par2/mediagenda-db-par2.yaml (F7-S10, PLAT-3710)
# Réplique de secours de la base du GHSV à PAR2, en TOPOLOGIE DISTRIBUÉE de CloudNativePG (comme
# mediagenda-db-par2 de MédiAgenda, F5-S06) : les deux grappes se déclarent mutuellement dans
# externalClusters ; « replica.primary » dit laquelle est primaire. Bascule (PAR1 → PAR2) et retour
# par jetons (demotionToken / promotionToken, RB-350 et RB-351) ; sans jeton, l'ancien primaire est à
# reconstruire. Côté PAR1, la grappe mediagenda-db de ghsv-prod reçoit le bloc symétrique (correctif
# de l'overlay ghsv-prod, extrait plus bas dans le corrigé de F7-S10).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mediagenda-db-par2
spec:
  description: "Réplique de secours (PAR2) de la base MédiAgenda du client GHSV"
  instances: 1
  imageName: reg02.par2.medisphere.internal/ghcr/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:<EMPREINTE-POSTGRESQL>
  storage:
    # Pas de Ceph à PAR2 : classe locale de k8s-par2 (F5-S06).
    storageClass: <CLASSE-DE-STOCKAGE-K8S-PAR2>
    size: 4Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  enableSuperuserAccess: false
  replica:
    self: mediagenda-db-par2
    primary: mediagenda-db-prod
    source: mediagenda-db-prod
  bootstrap:
    recovery:
      source: mediagenda-db-prod
  # Archivage de PAR2 (servira quand PAR2 sera primaire) : compartiment cnpg-ghsv de s3-02, autre
  # nom de serveur.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-ghsv-par2
        serverName: mediagenda-db-par2
  externalClusters:
    # Le primaire de PAR1, tel qu'il archive (sur s3-01, répliqué vers s3-02 par filer.sync).
    - name: mediagenda-db-prod
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-ghsv-par2
          serverName: mediagenda-db-prod
    - name: mediagenda-db-par2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-ghsv-par2
          serverName: mediagenda-db-par2
