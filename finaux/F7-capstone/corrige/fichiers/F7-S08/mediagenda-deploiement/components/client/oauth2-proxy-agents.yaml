# mediagenda/deploiement — components/client/oauth2-proxy-agents.yaml (F7-S08, PLAT-3708)
# Accès des AGENTS du client à l'API, par le courtier d'identité (RB-372). Même OAuth2 Proxy que le M24
# (7.15.5, cache Harbor de quay.io), mais dans l'espace du client : il appartient au client, il vit et
# meurt avec lui (réversibilité, destruction), et la journée de jeu (F7-S11) le compte comme tel.
#   - client Keycloak « ghsv-agents » (tofu/courtier-ghsv.tf) : son flux redirige d'office vers l'IdP
#     du GHSV : les agents ne voient jamais le formulaire de MédiSphère ;
#   - groupe exigé : ghsv-agents (et lui seul) ;
#   - session de 15 min sans rafraîchissement : à l'expiration, un aller-retour silencieux vers l'IdP
#     du GHSV ; un agent désactivé chez le GHSV est donc dehors en 15 min au plus (ESC-04) ;
#   - le jeton d'identité de l'agent est transmis à l'API (Authorization) : l'API y lit le groupe
#     (contrôle des portées, F7-S09).
# Valeurs de RECETTE ; l'overlay ghsv-prod remplace OAUTH2_PROXY_REDIRECT_URL, le nom publié et le
# chemin kv.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-agents
data:
  oauth2_proxy.cfg: |
    provider = "keycloak-oidc"
    provider_display_name = "GHSV"
    oidc_issuer_url = "https://sso.par1.medisphere.internal/realms/medisphere"
    provider_ca_files = ["/etc/medisphere-ca/medisphere-root-ca.crt"]
    scope = "openid email profile"
    code_challenge_method = "S256"
    oidc_groups_claim = "groups"
    user_id_claim = "preferred_username"
    allowed_groups = ["ghsv-agents"]
    email_domains = ["*"]
    # Service de l'API dans le même espace (résolu par le domaine de recherche du pod).
    upstreams = ["http://mediagenda:80"]
    # Pas de page intermédiaire « Se connecter avec… » : directement vers Keycloak, qui redirige vers
    # l'IdP du GHSV (flux navigateur-ghsv du client).
    skip_provider_button = true
    pass_authorization_header = true
    set_xauthrequest = false
    # /pret et les métriques du mandataire ne demandent pas de session (sonde de mon01, Prometheus).
    skip_auth_routes = ["GET=^/pret$"]
    # Les appels de l'API répondent 401 au lieu d'une redirection quand la session a expiré.
    api_routes = ["^/api/"]
    cookie_secure = true
    cookie_httponly = true
    cookie_samesite = "lax"
    cookie_path = "/"
    cookie_expire = "15m"
    reverse_proxy = true
    trusted_proxy_ips = ["10.240.0.0/16"]
    real_client_ip_header = "X-Forwarded-For"
    silence_ping_logging = true
    metrics_address = "0.0.0.0:44180"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: oauth2-proxy-agents
    creationPolicy: Owner
  # kv/ghsv/<env>/oauth2-proxy-agents : client-secret (client ghsv-agents, rangé sans affichage comme au
  # M24-E29), cookie-secret (32 octets aléatoires, propre à l'environnement).
  data:
    - secretKey: client-id
      remoteRef: {key: ghsv/recette/oauth2-proxy-agents, property: client-id}
    - secretKey: client-secret
      remoteRef: {key: ghsv/recette/oauth2-proxy-agents, property: client-secret}
    - secretKey: cookie-secret
      remoteRef: {key: ghsv/recette/oauth2-proxy-agents, property: cookie-secret}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-agents
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: oauth2-proxy-agents
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: oauth2-proxy-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: oauth2-proxy-agents
    spec:
      automountServiceAccountToken: false
      priorityClassName: medisphere-critique
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: oauth2-proxy
          # Par empreinte en production (Kyverno exiger-digest) : à TA valeur, relevée dans Harbor.
          image: registry.par1.medisphere.internal/quay/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:<EMPREINTE-OAUTH2-PROXY>
          args:
            - --config=/etc/oauth2-proxy/oauth2_proxy.cfg
            - --http-address=0.0.0.0:4180
          env:
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://ghsv-agents-recette.apps.par1.medisphere.internal/oauth2/callback
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: {secretKeyRef: {name: oauth2-proxy-agents, key: client-id}}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: oauth2-proxy-agents, key: client-secret}}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: oauth2-proxy-agents, key: cookie-secret}}
            - name: OAUTH2_PROXY_COOKIE_NAME
              value: __Host-ghsv-agents
          ports:
            - {name: http, containerPort: 4180}
            - {name: metriques, containerPort: 44180}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: configuration, mountPath: /etc/oauth2-proxy, readOnly: true}
            - {name: racine-medisphere, mountPath: /etc/medisphere-ca, readOnly: true}
      volumes:
        - name: configuration
          configMap: {name: oauth2-proxy-agents}
        - name: racine-medisphere
          configMap: {name: racine-medisphere}
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-agents
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: oauth2-proxy-agents
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: oauth2-proxy-agents
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: metriques, port: 44180, targetPort: metriques}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oauth2-proxy-agents
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: oauth2-proxy-agents
---
# Publication du nom des agents sur gw-par1 (espace étiqueté medisphere.internal/exposition: oui).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mediagenda-agents
spec:
  parentRefs:
    - {name: gw-par1, namespace: passerelles, sectionName: https}
  hostnames:
    - ghsv-agents-recette.apps.par1.medisphere.internal
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: max-age=31536000; includeSubDomains}
              - {name: X-Content-Type-Options, value: nosniff}
              - {name: Referrer-Policy, value: no-referrer}
              - {name: X-Frame-Options, value: DENY}
              - {name: X-MediSphere-Site, value: par1}
      backendRefs:
        - {name: oauth2-proxy-agents, port: 80}
