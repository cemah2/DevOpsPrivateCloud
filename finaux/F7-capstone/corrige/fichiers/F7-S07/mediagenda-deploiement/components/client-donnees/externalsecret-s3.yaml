# mediagenda/deploiement — components/client-donnees/externalsecret-s3.yaml (F7-S07, PLAT-3707)
# Clés S3 de l'identité SeaweedFS cnpg-ghsv, lues par le SecretStore « openbao » de l'espace (rôle
# eso-ghsv-<env> : kv/ghsv/<env>/* en lecture, rendu de plateforme/equipes). Le chemin dépend de
# l'environnement : l'overlay le remplace (recette → ghsv/recette/cnpg-s3, prod → ghsv/prod/cnpg-s3).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-ghsv-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: cnpg-ghsv-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: ghsv/ENVIRONNEMENT/cnpg-s3
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: ghsv/ENVIRONNEMENT/cnpg-s3
        property: AWS_SECRET_ACCESS_KEY
