# mediagenda/deploiement — components/donnees-demo/job.yaml (F7-S14, PLAT-3714)
# Hook PostSync d'Argo CD : après la synchronisation (donc après le Job de migrations, vague −1), insère
# des rendez-vous fictifs si la table n'en contient aucun du praticien « DEMO-001 ». Idempotent :
# rejoué à chaque synchronisation, il n'ajoute rien quand les données existent.
apiVersion: batch/v1
kind: Job
metadata:
  name: donnees-demo
  labels:
    app.kubernetes.io/name: donnees-demo
    app.kubernetes.io/part-of: mediagenda
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: donnees-demo
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: donnees
          image: registry.par1.medisphere.internal/ghcr/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:<EMPREINTE-POSTGRESQL>
          command: ["psql", "-X", "-q", "-v", "ON_ERROR_STOP=1", "$(MEDIAGENDA_DB_URL)", "-c"]
          args:
            - >-
              INSERT INTO rendez_vous (patient, praticien, debut, duree_minutes, motif, canal_rappel, contact_rappel)
              SELECT 'Patient Démo ' || n, 'DEMO-' || lpad(((n % 20) + 1)::text, 3, '0'),
                     (date '2030-01-07' + (n / 16) * interval '1 day' + interval '8 hours' + (n % 8) * interval '30 minutes') AT TIME ZONE 'Europe/Paris',
                     30, 'Consultation de démonstration', 'aucun', NULL
              FROM generate_series(0, 399) AS n
              WHERE NOT EXISTS (SELECT 1 FROM rendez_vous WHERE praticien = 'DEMO-001')
              ON CONFLICT DO NOTHING;
          env:
            - name: MEDIAGENDA_DB_URL
              valueFrom:
                secretKeyRef: {name: mediagenda-db-app, key: uri}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
