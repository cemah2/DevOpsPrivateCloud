# plateforme/secrets — .gitlab-ci.yml, EXTRAIT F1-S02 (PLAT-3102) : plan du coffre planifié.
# À fusionner dans le fichier de M25-E10. Le rôle JWT « ci-plateforme-secrets » exige ref_protected :
# un pipeline planifié sur main le satisfait (main est protégée), sans nouvelle politique.
# Planification : Build → Pipeline schedules, main, « 47 2 * * * » (Europe/Paris), PLANIF=derive.

tofu:plan:
  extends: .tofu
  stage: plan
  script:
    - tofu -chdir=tofu init -input=false -lockfile=readonly
    - |
      rc=0
      tofu -chdir=tofu plan -input=false -lock-timeout=10m -detailed-exitcode -out=plan.tfplan || rc=$?
      if [ "$rc" -eq 1 ]; then echo "Plan en ERREUR : rien ne sera appliqué."; exit 1; fi
      echo "$rc" > tofu/plan.code
    # suite du script et artifacts : INCHANGÉS (M25-E10), en ajoutant tofu/plan.code aux artefacts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|schedule|web)$/

derive:secrets:
  stage: appliquer
  tags: [shell]
  needs: ["tofu:plan"]
  script:
    - test -s tofu/plan.code
    - |
      if [ "$(cat tofu/plan.code)" != "0" ]; then
        echo "Dérive ou écart de code sur le coffre : lire tofu/plan.txt (artefact du job tofu:plan)."
        exit 1
      fi
      echo "Coffre conforme au code (No changes)."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/
