# plateforme/secrets — .gitlab-ci.yml, EXTRAIT (F1-S12, prévention d'INC-5712).
# Job PLANIFIÉ (pipeline planifié quotidien, source « schedule ») : l'autorité du dépôt vérifie-t-elle
# encore l'API du cluster, et OpenBao utilise-t-il bien celle du dépôt ? Rouge = alerte par courriel
# (notifications du projet) avant que les ExternalSecrets ne tombent.
# Identité : jeton d'identité de GitLab (audience openbao.medisphere.internal, M25-E10), rôle JWT
# « ci-secrets-lecture-config » à créer avec une politique qui ne permet que « read » sur
# auth/k8s-par1/config (aucune valeur de secret).
verifier-ca-k8s-par1:
  stage: test
  tags: [shell, socle]                   # runner01 : joint l'API par la VIP (flux déjà ouvert pour Ansible)
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [racine/k8s-par1-ca.crt]
  id_tokens:
    OPENBAO_ID_TOKEN:
      aud: openbao.medisphere.internal
  before_script:
    - . outils/openbao-ci.sh ci-secrets-lecture-config      # M25-E10 : jeton de 10 min, rien d'affiché
  script:
    - outils/ca-k8s-par1.sh verifier
  after_script:
    - . outils/openbao-ci.sh --fin
