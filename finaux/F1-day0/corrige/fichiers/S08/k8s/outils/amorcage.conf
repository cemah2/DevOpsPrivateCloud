# plateforme/k8s — outils/amorcage.conf (F1-S08, PLAT-3108)
# Secrets dont la couche de base a besoin AVANT External Secrets Operator (qu'Argo CD installe) : créés
# par outils/amorcer-secrets.sh depuis OpenBao, avec la session OIDC de la personne qui reconstruit,
# puis ADOPTÉS par leur ExternalSecret (mêmes nom, espace et clés) dès que la chaîne ESO revient (S09).
# Rien d'autre ne passe par ici : tout Secret qui peut attendre ESO l'attend.
#
# Une ligne par Secret :
#   <espace> <secret> <chemin kv (sans « kv/ »)> [type=<type>] [etiquette=<clé>=<valeur>]… [<clé>=<propriété>]…
# Sans correspondance <clé>=<propriété>, toutes les propriétés du secret d'OpenBao deviennent des clés
# (comme « dataFrom: extract » d'ESO). Chemins : ceux de docs/securite/secrets/inventaire-secrets.md
# (M25-E46) ; ALIGNE-LES sur ton inventaire avant la fenêtre (le corrigé suit les noms des modules).

# --- Réseau public des noms (S08 : cert-manager, ExternalDNS) ---------------------------------------
cert-manager    tsig-certmanager-k8s   plateforme/cert-manager/tsig   secret=secret
external-dns    tsig-externaldns-k8s   plateforme/external-dns/tsig   secret=secret

# --- Stockage (ceph-csi : identités client.k8s et client.k8s-cephfs, clé du chiffrement des volumes) -
ceph-csi        csi-rbd-secret         plateforme/ceph-csi/k8s
ceph-csi        csi-cephfs-secret      plateforme/ceph-csi/k8s-cephfs
ceph-csi        csi-rbd-secret-chiffre plateforme/ceph-csi/chiffre

# --- Sauvegarde (Velero : identité S3 de velero-k8s-par1, clé « cloud ») ------------------------------
velero          velero-s3              plateforme/velero/s3           cloud=cloud

# --- CI (releases de 50-ci : rollbackOnFailure attend des pods prêts) ---------------------------------
gitlab-runner   gitlab-runner                 plateforme/gitlab-runner/jeton
gitlab-runner   ci-cache-s3                   plateforme/gitlab-runner/cache-s3
gitlab-runner   gitlab-runner-protege-jeton   plateforme/gitlab-runner/protege-jeton
gitlab-agent    gitlab-agent-jeton            plateforme/gitlab-agent/jeton

# --- Argo CD : de quoi lire plateforme/gitops et les charts de Harbor, et rien d'autre --------------
argocd          repo-creds-plateforme  plateforme/argocd/depot-plateforme     etiquette=argocd.argoproj.io/secret-type=repo-creds
argocd          depot-harbor-charts    plateforme/argocd/depot-harbor-charts  etiquette=argocd.argoproj.io/secret-type=repository
