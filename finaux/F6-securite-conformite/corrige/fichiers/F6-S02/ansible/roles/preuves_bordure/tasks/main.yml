---
# Rôle preuves_bordure (F6-S02, PLAT-3602). Même construction que sonde_reseau (M07-E29) : compte
# système sans mot de passe, commande forcée, sudo limité à un script sans argument.
- name: Clé publique de collecte fournie
  ansible.builtin.assert:
    that: preuves_bordure_cle_publique is match('^ssh-ed25519 ')
    fail_msg: "preuves_bordure_cle_publique : clé ed25519 du job de collecte des preuves attendue."
    quiet: true

- name: Compte de collecte (sans mot de passe)
  ansible.builtin.user:
    name: "{{ preuves_bordure_compte }}"
    system: true
    shell: /bin/sh
    home: "/var/lib/{{ preuves_bordure_compte }}"
    create_home: true
    password: "!"
    password_lock: true

- name: Script de lecture des règles
  ansible.builtin.copy:
    src: preuves-pare-feu
    dest: /usr/local/sbin/preuves-pare-feu
    owner: root
    group: root
    mode: "0755"

- name: Clé autorisée, commande forcée
  ansible.posix.authorized_key:
    user: "{{ preuves_bordure_compte }}"
    key: "{{ preuves_bordure_cle_publique }}"
    key_options: 'restrict,from="{{ preuves_bordure_depuis | join(",") }}",command="sudo -n /usr/local/sbin/preuves-pare-feu"'
    exclusive: true
    state: present

- name: Règle sudo limitée à preuves-pare-feu
  ansible.builtin.copy:
    dest: /etc/sudoers.d/61-preuves-bordure
    content: |
      # Rôle preuves_bordure (F6-S02) : la collecte des preuves lit le pare-feu, rien d'autre.
      {{ preuves_bordure_compte }} ALL=(root) NOPASSWD: /usr/local/sbin/preuves-pare-feu ""
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# Si ssh_durci restreint les comptes autorisés (AllowUsers/AllowGroups), ajoute le compte à sa liste
# (comme pour sonde_reseau), sinon la connexion est refusée avant même la clé.
