# plateforme/k8s — composants/audit-archive/cronjob-archive-audit.yaml (F6-S08, SEC-3608, ferme ECA-3601)
#
# Archive quotidienne du locataire « audit » de Loki vers le compartiment RGW archive-audit (verrouillage
# d'objets, COMPLIANCE, rétention par défaut 365 jours), manifeste signé par transit d'OpenBao.
# Espace « journaux » (celui de Loki, M22). Aucune clé de signature dans le cluster : le pod se connecte
# à OpenBao par la méthode kubernetes « k8s-par1 » (rôle audit-archive, politique audit-archive :
# transit/sign/audit-archive seulement) avec un jeton projeté d'audience openbao.medisphere.internal ;
# les clés S3 d'écriture (utilisateur RGW archive-audit) arrivent par ESO depuis
# kv/plateforme/archive-audit/rgw-ecriture (ClusterSecretStore openbao, réservé aux espaces de plateforme).
# Le compartiment est créé À PART, verrouillage activé à la création (plateforme/ceph, rgw-preuves.sh) :
# ce CronJob ne règle jamais le verrou, il vérifie que chaque objet déposé le porte.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-archive
  namespace: journaux
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audit-archive-s3
  namespace: journaux
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: audit-archive-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: plateforme/archive-audit/rgw-ecriture
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: plateforme/archive-audit/rgw-ecriture
        property: AWS_SECRET_ACCESS_KEY
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-archive
  namespace: journaux
  labels:
    app.kubernetes.io/name: audit-archive
    medisphere.internal/composant: conformite
spec:
  # 01:30 UTC : la veille est close dans Loki ; la collecte ms-preuves (P-AUD-02) passe après.
  schedule: "30 1 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit-archive
        spec:
          restartPolicy: Never
          serviceAccountName: audit-archive
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: archive
              image: registry.par1.medisphere.internal/plateforme/audit-archive:v1.0.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: LOKI_URL
                  value: "http://loki.journaux.svc:3100"
                - name: LOKI_TENANT
                  value: "audit"
                - name: RGW_URL
                  value: "https://rgw.par1.medisphere.internal"
                - name: ARCHIVE_BUCKET
                  value: "archive-audit"
                - name: BAO_ADDR
                  value: "https://openbao.par1.medisphere.internal:8200"
                - name: BAO_AUTH
                  value: "k8s-par1"
                - name: BAO_ROLE
                  value: "audit-archive"
                - name: TRANSIT_CLE
                  value: "audit-archive"
                - name: BAO_JWT_FICHIER
                  value: "/var/run/secrets/openbao/token"
                - name: TMPDIR
                  value: "/tmp"
              envFrom:
                - secretRef:
                    name: audit-archive-s3
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: jeton-openbao
                  mountPath: /var/run/secrets/openbao
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: jeton-openbao
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: openbao.medisphere.internal
                      expirationSeconds: 600
