# plateforme/k8s — composants/velero/planifications.extrait-F6.yaml (F6-S09, SEC-3609, ferme ECA-3603)
#
# À FUSIONNER dans composants/velero/ (planifications du M16 ; même kustomization). Deux changements :
#
# 1. La phrase du dépôt Kopia (données des volumes) ne vaut plus la phrase PAR DÉFAUT que Velero écrit à
#    l'installation dans le Secret velero/velero-repo-credentials (clé repository-password) : elle vient
#    d'OpenBao (kv/plateforme/velero/depot, propriété phrase, 48 caractères aléatoires) par ESO.
#    ⚠️ La phrase est GLOBALE à tous les dépôts Kopia de Velero et un dépôt existant reste chiffré avec
#    l'ancienne : on fait pointer l'emplacement de sauvegarde « s3-01 » vers un NOUVEAU préfixe (dans
#    values.yaml du M16-E16 : « prefix: kopia-v2 » sous backupStorageLocation, donc de nouveaux dépôts
#    initialisés avec la nouvelle phrase) ; l'ancien emplacement reste déclaré en LECTURE SEULE
#    (« s3-01-avant », accessMode ReadOnly, sans préfixe) jusqu'à l'expiration des anciennes sauvegardes
#    (14 jours). Pour restaurer l'une d'elles, il faut l'ancienne phrase : ESO suspendu et phrase par
#    défaut remise le temps de la restauration (procédure dans docs/conformite/vulnerabilites.md).
# 2. Les Secrets ne sont plus dans l'archive des manifestes (tar.gz que Velero dépose EN CLAIR à côté des
#    dépôts Kopia) : ils sont tous recréés par ESO depuis OpenBao (M25), les sauvegarder n'apporte rien et
#    les expose. Les autres manifestes ne contiennent pas de données de santé.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: velero-repo-credentials
    # Le Secret existe déjà (créé par Velero) : ESO en prend la propriété et remplace la phrase.
    creationPolicy: Owner
  data:
    - secretKey: repository-password
      remoteRef:
        key: plateforme/velero/depot
        property: phrase
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: medidoc-dev-nuit
  namespace: velero
  labels:
    medisphere.internal/composant: sauvegarde
    medisphere.internal/sauvegarde: quotidienne
spec:
  schedule: "0 2 * * *"
  paused: false                     # écrit explicitement : un « apply » le remet à faux (leçon de F6-S04)
  template:
    includedNamespaces:
      - medidoc-dev
    excludedResources:
      - secrets                     # recréés par ESO depuis OpenBao ; jamais en clair sur s3-01
    snapshotVolumes: true
    snapshotMoveData: true          # données des volumes copiées par Kopia dans le dépôt chiffré
    defaultVolumesToFsBackup: false
    labelSelector:
      matchExpressions:
        - key: cnpg.io/cluster
          operator: DoesNotExist
    ttl: 336h0m0s
