# plateforme/secrets — .gitlab-ci.yml : CHANGEMENT de F2-S02 (PLAT-3202, ADR-0320).
# Même schéma pour plateforme/identite (tofu:apply, fichier tofu/equipes.auto.tfvars.json) et pour
# plateforme/infra (état observabilite-grafana, fichier observabilite-grafana/equipes.auto.tfvars.json).
#
# Un rendu de plateforme/equipes fusionné (MR de propagation de svc-equipes, garde-fou du chemin et de
# l'auteur : voir identite/gitlab-ci.extrait-F2-S02.yml) est appliqué SANS clic, mais seulement si le
# plan enregistré ne DÉTRUIT rien. Une destruction (équipe retirée : politique, groupe externe, rôles
# supprimés) reste MANUELLE : quelqu'un lit le plan et clique.

tofu:apply:equipes:
  extends: .tofu
  stage: appliquer
  needs: ["tofu:plan", "equipes:garde-fou"]
  interruptible: false
  resource_group: tofu-secrets
  environment:
    name: lab/secrets
  script:
    - test -s tofu/plan.tfplan
    - |
      if grep -Eq '^Plan: .* [1-9][0-9]* to destroy' tofu/plan.txt; then
        echo "Le rendu des équipes DÉTRUIT des objets du coffre : application manuelle (tofu:apply)."
        exit 1
      fi
    - tofu -chdir=tofu init -input=false -lockfile=readonly
    - tofu -chdir=tofu apply -input=false -lock-timeout=10m plan.tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /rendu de plateforme\/equipes@/
      changes:
        paths:
          - tofu/equipes.auto.tfvars.json

# Le job manuel tofu:apply du M25-E10 reste tel quel : c'est lui qu'on lance quand le job automatique
# a refusé (destruction annoncée), après relecture du plan.
