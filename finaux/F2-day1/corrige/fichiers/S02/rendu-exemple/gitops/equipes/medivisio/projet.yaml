# GÉNÉRÉ par plateforme/equipes (outils/rendre.py) depuis equipes/medivisio.yaml — NE PAS MODIFIER ICI.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: medivisio
  namespace: argocd
  labels:
    medisphere.internal/equipe: medivisio
    medisphere.internal/origine: plateforme-equipes
  annotations:
    medisphere.internal/ticket: "DEV-3202"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Équipe produit MédiVisio (téléconsultation)"
  # Les dépôts du groupe GitLab de l'équipe, et eux seuls.
  sourceRepos:
    - https://git01.par1.medisphere.internal/medivisio/*
  # Les environnements de l'équipe, nommés un par un (jamais « medivisio-* » : une future équipe
  # « medivisio-xxx » aurait le même préfixe).
  destinations:
    - server: https://kubernetes.default.svc
      namespace: medivisio-dev
    - server: https://kubernetes.default.svc
      namespace: medivisio-recette
    - server: https://kubernetes.default.svc
      namespace: medivisio-prod
  # Aucun objet de cluster.
  clusterResourceWhitelist: []
  # L'enveloppe de l'espace est à la plateforme (plateforme/equipes → plateforme/k8s).
  namespaceResourceBlacklist:
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: external-secrets.io, kind: SecretStore}
    - {group: monitoring.coreos.com, kind: AlertmanagerConfig}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
  orphanedResources:
    warn: true
    ignore:
      - {group: "", kind: ServiceAccount, name: eso}
      - {group: external-secrets.io, kind: SecretStore, name: openbao}
      - {group: monitoring.coreos.com, kind: AlertmanagerConfig, name: "alertes-*"}
      - {group: rbac.authorization.k8s.io, kind: RoleBinding, name: "capsule-*"}
      - {group: rbac.authorization.k8s.io, kind: RoleBinding, name: "supervision-lecture-*"}
      - {group: "", kind: ResourceQuota, name: quota}
      - {group: "", kind: ResourceQuota, name: "capsule-*"}
      - {group: "", kind: LimitRange, name: limites}
      - {group: "", kind: LimitRange, name: limites-locataire}
  roles:
    - name: equipe
      description: "Équipe medivisio (groupe medivisio de l'annuaire, SSO) : synchronise ses environnements, jamais hors fenêtre"
      groups:
        - medivisio
      policies:
        - p, proj:medivisio:equipe, applications, get, medivisio/*, allow
        - p, proj:medivisio:equipe, applications, sync, medivisio/*, allow
        - p, proj:medivisio:equipe, logs, get, medivisio/*, allow
        - p, proj:medivisio:equipe, applications, delete, medivisio/*, deny
        - p, proj:medivisio:equipe, applications, override, medivisio/*, deny
        - p, proj:medivisio:equipe, exec, create, medivisio/*, deny
  # Règle de la maison (CHG-2129, M20-E29) : pas de mise en production du vendredi 16:00 au lundi 08:00.
  # manualSync: false — l'équipe ne contourne pas la fenêtre ; une dérogation (incident) passe par
  # l'astreinte, qui ouvre la MR d'exception (RB-320 § Dérogations).
  syncWindows:
    - kind: deny
      schedule: "0 16 * * 5"
      duration: 64h
      timeZone: Europe/Paris
      applications:
        - "*-prod"
      manualSync: false
      description: "Pas de mise en production du vendredi 16h au lundi 8h (CHG-2129)"
