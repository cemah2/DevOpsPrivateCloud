# GÉNÉRÉ par plateforme/equipes (outils/rendre.py) depuis equipes/medivisio.yaml — NE PAS MODIFIER ICI.
# Jeton de déploiement du GROUPE medivisio (portée read_repository), créé par le job gitlab:equipes de
# plateforme/equipes et rangé dans kv/plateforme/argocd/depot-medivisio (url, username, password).
# Argo CD l'utilise pour tout dépôt dont l'URL commence par https://git01.par1.medisphere.internal/medivisio.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-creds-medivisio
  namespace: argocd
  labels:
    medisphere.internal/origine: plateforme-equipes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: repo-creds-medivisio
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      metadata:
        labels:
          medisphere.internal/source: openbao
          argocd.argoproj.io/secret-type: repo-creds
  dataFrom:
    - extract:
        key: plateforme/argocd/depot-medivisio
