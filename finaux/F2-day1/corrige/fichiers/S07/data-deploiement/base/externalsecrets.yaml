# data/deploiement — base/externalsecrets.yaml (F2-S07, DEV-3207)
# Secrets de l'espace, par le SecretStore « openbao » posé par la plateforme (rôle eso-data-traitements :
# kv/data/traitements/* et db-data/creds/data-traitement, RIEN d'autre).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-data-s3
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: cnpg-data-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: data/traitements/cnpg-s3, property: ACCESS_KEY_ID}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: data/traitements/cnpg-s3, property: ACCESS_SECRET_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medisphere-ca
spec:
  refreshInterval: 24h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: medisphere-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef: {key: data/traitements/medisphere-ca, property: ca.crt}
---
# Lecture du sas d'extraction (identité SeaweedFS extraction-lecture : Read et List sur data-extractions).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sas-extraction-lecture
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: sas-extraction-lecture
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: data/traitements/sas-extraction, property: AWS_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: data/traitements/sas-extraction, property: AWS_SECRET_ACCESS_KEY}
---
# Compte dynamique d'écriture (bail d'une heure) pour les traitements. Rafraîchi toutes les 30 min :
# un Job qui démarre a toujours au moins 30 min devant lui.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: statistiques-db-traitement
spec:
  refreshInterval: 30m
  target:
    name: statistiques-db-traitement
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PGHOST: statistiques-db-rw
        PGPORT: "5432"
        PGDATABASE: statistiques
        PGUSER: "{{ .username }}"
        PGPASSWORD: "{{ .password }}"
        PGSSLMODE: require
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: data-traitement
