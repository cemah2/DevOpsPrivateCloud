# data/deploiement — base/reseau.yaml (F2-S07, DEV-3207)
# Refus par défaut dans data-traitements, puis seulement ce dont la base et les traitements ont besoin.
# AUCUNE règle ne nomme un espace de MédiAgenda : l'extraction arrive par le sas S3 (s3-01).
# L'entrée depuis vault01-03 (moteur db-data) est posée par la plateforme (60-openbao.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refus-par-defaut
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: statistiques-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: statistiques-db
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Opérateur (état, mises à jour) et collecte Prometheus.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cnpg-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: cloudnative-pg}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 5432}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: supervision}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {protocol: TCP, port: 9187}
    # Traitements de l'équipe (pods étiquetés medisphere.internal/acces-base: statistiques).
    - from:
        - podSelector:
            matchLabels: {medisphere.internal/acces-base: statistiques}
      ports:
        - {protocol: TCP, port: 5432}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Sauvegardes et WAL (plugin Barman Cloud, en sidecar).
    - to:
        - ipBlock: {cidr: 10.10.20.14/32}
      ports:
        - {protocol: TCP, port: 8333}
---
# Traitements (chargement, agrégats) : DNS, base, s3-01 (sas d'extraction), RGW (résultats, S08).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traitements
spec:
  podSelector:
    matchLabels:
      medisphere.internal/acces-base: statistiques
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {cnpg.io/cluster: statistiques-db}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: 10.10.20.14/32}
      ports:
        - {protocol: TCP, port: 8333}
    - to:
        - ipBlock: {cidr: 10.10.30.200/32}
      ports:
        - {protocol: TCP, port: 443}
---
# API Kubernetes pour le gestionnaire d'instance (même raison qu'au M27-E15 : identité kube-apiserver).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: statistiques-db-api-kubernetes
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: statistiques-db
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
