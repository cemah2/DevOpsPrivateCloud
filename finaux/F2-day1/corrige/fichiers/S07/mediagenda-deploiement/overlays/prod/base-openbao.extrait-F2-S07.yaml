# mediagenda/deploiement — overlays/prod/base-openbao.yaml : EXTRAIT, ajout de F2-S07 (DEV-3207).
# Rôle géré « extraction_data » ajouté à la liste managed.roles du correctif de prod (M25-E14).
# ⚠️ Kustomize remplace une LISTE entière dans un correctif stratégique de ressource personnalisée
#    (pas de clé de fusion connue pour managed.roles) : ce fichier reprend donc TOUS les rôles de ton
#    correctif actuel. Recopie les tiens (M25-E14, M27-E02…) et ajoute seulement le dernier bloc.
#
# extraction_data : connexion, aucun autre droit que ceux posés par la migration V5 (USAGE sur le
# schéma extraction, SELECT sur la vue). Le rôle est créé sur le PRIMAIRE de la prod et arrive sur le
# réplica de secours par les WAL (un réplica est en lecture seule : on n'y crée rien). Le mot de passe
# vient d'OpenBao (kv/mediagenda/prod/extraction-data) par l'ExternalSecret extraction-data.yaml ; le
# CronJob de mediagenda-secours lit le même secret. Changer le mot de passe : nouvelle version dans
# OpenBao, ESO met le Secret à jour, CloudNativePG l'applique au rôle (étiquette cnpg.io/reload) ; le
# secours le reçoit au prochain segment de WAL archivé (5 min au plus) : faire la rotation de jour.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mediagenda-db
spec:
  managed:
    roles:
      # --- M25-E14 (inchangés : recopie TON état) ----------------------------------------------------
      - name: mediagenda_api
        ensure: present
        comment: "Droits de l'API MédiAgenda (comptes dynamiques d'OpenBao) — M25-E14"
        login: false
        inherit: true
      - name: openbao
        ensure: present
        comment: "OpenBao, moteur db-mediagenda (identifiants dynamiques) — M25-E14"
        login: true
        createrole: true
        superuser: false
        createdb: false
        inherit: false
        connectionLimit: 10
        inRoles:
          - mediagenda
          - mediagenda_api
      # --- F2-S07 (DEV-3207, ADR-0327) ---------------------------------------------------------------
      - name: extraction_data
        ensure: present
        comment: "Extraction pseudonymisée nocturne vers l'équipe Data (lecture de extraction.* seulement) — F2-S07"
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: false
        connectionLimit: 2
        passwordSecret:
          name: extraction-data
