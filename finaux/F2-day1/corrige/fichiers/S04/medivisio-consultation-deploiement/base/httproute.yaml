# Publication par la Gateway de la plateforme (gw-par1, écouteur https, certificat joker apps-joker) ;
# nom publié par ExternalDNS. Le nom d'hôte est posé par chaque overlay (patch).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: consultation
spec:
  parentRefs:
    - name: gw-par1
      namespace: passerelles
      sectionName: https
  hostnames:
    - "<POSÉ-PAR-L-OVERLAY>"
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains"}
              - {name: X-Content-Type-Options, value: nosniff}
              - {name: Referrer-Policy, value: no-referrer}
              - {name: X-Frame-Options, value: DENY}
      backendRefs:
        - name: consultation
          port: 80
