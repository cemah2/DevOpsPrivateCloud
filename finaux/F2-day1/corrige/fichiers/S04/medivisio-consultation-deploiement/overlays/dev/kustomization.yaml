# medivisio/consultation-deploiement — overlays/dev/ (F2-S04 ; secret et supervision : F2-S05)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medivisio-dev
resources:
  - ../../base
  - secret.yaml
labels:
  - pairs:
      medisphere.internal/environnement: dev
    includeSelectors: false
    includeTemplates: true
patches:
  - target: {kind: HTTPRoute, name: consultation}
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: consultation-dev.apps.par1.medisphere.internal
  - target: {kind: Deployment, name: consultation}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
# Posé par la MR de promotion de la CI (kustomize edit set image, par empreinte).
images:
  - name: registry.par1.medisphere.internal/medisphere/medivisio-consultation
    digest: sha256:<EMPREINTE-POSÉE-PAR-LA-PROMOTION>
