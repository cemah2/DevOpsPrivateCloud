# Secret « consultation » de l'environnement recette : clé HMAC des liens de salle, écrite par l'équipe
# dans kv/medivisio/recette/consultation (champ cle_salles) en libre-service (OIDC, politique medivisio-equipe).
# Le SecretStore « openbao » de l'espace (posé par la plateforme) ne lit que kv/medivisio/recette/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: consultation
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: consultation
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: cle_salles
      remoteRef:
        key: medivisio/recette/consultation
        property: cle_salles
