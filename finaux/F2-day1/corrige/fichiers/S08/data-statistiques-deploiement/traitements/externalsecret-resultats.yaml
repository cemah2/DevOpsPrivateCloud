# data/statistiques-deploiement — traitements/externalsecret-resultats.yaml (F2-S08, PLAT-3208)
# Identité RGW « data-resultats » (propriétaire du seul compartiment data-resultats, quota 5 Gio),
# créée par plateforme/ceph (outils/rgw-compartiment.sh, job manuel) qui range ses clés dans
# kv/data/traitements/s3-resultats.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-resultats
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: s3-resultats
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: data/traitements/s3-resultats, property: AWS_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: data/traitements/s3-resultats, property: AWS_SECRET_ACCESS_KEY}
