# plateforme/observabilite — tests/reseau-bordure.test.yaml (F3-S11) : promtool test rules
# (règles extraites par outils/extraire-regles.sh dans build/regles/, comme les tests du M21).
rule_files:
  - ../build/regles/reseau-bordure.yml
evaluation_interval: 1m
tests:
  - name: une session tombe sur k8s-w02, les autres restent établies
    interval: 1m
    input_series:
      - series: 'cilium_bgp_control_plane_session_state{instance="10.10.40.62:9962", neighbor="10.10.40.2", vrouter="65040"}'
        values: '1x4 0x20'
      - series: 'cilium_bgp_control_plane_session_state{instance="10.10.40.62:9962", neighbor="10.10.40.3", vrouter="65040"}'
        values: '1x25'
      - series: 'cilium_bgp_control_plane_session_state{instance="10.10.40.61:9962", neighbor="10.10.40.2", vrouter="65040"}'
        values: '1x25'
    alert_rule_test:
      # Tombée à 5 min : pas encore d'alerte à 8 min (for: 5m)…
      - eval_time: 8m
        alertname: BgpSessionTombee
        exp_alerts: []
      # … alerte à 12 min, pour cette session seulement.
      - eval_time: 12m
        alertname: BgpSessionTombee
        exp_alerts:
          - exp_labels: {gravite: critique, equipe: plateforme, instance: "10.10.40.62:9962", neighbor: "10.10.40.2"}
            exp_annotations:
              resume: "Session BGP 10.10.40.62:9962 → 10.10.40.2 tombée"
              description: "Le nœud 10.10.40.62:9962 n'a plus de session BGP avec la passerelle 10.10.40.2 depuis 5 min : les adresses de service en externalTrafficPolicy Local dont les pods sont sur ce nœud ne sont plus annoncées à cette passerelle. RB-337 § 2."
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/exploitation/runbooks/RB-337-noms-intermittents.md
      - eval_time: 12m
        alertname: BgpSessionsAbsentes
        exp_alerts: []
  - name: plus aucune mesure
    interval: 1m
    input_series:
      - series: 'up{job="cilium-agent"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: BgpSessionsAbsentes
        exp_alerts:
          - exp_labels: {gravite: avertissement, equipe: plateforme}
            exp_annotations:
              resume: "Aucune mesure d'état des sessions BGP de Cilium"
              description: "La métrique cilium_bgp_control_plane_session_state a disparu (agents non collectés, métrique renommée ou plan de contrôle BGP désactivé) : BgpSessionTombee ne peut plus sonner."
              runbook_url: https://git01.par1.medisphere.internal/plateforme/medisphere/-/blob/main/docs/exploitation/runbooks/RB-337-noms-intermittents.md
