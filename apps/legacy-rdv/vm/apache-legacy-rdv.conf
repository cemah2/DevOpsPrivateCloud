# Hôte virtuel Apache de Legacy-RDV, tel qu'InfoGér l'avait installé sur la VM.
# Emplacement : /etc/apache2/sites-available/legacy-rdv.conf (a2ensite legacy-rdv)
# Modules : mod_php (paquet libapache2-mod-php8.4), prefork.
<VirtualHost *:80>
    ServerName rdv.medisphere.internal
    DocumentRoot /var/www/legacy-rdv

    <Directory /var/www/legacy-rdv>
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Les pièces jointes ne sont servies que par piece.php, jamais en direct.
    <Directory /var/www/legacy-rdv/uploads>
        Require all denied
    </Directory>
    <DirectoryMatch "^/var/www/legacy-rdv/(inc|cron|vm)/">
        Require all denied
    </DirectoryMatch>
    <Files "schema.sql">
        Require all denied
    </Files>

    php_value upload_max_filesize 6M
    php_value post_max_size 8M

    ErrorLog ${APACHE_LOG_DIR}/legacy-rdv-error.log
    CustomLog ${APACHE_LOG_DIR}/legacy-rdv-access.log combined
</VirtualHost>
